<style>
  :root{
    --sea:#2a6f97; --panel:#f3ecda; --panel2:#e6dcc2; --ink:#2a2620;
    --slate:#7a231d; --slate2:#98332a; --slate3:#b4463a; --muted:#8a7d5e;
    --gold:#caa33a; --orange:#e2882a; --red:#cf3a36; --redd:#b8302c;
    --p0:#cf3a36; --p1:#2f6fd0; --p2:#e2882a; --p3:#f3efe2;
    --p0d:#8e221f; --p1d:#1d4a91; --p2d:#a85d12; --p3d:#9a9484;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    background:radial-gradient(circle at 50% 20%, #7c241d 0%, #52140f 60%, #350d0a 100%);
    -webkit-text-size-adjust:100%;
  }
  .ui{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .display{font-family:Georgia,'Iowan Old Style',serif;letter-spacing:.04em}
  .wrap{max-width:1040px;margin:0 auto;padding:16px 12px}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  button:disabled{cursor:not-allowed}
  select{font-family:ui-sans-serif,system-ui,sans-serif}

  /* ---- menu ---- */
  .menu{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;

  .menu .anchor{font-size:58px;margin-bottom:6px}

  .menu h1{font-family:Georgia,serif;font-weight:700;font-size:52px;letter-spacing:.25em;margin:0 0 2px}
  .menu .sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:#e6c6ac;margin-bottom:30px}
  .menu .q{font-family:ui-sans-serif,system-ui,sans-serif;color:#f0dcc8;font-size:14px;margin-bottom:12px}
  .menu .moderow{display:flex;gap:12px;justify-content:center;margin-bottom:26px}
  .menu .modebtn{font-family:Georgia,serif;letter-spacing:.05em;font-size:15px;padding:10px 22px;border-radius:10px;
    border:2px solid #b4695260;background:transparent;color:#e6c6ac;transition:.15s}
  .menu .modebtn.on{background:var(--slate2);border-color:#f3ecda;color:#fff}
  .menu .ns{display:flex;gap:12px;justify-content:center;margin-bottom:30px}
  .menu .ns button{width:54px;height:54px;border-radius:50%;font-size:20px;font-weight:700;border:2px solid #b4695260;
    background:transparent;color:#e6c6ac;font-family:ui-sans-serif,system-ui,sans-serif;transition:.15s}
  .menu .ns button.on{background:var(--orange);border-color:#f3ecda;color:#fff;transform:scale(1.1)}
  .menu .seatgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:26px}
  .menu .seatcard{background:#f6efdd;border:1px solid #d9cba6;border-radius:12px;padding:9px 9px 10px;
    box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .menu .seathead{display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .menu .seatdot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .menu .seatname{font-family:Georgia,serif;font-size:13px;font-weight:700;color:#2a2620;letter-spacing:.03em}
  .menu .seatseg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .menu .seatopt{display:flex;align-items:center;justify-content:center;gap:4px;font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:11px;line-height:1;padding:7px 3px;border-radius:7px;border:1px solid;cursor:pointer;transition:.12s}
  .menu .seatopt:hover{filter:brightness(.96)}
  .menu .seatopt.on{box-shadow:0 0 0 1px rgba(255,255,255,.5) inset}
  .menu .seatico{font-size:12px;line-height:1}
  .menu .begin{font-family:Georgia,serif;letter-spacing:.18em;font-size:18px;padding:12px 40px;border-radius:10px;
    background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .menu .skiproll{display:block;margin:0 auto 18px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;
    padding:6px 14px;border-radius:8px;background:transparent;color:#e6c6ac;border:1px solid #b4695240;transition:.15s}
  .menu .skiproll.on{color:#fff;border-color:#f3ecda80}
  .menu .begin:hover{background:var(--redd)}
  .menu .blurb{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;color:#d8a88f;margin-top:30px;line-height:1.6}
  .menu .version{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#8a7a70;letter-spacing:.12em;margin-top:14px;opacity:.7}



  /* ---- header ---- */
  .header{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:rgba(110,32,25,.92);color:#f3ecda;border-radius:12px;padding:8px 16px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .header .title{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.2em}
  .header .phase{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;text-transform:uppercase;
    letter-spacing:.16em;color:#e6c6ac}
  .header .right{display:flex;align-items:center;gap:10px}
  .header .turn{font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;display:flex;align-items:center;gap:8px}
  .header .turn .who{display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.4)}
  .btn-new{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;padding:6px 12px;border-radius:8px;
    background:var(--slate2);color:#f3ecda}
  .btn-new:hover{background:var(--slate3)}

  /* ---- layout ---- */
  .layout{display:flex;flex-direction:column;gap:16px;margin-top:12px}
  @media(min-width:900px){ .layout{flex-direction:row} .sidebar{width:320px;flex:0 0 320px} .board-wrap{flex:1;min-width:0} }
  .board-wrap{background:var(--sea);border-radius:18px;padding:8px;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
  .board-wrap svg{display:block;width:100%;height:auto;user-select:none}
  .sidebar{font-family:ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column;gap:12px}

  /* ---- panels ---- */
  .panel{background:var(--panel);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);overflow:hidden}
  .pp{padding:12px}
  .phead{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:700;letter-spacing:.02em}
  .phead .who{display:flex;align-items:center;gap:8px}

/* ---- island generator: contiguous islands that never touch each other ---- */
function hexDist(a,b){ var dq=a.q-b.q, dr=a.r-b.r; return (Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2; }
function hexAdjacency(coords){
  var idx={}; coords.forEach(function(c,i){ idx[c.q+","+c.r]=i; });
  var DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  return coords.map(function(c){
    var out=[];
    DIRS.forEach(function(d){ var j=idx[(c.q+d[0])+","+(c.r+d[1])]; if(j!=null) out.push(j); });
    return out;
  });
}
// returns owner[] (island index per hex, -1 = sea) or null if it could not be laid out
function makeIslandRegions(coords,sizes,maxDist){
  var adj=hexAdjacency(coords), nIsl=sizes.length;
  var cand=[]; coords.forEach(function(c,i){ if(c.dist<=maxDist) cand.push(i); });
  for(var attempt=0;attempt<300;attempt++){
    var owner=coords.map(function(){return -1;});
    var seeds=[], pool=shuffle(cand.slice()), ok=true;
    for(var s=0;s<nIsl;s++){
      var found=-1;
      for(var p=0;p<pool.length;p++){
        var i=pool[p]; if(owner[i]!==-1) continue;
        var good=true;
        for(var t=0;t<seeds.length;t++){ if(hexDist(coords[i],coords[seeds[t]])<4){ good=false; break; } }
        if(good){ found=i; break; }
      }
      if(found<0){ ok=false; break; }
      seeds.push(found); owner[found]=s;
    }
    if(!ok) continue;
    var counts=seeds.map(function(){return 1;}), stuck=false;
    for(var g=0;g<2000;g++){
      var done=true;
      for(var s2=0;s2<nIsl;s2++){
        if(counts[s2]>=sizes[s2]) continue;
        done=false;
        var opts=[];
        for(var hi=0;hi<owner.length;hi++){
          if(owner[hi]!==s2) continue;
          adj[hi].forEach(function(j){
            if(owner[j]!==-1||coords[j].dist>maxDist) return;
            var bad=false;
            adj[j].forEach(function(k){ if(owner[k]!==-1&&owner[k]!==s2) bad=true; });
            if(!bad) opts.push(j);
          });
        }
        if(!opts.length){ stuck=true; break; }
        var pick=opts[Math.floor(Math.random()*opts.length)];
        owner[pick]=s2; counts[s2]++;
      }
      if(stuck||done) break;
    }
    if(stuck) continue;
    var complete=true;
    for(var c2=0;c2<nIsl;c2++) if(counts[c2]<sizes[c2]) complete=false;
    if(complete) return owner;
  }
  return null;
}
// Aufbauhinweis: Wald und Weideland sollen keine zu schlechten Zahlen (2/12) erhalten
function avoidWeakWoodSheep(tiles){
  var weak=[2,12];
  tiles.forEach(function(t,i){
    if((t.resource!=="wood"&&t.resource!=="sheep")||t.number===null) return;
    if(weak.indexOf(t.number)<0) return;
    for(var j=0;j<tiles.length;j++){
      var o=tiles[j];
      if(o.number===null||j===i) continue;
      if(o.resource==="wood"||o.resource==="sheep") continue;
      if(weak.indexOf(o.number)>=0) continue;
      var tmp=t.number; t.number=o.number; o.number=tmp; return;
    }
  });
}
function assembleBoard(centers){
  function corner(cx,cy,i){var a=Math.PI/180*(60*i-30);return{x:cx+SIZE*Math.cos(a),y:cy+SIZE*Math.sin(a)};}
  var vmap={}, vertices=[];

    var id=vertices.length;vertices.push({id:id,x:p.x,y:p.y,hexes:[],edges:[],adj:[]});vmap[key]=id;return id;}
  var hexes=centers.map(function(c,hi){var vs=[];for(var i=0;i<6;i++)vs.push(vid(corner(c.x,c.y,i)));return{id:hi,x:c.x,y:c.y,vertices:vs,edges:[]};});
  hexes.forEach(function(h){h.vertices.forEach(function(v){if(vertices[v].hexes.indexOf(h.id)<0)vertices[v].hexes.push(h.id);});});
  var emap={}, edges=[];
  function eid(a,b){var key=a<b?a+"-"+b:b+"-"+a;if(emap[key]!==undefined)return emap[key];
    var id=edges.length;var va=vertices[a],vb=vertices[b];edges.push({id:id,v1:a,v2:b,x:(va.x+vb.x)/2,y:(va.y+vb.y)/2,hexes:[]});emap[key]=id;return id;}
  hexes.forEach(function(h){for(var i=0;i<6;i++){var a=h.vertices[i],b=h.vertices[(i+1)%6];var e=eid(a,b);
    if(edges[e].hexes.indexOf(h.id)<0)edges[e].hexes.push(h.id);
    if(h.edges.indexOf(e)<0)h.edges.push(e);
    if(vertices[a].edges.indexOf(e)<0)vertices[a].edges.push(e);if(vertices[b].edges.indexOf(e)<0)vertices[b].edges.push(e);}});
  edges.forEach(function(e){if(vertices[e.v1].adj.indexOf(e.v2)<0)vertices[e.v1].adj.push(e.v2);if(vertices[e.v2].adj.indexOf(e.v1)<0)vertices[e.v2].adj.push(e.v1);});
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  vertices.forEach(function(v){minX=Math.min(minX,v.x);minY=Math.min(minY,v.y);maxX=Math.max(maxX,v.x);maxY=Math.max(maxY,v.y);});
  return{hexes:hexes,vertices:vertices,edges:edges,bounds:{minX:minX,minY:minY,maxX:maxX,maxY:maxY}};
}
function buildBoard(rows){

  rows.forEach(function(count,r){
    var y=r*vSp, rowW=(count-1)*hSp;
    for(var i=0;i<count;i++) centers.push({x:i*hSp-rowW/2,y:y});
  });
  return assembleBoard(centers);
}
// Seafarers: radius-R hexagonal field; distance R ring = sea, inner = land
function seaCoords(R){

    out.push({q:q,r:r,dist:(Math.abs(q)+Math.abs(r)+Math.abs(q+r))/2});

}

function harborTypes(n){

function assignHarbors(board,n){
  var c={x:(board.bounds.minX+board.bounds.maxX)/2,y:(board.bounds.minY+board.bounds.maxY)/2};
  var outer=board.edges.filter(function(e){return e.hexes.length===1;});

/* ---------- rules helpers ---------- */
function distanceOK(v,b,board){if(b[v])return false;return board.vertices[v].adj.every(function(a){return !b[a];});}
function settlementLegal(v,pl,b,roads,board,setup){
  if(!distanceOK(v,b,board))return false; if(setup)return true;
  var ships=state.ships||{};

}
function roadLegal(eid,pl,b,roads,board,restrict){
  if(roads[eid])return false;
  if(state.ships&&state.ships[eid])return false;
  if(state.mode==="sea"&&edgeKind(eid)==="sea")return false;
  var e=board.edges[eid];
  if(restrict!=null)return e.v1===restrict||e.v2===restrict;
  return [e.v1,e.v2].some(function(w){
    var bo=b[w];
    if(bo&&bo.owner===pl)return true;
    if(bo&&bo.owner!==pl)return false;
    return board.vertices[w].edges.some(function(oe){return roads[oe]&&roads[oe].owner===pl;});
  });
}
function shipLegal(eid,pl,restrict){
  var ships=state.ships||{}, b=state.buildings, board=state.board;
  if(state.pathSet&&state.pathSet[eid]){
    var pd=state.pathSet[eid];
    if(pd.owner!==pl||ships[eid])return false;
    for(var kk=0;kk<pd.idx;kk++){ if(!ships[state.pathEdges[pl][kk]])return false; }
    return true;
  }
  if(ships[eid]||state.roads[eid])return false;
  var k=edgeKind(eid); if(k!=="sea"&&k!=="coast")return false;
  if(seaRobberBlocks(eid))return false;
  var e=board.edges[eid];
  if(restrict!=null)return e.v1===restrict||e.v2===restrict;
  return [e.v1,e.v2].some(function(w){
    var bo=b[w];
    if(bo&&bo.owner===pl)return true;
    if(bo&&bo.owner!==pl)return false;

}
function shipMovable(eid,pl){

    if(b[v]&&b[v].owner===pl)return false;

function hasMovableShip(pl){ for(var k in state.ships){ if(shipMovable(Number(k),pl))return true; } return false; }
function shipMoveTargets(pl,fromEid){

function longestRoute(pl){
  var board=state.board, roads=state.roads, ships=state.ships||{}, b=state.buildings, owned=[];
  board.edges.forEach(function(e){
    if(roads[e.id]&&roads[e.id].owner===pl) owned.push({id:e.id,v1:e.v1,v2:e.v2,kind:"road"});
    else if(ships[e.id]&&ships[e.id].owner===pl) owned.push({id:e.id,v1:e.v1,v2:e.v2,kind:"ship"});
  });
  if(owned.length===0)return 0;
  var inc={};
  owned.forEach(function(e){(inc[e.v1]=inc[e.v1]||[]).push(e);(inc[e.v2]=inc[e.v2]||[]).push(e);});

    if(arrived!==null&&blocked(vertex)){best=Math.max(best,used.size);return;}
    (inc[vertex]||[]).forEach(function(e){

function rollResourcesAndSeven(sum){
  if(sum===7){
    var queue=[]; state.players.forEach(function(p,pi){var nn=totalCards(p.res);if(nn>7)queue.push({pi:pi,count:Math.floor(nn/2)});});
    if(queue.length>0){ state.pending={type:"discard",queue:queue,qi:0}; state.ui.discardSel=emptyRes(); pushLog("log_robber_discard"); }
    else if(state.scenario==="piraten"){
      state.pending={type:"pirateSteal",candidates:state.players.map(function(_,i){return i;}).filter(function(i){return i!==state.current;})};
      pushLog("log_pirate_steal_prompt");
    } else beginRobber("roll");
  }else{
    var goldGain={};
    state.tiles.forEach(function(t,hi){
      if(t.number!==sum||hi===state.robberHex)return;
      state.board.hexes[hi].vertices.forEach(function(v){
        var b=state.buildings[v]; if(!b||b.captured)return;
        var amt=b.type==="city"?2:1;
        if(t.resource==="gold"){ goldGain[b.owner]=(goldGain[b.owner]||0)+amt; }
        else if(t.resource!=="sea"&&t.resource!=="desert"&&t.resource!=="village"&&t.resource!=="fortress"){ state.players[b.owner].res[t.resource]+=amt; }
      });
    });
    clothRoll(sum);
    var gq=Object.keys(goldGain).map(function(pik){return{pi:Number(pik),count:goldGain[pik]};});
    if(gq.length>0){ state.pending={type:"gold",queue:gq,qi:0}; state.ui.goldSel=emptyRes(); pushLog("log_gold"); }
  }
  checkWin();
}

/* Szenario 6 "Stoffe für Catan" für 5-6 Spieler.

   je ca. 21 Hex), dazwischen ein Meer-Streifen (q∈{-1,0,1}) mit 12 Dörfern

/* Szenario 6 "Stoffe für Catan" für 5-6 Spieler.
   PDF-konformes Layout (2025er Ausgabe): exakt 56 Hex = 12 offenes Meer +
   12 Dörfer + 4 Wüsten + 2 Goldflüsse + 26 Standard-Land (Hügel 4, Wald 6,
   Weide 5, Acker 6, Gebirge 5). (Anmerkung: PDF listet "Meer 24" — das
   umfasst auch die 12 Positionen unter den Dörfern; als eigenständige
   village-Hexes bleibt es logisch bei 12 offenen Sea-Feldern.)
   Häfen: 6 Spezial (2× Wolle) + 5 3:1 (via harborList). 12 Dörfer je
   5 Stoffballen + 10 Reserve = 70 Stoffballen (regelkonform).
   setupSettlements:3 greift automatisch: 3 Startsiedlungen pro Person.

   Board-Konstruktion: R=4-Basis (61 Hex) minus 5 äußere Meer-Streifen-
   Positionen → 56 Hex. Zwei Home-Inseln (q≤-2 und q≥2, je 18 Hex, davon
   je 2 Sea-Küstenrand + 2 Wüste + 1 Gold + 13 Standard-Land = 16 Land).
   Meer-Streifen (q∈{-1,0,1}, 20 Positionen nach Reduktion): 12 Dörfer +
   8 offene Sea. Chips: 26 Standard + 2 Gold = 28, verteilt nach
   proportional erweitertem PDF-Muster; Dorf-Nummern separat aus dem
   klassischen Dorf-Pool [3..11 ohne 7]. */
function buildStoffeBig(n){
  // 56 Hex: R=4 (61 Positionen) minus 5 äußere Meer-Streifen-Positionen
  var excluded={"-1,4":1,"0,-4":1,"0,4":1,"1,-4":1,"1,3":1};
  var coords=seaCoords(4).filter(function(c){ return !excluded[c.q+","+c.r]; });
  var centers=coords.map(function(c){return{x:SIZE*SQRT3*(c.q+c.r/2),y:SIZE*1.5*c.r};});
  var board=assembleBoard(centers); board.coords=coords;
  var idx={}; coords.forEach(function(c,i){ idx[c.q+","+c.r]=i; });

  // 12 Dorf-Positionen im Meer-Streifen (q in {-1,0,1}), zickzack + symmetrisch
  var villageQR=[
    [0,-3],[0,-1],[0,1],[0,3],                     // 4 auf q=0
    [-1,-3],[-1,-1],[-1,1],[-1,3],                  // 4 auf q=-1
    [1,-3],[1,-1],[1,1],[1,2]                       // 4 auf q=1
  ];
  var villageSet={}; villageQR.forEach(function(qr){ var i=idx[qr[0]+","+qr[1]]; if(i!=null) villageSet[i]=true; });

  // Regionen zuweisen
  var region=coords.map(function(c,i){
    if(villageSet[i]) return "village";
    if(c.q<=-2 && c.dist<4) return "homeInner";     // Innere Home-Insel-Positionen
    if(c.q>=2  && c.dist<4) return "homeInner";
    if(c.q<=-2 || c.q>=2)   return "homeCoast";     // dist=4 Home-Randstreifen (teils Sea, teils Land)
    return "sea";                                   // Meer-Streifen ohne Dorf
  });

  // Home-Küste (dist=4 mit q≤-2 oder q≥2): 4 Land Positionen behalten, Rest = Sea (2 pro Seite)
  var coastLeft=[], coastRight=[];
  region.forEach(function(rg,hi){
    if(rg!=="homeCoast") return;
    if(coords[hi].q<=-2) coastLeft.push(hi); else coastRight.push(hi);
  });
  var coastLandLeft =shuffle(coastLeft.slice()).slice(0,3);   // 3 Küsten-Land links
  var coastLandRight=shuffle(coastRight.slice()).slice(0,3);  // 3 Küsten-Land rechts
  var coastLandSet={};
  coastLandLeft.concat(coastLandRight).forEach(function(hi){ coastLandSet[hi]=true; });

  // Home-Land Positionen: innere Home + ausgewählte Küsten-Land
  var homeLeftIds=[], homeRightIds=[];
  region.forEach(function(rg,hi){
    var isHomeSide=(rg==="homeInner")||(rg==="homeCoast" && coastLandSet[hi]);
    if(!isHomeSide) return;
    if(coords[hi].q<=-2) homeLeftIds.push(hi); else homeRightIds.push(hi);
  });

  // Pro Home-Insel: 2 Wüsten + 1 Gold + Rest Standard-Land (Ziel: je 13 Standard-Land)
  function placeHome(hids){
    var sh=shuffle(hids.slice());
    return {desert:sh.slice(0,2), gold:sh.slice(2,3), land:sh.slice(3)};
  }
  var lz=placeHome(homeLeftIds), rz=placeHome(homeRightIds);
  var allLand=lz.land.concat(rz.land);
  var allGold=lz.gold.concat(rz.gold);

  // Chip-Verteilung: proportional erweitertes PDF-Muster für 28 Chip-Positionen
  // (26 Standard + 2 Gold). PDF-Muster: 2:1, 3:3, 4:3, 5:3, 6:4, 8:4, 9:3, 10:3, 11:3, 12:1 = 28
  var chipCfg={2:1,3:3,4:3,5:3,6:4,8:4,9:3,10:3,11:3,12:1};
  var toks=chipBag(chipCfg);

  // Standard-Land-Ressourcen exakt nach PDF: Hügel 4, Wald 6, Weide 5, Acker 6, Gebirge 5 = 26
  var landBag=shuffle(resBag({brick:4,wood:6,sheep:5,wheat:6,ore:5}));

  var tiles=board.hexes.map(function(){return{resource:"sea",number:null};});
  allLand.forEach(function(hi){ tiles[hi]={resource:landBag.pop(),number:toks.pop()}; });
  allGold.forEach(function(hi){ tiles[hi]={resource:"gold",number:toks.pop()}; });
  lz.desert.concat(rz.desert).forEach(function(hi){ tiles[hi]={resource:"desert",number:null}; });
  var homeHexes={}; region.forEach(function(rg,hi){
    var isHomeSide=(rg==="homeInner")||(rg==="homeCoast" && coastLandSet[hi]);
    if(isHomeSide) homeHexes[hi]=true;
  });

  // 12 Dörfer: Nummern aus [3..11] ohne 7, doppelt verteilt (12 Nummern)
  var villages={}, vnums=shuffle([3,4,5,6,8,9,10,11, 3,5,9,11]);
  var vi=0;
  region.forEach(function(rg,hi){
    if(rg==="village"){
      var num=vnums[vi++%vnums.length];
      tiles[hi]={resource:"village",number:num};
      villages[hi]={number:num,cloth:5};
    }
  });

  var robberHex=lz.desert.length ? lz.desert[0] : allLand[0];
  var seaRobberHex=tiles.findIndex(function(t){return t.resource==="sea";});
  return {board:board,tiles:tiles,harbors:assignSeaHarbors(board,tiles),robberHex:robberHex,seaRobberHex:seaRobberHex,islandOf:null,homeHexes:homeHexes,villages:villages,clothReserve:10};
}

  var board=assembleBoard(centers); board.coords=coords;
  var region=coords.map(function(c){ if(c.dist===4)return "sea"; if(c.r===0)return "sea"; return c.r>=1?"home":"far"; });
  var landIdx=[]; region.forEach(function(rg,hi){ if(rg==="home"||rg==="far") landIdx.push(hi); });
  var bag=shuffle(spreadRes(landIdx.length)), toks=makeTokens(landIdx.length);

  var homeHexes={}; region.forEach(function(rg,hi){ if(rg==="home") homeHexes[hi]=true; });
  // far hexes: coastal ones (r==-1) carry harbor tokens, the rest carry tribe reward tokens
  var farIds=[]; region.forEach(function(rg,hi){ if(rg==="far") farIds.push(hi); });
  var coastFar=farIds.filter(function(hi){ return coords[hi].r===-1; });
  var harborHexes=shuffle(coastFar.slice()).slice(0,4);
  var harborSet={}; harborHexes.forEach(function(hi){ harborSet[hi]=true; });
  var hspec=shuffle([{ratio:3,kind:"any"},{ratio:3,kind:"any"},{ratio:2,kind:"brick"},{ratio:2,kind:"ore"},{ratio:2,kind:"wheat"},{ratio:2,kind:"wood"}]);
  var tribeHarbors={}; harborHexes.forEach(function(hi,k){ var s=hspec[k%hspec.length]; tribeHarbors[hi]={ratio:s.ratio,kind:s.kind}; });
  var rewardIds=farIds.filter(function(hi){ return !harborSet[hi]; });
  var kinds=shuffle(rewardIds.map(function(_,i){ var m=i%10; return m<4?"res":(m<7?"dev":"vp"); }));
  var tribe={}; rewardIds.forEach(function(hi,k){ tribe[hi]={kind:kinds[k],res:tiles[hi].resource}; });
  var robberHex=region.indexOf("home"); var seaRobberHex=tiles.findIndex(function(t){return t.resource==="sea";});
  return {board:board,tiles:tiles,harbors:assignSeaHarbors(board,tiles),robberHex:robberHex,seaRobberHex:seaRobberHex,islandOf:null,homeHexes:homeHexes,tribe:tribe,tribeHarbors:tribeHarbors};
}
/* Szenario 5 "Der vergessene Stamm" für 5-6 Spieler.
   PDF-konformes Layout (2025er Ausgabe): exakt 63 Hex = 22 Meer + 4 Wüsten +
   3 Goldflüsse + 34 Standard-Land (7 pro Hügel/Wald/Weide/Acker + 6 Gebirge).
   Häfen: 5 Spezial + 3× 3:1 = 8 Häfen. Extra: 10 Siegpunkt-Chips + 6 Entw.-Karten.

   Board-Konstruktion: R=4-Basis (61 Hex) + 2 kleine Inseln bei (-4,-2) und
   (4,2) im dist=5-Ring → 63 Hex gesamt. Wasserstreifen r=0 (9 Hex) trennt
   Home (r≥1) und Far (r≤-1). Küstenring dist=4 non-r0 (22 Hex) verteilt in
   13 Sea + 9 Küsten-Land. Inner Home und Inner Far je 15 Standard-Land.
   Wüsten/Gold-Verteilung: Home = 2 Wüsten + 1 Gold + 17 Standard,
   Far = 2 Wüsten + 2 Gold + 17 Standard (thematisch: das vergessene Land ist
   ressourcen-reicher).

   Chip-Anmerkung: Das PDF listet 29 Chips (physisch im Karton), aber 37 Chip-
   Positionen (34 Standard-Land + 3 Gold). Für Regelfluss verwenden wir 37 Chips
   nach proportional erweiterter PDF-Verteilung (2:1, 3:5, 4:5, 5:5, 6:4, 8:4,
   9:4, 10:4, 11:4, 12:1). */
function buildVergessenBig(n){
  // 63 Hex: R=4-Basis + 2 kleine Inseln in der Far-Zone (dist=5)
  var coords=seaCoords(4).concat([
    {q:-4,r:-1,s: 5,dist:5},  // (q=-4, r=-1) → dist=(4+1+5)/2=5 ✓; Far-Seite (r<0)
    {q: 4,r: 1,s:-5,dist:5}   // (q=4, r=1)   → dist=(4+1+5)/2=5 ✓; thematisch Far
  ]);
  var centers=coords.map(function(c){return{x:SIZE*SQRT3*(c.q+c.r/2),y:SIZE*1.5*c.r};});
  var board=assembleBoard(centers); board.coords=coords;

  // Regionen zuweisen
  var region=coords.map(function(c){
    if(c.dist===5) return "island";                     // 2 kleine Inseln → Far
    if(c.r===0) return "sea";                           // Wasserstreifen 9 Hex
    if(c.dist===4) return c.r>=1 ? "homeCoast" : "farCoast"; // Küstenring 22 Hex → teils sea, teils Land
    if(c.r>=1) return "home";                           // Inner Home: 15 Hex
    return "far";                                       // Inner Far: 15 Hex
  });

  var tiles=board.hexes.map(function(){return{resource:"sea",number:null};});

  // Küstenring aufteilen: Home-Küste 11 Positionen → 6 sea + 5 Land; Far-Küste 11 → 7 sea + 4 Land
  // (asymmetrisch, damit Far mit den 2 Inseln in Summe ausgewogen bleibt)
  var homeCoastIdx=[], farCoastIdx=[];
  region.forEach(function(rg,hi){
    if(rg==="homeCoast") homeCoastIdx.push(hi);
    else if(rg==="farCoast") farCoastIdx.push(hi);
  });
  var hcShuf=shuffle(homeCoastIdx.slice()), fcShuf=shuffle(farCoastIdx.slice());
  var homeCoastLand=hcShuf.slice(0,5);   // 5 Küsten-Land Home
  var farCoastLand =fcShuf.slice(0,4);   // 4 Küsten-Land Far

  // Alle Home-Land Positionen: 15 Inner + 5 Küste = 20
  var innerHome=[]; region.forEach(function(rg,hi){ if(rg==="home") innerHome.push(hi); });
  var homeAllLand=innerHome.concat(homeCoastLand);
  // Alle Far-Land Positionen: 15 Inner + 4 Küste + 2 Inseln = 21
  var innerFar=[]; region.forEach(function(rg,hi){ if(rg==="far") innerFar.push(hi); });
  var islands=[]; region.forEach(function(rg,hi){ if(rg==="island") islands.push(hi); });
  var farAllLand=innerFar.concat(farCoastLand).concat(islands);

  // Home-Verteilung: 2 Wüsten + 1 Gold + 17 Standard = 20
  var homeShuf=shuffle(homeAllLand.slice());
  var homeDesert=homeShuf.slice(0,2);
  var homeGold  =homeShuf.slice(2,3);
  var homeStd   =homeShuf.slice(3);       // 17 Standard-Land

  // Far-Verteilung: 2 Wüsten + 2 Gold + 17 Standard = 21
  var farShuf=shuffle(farAllLand.slice());
  var farDesert=farShuf.slice(0,2);
  var farGold  =farShuf.slice(2,4);
  var farStd   =farShuf.slice(4);         // 17 Standard-Land

  // Chip-Distribution: proportional erweitertes PDF-Muster für 37 Chips
  // (34 Standard + 3 Gold = 37 → 2:1, 3:5, 4:5, 5:5, 6:4, 8:4, 9:4, 10:4, 11:4, 12:1)
  var chipCfg={2:1,3:5,4:5,5:5,6:4,8:4,9:4,10:4,11:4,12:1};
  var toks=chipBag(chipCfg);

  // Ressourcen-Verteilung: 7+7+7+7+6 = 34 Standard (Hügel/Wald/Weide/Acker + Gebirge)
  var landBag=shuffle(resBag({brick:7,wood:7,sheep:7,wheat:7,ore:6}));

  homeStd.forEach(function(hi){ tiles[hi]={resource:landBag.pop(), number:toks.pop()}; });
  farStd.forEach(function(hi){ tiles[hi]={resource:landBag.pop(), number:toks.pop()}; });
  homeGold.forEach(function(hi){ tiles[hi]={resource:"gold", number:toks.pop()}; });
  farGold.forEach(function(hi){ tiles[hi]={resource:"gold", number:toks.pop()}; });
  homeDesert.concat(farDesert).forEach(function(hi){ tiles[hi]={resource:"desert",number:null}; });

  // homeHexes: alle Home-Land-Positionen (für Startaufstellung "home"-Regel)
  var homeHexes={};
  homeAllLand.forEach(function(hi){ homeHexes[hi]=true; });

  // Tribe-Häfen auf Far-Küsten-Land + Islands (nur Standard-Land, keine Wüste/Gold)
  var specialSet={};
  homeDesert.concat(homeGold).concat(farDesert).concat(farGold).forEach(function(hi){ specialSet[hi]=true; });
  var tribeHarborCandidates=farCoastLand.concat(islands).filter(function(hi){ return !specialSet[hi]; });
  var harborHexes=shuffle(tribeHarborCandidates.slice()).slice(0,Math.min(6,tribeHarborCandidates.length));
  var harborSet={}; harborHexes.forEach(function(hi){ harborSet[hi]=true; });
  var hspec=shuffle([
    {ratio:3,kind:"any"},{ratio:3,kind:"any"},{ratio:3,kind:"any"},
    {ratio:2,kind:"brick"},{ratio:2,kind:"ore"},{ratio:2,kind:"wheat"},{ratio:2,kind:"wood"},{ratio:2,kind:"sheep"}
  ]);
  var tribeHarbors={};
  harborHexes.forEach(function(hi,k){ var s=hspec[k%hspec.length]; tribeHarbors[hi]={ratio:s.ratio,kind:s.kind}; });

  // Tribe-Rewards auf innerer Far (nur Standard-Land, nicht Wüste/Gold, nicht Hafen)
  var rewardIds=innerFar.filter(function(hi){ return !specialSet[hi] && !harborSet[hi]; });
  var kinds=shuffle(rewardIds.map(function(_,i){ var m=i%10; return m<4?"res":(m<7?"dev":"vp"); }));
  var tribe={};
  rewardIds.forEach(function(hi,k){ tribe[hi]={kind:kinds[k],res:tiles[hi].resource}; });

  var robberHex=homeDesert.length ? homeDesert[0] : (farDesert.length ? farDesert[0] : homeStd[0]);
  var seaRobberHex=tiles.findIndex(function(t){return t.resource==="sea";});
  return {board:board,tiles:tiles,harbors:assignSeaHarbors(board,tiles),robberHex:robberHex,seaRobberHex:seaRobberHex,islandOf:null,homeHexes:homeHexes,tribe:tribe,tribeHarbors:tribeHarbors};
}
// "Durch die Wüste": home island + desert belt + fertile land beyond; +1 VP per settlement beyond the desert
function buildWueste(n){

  var centers=coords.map(function(c){return{x:SIZE*SQRT3*(c.q+c.r/2),y:SIZE*1.5*c.r};});
  var board=assembleBoard(centers); board.coords=coords;
  var region=coords.map(function(c){
    if(c.dist===4) return "sea";     // coastal ring (sail around the desert)
    if(c.r===0) return "desert";     // the desert belt across the middle
    if(c.r>=1) return "home";        // near / home lands (founding here)
    return "far";                    // fertile land beyond the desert
  });
  var tiles=board.hexes.map(function(){return{resource:"sea",number:null};});
  var landIdx=[]; region.forEach(function(rg,hi){ if(rg==="home"||rg==="far") landIdx.push(hi); });
  var bag=shuffle(spreadRes(landIdx.length)), toks=makeTokens(landIdx.length);
  landIdx.forEach(function(hi){ tiles[hi]={resource:bag.pop(),number:toks.pop()}; });
  region.forEach(function(rg,hi){ if(rg==="desert") tiles[hi]={resource:"desert",number:null}; });
  var farHexes={}; region.forEach(function(rg,hi){ if(rg==="far") farHexes[hi]=true; });
  var robberHex=region.indexOf("desert"); if(robberHex<0)robberHex=landIdx[0];
  var seaRobberHex=tiles.findIndex(function(t){return t.resource==="sea";});
  return {board:board,tiles:tiles,harbors:assignSeaHarbors(board,tiles),robberHex:robberHex,seaRobberHex:seaRobberHex,islandOf:null,farHexes:farHexes};
}

/* Szenario 4 "Durch die Wüste" für 5-6 Spieler.
   PDF-konformes Layout (2025er Ausgabe): exakt 63 Hex = 20 Meer + 5 Wüsten +
   3 Goldflüsse + 35 Standard-Land (7 pro Ressource). 38 Chips genau nach
   PDF-Muster (2:3,3:4,4:4,5:4,6:4,8:4,9:4,10:4,11:4,12:3). 6 Spezialhäfen

   Board-Konstruktion: R=4-Basis (61 Hex) + 2 kleine Inseln bei (-4,-1) und

    var seaHex=isSea(e.hexes[0])?e.hexes[0]:e.hexes[1];

    harbors.push({edgeId:e.id,kind:t.kind,ratio:t.ratio,v1:e.v1,v2:e.v2,x:e.x,y:e.y,dx:dx/len,dy:dy/len});

}
/* main island shapes: 19 hexes (3-4 players) / 30 hexes (5-6 players, rows 3-4-5-6-5-4-3) */
function mainIslandSet(n,coords){

  var lens=[3,4,5,6,5,4,3], key={};

function assignSeaHarbors(board,tiles){
  var isSea=function(h){var r=tiles[h].resource;return r==="sea"||r==="fog";};
  var coast=board.edges.filter(function(e){ return e.hexes.length===2 && (isSea(e.hexes[0])!==isSea(e.hexes[1])); });
  var c={x:(board.bounds.minX+board.bounds.maxX)/2,y:(board.bounds.minY+board.bounds.maxY)/2};
  coast.sort(function(a,b){return Math.atan2(a.y-c.y,a.x-c.x)-Math.atan2(b.y-c.y,b.x-c.x);});
  var types=shuffle([{kind:"any",ratio:3},{kind:"any",ratio:3},{kind:"any",ratio:3},
    {kind:"wood",ratio:2},{kind:"brick",ratio:2},{kind:"sheep",ratio:2},{kind:"wheat",ratio:2},{kind:"ore",ratio:2}]);
  var harbors=[];
  for(var i=0;i<types.length&&coast.length>0;i++){
    var idx=Math.round(i*coast.length/types.length)%coast.length, e=coast[idx], t=types[i];
    var seaHex=isSea(e.hexes[0])?e.hexes[0]:e.hexes[1];
    var sh=board.hexes[seaHex], dx=sh.x-e.x, dy=sh.y-e.y, len=Math.hypot(dx,dy)||1;
    harbors.push({edgeId:e.id,kind:t.kind,ratio:t.ratio,v1:e.v1,v2:e.v2,x:e.x,y:e.y,dx:dx/len,dy:dy/len});

function checkWin(){

    var f=state.fortresses&&state.fortresses[pi];
    var liberated=!f||f.chips<=0;
    if(fullVP(pi)>=(state.vpTarget||10)&&liberated){ state.winner=pi; state.phase="gameover"; pushLog("log_wins",{name:pi}); }
    return;
  }
  if(state.scenario==="wunder"){
    if(fullVP(pi)>=(state.vpTarget||10)){
      var mine=state.wonderStage[pi]||0;
      var beatsAll=mine>0&&state.players.every(function(_,qi){return qi===pi||mine>(state.wonderStage[qi]||0);});
      if(beatsAll){ state.winner=pi; state.phase="gameover"; pushLog("log_wins",{name:pi}); }
    }

  }
  if(fullVP(pi)>=(state.vpTarget||10)){state.winner=pi;state.phase="gameover";pushLog("log_wins",{name:pi});return;}

// Ozeanien: reveal fog hexes bordering a newly built edge
function revealAt(hexId,discoverer,goldQ){

  var hidden=state.fog[hexId]; delete state.fog[hexId];
  if(!hidden||hidden.resource==="sea"){ state.tiles[hexId]={resource:"sea",number:null}; pushLog("log_fog_sea",{name:discoverer}); return; }

  var num=(res==="desert")?null:(state.fogTokens.length?state.fogTokens.pop():null);
  state.tiles[hexId]={resource:res,number:num};

  if(res==="gold"){ if(goldQ) goldQ.push(1); }

function revealFogFor(edgeId,discoverer){
  if(!state.fog)return;

  // ALLE Nebelfelder aufgedeckt, die an einem der beiden Endpunkte (Vertex) der

    state.pending={type:"gold",queue:[{pi:discoverer,count:goldQ.length}],qi:0};

      if(!shipLegal(a.edgeId,mv)){ state.ships[from]=saved; return; }
      state.ships[a.edgeId]={owner:mv,fresh:false};
      state.movedShip=true; state.ui.moveShipFrom=null; state.uiMode=null;
      // Regelkonform: das versetzte Schiff kann angrenzende Nebelfelder aufdecken
      // (Ozeanien), Stämme entdecken (Der vergessene Stamm) und Dörfer anschließen
      // (Stoffe für Catan) – wie beim Neubau eines Schiffs.
      revealFogFor(a.edgeId,mv); revealTribeFor(a.edgeId,mv); clothConnectFor(a.edgeId,mv);
      pushLog("log_moved_ship",{name:mv}); recomputeAwards(); checkWin(); return;
    }
    case "BUILD_SETTLEMENT":{
      var me1=activePlayer(), ps=state.players[me1];
      if(countType(me1,"settlement")>=PIECE.settlement)return;
      if(!canAfford(ps.res,COSTS.settlement))return; ps.res=pay(ps.res,COSTS.settlement);
      state.buildings[a.vertexId]={owner:me1,type:"settlement"}; state.uiMode=null;
      awardIsland(me1,a.vertexId);
      awardFar(me1,a.vertexId);
      if(state.tribeHarbors){ state.board.vertices[a.vertexId].hexes.forEach(function(hi){ var tk=state.tribeHarbors[hi]; if(tk){ delete state.tribeHarbors[hi]; claimTribeHarbor(a.vertexId,tk); pushLog("log_tribe_harbor",{name:me1}); } }); }
      pushLog("log_built_settle",{name:me1}); recomputeAwards(); checkWin(); return;
    }
    case "BUILD_CITY":{
      var me2=activePlayer(), pc=state.players[me2];
      if(countType(me2,"city")>=PIECE.city)return;
      if(!canAfford(pc.res,COSTS.city))return; pc.res=pay(pc.res,COSTS.city);
      state.buildings[a.vertexId]={owner:me2,type:"city"}; state.uiMode=null;
      pushLog("log_built_city",{name:me2}); checkWin(); return;
    }
    case "BUY_DEV":{
      var me3=activePlayer(), pd=state.players[me3];
      if(!canAfford(pd.res,COSTS.dev)||state.devDeck.length===0)return; pd.res=pay(pd.res,COSTS.dev);
      var card=state.devDeck.shift();
      if(card==="vp"&&state.scenario!=="piraten")pd.vpCards+=1; else pd.newDev.push(card);
      pushLog("log_bought_dev",{name:me3}); checkWin(); return;
    }
    case "PLAY_DEV":{
      var actP=activePlayer(), pp=state.players[actP];
      if(pp.playedDevThisTurn)return;
      var idx=pp.dev.indexOf(a.card); if(idx<0)return;
      pp.dev.splice(idx,1); pp.playedDevThisTurn=true; state.uiMode=null;
      pushLog("log_played_dev",{name:actP,card:a.card});
      if(a.card==="knight"){
        if(state.scenario==="piraten"){ pirateConvertShip(actP); checkWin(); }
        else { pp.knights+=1; recomputeAwards(); beginRobber("knight"); checkWin(); }
      }
      else if(a.card==="vp"&&state.scenario==="piraten"){ pirateConvertShip(actP); checkWin(); }
      else if(a.card==="road"){state.pending={type:"roadbuilding",left:2};state.uiMode="road";}
      else if(a.card==="plenty"){state.pending={type:"plenty"};state.ui.plentyPicks=[];}
      else if(a.card==="monopoly"){state.pending={type:"monopoly"};}
      return;
    }
    case "PLENTY_TOGGLE": if(state.ui.plentyPicks.length<2)state.ui.plentyPicks.push(a.res); return;
    case "PLENTY_RESET": state.ui.plentyPicks=[]; return;
    case "PLENTY_CONFIRM":{
      var plP=activePlayer(), pl2=state.players[plP]; state.ui.plentyPicks.forEach(function(r){pl2.res[r]+=1;});
      pushLog("log_plenty",{name:plP,resList:state.ui.plentyPicks.slice()}); state.pending=null; state.ui.plentyPicks=[]; return;
    }
    case "MONOPOLY":{
      var monP=activePlayer(), pm=state.players[monP], taken=0;
      state.players.forEach(function(q,qi){if(qi===monP)return;taken+=q.res[a.res];q.res[a.res]=0;});
      pm.res[a.res]+=taken; pushLog("log_monopoly",{name:monP,res:a.res,count:taken}); state.pending=null; return;
    }

    case "SET_BANK": state.ui[a.side]=a.res; return;    case "BANK_TRADE":{
      var bkP=activePlayer(), pb=state.players[bkP], g=state.ui.bankGive, ge=state.ui.bankGet;
      var ratio=bestRatio(bkP,g);
      if(pb.res[g]<ratio||g===ge)return; pb.res[g]-=ratio; pb.res[ge]+=1;
      pushLog("log_bank",{name:bkP,ratio:ratio,give:g,get:ge}); return;
    }

    case "OPEN_TRADE":
      if(state.part2)return; // Schiff 2: only bank trade, no player trade
      if(state.phase!=="play"||state.special||!state.turn.rolled||state.pending||state.uiMode==="moveRobber")return;
      state.ui.trade={give:emptyRes(),want:emptyRes(),partner:null};
      state.pending={type:"trade_compose"}; return;
    case "TRADE_ADJ":{
      var slot=a.slot, r=a.res, p=state.players[state.current];
      var max=slot==="give"?p.res[r]:19;
      var v=Math.max(0,Math.min(max,state.ui.trade[slot][r]+a.d));
      state.ui.trade[slot][r]=v; return;
    }
    case "TRADE_PARTNER": state.ui.trade.partner=a.pi; return;
    case "TRADE_CANCEL": state.pending=null; return;
    case "TRADE_SEND":{
      var T=state.ui.trade;
      if(T.partner===null||totalCards(T.give)<1||totalCards(T.want)<1)return;
      var pg=state.players[state.current];
      if(!RES.every(function(x){return pg.res[x]>=T.give[x];}))return;
      var g={},w={};RES.forEach(function(x){g[x]=T.give[x];w[x]=T.want[x];});
      state.pending={type:"trade_offer",partner:T.partner,give:g,want:w}; return;
    }
    case "TRADE_DECLINE":
      pushLog("log_trade_decline",{name:state.current,victim:state.pending.partner});
      state.pending=null; return;
    case "TRADE_ACCEPT":{
      var o=state.pending, act=state.players[state.current], par=state.players[o.partner];
      if(!RES.every(function(x){return par.res[x]>=o.want[x];}))return;
      RES.forEach(function(x){
        act.res[x]-=o.give[x]; act.res[x]+=o.want[x];
        par.res[x]+=o.give[x]; par.res[x]-=o.want[x];
      });
      pushLog("log_trade",{name:state.current,victim:o.partner,g:resIcons(o.give),w:resIcons(o.want)});
      state.pending=null; return;
    }

    case "END_TURN":{
      var actor=activePlayer(), pe=state.players[actor];
      pe.dev=pe.dev.concat(pe.newDev); pe.newDev=[]; pe.playedDevThisTurn=false;
      state.uiMode=null; state.pending=null;
      if(seaBig()){
        if(!state.part2){
          // Schiff 1 done -> Schiff 2 (3 seats left) takes a restricted turn (no roll, bank trade only)
          state.part2=true; state.movedShip=false;
          state.turn={rolled:true,dice:state.turn?state.turn.dice:null};
          pushLog("log_ship2",{name:schiff2Seat()}); return;
        }
        // both done -> new Spielzug: Schiff 1 moves one seat left
        state.part2=false; advanceTurn(); return;
      }
      if(state.players.length>=5){
        // Almanach 5–6 (base): after A's turn, all others may build/buy in clockwise order
        var q=[]; for(var kk=1;kk<state.players.length;kk++)q.push((state.current+kk)%state.players.length);
        state.special={queue:q,idx:0};
        pushLog("log_special_start",{name:q[0]}); return;
      }
      advanceTurn(); return;
    }
    case "ATTACK_FORTRESS":{
      var pia=activePlayer();
      if(state.scenario!=="piraten"||state.attackedFortress)return;
      var f=state.fortresses&&state.fortresses[pia]; if(!f||f.chips<=0)return;
      var path=state.pathEdges[pia]; if(!path||!path.every(function(e){return !!state.ships[e];}))return;
      state.attackedFortress=true;
      attackFortress(pia);
      checkWin();
      if(state.phase!=="gameover")apply({type:"END_TURN"});
      return;
    }
    case "CLAIM_WONDER":{
      var pw=activePlayer();
      if(state.scenario!=="wunder"||state.wonderClaims[pw])return;
      if(!wonderEligible(pw,a.wonder))return;
      state.wonderClaims[pw]=a.wonder; state.wonderStage[pw]=0;
      pushLog("log_wonder_claimed",{name:pw,wonder:tr("wonder_"+a.wonder)});
      return;
    }
    case "BUILD_WONDER_STAGE":{
      var pw2=activePlayer(), wid2=state.wonderClaims[pw2]; if(!wid2)return;
      if((state.wonderStage[pw2]||0)>=4)return;
      var p2=state.players[pw2], cost=WONDERS[wid2].cost;
      if(!canAfford(p2.res,cost))return;
      p2.res=pay(p2.res,cost); state.wonderStage[pw2]=(state.wonderStage[pw2]||0)+1;
      pushLog("log_wonder_stage",{name:pw2,wonder:tr("wonder_"+wid2),stage:state.wonderStage[pw2]});
      if(state.wonderStage[pw2]>=4){ state.winner=pw2; state.phase="gameover"; pushLog("log_wonder_win",{name:pw2}); }
      return;
    }
    case "SPECIAL_DONE":{
      if(!state.special)return;
      var sb=state.players[state.special.queue[state.special.idx]];
      sb.dev=sb.dev.concat(sb.newDev); sb.newDev=[]; // bought in A's turn → playable on their own turn
      state.uiMode=null; state.special.idx+=1;
      if(state.special.idx>=state.special.queue.length){ state.special=null; advanceTurn(); }
      else pushLog("log_special_next",{name:state.special.queue[state.special.idx]});
      return;
    }
  }
}
function advanceTurn(){
  state.current=(state.current+1)%state.players.length;
  state.turnCount=(state.turnCount||0)+1;
  state.turn={rolled:false,dice:null}; state.uiMode=null; state.pending=null; state.special=null; state.part2=false;
  state.movedShip=false; state.attackedFortress=false;
  for(var k in state.ships) state.ships[k].fresh=false;
  pushLog("log_next",{name:state.current});
}

/* ============================================================ BOT AI ============ */
var PIP_WEIGHT={2:1,3:2,4:3,5:4,6:5,8:5,9:4,10:3,11:2,12:1};
var SKILL={
  easy:  {noise:0.75, trade:false,  devTiming:"immediate", buyDevChance:0.30},
  medium:{noise:0.32, trade:"bank", devTiming:"smart",     buyDevChance:0.55},
  hard:  {noise:0.10, trade:"bank", devTiming:"smart",     buyDevChance:0.75}
};
function botSkill(pi){ return SKILL[state.players[pi]&&state.players[pi].bot]||SKILL.medium; }
function withUiMode(mode,fn){ var saved=state.uiMode; state.uiMode=mode; var r=fn(); state.uiMode=saved; return r; }
function legalSettlementVerts(){ return withUiMode("settlement",legalVertSet); }
function legalCityVerts(){ return withUiMode("city",legalVertSet); }
function legalRoadEdges(){ return withUiMode("road",legalEdgeSet); }
function legalShipEdges(){ return withUiMode("ship",legalEdgeSet); }
function vertexScore(v){
  var score=0, resSeen={};
  state.board.vertices[v].hexes.forEach(function(hi){
    var t=state.tiles[hi];
    if(!t||t.resource==="sea"||t.resource==="fog"||t.resource==="desert"||t.resource==="fortress"||t.resource==="village")return;
    var w=PIP_WEIGHT[t.number]||0;
    if(t.resource==="gold")w*=1.3;
    score+=w; resSeen[t.resource]=(resSeen[t.resource]||0)+1;
  });
  score+=Object.keys(resSeen).length*0.6;
  state.harbors.forEach(function(hb){ if(hb.v1===Number(v)||hb.v2===Number(v))score+=(hb.kind==="any"?0.8:1.4); });
  return score;
}
function edgeScore(eid){
  var e=state.board.edges[eid];
  var sc=(vertexScore(e.v1)+vertexScore(e.v2))/2;
  if(state.pathSet&&state.pathSet[eid]&&state.pathSet[eid].owner===activePlayer())sc+=50;
  return sc;
}
function pickBest(map,scoreFn,sk){
  var keys=Object.keys(map); if(!keys.length)return null;
  var best=null,bestScore=-Infinity;
  keys.forEach(function(k){
    var raw=scoreFn(k); var jitter=1+(Math.random()*2-1)*(sk?sk.noise:0.3);
    var sc=raw*jitter;
    if(sc>bestScore){bestScore=sc;best=k;}
  });
  return best;
}
function leaderPi(excludePi){
  var best=-1,bi=null;
  state.players.forEach(function(pl,qi){ if(qi===excludePi)return; var v=fullVP(qi); if(v>best){best=v;bi=qi;} });
  return bi;
}
function missingFor(res,cost){ var m=[]; for(var k in cost){ if(res[k]<cost[k])m.push(k); } return m; }
function planBankTrade(pi){
  var p=state.players[pi], targets=[COSTS.settlement,COSTS.city,COSTS.dev];
  for(var i=0;i<targets.length;i++){
    var need=missingFor(p.res,targets[i]);
    if(need.length===1){
      var want=need[0];
      var give=RES.filter(function(r){return r!==want;}).sort(function(a,b){
        return (p.res[b]-bestRatio(pi,b))-(p.res[a]-bestRatio(pi,a));
      })[0];
      var ratio=bestRatio(pi,give);
      if(p.res[give]>=ratio)return{give:give,get:want};
    }
  }
  return null;
}
function pickNeededResource(pi){
  var p=state.players[pi];
  return ["ore","wheat","sheep","wood","brick"].sort(function(a,b){return p.res[a]-p.res[b];})[0];
}
function shouldPlayKnight(pi){
  if(state.robberHex==null)return false;
  var onMine=state.board.hexes[state.robberHex].vertices.some(function(v){var b=state.buildings[v];return b&&b.owner===pi;});
  return onMine||Math.random()<0.3;
}
function hasConvertibleShip(pi){
  var path=state.pathEdges&&state.pathEdges[pi]; if(!path)return false;
  return path.some(function(e){var sh=state.ships[e]; return sh&&sh.owner===pi&&!sh.war;});
}
function pickDevCardToPlay(pi,sk){
  var p=state.players[pi];
  if(sk.devTiming==="immediate")return p.dev[0]||null;
  if(state.scenario==="piraten"){
    if(p.dev.indexOf("knight")>=0&&hasConvertibleShip(pi))return "knight";
    if(p.dev.indexOf("vp")>=0&&hasConvertibleShip(pi))return "vp";
    if(p.dev.indexOf("road")>=0&&(countRoads(pi)<PIECE.road||countShips(pi)<PIECE.ship))return "road";
    if(p.dev.indexOf("monopoly")>=0&&Math.random()<0.5)return "monopoly";
    if(p.dev.indexOf("plenty")>=0&&Math.random()<0.6)return "plenty";
    return null;
  }
  if(p.dev.indexOf("knight")>=0&&shouldPlayKnight(pi))return "knight";
  if(p.dev.indexOf("road")>=0&&(countRoads(pi)<PIECE.road||countShips(pi)<PIECE.ship))return "road";
  if(p.dev.indexOf("monopoly")>=0&&Math.random()<0.5)return "monopoly";
  if(p.dev.indexOf("plenty")>=0&&Math.random()<0.6)return "plenty";
  return null;
}
function botMoveRobberHex(pi,seaMode){
  var target=leaderPi(pi);
  var cands=state.tiles.map(function(t,hi){return hi;}).filter(function(hi){
    var t=state.tiles[hi]; if(!t)return false;
    var isWater=t.resource==="sea"||t.resource==="fog";
    if(seaMode&&(!isWater||hi===state.seaRobberHex))return false;
    if(!seaMode&&(isWater||hi===state.robberHex))return false;
    if(seaMode){
      return hexEdges(hi).some(function(e){var s=state.ships[e];return s&&s.owner!==pi;});
    }
    var hasSelf=state.board.hexes[hi].vertices.some(function(v){var b=state.buildings[v];return b&&b.owner===pi;});
    return !hasSelf;
  });
  function scoreHex(hi){
    var s=PIP_WEIGHT[state.tiles[hi].number]||0;
    var hitsTarget=seaMode
      ? hexEdges(hi).some(function(e){var sh=state.ships[e];return sh&&sh.owner===target;})
      : state.board.hexes[hi].vertices.some(function(v){var b=state.buildings[v];return b&&b.owner===target;});
    if(hitsTarget)s+=5;
    return s;
  }
  cands.sort(function(a,b){return scoreHex(b)-scoreHex(a);});
  return cands.length?cands[0]:0;
}
function botDiscard(){
  var item=state.pending.queue[state.pending.qi], p=state.players[item.pi], need=item.count;
  var sel=emptyRes(), guard=0;
  while(need>0&&guard<2000){
    guard++;
    var order=RES.slice().sort(function(a,b){return (p.res[b]-sel[b])-(p.res[a]-sel[a]);});
    var r=order[0];
    if(sel[r]>=p.res[r])break;
    sel[r]++; need--;
  }
  state.ui.discardSel=sel;
  apply({type:"DISCARD_CONFIRM"});
}
function botGold(){
  var gi=state.pending.queue[state.pending.qi], sel=emptyRes(), pick=pickNeededResource(gi.pi);
  sel[pick]=gi.count; state.ui.goldSel=sel;
  apply({type:"GOLD_CONFIRM"});
}
function botSteal(){
  var cands=state.pending.candidates.slice().sort(function(a,b){
    return (totalCards(state.players[b].res)+fullVP(b))-(totalCards(state.players[a].res)+fullVP(a));
  });
  apply({type:"STEAL",from:cands[0]});
}
function botTradeOfferDecision(){
  var o=state.pending, me=o.partner, p=state.players[me];
  if(!RES.every(function(r){return p.res[r]>=o.want[r];})){ apply({type:"TRADE_DECLINE"}); return; }
  var giveThem=totalCards(o.want), getFromThem=totalCards(o.give);
  if(getFromThem>=giveThem||Math.random()<0.15)apply({type:"TRADE_ACCEPT"});
  else apply({type:"TRADE_DECLINE"});
}
function botRoadBuildingPending(pi,sk){
  var le=legalEdgeSet(), keys=Object.keys(le);
  if(!keys.length){ state.pending=null; state.uiMode=null; return; }
  var best=pickBest(le,function(k){return edgeScore(Number(k));},sk);
  apply({type:(le[best]==="ship"?"BUILD_SHIP":"BUILD_ROAD"),edgeId:Number(best)});
}
function botPlentyPending(pi){
  var p=state.players[pi];
  var order=RES.slice().sort(function(a,b){return p.res[a]-p.res[b];});
  apply({type:"PLENTY_TOGGLE",res:order[0]});
  apply({type:"PLENTY_TOGGLE",res:order[1]});
  apply({type:"PLENTY_CONFIRM"});
}
function botMonopolyPending(pi){
  var best=null,bestCount=-1;
  RES.forEach(function(r){
    var total=0; state.players.forEach(function(pl,qi){ if(qi!==pi)total+=pl.res[r]; });
    if(total>bestCount){bestCount=total;best=r;}
  });
  apply({type:"MONOPOLY",res:best});
}
function botSetupSettlement(pi){
  var sk=botSkill(pi), lv=legalVertSet();
  var best=pickBest(lv,vertexScore,sk);
  if(best!=null)apply({type:"SETUP_SETTLEMENT",vertexId:Number(best)});
}
function botSetupRoad(pi){
  var sk=botSkill(pi), le=legalEdgeSet();
  var best=pickBest(le,function(k){return edgeScore(Number(k));},sk);
  if(best!=null)apply({type:(le[best]==="ship"?"SETUP_SHIP":"SETUP_ROAD"),edgeId:Number(best)});
}
function botSpecialAction(pi){
  var p=state.players[pi], sk=botSkill(pi);
  var cityV=pickBest(legalCityVerts(),vertexScore,sk);
  if(cityV!=null&&canAfford(p.res,COSTS.city)){apply({type:"BUILD_CITY",vertexId:Number(cityV)});return;}
  var setV=pickBest(legalSettlementVerts(),vertexScore,sk);
  if(setV!=null&&canAfford(p.res,COSTS.settlement)){apply({type:"BUILD_SETTLEMENT",vertexId:Number(setV)});return;}
  var roadE=pickBest(legalRoadEdges(),edgeScore,sk);
  if(roadE!=null&&canAfford(p.res,COSTS.road)){apply({type:"BUILD_ROAD",edgeId:Number(roadE)});return;}
  if(state.mode==="sea"){
    var shipE=pickBest(legalShipEdges(),edgeScore,sk);
    if(shipE!=null&&canAfford(p.res,COSTS.ship)){apply({type:"BUILD_SHIP",edgeId:Number(shipE)});return;}
  }
  if(canAfford(p.res,COSTS.dev)&&state.devDeck.length>0&&Math.random()<sk.buyDevChance){apply({type:"BUY_DEV"});return;}
  apply({type:"SPECIAL_DONE"});
}
function botTurnAction(pi){
  var p=state.players[pi], sk=botSkill(pi);
  if(!state.turn||!state.turn.rolled){ apply({type:"ROLL"}); return; }
  if(state.scenario==="piraten"&&canAttackFortress(pi)){
    var mineWS=countWarShips(pi);
    if(mineWS>=2&&Math.random()<0.9){ apply({type:"ATTACK_FORTRESS"}); return; }
    if(mineWS<2&&state.devDeck.length===0){ apply({type:"ATTACK_FORTRESS"}); return; }
  }
  if(state.scenario==="wunder"){
    if(!state.wonderClaims[pi]){
      var elig=eligibleWonders(pi);
      if(elig.length){ apply({type:"CLAIM_WONDER",wonder:elig[Math.floor(Math.random()*elig.length)]}); return; }
    }else if((state.wonderStage[pi]||0)<4&&canAfford(p.res,WONDERS[state.wonderClaims[pi]].cost)){
      apply({type:"BUILD_WONDER_STAGE"}); return;
    }
  }
  var cityV=pickBest(legalCityVerts(),vertexScore,sk);
  if(cityV!=null&&canAfford(p.res,COSTS.city)&&countType(pi,"city")<PIECE.city){ apply({type:"BUILD_CITY",vertexId:Number(cityV)}); return; }
  var setV=pickBest(legalSettlementVerts(),vertexScore,sk);
  if(setV!=null&&canAfford(p.res,COSTS.settlement)&&countType(pi,"settlement")<PIECE.settlement){ apply({type:"BUILD_SETTLEMENT",vertexId:Number(setV)}); return; }
  if(!p.playedDevThisTurn&&p.dev.length){
    var card=pickDevCardToPlay(pi,sk);
    if(card){ apply({type:"PLAY_DEV",card:card}); return; }
  }
  var eagerForWarships=state.scenario==="piraten"&&countWarShips(pi)<2;
  if(eagerForWarships&&canAfford(p.res,COSTS.dev)&&state.devDeck.length>0){ apply({type:"BUY_DEV"}); return; }
    var roadE=pickBest(legalRoadEdges(),edgeScore,sk);
    var shipE=(state.mode==="sea")?pickBest(legalShipEdges(),edgeScore,sk):null;
    var shipIsPath=shipE!=null&&state.pathSet&&state.pathSet[shipE]&&state.pathSet[shipE].owner===pi;
    var shipCapOK=shipIsPath||state.scenario!=="piraten"||countShips(pi)<8;
    if(shipE!=null&&canAfford(p.res,COSTS.ship)&&countShips(pi)<PIECE.ship&&shipCapOK&&(roadE==null||edgeScore(Number(shipE))>=edgeScore(Number(roadE)))){
      apply({type:"BUILD_SHIP",edgeId:Number(shipE)}); return;
    }
    if(roadE!=null&&canAfford(p.res,COSTS.road)&&countRoads(pi)<PIECE.road){ apply({type:"BUILD_ROAD",edgeId:Number(roadE)}); return; }
  if(canAfford(p.res,COSTS.dev)&&state.devDeck.length>0&&Math.random()<sk.buyDevChance){ apply({type:"BUY_DEV"}); return; }
  if(sk.trade){
    var t=planBankTrade(pi);
    if(t){ state.ui.bankGive=t.give; state.ui.bankGet=t.get; apply({type:"BANK_TRADE"}); return; }
  }
  apply({type:"END_TURN"});
}
function botStep(){
  var pi=nextActorPi();
  if(pi==null||!isBot(pi))return;
  if(state.phase==="firstroll"){ apply({type:"FIRST_ROLL"}); return; }
  if(state.phase==="setup"){
    if(state.setup.placing==="settlement")botSetupSettlement(pi); else botSetupRoad(pi);
    return;
  }
  if(state.pending){
    switch(state.pending.type){
      case "discard": botDiscard(); return;
      case "gold": botGold(); return;
      case "steal": case "pirateSteal": botSteal(); return;
      case "robberChoice": apply({type:"ROBBER_CHOICE",which:"land"}); return;
      case "trade_offer": botTradeOfferDecision(); return;
      case "roadbuilding": botRoadBuildingPending(pi,botSkill(pi)); return;
      case "plenty": botPlentyPending(pi); return;
      case "monopoly": botMonopolyPending(pi); return;
      case "robber": case "searobber": break; // fall through to the uiMode robber-move handling below
      default: return;
    }
  }
  if(state.uiMode==="moveRobber"){ apply({type:"MOVE_ROBBER",hexId:botMoveRobberHex(pi,false)}); return; }
  if(state.uiMode==="moveSeaRobber"){ apply({type:"MOVE_SEA_ROBBER",hexId:botMoveRobberHex(pi,true)}); return; }
  if(state.special){ botSpecialAction(pi); return; }
  botTurnAction(pi);
}
var BOT_DELAY=550, botTimer=null;
function scheduleBot(){
  if(botTimer)return;
  var pi=nextActorPi();
  if(pi==null||!isBot(pi))return;
  botTimer=setTimeout(function(){ botTimer=null; botStep(); render(); },BOT_DELAY);
}

/* ---- board ---- */
function touchesLand(v){
  return state.board.vertices[v].hexes.some(function(hi){ var r=state.tiles[hi].resource; return r!=="sea"&&r!=="fog"; });
}
function onMainIsland(v){
  return state.board.vertices[v].hexes.some(function(hi){ return state.tiles[hi].resource!=="sea" && state.tiles[hi].resource!=="fog" && (!state.islandOf||state.islandOf[hi]==null); });
}
function onHomeSide(v){ // found only on the home island
  if(state.homeHexes) return state.board.vertices[v].hexes.some(function(hi){ return state.homeHexes[hi]; });
  return state.board.vertices[v].hexes.some(function(hi){
    var r=state.tiles[hi].resource;
    return r!=="sea"&&r!=="fog"&&r!=="desert"&&!(state.farHexes&&state.farHexes[hi]);
  });
}
function legalVertSet(){
  var out={}, me=activePlayer(), mode=state.uiMode, setup=state.setup, board=state.board;
  if(state.phase==="setup"&&setup&&setup.placing==="settlement"){
    var setupPl=setup.order[setup.idx];
    // Ozeanien-Regel: Wenn der Spieler seine 1. Siedlung bereits auf einer der
    // beiden Startinseln gesetzt hat, MUSS die 2. Siedlung auf der anderen liegen.
    // homeIsland[hi] enthält 0 oder 1 pro Home-Hex; forbidIsland ist die Insel
    // der schon platzierten Siedlung.
    var forbidIsland=-1;
    if(state.scenario==="ozeanien"&&state.homeIsland){
      for(var _bid in state.buildings){
        if(state.buildings[_bid].owner!==setupPl)continue;
        board.vertices[_bid].hexes.forEach(function(hi){
          if(state.homeIsland[hi]!=null) forbidIsland=state.homeIsland[hi];
        });
        break;
      }
    }
    board.vertices.forEach(function(v){
      if(!settlementLegal(v.id,setupPl,state.buildings,state.roads,board,true))return;
      if(state.mode==="sea"){
        if(!touchesLand(v.id))return;                 // no founding in open water/fog
        if(state.scenario&&SCEN[state.scenario]&&SCEN[state.scenario].founding==="main"&&!onMainIsland(v.id))return;
        if(state.scenario&&SCEN[state.scenario]&&SCEN[state.scenario].founding==="home"&&!onHomeSide(v.id))return;
        if(forbidIsland!==-1){
          var vIsland=-1;
          board.vertices[v.id].hexes.forEach(function(hi){
            if(state.homeIsland[hi]!=null) vIsland=state.homeIsland[hi];
          });
          if(vIsland===forbidIsland)return;
        }
        if(state.wonderTaboo&&state.wonderTaboo[v.id])return;
      }
      out[v.id]=1;
    });
  }else if(mode==="settlement"&&countType(me,"settlement")<PIECE.settlement){
    board.vertices.forEach(function(v){
      if(!settlementLegal(v.id,me,state.buildings,state.roads,board,false))return;
      if(state.mode==="sea"&&!touchesLand(v.id))return; // new settlements must reach land
      out[v.id]=1;
    });
  }else if(mode==="city"&&countType(me,"city")<PIECE.city){
    for(var k in state.buildings){var b=state.buildings[k];if(b.owner===me&&b.type==="settlement"&&!b.captured)out[k]=1;}
  }
  return out;
}
function legalEdgeSet(){
  var out={}, me=activePlayer(), mode=state.uiMode, setup=state.setup, board=state.board;
  if(state.phase==="setup"&&setup&&setup.placing==="road"){
    var who=setup.order[setup.idx], rv=setup.lastSettlement;
    board.edges.forEach(function(e){
      if(countRoads(who)<PIECE.road&&roadLegal(e.id,who,state.buildings,state.roads,board,rv))out[e.id]="road";
      else if(state.mode==="sea"&&countShips(who)<PIECE.ship&&shipLegal(e.id,who,rv))out[e.id]="ship";
    });
  }else if(mode==="road"){
    if(countRoads(me)<PIECE.road)board.edges.forEach(function(e){if(roadLegal(e.id,me,state.buildings,state.roads,board))out[e.id]="road";});
    if(state.pending&&state.pending.type==="roadbuilding"&&state.mode==="sea"&&countShips(me)<PIECE.ship)
      board.edges.forEach(function(e){if(shipLegal(e.id,me))out[e.id]="ship";});
  }else if(mode==="ship"){
    if(countShips(me)<PIECE.ship)board.edges.forEach(function(e){if(shipLegal(e.id,me))out[e.id]="ship";});
  }else if(mode==="moveShipFrom"){
    for(var mk in state.ships){ if(shipMovable(Number(mk),me)) out[mk]="movefrom"; }
  }else if(mode==="moveShipTo"){
    var tg=shipMoveTargets(me,state.ui.moveShipFrom); for(var tk in tg) out[tk]=tg[tk];
  }
  return out;
}

    s+='<g transform="translate('+srh.x+','+srh.y+')" pointer-events="none">'+
       '<circle cx="0" cy="0" r="12" fill="#10314a" stroke="#cfe0ea" stroke-width="1.5"/>'+
       '<line x1="0" y1="-2" x2="0" y2="-12" stroke="#cfe0ea" stroke-width="1.5"/>'+
       '<path d="M0,-12 L8,-9 L0,-6 Z" fill="#111"/>'+
       '<text x="0" y="4" text-anchor="middle" font-size="10" fill="#cfe0ea">☠</text></g>';
  }
  if(state.scenario==="piraten"&&state.pirateRoute&&state.pirateRoute.length){
    var pfh=board.hexes[state.pirateRoute[state.pirateIdx]];
    s+='<g transform="translate('+pfh.x+','+pfh.y+')" pointer-events="none">'+
       '<circle cx="0" cy="0" r="15" fill="#1a1a1a" stroke="#e8c15a" stroke-width="1.5"/>'+
       '<text x="0" y="6" text-anchor="middle" font-size="17">🏴‍☠️</text></g>';
  }

  for(var rid in state.roads){
    var e=board.edges[rid], va=board.vertices[e.v1], vb2=board.vertices[e.v2];
    s+='<line x1="'+va.x+'" y1="'+va.y+'" x2="'+vb2.x+'" y2="'+vb2.y+'" stroke="'+PCOL[state.roads[rid].owner].main+'" stroke-width="9" stroke-linecap="round"/>';
  }
  for(var eid in le){
    var e2=board.edges[eid], k2=le[eid];
    var ecol = k2==="movefrom" ? "#ffcf87" : (k2==="ship"||k2==="moveto") ? "#bfe3f5" : "#fff7d6";
    s+='<line data-edge="'+eid+'" x1="'+board.vertices[e2.v1].x+'" y1="'+board.vertices[e2.v1].y+'" x2="'+board.vertices[e2.v2].x+'" y2="'+board.vertices[e2.v2].y+'" stroke="'+ecol+'" stroke-width="9" stroke-linecap="round" opacity="0.6" style="cursor:pointer">'+
       '<animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.4s" repeatCount="indefinite"/></line>';
  }

  for(var bid in state.buildings){
    var b=state.buildings[bid], v=board.vertices[bid], col=PCOL[b.owner];
    if(b.type==="city"){
      // Klassische Catan-Stadt: Haupthaus mit angebautem hohen Turm links.
      // Zwei separate Pfade in Spielerfarbe; überlappen sich, sodass eine markante
      // Silhouette entsteht (breite Basis, hoher Turm mit Spitzdach).
      var mainD="M "+(v.x-10)+" "+(v.y+8)+
                " L "+(v.x-10)+" "+(v.y-1)+
                " L "+v.x+" "+(v.y-7)+
                " L "+(v.x+10)+" "+(v.y-1)+
                " L "+(v.x+10)+" "+(v.y+8)+" Z";
      var towerD="M "+(v.x-11)+" "+(v.y+8)+
                 " L "+(v.x-11)+" "+(v.y-5)+
                 " L "+(v.x-7)+" "+(v.y-10)+
                 " L "+(v.x-3)+" "+(v.y-5)+
                 " L "+(v.x-3)+" "+(v.y+8)+" Z";
      s+='<g pointer-events="none">'+
         '<path d="'+mainD+'" fill="'+col.main+'" stroke="'+col.dark+'" stroke-width="1.8" stroke-linejoin="round"/>'+
         '<path d="'+towerD+'" fill="'+col.main+'" stroke="'+col.dark+'" stroke-width="1.8" stroke-linejoin="round"/>'+
         '</g>';
    }else{
      // Siedlung: einfaches Haus mit Spitzdach (Original beibehalten)
      var sz=9;
      var d="M "+(v.x-sz)+" "+(v.y+sz)+" L "+(v.x-sz)+" "+(v.y-sz*0.25)+" L "+v.x+" "+(v.y-sz)+" L "+(v.x+sz)+" "+(v.y-sz*0.25)+" L "+(v.x+sz)+" "+(v.y+sz)+" Z";
      s+='<g pointer-events="none"><path d="'+d+'" fill="'+col.main+'" stroke="'+col.dark+'" stroke-width="2" stroke-linejoin="round"/></g>';
    }
  }
  if(state.fortresses){
    for(var fpi in state.fortresses){
      var ff=state.fortresses[fpi], fv=board.vertices[ff.vertexId];
      s+='<g pointer-events="none"><circle cx="'+(fv.x+16)+'" cy="'+(fv.y-16)+'" r="11" fill="rgba(20,10,8,.8)" stroke="#f0e0c8" stroke-width="1.1"/>'+
         '<text x="'+(fv.x+16)+'" y="'+(fv.y-12)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">'+(ff.chips>0?ff.chips:"✓")+'</text></g>';
    }
  }
  if(state.wonders){
    var wMarks=[["wallChips","🧱"],["bridgeChips","🌉"],["lighthouseChips","💡"]];
    wMarks.forEach(function(pair){
      (state.wonders[pair[0]]||[]).forEach(function(v){
        var vv2=board.vertices[v]; if(!vv2)return;
        s+='<g pointer-events="none"><circle cx="'+vv2.x+'" cy="'+(vv2.y-14)+'" r="9" fill="rgba(20,10,8,.65)" stroke="#f0e0c8" stroke-width="1"/>'+
           '<text x="'+vv2.x+'" y="'+(vv2.y-10)+'" text-anchor="middle" font-size="10">'+pair[1]+'</text></g>';
      });
    });
  }
  for(var vid in lv){
    var vv=board.vertices[vid];
    s+='<circle data-vert="'+vid+'" cx="'+vv.x+'" cy="'+vv.y+'" r="9" fill="#fff7d6" stroke="#caa33a" stroke-width="2" opacity="0.85" style="cursor:pointer">'+
       '<animate attributeName="r" values="7;10;7" dur="1.3s" repeatCount="indefinite"/></circle>';
  }
  s+='</svg>';
  return s;
}

/* ---- sidebar ---- */
function renderFirstRoll(){
  var fr=state.firstRoll, roller=fr.active[fr.idx], c=PCOL[roller];
  var rows=fr.active.map(function(pl){
    var r=fr.rolls[pl], done=!!r, cc=PCOL[pl];
    return '<div class="frrow'+(pl===roller?" active":"")+'">'+
      '<span class="frname"><span class="dot" style="background:'+cc.main+'"></span>'+esc(colorName(pl))+'</span>'+
      '<span class="frval">'+(done?('🎲 '+(r[0]+r[1])+' <span class="frd">('+r[0]+'+'+r[1]+')</span>'):'—')+'</span></div>';
  }).join("");
  var body='<div class="panel"><div class="phead" style="background:'+c.main+';color:'+c.text+'">'+
      '<span class="who"><span class="miniwhite"></span>'+esc(tr("phase_firstroll"))+'</span></div>'+
    '<div class="pp">'+
      (fr.tie?'<div class="hint gold">'+esc(tr("first_tie"))+'</div>':'<div class="hint">'+esc(tr("first_hint"))+'</div>')+
      '<div class="frlist">'+rows+'</div>'+
      '<button class="btn-roll" data-act="firstroll">'+esc(tr("first_roll_btn",{name:colorName(roller)}))+'</button>'+
    '</div></div>';
  return '<div class="sidebar">'+body+renderLog()+'</div>';
}
function renderSidebar(){
  if(state.phase==="firstroll")return renderFirstRoll();
  var me=activePlayer(), p=state.players[me], c=PCOL[me];
  var isSetup=state.phase==="setup";
  var blocking=!!state.pending&&state.pending.type!=="robber";
  var mustRobber=state.uiMode==="moveRobber"||state.uiMode==="moveSeaRobber";
  var canAct=state.phase==="play"&&!blocking&&!mustRobber;
  var rolled=state.turn&&state.turn.rolled;
  var canBuild=canAct&&rolled;
  var canPlayDev=!state.special&&canAct&&!p.playedDevThisTurn;
  var sea=state.mode==="sea";
  var roadsLeft=PIECE.road-countRoads(me), settLeft=PIECE.settlement-countType(me,"settlement"), cityLeft=PIECE.city-countType(me,"city"), shipsLeft=PIECE.ship-countShips(me);

  var resCells=RES.map(function(r){
    return '<div class="res-cell" style="background:'+RES_META[r].token+'" title="'+esc(resLabel(r))+'"><div class="ic">'+RES_META[r].icon+'</div><div class="n">'+p.res[r]+'</div></div>';
  }).join("");

  var devSection="";
  if(p.dev.length||p.newDev.length||p.vpCards){
    var items=p.dev.map(function(d){return '<button class="devbtn" data-act="playdev" data-card="'+d+'" '+(canPlayDev?"":"disabled")+' title="'+esc(devDesc(d))+'">'+esc(devLabel(d))+'</button>';}).join("");
    items+=p.newDev.map(function(d){return '<span class="newdev" title="'+esc(tr("tip_newdev"))+'">'+esc(devLabel(d))+' '+esc(tr("new_suffix"))+'</span>';}).join("");
    if(p.vpCards)items+='<span class="vpbadge">'+esc(tr("vp_card"))+p.vpCards+'</span>';
    devSection='<div style="margin-bottom:12px"><div class="seclbl">'+esc(tr("dev_cards"))+'</div><div class="devrow">'+items+'</div></div>';
  }

  function bb(label,cost,mode,enabled,act){
    var costStr=Object.keys(cost).map(function(k){return cost[k]+RES_META[k].icon;}).join(" ");
    var cls="bbtn"+(state.uiMode===mode?" active":"");
    var data=act?'data-act="'+act+'"':'data-act="mode" data-mode="'+mode+'"';
    return '<button class="'+cls+'" '+data+' '+(enabled?"":"disabled")+'><div>'+esc(label)+'</div><div class="cost">'+costStr+'</div></button>';
  }
  var actions;
  if(isSetup){
    var placeWhat=state.setup.placing==="settlement"?tr("s_settlement"):(sea?tr("s_road_ship"):tr("s_road"));
    actions='<div class="hint">'+esc(tr("place_a"))+' <b>'+esc(placeWhat)+'</b> '+esc(tr("on_board"))+'</div>';
  }else if(state.special){
    if(isBot(me)){
      actions='<div class="actions"><div class="hint gold">'+esc(tr("bot_thinking",{name:colorName(me)}))+'</div></div>';
    } else {
    var sgrid='<div class="grid2">'+
      bb(tr("b_road"),COSTS.road,"road",canAfford(p.res,COSTS.road)&&roadsLeft>0)+
      (sea?bb(tr("b_ship"),COSTS.ship,"ship",canAfford(p.res,COSTS.ship)&&shipsLeft>0):"")+
      bb(tr("b_settlement"),COSTS.settlement,"settlement",canAfford(p.res,COSTS.settlement)&&settLeft>0)+
      bb(tr("b_city"),COSTS.city,"city",canAfford(p.res,COSTS.city)&&cityLeft>0&&countType(me,"settlement")>0)+
      bb(tr("b_dev"),COSTS.dev,"dev",canAfford(p.res,COSTS.dev)&&state.devDeck.length>0,"buydev")+
    '</div>';
    actions='<div class="actions"><div class="hint gold">'+esc(tr("special_hint"))+'</div>'+sgrid+
      '<button class="btn-end" data-act="specialdone">'+esc(tr("special_done"))+'</button></div>';
    }
  }else if(mustRobber){
    actions='<div class="hint'+(isBot(me)?' gold':'')+'">'+(isBot(me)?esc(tr("bot_thinking",{name:colorName(me)})):esc(state.uiMode==="moveSeaRobber"?tr("click_searobber"):tr("click_robber")))+'</div>';
  }else if(state.uiMode==="moveShipFrom"){
    actions='<div class="actions"><div class="hint">'+esc(tr("moveship_from"))+'</div><button class="btn-end" data-act="cancelmoveship">'+esc(tr("cancel"))+'</button></div>';
  }else if(state.uiMode==="moveShipTo"){
    actions='<div class="actions"><div class="hint gold">'+esc(tr("moveship_to"))+'</div><button class="btn-end" data-act="cancelmoveship">'+esc(tr("cancel"))+'</button></div>';
  }else if(isBot(me)){
    actions='<div class="actions"><div class="hint gold">'+esc(tr("bot_thinking",{name:colorName(me)}))+'</div></div>';
  }else{
    var rb=(state.pending&&state.pending.type==="roadbuilding")?'<div class="hint gold">'+esc(tr("rb_hint"))+' ('+state.pending.left+')</div>':'';
    var rollRow= !rolled
      ? '<button class="btn-roll" data-act="roll" '+(canAct?"":"disabled")+'>'+esc(tr("roll"))+'</button>'
      : renderDice(state.turn.dice);
    var buildGrid='<div class="grid2">'+
      bb(tr("b_road"),COSTS.road,"road",canBuild&&canAfford(p.res,COSTS.road)&&roadsLeft>0)+
      (sea?bb(tr("b_ship"),COSTS.ship,"ship",canBuild&&canAfford(p.res,COSTS.ship)&&shipsLeft>0):"")+
      bb(tr("b_settlement"),COSTS.settlement,"settlement",canBuild&&canAfford(p.res,COSTS.settlement)&&settLeft>0)+
      bb(tr("b_city"),COSTS.city,"city",canBuild&&canAfford(p.res,COSTS.city)&&cityLeft>0&&countType(me,"settlement")>0)+
      bb(tr("b_dev"),COSTS.dev,"dev",canBuild&&canAfford(p.res,COSTS.dev)&&state.devDeck.length>0,"buydev")+
    '</div>';
    var giveRatio=bestRatio(me,state.ui.bankGive);
    var bankDisabled=(!canBuild)||p.res[state.ui.bankGive]<giveRatio||state.ui.bankGive===state.ui.bankGet;
    var sel=function(side){return '<select data-act="setbank" data-side="'+side+'">'+RES.map(function(r){return '<option value="'+r+'"'+(state.ui[side]===r?" selected":"")+'>'+RES_META[r].icon+' '+esc(resLabel(r))+'</option>';}).join("")+'</select>';};
    var bank='<div class="banktrade"><div class="seclbl" style="margin-bottom:4px">'+esc(tr("bank_trade"))+'</div>'+
      '<div class="row">'+sel("bankGive")+'<span class="ratio">'+giveRatio+':1</span><span class="arrow">→</span>'+sel("bankGet")+
      '<button class="tradebtn" data-act="trade" '+(bankDisabled?"disabled":"")+'>'+esc(tr("trade"))+'</button></div></div>';
    var tradeBtn='<button class="btn-trade" data-act="opentrade" '+((canBuild&&!state.part2)?"":"disabled")+'>'+esc(tr("trade_btn"))+'</button>';
    var moveShipBtn=sea?('<button class="btn-trade" data-act="startmoveship" '+((canBuild&&!state.movedShip&&hasMovableShip(me))?"":"disabled")+'>'+esc(tr("moveship_btn"))+'</button>'):'';
    var atkBtn=(state.scenario==="piraten"&&canAttackFortress(me))?('<button class="btn-trade" data-act="attackfortress" style="background:#7c241d;color:#fff">'+esc(tr("attack_fortress"))+' ('+countWarShips(me)+'⚔)</button>'):'';
    var wonderBox="";
    if(state.scenario==="wunder"){
      var myWonder=state.wonderClaims[me];
      if(myWonder){
        var wstage=state.wonderStage[me]||0, wcost=WONDERS[myWonder].cost;
        var wcostStr=Object.keys(wcost).map(function(k){return wcost[k]+RES_META[k].icon;}).join(" ");
        wonderBox='<div class="hint gold">'+esc(tr("wonder_"+myWonder))+' — '+esc(tr("wonder_stage",{stage:wstage}))+'</div>'+
          (wstage<4?'<button class="btn-trade" data-act="buildwonderstage" '+(canBuild&&canAfford(p.res,wcost)?"":"disabled")+'>'+esc(tr("wonder_build"))+' ('+wcostStr+')</button>':'');
      }else{
        var elig=eligibleWonders(me);
        if(elig.length){
          wonderBox='<div class="hint gold">'+esc(tr("wonder_choose"))+'</div><div class="grid2">'+
            elig.map(function(w){return '<button class="bbtn" data-act="claimwonder" data-wonder="'+w+'" '+(canBuild?"":"disabled")+'><div>'+esc(tr("wonder_"+w))+'</div></button>';}).join("")+'</div>';
        }
      }
    }
    var endBtn='<button class="btn-end" data-act="endturn" '+((rolled&&canAct)?"":"disabled")+'>'+esc(tr(state.part2?"end_turn":(seaBig()?"end_ship1":"end_turn")))+'</button>';
    var ship12=seaBig()?('<div class="hint'+(state.part2?" gold":"")+'">'+esc(state.part2?tr("ship2_hint"):tr("ship1_hint"))+'</div>'):'';
    actions='<div class="actions">'+ship12+rb+rollRow+buildGrid+bank+tradeBtn+moveShipBtn+atkBtn+wonderBox+endBtn+'</div>';
  }

  var card='<div class="panel"><div class="phead" style="background:'+c.main+';color:'+c.text+'">'+
      '<span class="who"><span class="miniwhite"></span>'+esc(colorName(me))+(isBot(me)?' '+tr("bot_tag"):'')+'</span>'+
      '<span style="font-size:14px;font-weight:700">'+fullVP(me)+' / '+(state.vpTarget||10)+' ★</span></div>'+
    '<div class="pp">'+
      '<div class="res-grid">'+resCells+'</div>'+
      '<div class="supply"><span class="lbl">'+esc(tr("supply"))+'</span><span class="nums">'+
        '<span title="'+esc(tr("b_road"))+'">🛤️ '+roadsLeft+'</span>'+
        (sea?'<span title="'+esc(tr("b_ship"))+'">⛵ '+shipsLeft+'</span>':'')+
        '<span title="'+esc(tr("b_settlement"))+'">🏠 '+settLeft+'</span>'+
        '<span title="'+esc(tr("b_city"))+'">🏛️ '+cityLeft+'</span></span></div>'+
      devSection+actions+
    '</div></div>';

  return '<div class="sidebar">'+card+renderScoreboard()+renderLog()+'</div>';
}

function renderDice(d){
  function die(n){var dots={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n];
    var cells="";for(var i=0;i<9;i++)cells+='<span>'+(dots.indexOf(i)>=0?'<span class="pip"></span>':'')+'</span>';
    return '<div class="die">'+cells+'</div>';}
  return '<div class="dice">'+die(d[0])+die(d[1])+'<span class="dsum">= '+(d[0]+d[1])+'</span></div>';
}

function renderScoreboard(){
  var rows=state.players.map(function(p,pi){
    var c=PCOL[pi];
    return '<div class="score-row'+(pi===activePlayer()?" cur":"")+'">'+
      '<span class="dot" style="background:'+c.main+'"></span>'+
      '<span class="nm">'+esc(colorName(pi))+(p.bot?' '+tr("bot_tag"):'')+(seaBig()&&state.phase==="play"&&pi===state.current?' <span class="sb-ship sb-ship1" title="Schiff 1">🚢1</span>':'')+(seaBig()&&state.phase==="play"&&pi===schiff2Seat()?' <span class="sb-ship sb-ship2" title="Schiff 2">🚢2</span>':'')+'</span>'+
      '<span class="vp">'+publicVP(pi)+' ★</span>'+
      '<span class="meta"><span title="'+esc(tr("tip_hand"))+'">🂠 '+totalCards(p.res)+'</span>'+
        '<span title="'+esc(tr("tip_knights"))+'">⚔ '+p.knights+'</span>'+
        (state.longestRoadOwner===pi?'<span title="'+esc(tr("tip_lroad"))+'">🛤️</span>':'')+
        (state.largestArmyOwner===pi?'<span title="'+esc(tr("tip_larmy"))+'">🏰</span>':'')+
        (p.islandVP?'<span title="'+esc(tr("tip_island"))+'">🏝️+'+p.islandVP+'</span>':'')+
        (p.cloth?'<span title="'+esc(tr("tip_cloth"))+'">🧶'+p.cloth+'</span>':'')+
        (state.fortresses&&state.fortresses[pi]?'<span title="'+esc(tr("tip_fortress"))+'">🏰'+(state.fortresses[pi].chips>0?state.fortresses[pi].chips:"✓")+'</span>':'')+
        (state.wonderClaims&&state.wonderClaims[pi]?'<span title="'+esc(tr(state.wonderClaims[pi]==="wall"?"wonder_wall":"wonder_"+state.wonderClaims[pi]))+'">🏛️'+(state.wonderStage[pi]||0)+'/4</span>':'')+
      '</span></div>';
  }).join("");
  return '<div class="panel pp scoreboard"><div class="seclbl">'+esc(tr("settlers"))+'</div>'+rows+'</div>';
}

function renderLog(){
  var lines=state.log.map(function(l,i){return '<div class="ln'+(i===0?" first":"")+'">'+esc(logText(l))+'</div>';}).join("");
  return '<div class="log"><div class="lh">'+esc(tr("game_log"))+'</div>'+lines+'</div>';
}

/* ---- modals ---- */
function renderModals(){
  if(!state.pending&&state.phase!=="gameover")return "";
  if(state.phase==="gameover")return modalWin();
  if(isBot(pendingDeciderPi()))return "";
  switch(state.pending.type){
    case "discard": return modalDiscard();
    case "steal": return modalSteal();
    case "plenty": return modalPlenty();
    case "monopoly": return modalMonopoly();
    case "trade_compose": return modalTradeCompose();
    case "trade_offer": return modalTradeOffer();
    case "robberChoice": return modalRobberChoice();
    case "gold": return modalGold();
    case "pirateSteal": return modalSteal();
  }
  return "";
}
function shell(color,inner){return '<div class="overlay"><div class="modal"><div class="bar" style="background:'+color+'"></div><div class="body">'+inner+'</div></div></div>';}
function modalRobberChoice(){
  var c=PCOL[state.current];
  var opts='<button class="steal-opt" style="background:#2c2c2c" data-act="robberchoice" data-which="land">⚔️ '+esc(tr("rc_robber"))+'</button>'+
    '<button class="steal-opt" style="background:#10314a" data-act="robberchoice" data-which="sea">☠ '+esc(tr("rc_searobber"))+'</button>';
  return shell("#1f3242",'<h3 style="color:#1f3242">'+esc(tr("rc_title"))+'</h3><p>'+esc(tr("rc_desc"))+'</p>'+opts);
}
function modalGold(){
  var item=state.pending.queue[state.pending.qi], c=PCOL[item.pi];

    return '<div class="drow"><span class="rn">'+RES_META[r].icon+' '+esc(resLabel(r))+'</span>'+
      '<button class="pm" data-act="goldadj" data-res="'+r+'" data-d="-1">−</button>'+
      '<span class="cnt">'+sel[r]+'</span>'+

  return shell(c.main,'<h3 style="color:'+c.main+'">'+esc(tr("gold_title",{name:colorName(item.pi)}))+'</h3>'+
    '<p>'+esc(tr("gold_desc",{count:item.count}))+'</p>'+rows+btn);
}
function modalDiscard(){
  var item=state.pending.queue[state.pending.qi], p=state.players[item.pi], c=PCOL[item.pi];
  var sel=state.ui.discardSel, selected=totalCards(sel);
  var rows=RES.filter(function(r){return p.res[r]>0;}).map(function(r){
    return '<div class="drow"><span class="rn">'+RES_META[r].icon+' '+esc(resLabel(r))+'</span>'+
      '<span class="have">'+esc(tr("discard_have"))+' '+p.res[r]+'</span>'+
      '<button class="pm" data-act="discadj" data-res="'+r+'" data-d="-1">−</button>'+
      '<span class="cnt">'+sel[r]+'</span>'+
      '<button class="pm" data-act="discadj" data-res="'+r+'" data-d="1">+</button></div>';
  }).join("");
  var btn='<button class="mbtn" style="background:'+c.main+'" '+(selected===item.count?"":"disabled")+' data-act="disconfirm">'+
    esc(tr("discard_btn",{sel:selected,count:item.count}))+'</button>';
  return shell(c.main,'<h3 style="color:'+c.main+'">'+esc(tr("discard_title",{name:colorName(item.pi)}))+'</h3>'+
    '<p>'+esc(tr("discard_desc",{count:item.count}))+'</p>'+rows+btn);
}
function modalSteal(){
  var opts=state.pending.candidates.map(function(pi){var c=PCOL[pi];
    return '<button class="steal-opt" style="background:'+c.main+'" data-act="steal" data-pi="'+pi+'">'+

  return shell("#1f3242",'<h3 style="color:#1f3242">'+esc(tr("steal_title"))+'</h3>'+opts);
}
function modalPlenty(){
  var picks=state.ui.plentyPicks;
  var grid=RES.map(function(r){return '<button data-act="plentytoggle" data-res="'+r+'" style="background:'+RES_META[r].token+'"><div class="ic">'+RES_META[r].icon+'</div></button>';}).join("");
  var picked='<div class="picked">'+esc(tr("plenty_picked"))+' '+(picks.map(function(r){return RES_META[r].icon;}).join(" ")||"—")+
    (picks.length?'<button class="reset" data-act="plentyreset">'+esc(tr("plenty_reset"))+'</button>':'')+'</div>';
  var btn='<button class="mbtn" style="background:#caa33a" '+(picks.length===2?"":"disabled")+' data-act="plentyconfirm">'+esc(tr("plenty_btn"))+'</button>';
  return shell("#caa33a",'<h3 style="color:#7a5e12">'+esc(tr("plenty_title"))+'</h3><p>'+esc(tr("plenty_desc"))+'</p>'+
    '<div class="resgrid">'+grid+'</div>'+picked+btn);
