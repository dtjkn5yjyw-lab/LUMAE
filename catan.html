  .menu h1{font-family:Georgia,serif;font-weight:700;font-size:52px;letter-spacing:.25em;margin:0 0 2px}
  .menu .sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:#e6c6ac;margin-bottom:30px}
  .menu .q{font-family:ui-sans-serif,system-ui,sans-serif;color:#f0dcc8;font-size:14px;margin-bottom:12px}
  .menu .moderow{display:flex;gap:12px;justify-content:center;margin-bottom:26px}
  .menu .modebtn{font-family:Georgia,serif;letter-spacing:.05em;font-size:15px;padding:10px 22px;border-radius:10px;
    border:2px solid #b4695260;background:transparent;color:#e6c6ac;transition:.15s}
  .menu .modebtn.on{background:var(--slate2);border-color:#f3ecda;color:#fff}
  .menu .ns{display:flex;gap:12px;justify-content:center;margin-bottom:30px}
  .menu .ns button{width:54px;height:54px;border-radius:50%;font-size:20px;font-weight:700;border:2px solid #b4695260;
    background:transparent;color:#e6c6ac;font-family:ui-sans-serif,system-ui,sans-serif;transition:.15s}
  .menu .ns button.on{background:var(--orange);border-color:#f3ecda;color:#fff;transform:scale(1.1)}
  .menu .begin{font-family:Georgia,serif;letter-spacing:.18em;font-size:18px;padding:12px 40px;border-radius:10px;
    background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .menu .begin:hover{background:var(--redd)}
  .menu .blurb{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;color:#d8a88f;margin-top:30px;line-height:1.6}

  /* ---- lang toggle ---- */
  .lang{display:inline-flex;gap:4px;padding:3px;border-radius:9px;background:rgba(0,0,0,.25)}
  .lang.light{background:rgba(122,35,29,.1)}
  .lang button{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;font-weight:600;
    padding:5px 10px;border-radius:7px;color:#e6c6ac;transition:.15s}
  .lang.light button{color:var(--slate2)}
  .lang button.on{background:var(--orange);color:#fff}

  /* ---- header ---- */
  .header{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:rgba(110,32,25,.92);color:#f3ecda;border-radius:12px;padding:8px 16px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .header .title{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.2em}
  .header .phase{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;text-transform:uppercase;
    letter-spacing:.16em;color:#e6c6ac}
  .header .right{display:flex;align-items:center;gap:10px}
  .header .turn{font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;display:flex;align-items:center;gap:8px}
  .header .turn .who{display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.4)}
  .btn-new{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;padding:6px 12px;border-radius:8px;
    background:var(--slate2);color:#f3ecda}
  .btn-new:hover{background:var(--slate3)}

  /* ---- layout ---- */
  .layout{display:flex;flex-direction:column;gap:16px;margin-top:12px}
  @media(min-width:900px){ .layout{flex-direction:row} .sidebar{width:320px;flex:0 0 320px} .board-wrap{flex:1;min-width:0} }
  .board-wrap{background:var(--sea);border-radius:18px;padding:8px;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
  .board-wrap svg{display:block;width:100%;height:auto;user-select:none}
  .sidebar{font-family:ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column;gap:12px}

  /* ---- panels ---- */
  .panel{background:var(--panel);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);overflow:hidden}
  .pp{padding:12px}
  .phead{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:700;letter-spacing:.02em}
  .phead .who{display:flex;align-items:center;gap:8px}
  .miniwhite{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.7)}

  .res-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
  .res-cell{text-align:center;border-radius:8px;padding:6px 0}
  .res-cell .ic{font-size:18px;line-height:1}
  .res-cell .n{font-weight:700;font-size:14px}

  .supply{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#7a6e52;margin:0 2px 12px}
  .supply .lbl{text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--muted)}
  .supply .nums{display:flex;gap:10px}

  .seclbl{text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--muted);margin-bottom:5px}

    if(edges[e].hexes.indexOf(h.id)<0)edges[e].hexes.push(h.id);

    if(vertices[a].edges.indexOf(e)<0)vertices[a].edges.push(e);if(vertices[b].edges.indexOf(e)<0)vertices[b].edges.push(e);}});

    Array(3).fill("brick"),Array(3).fill("ore"),["gold"],["desert"])); // 19 land tiles incl 1 gold + 1 desert

/* ---------- rules helpers ---------- */
function distanceOK(v,b,board){if(b[v])return false;return board.vertices[v].adj.every(function(a){return !b[a];});}

}
function roadLegal(eid,pl,b,roads,board,restrict){
  if(roads[eid])return false;
  if(state.ships&&state.ships[eid])return false;
  if(state.mode==="sea"&&edgeKind(eid)==="sea")return false;
  var e=board.edges[eid];
  if(restrict!=null)return e.v1===restrict||e.v2===restrict;
  return [e.v1,e.v2].some(function(w){
    var bo=b[w];
    if(bo&&bo.owner===pl)return true;
    if(bo&&bo.owner!==pl)return false;
    return board.vertices[w].edges.some(function(oe){return roads[oe]&&roads[oe].owner===pl;});
  });
}
function shipLegal(eid,pl,restrict){

  var k=edgeKind(eid); if(k!=="sea"&&k!=="coast")return false;
  if(seaRobberBlocks(eid))return false;
  var e=board.edges[eid];
  if(restrict!=null)return e.v1===restrict||e.v2===restrict;
  return [e.v1,e.v2].some(function(w){
    var bo=b[w];
    if(bo&&bo.owner===pl)return true;
    if(bo&&bo.owner!==pl)return false;
    return board.vertices[w].edges.some(function(oe){return ships[oe]&&ships[oe].owner===pl;});
  });
}
function shipMovable(eid,pl){

}

  var out={}, saved=state.ships[fromEid]; delete state.ships[fromEid];

}
function longestRoute(pl){
  var board=state.board, roads=state.roads, ships=state.ships||{}, b=state.buildings, owned=[];
  board.edges.forEach(function(e){
    if(roads[e.id]&&roads[e.id].owner===pl) owned.push({id:e.id,v1:e.v1,v2:e.v2,kind:"road"});
    else if(ships[e.id]&&ships[e.id].owner===pl) owned.push({id:e.id,v1:e.v1,v2:e.v2,kind:"ship"});
  });
  if(owned.length===0)return 0;
  var inc={};
  owned.forEach(function(e){(inc[e.v1]=inc[e.v1]||[]).push(e);(inc[e.v2]=inc[e.v2]||[]).push(e);});

/* ---------- awards (Almanach-faithful) ---------- */
function recomputeAwards(){
  var lengths=state.players.map(function(_,pi){return longestRoute(pi);});
  var max=Math.max.apply(null,lengths.concat([0]));
  var owner=state.longestRoadOwner;
  if(max<5) owner=null;
  else if(owner!==null&&lengths[owner]===max){/* holder keeps */}
  else{
    var leaders=lengths.map(function(l,i){return l===max?i:-1;}).filter(function(i){return i>=0;});
    owner=leaders.length===1?leaders[0]:null; // tie among challengers => set aside
  }
  state.longestRoadOwner=owner;
  state.longestRoadLength=owner===null?0:lengths[owner];

  var knights=state.players.map(function(p){return p.knights;});
  var aMax=Math.max.apply(null,knights.concat([0]));
  var aOwner=state.largestArmyOwner;
  if(aMax<3) aOwner=null;
  else if(aOwner!==null&&knights[aOwner]===aMax){/* keep */}
  else{
    var aL=knights.map(function(k,i){return k===aMax?i:-1;}).filter(function(i){return i>=0;});
    aOwner=aL.length===1?aL[0]:null;
  }
  state.largestArmyOwner=aOwner;
  state.largestArmySize=aOwner===null?0:knights[aOwner];
}

    var R=3, board=buildSeaBoard(R), tiles=assignSeaTiles(board,R);
    var robberHex=tiles.findIndex(function(t){return t.resource==="desert";}); if(robberHex<0)robberHex=tiles.findIndex(function(t){return t.resource!=="sea";});
    var seaRobberHex=tiles.findIndex(function(t){return t.resource==="sea";});
    return {board:board,tiles:tiles,harbors:assignSeaHarbors(board,tiles),robberHex:robberHex,seaRobberHex:seaRobberHex,islandOf:null};
  }},
  ufern:{key:"menu_scn_ufern",players:[3,4],vpTarget:14,build:function(n){return buildUfern(n);}},
  ozeanien:{key:"menu_scn_ozeanien",players:[3,4],vpTarget:12,build:function(n){return buildOzeanien(n);}}
};
// "Ozeanien" – two home islands + a fog sea (face-down hexes) to explore
function buildOzeanien(n){
  var R=4, coords=seaCoords(R);
  var centers=coords.map(function(c){return{x:SIZE*SQRT3*(c.q+c.r/2),y:SIZE*1.5*c.r};});
  var board=assembleBoard(centers); board.coords=coords;
  function d(c,cq,cr){return (Math.abs(c.q-cq)+Math.abs(c.r-cr)+Math.abs((c.q+c.r)-(cq+cr)))/2;}
  // two home islands (distance<=1 around two centers), fog in the central blob, rest sea
  var region=coords.map(function(c){
    if(d(c,-2,1)<=1) return "homeA";
    if(d(c,2,-1)<=1) return "homeB";
    if(c.dist<=2) return "fog";
    return "sea";
  });
  var tiles=board.hexes.map(function(){return{resource:"sea",number:null};});
  // home islands: real land + visible tokens
  var homeCount=region.filter(function(r){return r==="homeA"||r==="homeB";}).length;
  var homeBag=shuffle(spreadRes(homeCount));
  var homeToks=makeTokens(homeCount);
  region.forEach(function(rg,hi){ if(rg==="homeA"||rg==="homeB"){ tiles[hi]={resource:homeBag.pop(),number:homeToks.pop()}; } });
  // fog hexes: hidden mix of land + sea (face-down)
  var fog={}, fogHexes=[];
  region.forEach(function(rg,hi){ if(rg==="fog"){ tiles[hi]={resource:"fog",number:null}; fogHexes.push(hi); } });
  var F=fogHexes.length, landCount=Math.round(F*0.6);
  var hiddenBag=shuffle(spreadRes(landCount).concat(Array(F-landCount).fill("sea")));
  fogHexes.forEach(function(hi,k){ fog[hi]={resource:hiddenBag[k]}; });
  var fogTokens=makeTokens(landCount); // drawn as land is revealed
  // robber on a "12" home hex if present, else any home hex; sea robber on a real sea hex
  var robberHex=tiles.findIndex(function(t){return t.number===12;});
  if(robberHex<0)robberHex=region.findIndex(function(r){return r==="homeA"||r==="homeB";});
  var seaRobberHex=tiles.findIndex(function(t){return t.resource==="sea";});
  return {board:board,tiles:tiles,harbors:assignSeaHarbors(board,tiles),robberHex:robberHex,seaRobberHex:seaRobberHex,islandOf:null,fog:fog,fogTokens:fogTokens};
}
// "Zu neuen Ufern" – official variable setup: big home island (dist<=2) + small gold islands (isolated) + sea + harbors
function buildUfern(n){
  var R=4, coords=seaCoords(R);
  var centers=coords.map(function(c){return{x:SIZE*SQRT3*(c.q+c.r/2),y:SIZE*1.5*c.r};});
  var board=assembleBoard(centers); board.coords=coords;
  var ring4=coords.map(function(c,i){return{c:c,i:i};}).filter(function(o){return o.c.dist===4;});
  ring4.sort(function(a,b){return Math.atan2(centers[a.i].y,centers[a.i].x)-Math.atan2(centers[b.i].y,centers[b.i].x);});
  var smallSet={}; ring4.forEach(function(o,k){ if(k%4===0) smallSet[o.i]=true; }); // 6 isolated island hexes
  var region=coords.map(function(c,i){ return c.dist<=2?"main":(smallSet[i]?"small":"sea"); });
  var M=region.filter(function(r){return r==="main";}).length, S=region.filter(function(r){return r==="small";}).length;
  var mainBag=shuffle(["desert"].concat(spreadRes(M-1)));
  var smallBag=shuffle(["gold","gold"].concat(spreadRes(S-2)));
  var tiles=board.hexes.map(function(){return{resource:"sea",number:null};});
  region.forEach(function(rg,hi){ if(rg==="main")tiles[hi]={resource:mainBag.pop(),number:null}; else if(rg==="small")tiles[hi]={resource:smallBag.pop(),number:null}; });
  var producing=tiles.filter(function(t){return t.resource!=="sea"&&t.resource!=="desert";}).length;
  var toks=makeTokens(producing);
  tiles.forEach(function(t){ if(t.resource!=="sea"&&t.resource!=="desert") t.number=toks.pop(); });
  var islandOf=region.map(function(){return null;}), iid=0;
  region.forEach(function(rg,hi){ if(rg==="small") islandOf[hi]=iid++; });
  var robberHex=tiles.findIndex(function(t){return t.resource==="desert";}); if(robberHex<0)robberHex=0;
  var seaRobberHex=tiles.findIndex(function(t){return t.resource==="sea";});
  return {board:board,tiles:tiles,harbors:assignSeaHarbors(board,tiles),robberHex:robberHex,seaRobberHex:seaRobberHex,islandOf:islandOf};
}
function freshGame(n,lang,mode,scnId){
  mode=mode||"base";
  var board,tiles,harbors,robberHex,seaRobberHex=null,islandOf=null,vpTarget=10,scenario=null,fog={},fogTokens=[],R=3;
  if(mode==="sea"){
    scnId=scnId||"frei"; if(!SCEN[scnId])scnId="frei"; scenario=scnId;
    var built=SCEN[scnId].build(n);
    board=built.board; tiles=built.tiles; harbors=built.harbors; robberHex=built.robberHex; seaRobberHex=built.seaRobberHex;
    islandOf=built.islandOf; vpTarget=SCEN[scnId].vpTarget;
    fog=built.fog||{}; fogTokens=built.fogTokens||[];
  }else{
    board=buildBoard(rowsFor(n)); tiles=assignTiles(n);
    robberHex=tiles.findIndex(function(t){return t.resource==="desert";});
    harbors=assignHarbors(board,n);
  }
  var players=[]; for(var i=0;i<n;i++) players.push({id:i,res:emptyRes(),dev:[],newDev:[],vpCards:0,knights:0,playedDevThisTurn:false,islandVP:0});
  var active=[]; for(var a=0;a<n;a++)active.push(a);
  return{
    phase:"firstroll", lang:lang, mode:mode, scenario:scenario, vpTarget:vpTarget,
    board:board, tiles:tiles, robberHex:robberHex, seaRobberHex:seaRobberHex, harbors:harbors, players:players,
    islandOf:islandOf, islandScored:{}, fog:fog, fogTokens:fogTokens,
    buildings:{}, roads:{}, ships:{}, current:0, devDeck:buildDevDeck(n), movedShip:false,
    setup:null, firstRoll:{active:active,idx:0,rolls:{},lastRoller:null,tie:false},
    turn:null, uiMode:null, pending:null, special:null,
    longestRoadOwner:null,longestRoadLength:0,largestArmyOwner:null,largestArmySize:0,
    winner:null, log:[{k:"log_first_intro"}],
    ui:freshUi()
  };
}
function beginSetup(starter){
  var n=state.players.length, order=[];
  for(var i=0;i<n;i++) order.push((starter+i)%n);
  for(var j=n-1;j>=0;j--) order.push((starter+j)%n);
  state.setup={order:order,idx:0,placing:"settlement",lastSettlement:null};
  state.current=order[0]; state.phase="setup"; state.firstRoll=null;
  pushLog("log_first_start",{name:starter});
  pushLog("log_setup_prompt",{name:order[0]});
}
function assignSeaHarbors(board,tiles){
  var isSea=function(h){var r=tiles[h].resource;return r==="sea"||r==="fog";};
  var coast=board.edges.filter(function(e){ return e.hexes.length===2 && (isSea(e.hexes[0])!==isSea(e.hexes[1])); });
  var c={x:(board.bounds.minX+board.bounds.maxX)/2,y:(board.bounds.minY+board.bounds.maxY)/2};
  coast.sort(function(a,b){return Math.atan2(a.y-c.y,a.x-c.x)-Math.atan2(b.y-c.y,b.x-c.x);});
  var types=shuffle([{kind:"any",ratio:3},{kind:"any",ratio:3},{kind:"any",ratio:3},
    {kind:"wood",ratio:2},{kind:"brick",ratio:2},{kind:"sheep",ratio:2},{kind:"wheat",ratio:2},{kind:"ore",ratio:2}]);
  var harbors=[];
  for(var i=0;i<types.length&&coast.length>0;i++){
    var idx=Math.round(i*coast.length/types.length)%coast.length, e=coast[idx], t=types[i];
    var seaHex=isSea(e.hexes[0])?e.hexes[0]:e.hexes[1];
    var sh=board.hexes[seaHex], dx=sh.x-e.x, dy=sh.y-e.y, len=Math.hypot(dx,dy)||1;
    harbors.push({edgeId:e.id,kind:t.kind,ratio:t.ratio,v1:e.v1,v2:e.v2,x:e.x,y:e.y,dx:dx/len,dy:dy/len});
  }
  return harbors;
}
function pushLog(k,p){state.log.unshift({k:k,p:p});state.log=state.log.slice(0,7);}
function advanceSetup(){
  state.setup.idx+=1;
  if(state.setup.idx>=state.setup.order.length){
    state.phase="play"; state.current=state.setup.order[state.setup.order.length-1];
    state.setup=null; state.turn={rolled:false,dice:null}; recomputeAwards();
    pushLog("log_setup_done",{name:state.current});
  }else{
    state.setup.placing="settlement"; state.setup.lastSettlement=null;
    pushLog("log_setup_prompt",{name:state.setup.order[state.setup.idx]});
  }
}
function beginRobber(source){
  if(state.mode==="sea"){ state.pending={type:"robberChoice",source:source}; pushLog("log_robber_choice"); }
  else { state.uiMode="moveRobber"; state.pending={type:"robber",source:source}; pushLog("log_move_robber"); }
}

function stealFrom(victimPi){
  var v=state.players[victimPi], pool=[];
  RES.forEach(function(r){for(var i=0;i<v.res[r];i++)pool.push(r);});
  if(pool.length===0){pushLog("log_nothing_steal");return;}
  var r=pool[Math.floor(Math.random()*pool.length)];
  v.res[r]-=1; state.players[state.current].res[r]+=1;
  pushLog("log_stole",{name:state.current,victim:victimPi});
}
function checkWin(){ var pi=activePlayer(); if(fullVP(pi)>=(state.vpTarget||10)){state.winner=pi;state.phase="gameover";pushLog("log_wins",{name:pi});} }
function awardIsland(pi,v){
  if(!state.islandOf)return;
  state.board.vertices[v].hexes.forEach(function(hi){
    var id=state.islandOf[hi]; if(id==null)return;
    var key=pi+":"+id;
    if(!state.islandScored[key]){ state.islandScored[key]=true; state.players[pi].islandVP=(state.players[pi].islandVP||0)+2; pushLog("log_island_vp",{name:pi}); }
  });
}
// Ozeanien: reveal fog hexes bordering a newly built edge
function revealAt(hexId,discoverer){
  if(!state.fog||state.tiles[hexId].resource!=="fog")return;
  var hidden=state.fog[hexId]; delete state.fog[hexId];
  if(!hidden||hidden.resource==="sea"){ state.tiles[hexId]={resource:"sea",number:null}; pushLog("log_fog_sea",{name:discoverer}); return; }
  var res=hidden.resource, num=(res==="desert"||res==="gold")?null:(state.fogTokens.length?state.fogTokens.pop():null);
  state.tiles[hexId]={resource:res,number:num};
  if(res!=="desert"&&res!=="gold"&&res!=="sea"){ state.players[discoverer].res[res]+=1; }
  pushLog("log_fog_land",{name:discoverer});
}
function revealFogFor(edgeId,discoverer){
  if(!state.fog)return;
  state.board.edges[edgeId].hexes.forEach(function(hi){ revealAt(hi,discoverer); });
}

/* ---------- actions (mutating, then render) ---------- */
function dispatch(a){ apply(a); render(); }
function apply(a){
  switch(a.type){
    case "SET_LANG": state.lang=a.lang; return;
    case "TOGGLE_COSTS": state.ui.showCosts=!state.ui.showCosts; return;
    case "TOGGLE_SAVE": state.ui.showSave=!state.ui.showSave; state.ui.saveMsg=""; return;
    case "SAVE_SLOT": state.ui.saveMsg=saveToSlot(a.slot)?"save_ok":"save_err"; return;
    case "LOAD_SLOT": if(!loadFromSlot(a.slot))state.ui.saveMsg="save_err"; return;
    case "IMPORT_TEXT": try{applyLoad(a.json);}catch(e){state.ui.saveMsg="save_err";} return;
    case "SET_SAVE_MSG": state.ui.saveMsg=a.msg; return;
    case "SET_N": state.ui.startN=a.n; return;
    case "SET_STARTMODE":{
      state.ui.startMode=a.mode;
      if(a.mode==="sea"){ if(!state.ui.startScn||!SCEN[state.ui.startScn])state.ui.startScn="frei"; }
      clampStartN(); return;
    }
    case "SET_STARTSCN": state.ui.startScn=a.scn; clampStartN(); return;
    case "NEW_GAME": state=freshGame(a.n||state.ui.startN||3, state.lang, a.mode||state.ui.startMode||"base", a.scn||state.ui.startScn||"frei"); return;
    case "FIRST_ROLL":{
      var fr=state.firstRoll; if(!fr)return;
      var pl=fr.active[fr.idx], d1=1+Math.floor(Math.random()*6), d2=1+Math.floor(Math.random()*6);
      fr.rolls[pl]=[d1,d2]; fr.lastRoller=pl; fr.tie=false;
      pushLog("log_first_roll",{name:pl,sum:d1+d2,d1:d1,d2:d2});
      fr.idx+=1;
      if(fr.idx>=fr.active.length){
        var best=-1,winners=[];
        fr.active.forEach(function(p){var sm=fr.rolls[p][0]+fr.rolls[p][1];if(sm>best){best=sm;winners=[p];}else if(sm===best)winners.push(p);});
        if(winners.length===1){ beginSetup(winners[0]); }
        else { fr.active=winners; fr.idx=0; fr.rolls={}; fr.tie=true; pushLog("log_first_tie"); }
      }
      return;
    }

    case "SETUP_SETTLEMENT":{
      var v=a.vertexId, pi=state.setup.order[state.setup.idx];
      state.buildings[v]={owner:pi,type:"settlement"};
      if(state.setup.idx>=state.players.length){
        state.board.vertices[v].hexes.forEach(function(hi){var t=state.tiles[hi];if(t.resource!=="desert"&&t.resource!=="sea"&&t.resource!=="gold")state.players[pi].res[t.resource]+=1;});
      }
      state.setup.placing="road"; state.setup.lastSettlement=v;
      pushLog("log_setup_settle",{name:pi}); return;
    }
    case "SETUP_ROAD":{
      var pir=state.setup.order[state.setup.idx];
      state.roads[a.edgeId]={owner:pir}; pushLog("log_setup_road",{name:pir});
      advanceSetup(); return;
    }
    case "SETUP_SHIP":{
      var pis=state.setup.order[state.setup.idx];
      state.ships[a.edgeId]={owner:pis}; pushLog("log_setup_ship",{name:pis});
      advanceSetup(); return;
    }

    case "ROLL":{
      var d1=1+Math.floor(Math.random()*6), d2=1+Math.floor(Math.random()*6), sum=d1+d2;
      state.turn.rolled=true; state.turn.dice=[d1,d2];
      pushLog("log_roll",{name:state.current,sum:sum,d1:d1,d2:d2});
      if(sum===7){
        var queue=[];
        state.players.forEach(function(p,pi){var nn=totalCards(p.res);if(nn>7)queue.push({pi:pi,count:Math.floor(nn/2)});});
        if(queue.length>0){state.pending={type:"discard",queue:queue,qi:0};state.ui.discardSel=emptyRes();pushLog("log_robber_discard");}
        else beginRobber("roll");
      }else{
        var goldGain={};
        state.tiles.forEach(function(t,hi){
          if(t.number!==sum||hi===state.robberHex)return;
          state.board.hexes[hi].vertices.forEach(function(v){
            var b=state.buildings[v]; if(!b)return;
            var amt=b.type==="city"?2:1;
            if(t.resource==="gold"){ goldGain[b.owner]=(goldGain[b.owner]||0)+amt; }
            else if(t.resource!=="sea"&&t.resource!=="desert"){ state.players[b.owner].res[t.resource]+=amt; }
          });
        });
        var gq=Object.keys(goldGain).map(function(pi){return{pi:Number(pi),count:goldGain[pi]};});
        if(gq.length>0){ state.pending={type:"gold",queue:gq,qi:0}; state.ui.goldSel=emptyRes(); pushLog("log_gold"); }
      }
      return;
    }

    case "DISCARD_ADJ":{
      var p=state.players[state.pending.queue[state.pending.qi].pi];
      var cur=state.ui.discardSel[a.res]+a.d;
      cur=Math.max(0,Math.min(p.res[a.res],cur)); state.ui.discardSel[a.res]=cur; return;
    }
    case "DISCARD_CONFIRM":{
      var item=state.pending.queue[state.pending.qi]; var pl=state.players[item.pi];
      RES.forEach(function(r){pl.res[r]-=state.ui.discardSel[r];});
      pushLog("log_discarded",{name:item.pi,count:item.count});
      state.pending.qi+=1; state.ui.discardSel=emptyRes();
      if(state.pending.qi>=state.pending.queue.length){beginRobber("roll");}
      return;
    }

    case "MOVE_ROBBER":{
      state.robberHex=a.hexId;
      var victims={};
      state.board.hexes[a.hexId].vertices.forEach(function(v){var b=state.buildings[v];if(b&&b.owner!==state.current&&totalCards(state.players[b.owner].res)>0)victims[b.owner]=true;});
      var list=Object.keys(victims).map(Number);
      state.uiMode=null;
      if(list.length===0){state.pending=null;pushLog("log_robber_nosteal");}
      else if(list.length===1){stealFrom(list[0]);state.pending=null;}
      else state.pending={type:"steal",candidates:list};
      return;
    }
    case "STEAL": stealFrom(a.from); state.pending=null; return;
    case "ROBBER_CHOICE":{
      if(a.which==="sea"){ state.uiMode="moveSeaRobber"; state.pending={type:"searobber",source:state.pending?state.pending.source:"roll"}; pushLog("log_move_searobber"); }
      else { state.uiMode="moveRobber"; state.pending={type:"robber",source:state.pending?state.pending.source:"roll"}; pushLog("log_move_robber"); }
      return;
    }
    case "MOVE_SEA_ROBBER":{
      state.seaRobberHex=a.hexId;
      var victimsS={};
      hexEdges(a.hexId).forEach(function(e){var s=state.ships&&state.ships[e];if(s&&s.owner!==state.current&&totalCards(state.players[s.owner].res)>0)victimsS[s.owner]=true;});
      var listS=Object.keys(victimsS).map(Number);
      state.uiMode=null;
      if(listS.length===0){state.pending=null;pushLog("log_robber_nosteal");}
      else if(listS.length===1){stealFrom(listS[0]);state.pending=null;}
      else state.pending={type:"steal",candidates:listS};
      return;
    }
    case "GOLD_ADJ":{
      var curG=state.ui.goldSel[a.res]+a.d; state.ui.goldSel[a.res]=Math.max(0,curG); return;
    }
    case "GOLD_CONFIRM":{
      var gi=state.pending.queue[state.pending.qi], gp=state.players[gi.pi];
      RES.forEach(function(r){gp.res[r]+=state.ui.goldSel[r];});
      pushLog("log_gold_take",{name:gi.pi,count:gi.count});
      state.pending.qi+=1; state.ui.goldSel=emptyRes();
      if(state.pending.qi>=state.pending.queue.length)state.pending=null;
      return;
    }

    case "SET_MODE": state.uiMode=(state.uiMode===a.mode?null:a.mode); return;

    case "BUILD_ROAD":{
      var me0=activePlayer(), pr=state.players[me0], free=state.pending&&state.pending.type==="roadbuilding";
      if(countRoads(me0)>=PIECE.road)return;
      if(!free){ if(!canAfford(pr.res,COSTS.road))return; pr.res=pay(pr.res,COSTS.road); }
      state.roads[a.edgeId]={owner:me0}; pushLog("log_built_road",{name:me0}); revealFogFor(a.edgeId,me0); recomputeAwards();
      if(free){
        state.pending.left-=1;
        var anyLegal=countRoads(me0)<PIECE.road&&state.board.edges.some(function(e){return roadLegal(e.id,me0,state.buildings,state.roads,state.board);});
        if(state.pending.left<=0||!anyLegal){state.pending=null;state.uiMode=null;}
      }
      checkWin(); return;
    }
    case "BUILD_SHIP":{
      var meS=activePlayer(), psh=state.players[meS], freeS=state.pending&&state.pending.type==="roadbuilding";
      if(countShips(meS)>=PIECE.ship)return;
      if(!shipLegal(a.edgeId,meS))return;
      if(!freeS){ if(!canAfford(psh.res,COSTS.ship))return; psh.res=pay(psh.res,COSTS.ship); }
      state.ships[a.edgeId]={owner:meS,fresh:true}; pushLog("log_built_ship",{name:meS}); revealFogFor(a.edgeId,meS); recomputeAwards();
      if(freeS){
        state.pending.left-=1;
        var anyS=countShips(meS)<PIECE.ship&&state.board.edges.some(function(e){return shipLegal(e.id,meS);});
        var anyR=countRoads(meS)<PIECE.road&&state.board.edges.some(function(e){return roadLegal(e.id,meS,state.buildings,state.roads,state.board);});
        if(state.pending.left<=0||(!anyS&&!anyR)){state.pending=null;state.uiMode=null;}
      }
      checkWin(); return;
    }
    case "START_MOVE_SHIP": state.uiMode=(state.uiMode==="moveShipFrom"?null:"moveShipFrom"); state.ui.moveShipFrom=null; return;
    case "PICK_MOVE_SHIP": if(!shipMovable(a.edgeId,activePlayer()))return; state.ui.moveShipFrom=a.edgeId; state.uiMode="moveShipTo"; return;
    case "CANCEL_MOVE_SHIP": state.uiMode=null; state.ui.moveShipFrom=null; return;
    case "MOVE_SHIP":{
      var mv=activePlayer(), from=state.ui.moveShipFrom;
      if(from==null||state.movedShip)return;

      state.ships[a.edgeId]={owner:mv,fresh:false};

      pushLog("log_moved_ship",{name:mv}); recomputeAwards(); checkWin(); return;

    case "BUILD_SETTLEMENT":{
      var me1=activePlayer(), ps=state.players[me1];
      if(countType(me1,"settlement")>=PIECE.settlement)return;
      if(!canAfford(ps.res,COSTS.settlement))return; ps.res=pay(ps.res,COSTS.settlement);
      state.buildings[a.vertexId]={owner:me1,type:"settlement"}; state.uiMode=null;

    }
    case "BUILD_CITY":{
      var me2=activePlayer(), pc=state.players[me2];
      if(countType(me2,"city")>=PIECE.city)return;
      if(!canAfford(pc.res,COSTS.city))return; pc.res=pay(pc.res,COSTS.city);
      state.buildings[a.vertexId]={owner:me2,type:"city"}; state.uiMode=null;
      pushLog("log_built_city",{name:me2}); checkWin(); return;
    }
    case "BUY_DEV":{
      var me3=activePlayer(), pd=state.players[me3];
      if(!canAfford(pd.res,COSTS.dev)||state.devDeck.length===0)return; pd.res=pay(pd.res,COSTS.dev);
      var card=state.devDeck.shift();
      if(card==="vp")pd.vpCards+=1; else pd.newDev.push(card);
      pushLog("log_bought_dev",{name:me3}); checkWin(); return;
    }
    case "PLAY_DEV":{
      var pp=state.players[state.current];
      if(pp.playedDevThisTurn)return;
      var idx=pp.dev.indexOf(a.card); if(idx<0)return;
      pp.dev.splice(idx,1); pp.playedDevThisTurn=true; state.uiMode=null;
      pushLog("log_played_dev",{name:state.current,card:a.card});
      if(a.card==="knight"){pp.knights+=1;recomputeAwards();beginRobber("knight");checkWin();}
      else if(a.card==="road"){state.pending={type:"roadbuilding",left:2};state.uiMode="road";}
      else if(a.card==="plenty"){state.pending={type:"plenty"};state.ui.plentyPicks=[];}
      else if(a.card==="monopoly"){state.pending={type:"monopoly"};}
      return;
    }
    case "PLENTY_TOGGLE": if(state.ui.plentyPicks.length<2)state.ui.plentyPicks.push(a.res); return;
    case "PLENTY_RESET": state.ui.plentyPicks=[]; return;
    case "PLENTY_CONFIRM":{
      var pl2=state.players[state.current]; state.ui.plentyPicks.forEach(function(r){pl2.res[r]+=1;});
      pushLog("log_plenty",{name:state.current,resList:state.ui.plentyPicks.slice()}); state.pending=null; state.ui.plentyPicks=[]; return;
    }
    case "MONOPOLY":{
      var pm=state.players[state.current], taken=0;
      state.players.forEach(function(q,qi){if(qi===state.current)return;taken+=q.res[a.res];q.res[a.res]=0;});
      pm.res[a.res]+=taken; pushLog("log_monopoly",{name:state.current,res:a.res,count:taken}); state.pending=null; return;
    }

    case "SET_BANK": state.ui[a.side]=a.res; return;    case "BANK_TRADE":{
      var pb=state.players[state.current], g=state.ui.bankGive, ge=state.ui.bankGet;
      var ratio=bestRatio(state.current,g);
      if(pb.res[g]<ratio||g===ge)return; pb.res[g]-=ratio; pb.res[ge]+=1;
      pushLog("log_bank",{name:state.current,ratio:ratio,give:g,get:ge}); return;
    }

    case "OPEN_TRADE":
      if(state.phase!=="play"||state.special||!state.turn.rolled||state.pending||state.uiMode==="moveRobber")return;
      state.ui.trade={give:emptyRes(),want:emptyRes(),partner:null};
      state.pending={type:"trade_compose"}; return;
    case "TRADE_ADJ":{
      var slot=a.slot, r=a.res, p=state.players[state.current];
      var max=slot==="give"?p.res[r]:19;
      var v=Math.max(0,Math.min(max,state.ui.trade[slot][r]+a.d));
      state.ui.trade[slot][r]=v; return;
    }
    case "TRADE_PARTNER": state.ui.trade.partner=a.pi; return;
    case "TRADE_CANCEL": state.pending=null; return;
    case "TRADE_SEND":{
      var T=state.ui.trade;
      if(T.partner===null||totalCards(T.give)<1||totalCards(T.want)<1)return;
      var pg=state.players[state.current];
      if(!RES.every(function(x){return pg.res[x]>=T.give[x];}))return;
      var g={},w={};RES.forEach(function(x){g[x]=T.give[x];w[x]=T.want[x];});
      state.pending={type:"trade_offer",partner:T.partner,give:g,want:w}; return;
    }
    case "TRADE_DECLINE":
      pushLog("log_trade_decline",{name:state.current,victim:state.pending.partner});
      state.pending=null; return;
    case "TRADE_ACCEPT":{
      var o=state.pending, act=state.players[state.current], par=state.players[o.partner];
      if(!RES.every(function(x){return par.res[x]>=o.want[x];}))return;
      RES.forEach(function(x){
        act.res[x]-=o.give[x]; act.res[x]+=o.want[x];
        par.res[x]+=o.give[x]; par.res[x]-=o.want[x];
      });
      pushLog("log_trade",{name:state.current,victim:o.partner,g:resIcons(o.give),w:resIcons(o.want)});
      state.pending=null; return;
    }

    case "END_TURN":{
      var pe=state.players[state.current];
      pe.dev=pe.dev.concat(pe.newDev); pe.newDev=[]; pe.playedDevThisTurn=false;
      state.uiMode=null; state.pending=null;
      if(state.players.length>=5){
        // Almanach 5–6: after A's turn, all others may build/buy in clockwise order
        var q=[]; for(var kk=1;kk<state.players.length;kk++)q.push((state.current+kk)%state.players.length);
        state.special={queue:q,idx:0};
        pushLog("log_special_start",{name:q[0]}); return;
      }
      advanceTurn(); return;
    }
    case "SPECIAL_DONE":{
      if(!state.special)return;
      var sb=state.players[state.special.queue[state.special.idx]];
      sb.dev=sb.dev.concat(sb.newDev); sb.newDev=[]; // bought in A's turn → playable on their own turn
      state.uiMode=null; state.special.idx+=1;
      if(state.special.idx>=state.special.queue.length){ state.special=null; advanceTurn(); }
      else pushLog("log_special_next",{name:state.special.queue[state.special.idx]});
      return;
    }
  }
}
function advanceTurn(){
  state.current=(state.current+1)%state.players.length;
  state.turn={rolled:false,dice:null}; state.uiMode=null; state.pending=null; state.special=null;
  state.movedShip=false;
  for(var k in state.ships) state.ships[k].fresh=false;
  pushLog("log_next",{name:state.current});
}

/* ---- board ---- */
function touchesLand(v){
  return state.board.vertices[v].hexes.some(function(hi){ var r=state.tiles[hi].resource; return r!=="sea"&&r!=="fog"; });
}
function onMainIsland(v){
  return state.board.vertices[v].hexes.some(function(hi){ return state.tiles[hi].resource!=="sea" && state.tiles[hi].resource!=="fog" && (!state.islandOf||state.islandOf[hi]==null); });
}
function legalVertSet(){
  var out={}, me=activePlayer(), mode=state.uiMode, setup=state.setup, board=state.board;
  if(state.phase==="setup"&&setup&&setup.placing==="settlement"){
    board.vertices.forEach(function(v){
      if(!settlementLegal(v.id,setup.order[setup.idx],state.buildings,state.roads,board,true))return;
      if(state.mode==="sea"){
        if(!touchesLand(v.id))return;                 // no founding in open water/fog
        if(state.islandOf&&!onMainIsland(v.id))return; // island scenarios: home island only
      }
      out[v.id]=1;
    });
  }else if(mode==="settlement"&&countType(me,"settlement")<PIECE.settlement){
    board.vertices.forEach(function(v){
      if(!settlementLegal(v.id,me,state.buildings,state.roads,board,false))return;
      if(state.mode==="sea"&&!touchesLand(v.id))return; // new settlements must reach land
      out[v.id]=1;
    });
  }else if(mode==="city"&&countType(me,"city")<PIECE.city){
    for(var k in state.buildings){var b=state.buildings[k];if(b.owner===me&&b.type==="settlement")out[k]=1;}
  }
  return out;
}
function legalEdgeSet(){
  var out={}, me=activePlayer(), mode=state.uiMode, setup=state.setup, board=state.board;
  if(state.phase==="setup"&&setup&&setup.placing==="road"){
    var who=setup.order[setup.idx], rv=setup.lastSettlement;
    board.edges.forEach(function(e){
      if(countRoads(who)<PIECE.road&&roadLegal(e.id,who,state.buildings,state.roads,board,rv))out[e.id]="road";
      else if(state.mode==="sea"&&countShips(who)<PIECE.ship&&shipLegal(e.id,who,rv))out[e.id]="ship";
    });
  }else if(mode==="road"){
    if(countRoads(me)<PIECE.road)board.edges.forEach(function(e){if(roadLegal(e.id,me,state.buildings,state.roads,board))out[e.id]="road";});
    if(state.pending&&state.pending.type==="roadbuilding"&&state.mode==="sea"&&countShips(me)<PIECE.ship)
      board.edges.forEach(function(e){if(shipLegal(e.id,me))out[e.id]="ship";});
  }else if(mode==="ship"){
    if(countShips(me)<PIECE.ship)board.edges.forEach(function(e){if(shipLegal(e.id,me))out[e.id]="ship";});
  }else if(mode==="moveShipFrom"){
    for(var mk in state.ships){ if(shipMovable(Number(mk),me)) out[mk]="movefrom"; }
  }else if(mode==="moveShipTo"){
    var tg=shipMoveTargets(me,state.ui.moveShipFrom); for(var tk in tg) out[tk]=tg[tk];
  }
  return out;
}

function renderSidebar(){

  var me=activePlayer(), p=state.players[me], c=PCOL[me];
  var isSetup=state.phase==="setup";
  var blocking=!!state.pending&&state.pending.type!=="robber";
  var mustRobber=state.uiMode==="moveRobber"||state.uiMode==="moveSeaRobber";
  var canAct=state.phase==="play"&&!blocking&&!mustRobber;
  var rolled=state.turn&&state.turn.rolled;
  var canBuild=canAct&&rolled;
  var canPlayDev=!state.special&&canAct&&!p.playedDevThisTurn;
  var sea=state.mode==="sea";
  var roadsLeft=PIECE.road-countRoads(me), settLeft=PIECE.settlement-countType(me,"settlement"), cityLeft=PIECE.city-countType(me,"city"), shipsLeft=PIECE.ship-countShips(me);

  var resCells=RES.map(function(r){
    return '<div class="res-cell" style="background:'+RES_META[r].token+'" title="'+esc(resLabel(r))+'"><div class="ic">'+RES_META[r].icon+'</div><div class="n">'+p.res[r]+'</div></div>';
  }).join("");

  var devSection="";
  if(p.dev.length||p.newDev.length||p.vpCards){
    var items=p.dev.map(function(d){return '<button class="devbtn" data-act="playdev" data-card="'+d+'" '+(canPlayDev?"":"disabled")+' title="'+esc(devDesc(d))+'">'+esc(devLabel(d))+'</button>';}).join("");
    items+=p.newDev.map(function(d){return '<span class="newdev" title="'+esc(tr("tip_newdev"))+'">'+esc(devLabel(d))+' '+esc(tr("new_suffix"))+'</span>';}).join("");
    if(p.vpCards)items+='<span class="vpbadge">'+esc(tr("vp_card"))+p.vpCards+'</span>';
    devSection='<div style="margin-bottom:12px"><div class="seclbl">'+esc(tr("dev_cards"))+'</div><div class="devrow">'+items+'</div></div>';
  }

  function bb(label,cost,mode,enabled,act){
    var costStr=Object.keys(cost).map(function(k){return cost[k]+RES_META[k].icon;}).join(" ");
    var cls="bbtn"+(state.uiMode===mode?" active":"");
    var data=act?'data-act="'+act+'"':'data-act="mode" data-mode="'+mode+'"';
    return '<button class="'+cls+'" '+data+' '+(enabled?"":"disabled")+'><div>'+esc(label)+'</div><div class="cost">'+costStr+'</div></button>';
  }
  var actions;
  if(isSetup){
    var placeWhat=state.setup.placing==="settlement"?tr("s_settlement"):(sea?tr("s_road_ship"):tr("s_road"));
    actions='<div class="hint">'+esc(tr("place_a"))+' <b>'+esc(placeWhat)+'</b> '+esc(tr("on_board"))+'</div>';
  }else if(state.special){
    var sgrid='<div class="grid2">'+
      bb(tr("b_road"),COSTS.road,"road",canAfford(p.res,COSTS.road)&&roadsLeft>0)+
      (sea?bb(tr("b_ship"),COSTS.ship,"ship",canAfford(p.res,COSTS.ship)&&shipsLeft>0):"")+
      bb(tr("b_settlement"),COSTS.settlement,"settlement",canAfford(p.res,COSTS.settlement)&&settLeft>0)+
      bb(tr("b_city"),COSTS.city,"city",canAfford(p.res,COSTS.city)&&cityLeft>0&&countType(me,"settlement")>0)+
      bb(tr("b_dev"),COSTS.dev,"dev",canAfford(p.res,COSTS.dev)&&state.devDeck.length>0,"buydev")+
    '</div>';
    actions='<div class="actions"><div class="hint gold">'+esc(tr("special_hint"))+'</div>'+sgrid+
      '<button class="btn-end" data-act="specialdone">'+esc(tr("special_done"))+'</button></div>';
  }else if(mustRobber){
    actions='<div class="hint">'+esc(state.uiMode==="moveSeaRobber"?tr("click_searobber"):tr("click_robber"))+'</div>';
  }else if(state.uiMode==="moveShipFrom"){
    actions='<div class="actions"><div class="hint">'+esc(tr("moveship_from"))+'</div><button class="btn-end" data-act="cancelmoveship">'+esc(tr("cancel"))+'</button></div>';
  }else if(state.uiMode==="moveShipTo"){
    actions='<div class="actions"><div class="hint gold">'+esc(tr("moveship_to"))+'</div><button class="btn-end" data-act="cancelmoveship">'+esc(tr("cancel"))+'</button></div>';
  }else{
    var rb=(state.pending&&state.pending.type==="roadbuilding")?'<div class="hint gold">'+esc(tr("rb_hint"))+' ('+state.pending.left+')</div>':'';
    var rollRow= !rolled
      ? '<button class="btn-roll" data-act="roll" '+(canAct?"":"disabled")+'>'+esc(tr("roll"))+'</button>'
      : renderDice(state.turn.dice);
    var buildGrid='<div class="grid2">'+
      bb(tr("b_road"),COSTS.road,"road",canBuild&&canAfford(p.res,COSTS.road)&&roadsLeft>0)+
      (sea?bb(tr("b_ship"),COSTS.ship,"ship",canBuild&&canAfford(p.res,COSTS.ship)&&shipsLeft>0):"")+
      bb(tr("b_settlement"),COSTS.settlement,"settlement",canBuild&&canAfford(p.res,COSTS.settlement)&&settLeft>0)+
      bb(tr("b_city"),COSTS.city,"city",canBuild&&canAfford(p.res,COSTS.city)&&cityLeft>0&&countType(me,"settlement")>0)+
      bb(tr("b_dev"),COSTS.dev,"dev",canBuild&&canAfford(p.res,COSTS.dev)&&state.devDeck.length>0,"buydev")+
    '</div>';
    var giveRatio=bestRatio(me,state.ui.bankGive);
    var bankDisabled=(!canBuild)||p.res[state.ui.bankGive]<giveRatio||state.ui.bankGive===state.ui.bankGet;
    var sel=function(side){return '<select data-act="setbank" data-side="'+side+'">'+RES.map(function(r){return '<option value="'+r+'"'+(state.ui[side]===r?" selected":"")+'>'+RES_META[r].icon+' '+esc(resLabel(r))+'</option>';}).join("")+'</select>';};
    var bank='<div class="banktrade"><div class="seclbl" style="margin-bottom:4px">'+esc(tr("bank_trade"))+'</div>'+
      '<div class="row">'+sel("bankGive")+'<span class="ratio">'+giveRatio+':1</span><span class="arrow">→</span>'+sel("bankGet")+
      '<button class="tradebtn" data-act="trade" '+(bankDisabled?"disabled":"")+'>'+esc(tr("trade"))+'</button></div></div>';
    var tradeBtn='<button class="btn-trade" data-act="opentrade" '+(canBuild?"":"disabled")+'>'+esc(tr("trade_btn"))+'</button>';
    var moveShipBtn=sea?('<button class="btn-trade" data-act="startmoveship" '+((canBuild&&!state.movedShip&&hasMovableShip(me))?"":"disabled")+'>'+esc(tr("moveship_btn"))+'</button>'):'';
    var endBtn='<button class="btn-end" data-act="endturn" '+((rolled&&canAct)?"":"disabled")+'>'+esc(tr("end_turn"))+'</button>';
    actions='<div class="actions">'+rb+rollRow+buildGrid+bank+tradeBtn+moveShipBtn+endBtn+'</div>';
  }

  var card='<div class="panel"><div class="phead" style="background:'+c.main+';color:'+c.text+'">'+
      '<span class="who"><span class="miniwhite"></span>'+esc(colorName(me))+'</span>'+
      '<span style="font-size:14px;font-weight:700">'+fullVP(me)+' / '+(state.vpTarget||10)+' ★</span></div>'+
    '<div class="pp">'+
      '<div class="res-grid">'+resCells+'</div>'+
      '<div class="supply"><span class="lbl">'+esc(tr("supply"))+'</span><span class="nums">'+
        '<span title="'+esc(tr("b_road"))+'">🛤️ '+roadsLeft+'</span>'+
        (sea?'<span title="'+esc(tr("b_ship"))+'">⛵ '+shipsLeft+'</span>':'')+
        '<span title="'+esc(tr("b_settlement"))+'">🏠 '+settLeft+'</span>'+
        '<span title="'+esc(tr("b_city"))+'">🏛️ '+cityLeft+'</span></span></div>'+
      devSection+actions+
    '</div></div>';

  return '<div class="sidebar">'+card+renderScoreboard()+renderLog()+'</div>';

function renderDice(d){

    var cells="";for(var i=0;i<9;i++)cells+='<span>'+(dots.indexOf(i)>=0?'<span class="pip"></span>':'')+'</span>';
    return '<div class="die">'+cells+'</div>';}
  return '<div class="dice">'+die(d[0])+die(d[1])+'<span class="dsum">= '+(d[0]+d[1])+'</span></div>';

/* ---- board click routing ---- */
function clickVertex(v){
  var setup=state.setup, mode=state.uiMode, lv=legalVertSet();
  if(!lv[v])return;
  if(state.phase==="setup"&&setup.placing==="settlement")dispatch({type:"SETUP_SETTLEMENT",vertexId:Number(v)});
  else if(mode==="settlement")dispatch({type:"BUILD_SETTLEMENT",vertexId:Number(v)});
  else if(mode==="city")dispatch({type:"BUILD_CITY",vertexId:Number(v)});
}
function clickEdge(e){
  var setup=state.setup, le=legalEdgeSet(), kind=le[e];
  if(!kind)return;
  if(kind==="movefrom"){dispatch({type:"PICK_MOVE_SHIP",edgeId:Number(e)});return;}
  if(kind==="moveto"){dispatch({type:"MOVE_SHIP",edgeId:Number(e)});return;}
  if(state.phase==="setup"&&setup.placing==="road")dispatch({type:(kind==="ship"?"SETUP_SHIP":"SETUP_ROAD"),edgeId:Number(e)});
  else dispatch({type:(kind==="ship"?"BUILD_SHIP":"BUILD_ROAD"),edgeId:Number(e)});
}

/* ---- event delegation ---- */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act],[data-vert],[data-edge],[data-hex]");
  if(!t)return;
  if(t.hasAttribute("data-vert")){clickVertex(t.getAttribute("data-vert"));return;}
  if(t.hasAttribute("data-edge")){clickEdge(t.getAttribute("data-edge"));return;}
  if(t.hasAttribute("data-hex")){dispatch({type:(state.uiMode==="moveSeaRobber"?"MOVE_SEA_ROBBER":"MOVE_ROBBER"),hexId:Number(t.getAttribute("data-hex"))});return;}
  var act=t.getAttribute("data-act");
  switch(act){
    case "lang": dispatch({type:"SET_LANG",lang:t.getAttribute("data-lang")}); break;
    case "costs": dispatch({type:"TOGGLE_COSTS"}); break;
    case "togglesave": dispatch({type:"TOGGLE_SAVE"}); break;
    case "savefile": if(downloadSave())dispatch({type:"SET_SAVE_MSG",msg:"save_file_ok"}); else dispatch({type:"SET_SAVE_MSG",msg:"save_err"}); break;
    case "loadfile": { var fi=document.getElementById("loadFileInput"); if(fi)fi.click(); break; }
    case "closesave": dispatch({type:"TOGGLE_SAVE"}); break;
    case "saveslot": dispatch({type:"SAVE_SLOT",slot:Number(t.getAttribute("data-slot"))}); break;
    case "loadslot": dispatch({type:"LOAD_SLOT",slot:Number(t.getAttribute("data-slot"))}); break;
    case "importsave": { var ia=document.getElementById("importArea"); dispatch({type:"IMPORT_TEXT",json:ia?ia.value:""}); break; }
    case "copyexport": { var ea=document.getElementById("exportArea"); if(ea){ea.select();try{document.execCommand("copy");}catch(e){}} dispatch({type:"SET_SAVE_MSG",msg:"save_copied"}); break; }
    case "setn": dispatch({type:"SET_N",n:Number(t.getAttribute("data-n"))}); break;
    case "setstartmode": dispatch({type:"SET_STARTMODE",mode:t.getAttribute("data-mode")}); break;
    case "setstartscn": dispatch({type:"SET_STARTSCN",scn:t.getAttribute("data-scn")}); break;
    case "begin": dispatch({type:"NEW_GAME",n:state.ui.startN}); break;
    case "firstroll": dispatch({type:"FIRST_ROLL"}); break;
    case "startmoveship": dispatch({type:"START_MOVE_SHIP"}); break;
    case "cancelmoveship": dispatch({type:"CANCEL_MOVE_SHIP"}); break;
    case "robberchoice": dispatch({type:"ROBBER_CHOICE",which:t.getAttribute("data-which")}); break;
    case "goldadj": dispatch({type:"GOLD_ADJ",res:t.getAttribute("data-res"),d:Number(t.getAttribute("data-d"))}); break;
    case "goldconfirm": dispatch({type:"GOLD_CONFIRM"}); break;
    case "newgame": dispatch({type:"NEW_GAME",n:(state.players?state.players.length:state.ui.startN)}); break;
    case "roll": dispatch({type:"ROLL"}); break;
    case "mode": dispatch({type:"SET_MODE",mode:t.getAttribute("data-mode")}); break;
    case "buydev": dispatch({type:"BUY_DEV"}); break;
    case "playdev": dispatch({type:"PLAY_DEV",card:t.getAttribute("data-card")}); break;
    case "endturn": dispatch({type:"END_TURN"}); break;
    case "specialdone": dispatch({type:"SPECIAL_DONE"}); break;
    case "trade": dispatch({type:"BANK_TRADE"}); break;
    case "discadj": dispatch({type:"DISCARD_ADJ",res:t.getAttribute("data-res"),d:Number(t.getAttribute("data-d"))}); break;
    case "disconfirm": dispatch({type:"DISCARD_CONFIRM"}); break;
    case "steal": dispatch({type:"STEAL",from:Number(t.getAttribute("data-pi"))}); break;
    case "plentytoggle": dispatch({type:"PLENTY_TOGGLE",res:t.getAttribute("data-res")}); break;
    case "plentyreset": dispatch({type:"PLENTY_RESET"}); break;
    case "plentyconfirm": dispatch({type:"PLENTY_CONFIRM"}); break;
    case "monopoly": dispatch({type:"MONOPOLY",res:t.getAttribute("data-res")}); break;
    case "opentrade": dispatch({type:"OPEN_TRADE"}); break;
    case "tradepartner": dispatch({type:"TRADE_PARTNER",pi:Number(t.getAttribute("data-pi"))}); break;
    case "tradeadj": dispatch({type:"TRADE_ADJ",slot:t.getAttribute("data-slot"),res:t.getAttribute("data-res"),d:Number(t.getAttribute("data-d"))}); break;
    case "tradesend": dispatch({type:"TRADE_SEND"}); break;
    case "tradecancel": dispatch({type:"TRADE_CANCEL"}); break;
    case "tradeaccept": dispatch({type:"TRADE_ACCEPT"}); break;
    case "tradedecline": dispatch({type:"TRADE_DECLINE"}); break;
  }
});
document.addEventListener("change",function(ev){
  var t=ev.target.closest('[data-act="setbank"]');
  if(!t)return;
  dispatch({type:"SET_BANK",side:t.getAttribute("data-side"),res:t.value});
});

/* ---- go ---- */
render();
</script>
</body>
</html>
