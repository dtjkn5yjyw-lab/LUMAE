// Ausrichtung einer Kante: 0/1/2 (drei Winkelklassen im Hex-Grid)
function edgeOrientation(eid){
  var e=state.board.edges[eid];
  if(!e) return 0;
  var vA=state.board.vertices[e.v1], vB=state.board.vertices[e.v2];
  var dx=vB.x-vA.x, dy=vB.y-vA.y;
  var angle=Math.atan2(dy,dx);
  if(angle<0) angle+=Math.PI;   // 0..π
  var bucket=Math.floor((angle+0.001)/(Math.PI/3)) % 3;
  return bucket;
}
// Farbwürfel: würfelt Farbe (0-5). Zwei Farben pro Ausrichtung. Alle Ritter dieser Ausrichtung verlieren.
function rollColorDie(){
  var color=Math.floor(Math.random()*6);      // 6 Farben
  var orient=color%3;                          // 3 Ausrichtungsklassen
  var lost=[];
  Object.keys(state.barbKnights||{}).forEach(function(eid){
    if(edgeOrientation(Number(eid))===orient){
      lost.push({eid:Number(eid), owner:state.barbKnights[eid].owner});
    }
  });
  lost.forEach(function(x){
    delete state.barbKnights[x.eid];
    state.barbKnightsLeft[x.owner]=(state.barbKnightsLeft[x.owner]||0)+1;
    state.players[x.owner].gold=(state.players[x.owner].gold||0)+3;
    pushLog("log_barb_knight_lost",{name:x.owner});
  });
  return {color:color, orient:orient, lost:lost.length};
}
// 2W6 pro Person, Höchste gewinnt (rekursiv bei Gleichstand)
function rollForPrisoner(candidates){
  var rolls=candidates.map(function(pi){
    var d1=1+Math.floor(Math.random()*6), d2=1+Math.floor(Math.random()*6);
    return {pi:pi, sum:d1+d2};
  });
  var maxS=Math.max.apply(null,rolls.map(function(r){return r.sum;}));
  var top=rolls.filter(function(r){return r.sum===maxS;}).map(function(r){return r.pi;});
  if(top.length===1) return top[0];
  return rollForPrisoner(top);
}
function barbKnightMoveDistance(fromEid, toEid, pl){
  // BFS über Kanten: benachbarte Kanten teilen einen Vertex
  var visited={}; visited[fromEid]=0;
  var queue=[fromEid];
  while(queue.length){
    var eid=queue.shift();
    var d=visited[eid];
    if(eid===toEid) return d;
    if(d>=5) continue; // Maximum: 3+2 mit Getreide
    var e=state.board.edges[eid];
    [e.v1,e.v2].forEach(function(v){
      state.board.vertices[v].edges.forEach(function(oe){
        if(visited[oe]!=null) return;
        // Man darf über andere Ritter/Bauwerke springen, aber Zielkante darf keinen Ritter tragen
        // Für den BFS: alle Kanten dürfen genutzt werden, nur die eigene Startkante nicht Endziel
        // Einschränkung: kein Ritter auf Ziel; das prüfen wir außerhalb
        visited[oe]=d+1;
        queue.push(oe);
      });
    });
  }
  return null;
}
function takeBarbAsPrisoner(pi){
  var hexes=Object.keys(state.barbarians||{}).map(Number).filter(function(hi){return state.barbarians[hi]>0;});
  if(!hexes.length) return false;
  hexes.sort(function(a,b){ return state.barbarians[b]-state.barbarians[a]; });
  var hi=hexes[0];
  var was=state.barbarians[hi];
  state.barbarians[hi]-=1;
  if(state.barbarians[hi]<=0) delete state.barbarians[hi];
  state.prisoners[pi]=(state.prisoners[pi]||0)+1;
  if(was===3 && isCapturedHex(hi)){
    delete state.capturedHexes[hi];
    pushLog("log_barb_recaptured",{n:state.tiles[hi].number});
  }
  updateCapturedBuildings();
  return true;
}
function checkBarbarianVictory(){
  if(!isBarb()) return;
  // Beginne links vom Burgfeld (bei 5-6: beide Burgfelder), im Uhrzeigersinn
  var order = (state.coastHexes||[]).slice();
  order.forEach(function(hi){
    if(!barbariansAtHex(hi)) return;
    var barbs=barbariansAtHex(hi);
    var knightsPer=barbKnightsAtHex(hi);
    var totalKnights=totalBarbKnightsAtHex(hi);
    if(totalKnights <= barbs) return;
    // Sieg!
    var t=state.tiles[hi];
    pushLog("log_barb_win",{n:t.number, n2:totalKnights, n3:barbs});
    // Gefangene verteilen
    var participants=Object.keys(knightsPer).map(Number).sort(function(a,b){return knightsPer[b]-knightsPer[a];});
    var toGive=barbs;
    if(participants.length===1){
      // Ein Spieler allein: bekommt alle Gefangenen
      state.prisoners[participants[0]]=(state.prisoners[participants[0]]||0)+toGive;
      for(var pg=0;pg<toGive;pg++) pushLog("log_barb_prisoner",{name:participants[0]});
    } else {
      // Mehrere Beteiligte: jede/r bekommt zunächst 1 Gefangenen
      var enoughForAll=(toGive>=participants.length);
      var noPrisonerYet=[];
      if(enoughForAll){
        participants.forEach(function(pi){
          state.prisoners[pi]=(state.prisoners[pi]||0)+1;
          pushLog("log_barb_prisoner",{name:pi});
          toGive--;
        });
      } else {
        // Nicht genug für alle: würfeln unter allen Beteiligten
        // Regel: Höchste Zahl bekommt 1, wer keinen erhält bekommt 3 Gold Ausgleich
        var remaining=participants.slice();
        while(toGive>0 && remaining.length>0){
          var winner=rollForPrisoner(remaining);
          state.prisoners[winner]=(state.prisoners[winner]||0)+1;
          pushLog("log_barb_prisoner",{name:winner});
          toGive--;
          remaining=remaining.filter(function(pi){return pi!==winner;});
        }
        noPrisonerYet=remaining.slice();
      }
      // Rest an die Person mit meisten Rittern (alleiniger Führer), sonst Würfeln
      if(toGive>0){
        var top=participants[0];
        var tie=participants.filter(function(pi){return knightsPer[pi]===knightsPer[top];});
        if(tie.length===1){
          state.prisoners[top]=(state.prisoners[top]||0)+toGive;
          pushLog("log_barb_prisoner",{name:top});
        } else {
          // Bei Gleichstand: 2W6 pro Führer, höchste gewinnt
          var winner2=rollForPrisoner(tie);
          state.prisoners[winner2]=(state.prisoners[winner2]||0)+toGive;
          pushLog("log_barb_prisoner",{name:winner2});
          // Verlierer bekommen 3 Gold
          tie.filter(function(pi){return pi!==winner2;}).forEach(function(pi){
            state.players[pi].gold=(state.players[pi].gold||0)+3;
            pushLog("log_barb_gold_comp",{name:pi});
          });
        }
      }
      // Wer nichts bekommen hat: 3 Gold
      noPrisonerYet.forEach(function(pi){
        state.players[pi].gold=(state.players[pi].gold||0)+3;
        pushLog("log_barb_gold_comp",{name:pi});
      });
    }
    // Feld zurückerobern (wenn 3 Barbaren waren)
    if(barbs===3){
      delete state.capturedHexes[hi];
      pushLog("log_barb_recaptured",{n:t.number});
    }
    // Barbaren entfernen
    state.barbariansLeft = Math.min(state.barbariansMax||36,(state.barbariansLeft||0)+barbs);
    delete state.barbarians[hi];
    // Farbwürfel: alle Ritter auf gleicher Ausrichtung im gesamten Spiel gehen verloren
    rollColorDie();
    updateCapturedBuildings();
  });
}

/* ---- Handelstross Helpers ---- */
function isWagonEdge(eid){ return state.wagons && state.wagons[eid]; }
// Alle Kanten der Wasserstelle (für erste Wagenplatzierung)
function waterholeStartEdges(){
  var out=[];
  var whs = (state.waterholeHexes && state.waterholeHexes.length) ? state.waterholeHexes : (state.waterholeHex!=null&&state.waterholeHex>=0?[state.waterholeHex]:[]);
  whs.forEach(function(hi){
    var h=state.board.hexes[hi]; if(!h)return;
    h.edges.forEach(function(eid){ if(out.indexOf(eid)<0) out.push(eid); });
  });
  return out;
}
// Kandidaten-Kanten für nächsten Wagen eines bestehenden Trossen
function trossExtensionEdges(trossenIdx){
  var chain=state.handelstrosse[trossenIdx]||[];
  if(chain.length===0) return waterholeStartEdges();
  var lastEid=chain[chain.length-1];
  var lastE=state.board.edges[lastEid];
  // Alle Kanten, die einen Endpunkt mit lastE teilen und selbst kein Wagen haben
  var candidates=[];
  [lastE.v1,lastE.v2].forEach(function(v){
    state.board.vertices[v].edges.forEach(function(eid){
      if(eid===lastEid)return;
      if(state.wagons&&state.wagons[eid])return;
      // Nicht auf Deep-Sea
      if(edgeKind(eid)==="deep")return;
      candidates.push(eid);
    });
  });
  return candidates;
}
// Erste Wagen eines neuen Trossen: nur Kanten der Wasserstelle, die kein Wagen tragen
function trossFirstEdges(){
  return waterholeStartEdges().filter(function(eid){ return !(state.wagons&&state.wagons[eid]); });
}
// Zähle Trosswagen entlang Route zu einem Endpunkt (für Bonus)
function wagonAdjacentToVertex(vi){
  var count=0;
  if(!state.wagons)return 0;
  state.board.vertices[vi].edges.forEach(function(eid){
    if(state.wagons[eid])count++;
  });
  return count;
}

/* Freundlicher Räuber: darf nicht auf Felder mit Bauwerken einer Person mit ≤2 Siegpunkten.
   Ausnahme: wenn alle Landschaften nur solche Bauwerke haben, ist die Regel aufgehoben. */
function hexHasVulnerableOwner(hi, mover){
  var t=state.tiles[hi]; if(!t) return false;
  if(t.resource==="deepsea"||t.resource==="sea") return false;
  var found=false;
  state.board.hexes[hi].vertices.forEach(function(v){
    var b=state.buildings[v]; if(!b||b.captured) return;
    if(b.owner===mover) return; // eigene Bauwerke schützen nicht
    if(fullVP(b.owner) <= 2) found=true;
  });
  return found;
}
function robberHexLegal(hi, mover){
  if(hi===state.robberHex) return false;
  var t=state.tiles[hi]; if(!t) return false;
  if(t.resource==="deepsea"||t.resource==="sea") return false;
  if(!state.friendlyRobber) return true;
  if(!hexHasVulnerableOwner(hi, mover)) return true;
  // Ausnahme: prüfe, ob alle Landfelder blockiert wären
  var anyFree=false;
  state.tiles.forEach(function(tt, ii){
    if(ii===state.robberHex) return;
    if(!tt||tt.resource==="deepsea"||tt.resource==="sea") return;
    if(!hexHasVulnerableOwner(ii, mover)) anyFree=true;
  });
  if(!anyFree) return true; // Ausnahme greift
  return false;
}
// Prüfe, ob eine Kante parallel zu einem Trosswagen liegt (also selbe Trossen-Route entlang)
function isParallelToWagon(eid){
  if(!state.wagons)return false;
  var e=state.board.edges[eid]; if(!e)return false;
  // "Parallel" heißt: hat gemeinsamen Endpunkt mit einer Wagen-Kante der gleichen Route (aber wir vereinfachen: Nachbar-Kanten)
  return [e.v1,e.v2].some(function(v){
    return state.board.vertices[v].edges.some(function(oe){
      return oe!==eid && state.wagons&&state.wagons[oe];
    });
  });
}

/* Handelstross:
   startWagonPlacement(builderPi) — nach Bau eines Bauwerks aufgerufen.
   Sammelt Kandidatenkanten. Bots stimmen automatisch mit Wolle/Getreide-Karten.
   Bei Human-Baumeister öffnet sich ein Voting-Modal, sonst wird sofort gelöst. */
function collectWagonCandidates(){
  var cands=[]; // [{eid, trossen}]
  var order=state.handelstrosse.map(function(_,i){return i;}).sort(function(a,b){
    return (state.handelstrosse[a].length||0) - (state.handelstrosse[b].length||0);
  });
  for(var oi=0;oi<order.length;oi++){
    var ti=order[oi];
    var chain=state.handelstrosse[ti]||[];
    if(chain.length>=7) continue;
    var raw = chain.length===0 ? trossFirstEdges() : trossExtensionEdges(ti);
    raw = raw.filter(function(eid){
      var k=edgeKind(eid);
      return k!=="deep" && k!=="sea" && !state.wagons[eid];
    });
    if(raw.length){
      raw.forEach(function(eid){ cands.push({eid:eid, trossen:ti}); });
      break; // nur den kürzesten aktiven Trossen erweitern
    } else if(chain.length===0){
      continue; // versuche nächsten leeren Trossen
    } else {
      pushLog("log_wagon_none",{h:ti+1});
    }
  }
  return cands;
}
function mergeTrossenAt(newEid, myTrossen){
  var e=state.board.edges[newEid];
  var mergedInto={}; // to avoid double-merge
  [e.v1,e.v2].forEach(function(v){
    state.board.vertices[v].edges.forEach(function(oe){
      if(oe===newEid)return;
      var w=state.wagons[oe]; if(!w)return;
      if(w.trossen===myTrossen)return;
      if(mergedInto[w.trossen])return;
      mergedInto[w.trossen]=true;
      var other=w.trossen;
      pushLog("log_wagon_merge",{a:myTrossen+1,b:other+1});
      state.handelstrosse[other].slice().forEach(function(oeid){
        if(state.wagons[oeid]){ state.wagons[oeid].trossen=myTrossen; state.handelstrosse[myTrossen].push(oeid); }
      });
      state.handelstrosse[other]=[];
    });
  });
}
function doPlaceWagon(eid, trossen){
  state.wagons[eid]={trossen:trossen};
  state.handelstrosse[trossen].push(eid);
  state.wagonsLeft=Math.max(0,(state.wagonsLeft||22)-1);
  pushLog("log_wagon_place",{h:trossen+1});
  mergeTrossenAt(eid, trossen);
}
// Bot: welchen Kandidaten bevorzugt Spieler pi? — Bewertung nach Nähe zu eigenen Bauwerken
function scoreWagonCandidate(pi,eid){
  var e=state.board.edges[eid], sc=0;
  [e.v1,e.v2].forEach(function(v){
    var b=state.buildings[v];
    if(b&&b.owner===pi&&!b.captured) sc += (b.type==="city"?4:2);
    // Bonus: 2. angrenzender Wagen würde +1 VP-Bonus bringen
    if(b&&b.owner===pi&&wagonAdjacentToVertex(v)===1) sc += 3;
  });
  return sc;
}
function botCastVotes(pi, candidates){
  var p=state.players[pi], avail=(p.res.sheep||0)+(p.res.wheat||0);
  if(avail<=0) return null;
  // Wähle bevorzugten Kandidaten
  var best=null, bestSc=-1;
  candidates.forEach(function(c){
    var sc=scoreWagonCandidate(pi,c.eid);
    if(sc>bestSc){ bestSc=sc; best=c; }
  });
  if(!best||bestSc<=0) return null; // nichts wichtig genug
  // wie viele Karten? mind. 1, max. 3, skalierend mit Score
  var give=Math.min(avail, Math.min(3, 1+Math.floor(bestSc/4)));
  // Abziehen: erst Wolle, dann Getreide
  var sheep=Math.min(p.res.sheep||0, give), wheat=give-sheep;
  p.res.sheep -= sheep; p.res.wheat -= wheat;
  return {eid:best.eid, n:give, sheep:sheep, wheat:wheat};
}
function resolveWagonVote(builderPi){
  var wv=state.wagonVote; if(!wv)return;
  var tally={}; // eid → sum, and per-player
  var perPlayer={}; // eid → {pi: n}
  wv.candidates.forEach(function(c){ tally[c.eid]=0; perPlayer[c.eid]={}; });
  Object.keys(wv.votes).forEach(function(piStr){
    var pi=Number(piStr), v=wv.votes[piStr];
    if(!tally.hasOwnProperty(v.eid)) return;
    tally[v.eid]+=v.n; perPlayer[v.eid][pi]=v.n;
  });
  // Regel: hat eine Person allein mehr Stimmen als alle anderen zusammen → sie entscheidet
  var totalVotes=0; Object.keys(tally).forEach(function(k){ totalVotes+=tally[k]; });
  var dominator=null;
  Object.keys(wv.votes).forEach(function(piStr){
    var pi=Number(piStr), v=wv.votes[piStr];
    if(v.n>totalVotes-v.n && v.n>0) dominator=pi;
  });
  var pickEid=null;
  if(dominator!=null){
    // Dominator wählt die Position auf die er gesetzt hat
    pickEid = wv.votes[dominator].eid;
    pushLog("log_wagon_vote",{name:dominator});
  } else {
    // Position mit meisten Stimmen
    var maxV=0; Object.keys(tally).forEach(function(k){ if(tally[k]>maxV) maxV=tally[k]; });
    var winners=Object.keys(tally).filter(function(k){ return tally[k]===maxV; });
    if(maxV===0){
      // Niemand hat Stimmen abgegeben: Baumeister entscheidet automatisch
      pickEid = wv.candidates[0].eid;
      pushLog("log_wagon_auto",{name:builderPi});
    } else if(winners.length===1){
      pickEid = Number(winners[0]);
      pushLog("log_wagon_win",{w:wv.candidates.findIndex(function(c){return c.eid===pickEid;})+1, n:maxV});
    } else {
      // Bei Gleichstand: Baumeister entscheidet (bevorzugt eine der Gewinner-Optionen falls möglich)
      var bBet = wv.votes[builderPi];
      if(bBet && winners.indexOf(String(bBet.eid))>=0){ pickEid = bBet.eid; }
      else { pickEid = Number(winners[0]); }
      pushLog("log_wagon_vote",{name:builderPi});
    }
  }
  var chosen=wv.candidates.find(function(c){return c.eid===pickEid;});
  if(chosen) doPlaceWagon(chosen.eid, chosen.trossen);
  state.wagonVote=null; state.modal=null;
}
function startWagonPlacement(builderPi){
  if(state.hbScenario!=="handelstross") return;
  if((state.wagonsLeft||0)<=0) return;
  var cands=collectWagonCandidates();
  if(cands.length===0) return;
  if(cands.length===1){ doPlaceWagon(cands[0].eid, cands[0].trossen); return; }
  // Voting-Setup: Bots stimmen sofort
  var votes={};
  state.players.forEach(function(p, pi){
    if(pi===builderPi) return;
    if(!p.bot) return;
    var v=botCastVotes(pi, cands);
    if(v) votes[pi]=v;
  });
  // Wenn Baumeister Bot ist: sein eigener Bot-Vote + Auflösung
  if(state.players[builderPi] && state.players[builderPi].bot){
    var vb=botCastVotes(builderPi, cands);
    if(vb) votes[builderPi]=vb;
    state.wagonVote={candidates:cands, votes:votes, builder:builderPi};
    resolveWagonVote(builderPi);
    return;
  }
  // Human-Baumeister: Modal öffnen
  state.wagonVote={candidates:cands, votes:votes, builder:builderPi, uiPick:null};
  state.modal="wagonVote";
}
function updateRichPoor(){
  if(state.hbScenario!=="fluesse")return;
  var golds=state.players.map(function(p,i){return {i:i,g:p.gold||0};});
  var maxG=Math.max.apply(null,golds.map(function(x){return x.g;}));
  var minG=Math.min.apply(null,golds.map(function(x){return x.g;}));
  var withMax=golds.filter(function(x){return x.g===maxG;});
  var withMin=golds.filter(function(x){return x.g===minG;});

  // Reichster: nur wenn allein am meisten Gold (und >0)
  var newRich = (withMax.length===1 && maxG>0) ? withMax[0].i : null;
  if(newRich!==state.richest){
    if(state.richest!=null) pushLog("log_richest_lose",{name:state.richest});
    state.richest=newRich;
    if(newRich!=null) pushLog("log_richest_get",{name:newRich});
  }
  // Armer: alle mit minimalstem Gold (auch bei Gleichstand)
  var newPoor={};
  withMin.forEach(function(x){ newPoor[x.i]=true; });
  // Log-Diff
  Object.keys(newPoor).forEach(function(k){ if(!state.poorest[k]) pushLog("log_poorest_get",{name:Number(k)}); });
  Object.keys(state.poorest).forEach(function(k){ if(!newPoor[k]) pushLog("log_poorest_lose",{name:Number(k)}); });
  state.poorest=newPoor;
}
/* Häfen von Catan: „Stärkste Häfen" +2 SP, an den Spieler mit den meisten 2:1-Hafenmeister-Markern (min. 2). */
function updateStrongestHarbors(){
  if(!state.harborsVariant || !state.harborMasters) return;
  var counts={};
  Object.keys(state.harborMasters).forEach(function(k){
    var pi=state.harborMasters[k];
    if(pi==null) return;
    counts[pi]=(counts[pi]||0)+1;
  });
  var top=null, topN=0, tie=false;
  Object.keys(counts).forEach(function(pi){
    if(counts[pi]>topN){ topN=counts[pi]; top=Number(pi); tie=false; }
    else if(counts[pi]===topN){ tie=true; }
  });
  var newOwner = (topN>=2 && !tie) ? top : null;
  if(newOwner!==state.strongestHarbors){
    if(state.strongestHarbors!=null) pushLog("log_strongest_harbors_lose",{name:state.strongestHarbors});
    state.strongestHarbors = newOwner;
    if(newOwner!=null) pushLog("log_strongest_harbors",{name:newOwner});
  }
}

/* ---- Ereignisse auf Catan (37 Karten) ---- */
function buildEventDeck(){
  // Jede Karte: {n: Zahl (2..12) oder null, ev: EreignisID}
  // 11 Ereignisse plus "schoen" (kein Ereignis)
  var cards=[];
  function add(n,ev,x){ for(var i=0;i<x;i++) cards.push({n:n, ev:ev}); }
  // Räuberüberfall: 6× mit 7
  add(7,"raeuber",6);
  // Seuche: 1×6, 1×8
  add(6,"seuche",1); add(8,"seuche",1);
  // Erdbeben: 1×6
  add(6,"erdbeben",1);
  // Gute Nachbarschaft: 1×6
  add(6,"gnb",1);
  // Ritterturnier: 1×5
  add(5,"turnier",1);
  // Handelsvorteil: 1×5
  add(5,"hvorteil",1);
  // Ruhige See: 1×9, 1×12
  add(9,"rsee",1); add(12,"rsee",1);
  // Nachbarschaftshilfe: 1×10, 1×11
  add(10,"nbhilfe",1); add(11,"nbhilfe",1);
  // Konflikt: 1×3
  add(3,"konflikt",1);
  // Ertragreiches Jahr: 1×2
  add(2,"ertrag",1);
  // Ein schöner Tag: 1×3, 1×4, 2×5, 2×6, 4×8, 3×9, 2×10, 1×11
  add(3,"schoen",1); add(4,"schoen",1); add(5,"schoen",2); add(6,"schoen",2);
  add(8,"schoen",4); add(9,"schoen",3); add(10,"schoen",2); add(11,"schoen",1);
  // Jahreswechsel: 1× ohne Zahl (kommt zuletzt, oben)
  var jw={n:null, ev:"jahr"};
  shuffle(cards);
  // 5 Karten drunter, Jahreswechsel darüber, restliche Karten drüber
  var deck=cards.slice(0,5); deck.push(jw); deck=deck.concat(cards.slice(5));
  return deck;
}
function drawEventCard(){
  if(!state.eventDeck||!state.eventDeck.length){
    state.eventDeck=state.eventDiscard.slice(); state.eventDiscard=[]; shuffle(state.eventDeck);
  }
  var c=state.eventDeck.pop();
  state.eventDiscard.push(c);
  return c;
}
// Anwendung der Ereignisse. Erträge werden anschließend über rollResourcesAndSeven ausgezahlt (mit ev als context).
function applyEventEffect(card){
  var me=state.current;
  switch(card.ev){
    case "raeuber":
      // Wird wie klassische 7 behandelt: state.seven=true, Discard-Phase startet über die normale roll-Logik
      break;
    case "seuche":
      state.seucheThisTurn=true;
      pushLog("log_ev_seuche"); break;
    case "erdbeben":
      // Jeder Spieler eine zufällige eigene Straße quer legen
      state.players.forEach(function(p,pi){
        var mine=[];
        Object.keys(state.roads).forEach(function(eid){ if(state.roads[eid].owner===pi && !(state.brokenRoads&&state.brokenRoads[eid])) mine.push(eid); });
        if(mine.length){
          var pick=mine[Math.floor(Math.random()*mine.length)];
          state.brokenRoads[pick]=true;
        }
      });
      pushLog("log_ev_erdbeben"); break;
    case "gnb":
      // Alle geben der Person links (Reihenfolge state.order) 1 Karte
      var n=state.players.length;
      state.players.forEach(function(p,pi){
        var to=(pi+1)%n;
        var kinds=Object.keys(p.res).filter(function(r){ return p.res[r]>0; });
        if(!kinds.length) return;
        var pickR=kinds[Math.floor(Math.random()*kinds.length)];
        p.res[pickR]-=1; state.players[to].res[pickR]=(state.players[to].res[pickR]||0)+1;
        pushLog("log_ev_gift",{name:pi,to:to,res:pickR});
      });
      break;
    case "turnier":
      // Person mit meisten ausgespielten Ritterkarten
      var maxK=-1, winnerT=null, tieT=false;
      state.players.forEach(function(p,pi){
        var k=p.knightsPlayed||0;
        if(k>maxK){ maxK=k; winnerT=pi; tieT=false; }
        else if(k===maxK && k>0){ tieT=true; }
      });
      if(winnerT!=null && maxK>0 && !tieT){
        var kinds2=RES.slice(); var pickR2=kinds2[Math.floor(Math.random()*kinds2.length)];
        // Bots wählen zufällig; Human: Modal? -> für Simplicity gleich zufällig
        if(!state.players[winnerT].bot && winnerT===me){ pickR2 = pickBestResFor(winnerT); }
        state.players[winnerT].res[pickR2]+=1;
        pushLog("log_ev_turnier",{name:winnerT});
      }
      break;
    case "hvorteil":
      // Wer Längste Handelsroute hat: ziehe 1 Karte von beliebiger Person
      if(state.longestRoad!=null){
        var winnerH=state.longestRoad;
        var victims=state.players.map(function(_,i){return i;}).filter(function(i){ return i!==winnerH && totalCards(state.players[i].res)>0; });
        if(victims.length){
          var vpick=victims[Math.floor(Math.random()*victims.length)];
          var mv=takeRandomCards(vpick,winnerH,1);
          if(mv.length) pushLog("log_ev_hvorteil",{name:winnerH,victim:vpick});
        }
      }
      break;
    case "rsee":
      // Person mit meisten Hafen-Siedlungen/-Städten
      var counts={};
      var hs=state.harbors;
      hs.forEach(function(hb){
        [hb.v1,hb.v2].forEach(function(v){
          var b=state.buildings[v];
          if(b&&!b.captured){ counts[b.owner]=(counts[b.owner]||0)+(b.type==="city"?2:1); }
        });
      });
      var maxH=0, winnerR=null, tieR=false;
      Object.keys(counts).forEach(function(pi){
        if(counts[pi]>maxH){ maxH=counts[pi]; winnerR=Number(pi); tieR=false; }
        else if(counts[pi]===maxH){ tieR=true; }
      });
      if(winnerR!=null && maxH>0 && !tieR){
        var pickR3 = state.players[winnerR].bot ? RES[Math.floor(Math.random()*RES.length)] : pickBestResFor(winnerR);
        state.players[winnerR].res[pickR3]+=1;
        pushLog("log_ev_rsee",{name:winnerR});
      }
      break;
    case "nbhilfe":
      // Person mit meisten SP schenkt einer Person mit weniger SP 1 Karte
      var vps=state.players.map(function(_,i){return {i:i,vp:publicVP(i)};});
      vps.sort(function(a,b){return b.vp-a.vp;});
      var topVP=vps[0].vp;
      vps.filter(function(x){return x.vp===topVP;}).forEach(function(giver){
        var less=vps.filter(function(x){return x.vp<topVP;});
        if(!less.length) return;
        var target = less[Math.floor(Math.random()*less.length)].i;
        var gp=state.players[giver.i], kinds3=Object.keys(gp.res).filter(function(r){return gp.res[r]>0;});
        if(!kinds3.length) return;
        var gres=kinds3[Math.floor(Math.random()*kinds3.length)];
        gp.res[gres]-=1; state.players[target].res[gres]=(state.players[target].res[gres]||0)+1;
        pushLog("log_ev_nbhilfe",{name:giver.i,victim:target});
      });
      break;
    case "konflikt":
      // Wer alleine meiste ausgespielte Ritter hat: 1 Karte
      var maxKn=-1, wnK=null, tieK=false;
      state.players.forEach(function(p,pi){
        var k=p.knightsPlayed||0;
        if(k>maxKn){ maxKn=k; wnK=pi; tieK=false; }
        else if(k===maxKn && k>0){ tieK=true; }
      });
      var winnerK = (!tieK && maxKn>0) ? wnK : state.largestArmy;
      if(winnerK!=null){
        var vict=state.players.map(function(_,i){return i;}).filter(function(i){ return i!==winnerK && totalCards(state.players[i].res)>0; });
        if(vict.length){
          var vp2=vict[Math.floor(Math.random()*vict.length)];
          var mv2=takeRandomCards(vp2,winnerK,1);
          if(mv2.length) pushLog("log_ev_konflikt",{name:winnerK,victim:vp2});
        }
      }
      break;
    case "ertrag":
      // Alle wählen 1 Rohstoff
      state.players.forEach(function(p,pi){
        var pick=p.bot?RES[Math.floor(Math.random()*RES.length)]:pickBestResFor(pi);
        p.res[pick]+=1;
      });
      pushLog("log_ev_ertrag");
      break;

/* Szenario 6 "Stoffe für Catan" für 5-6 Spieler.

   je ca. 21 Hex), dazwischen ein Meer-Streifen (q∈{-1,0,1}) mit 12 Dörfern
   (statt 4). Jedes Dorf hat eine Zahl (aus dem Pool 3..11 ohne 7, doppelt
   verteilt) und startet mit 5 Stoffballen — insgesamt 60 + 10 Reserve = 70

/* Szenario 6 "Stoffe für Catan" für 5-6 Spieler.
   PDF-konformes Layout (2025er Ausgabe): exakt 56 Hex = 12 offenes Meer +
   12 Dörfer + 4 Wüsten + 2 Goldflüsse + 26 Standard-Land (Hügel 4, Wald 6,
   Weide 5, Acker 6, Gebirge 5). (Anmerkung: PDF listet "Meer 24" — das
   umfasst auch die 12 Positionen unter den Dörfern; als eigenständige
   village-Hexes bleibt es logisch bei 12 offenen Sea-Feldern.)
   Häfen: 6 Spezial (2× Wolle) + 5 3:1 (via harborList). 12 Dörfer je
   5 Stoffballen + 10 Reserve = 70 Stoffballen (regelkonform).
   setupSettlements:3 greift automatisch: 3 Startsiedlungen pro Person.

   Board-Konstruktion: R=4-Basis (61 Hex) minus 5 äußere Meer-Streifen-
   Positionen → 56 Hex. Zwei Home-Inseln (q≤-2 und q≥2, je 18 Hex, davon
   je 2 Sea-Küstenrand + 2 Wüste + 1 Gold + 13 Standard-Land = 16 Land).
   Meer-Streifen (q∈{-1,0,1}, 20 Positionen nach Reduktion): 12 Dörfer +
   8 offene Sea. Chips: 26 Standard + 2 Gold = 28, verteilt nach

   klassischen Dorf-Pool [3..11 ohne 7]. */
function buildStoffeBig(n){
  // 56 Hex: R=4 (61 Positionen) minus 5 äußere Meer-Streifen-Positionen

  var coords=seaCoords(4).filter(function(c){ return !excluded[c.q+","+c.r]; });
  var centers=coords.map(function(c){return{x:SIZE*SQRT3*(c.q+c.r/2),y:SIZE*1.5*c.r};});
  var board=assembleBoard(centers); board.coords=coords;
  var idx={}; coords.forEach(function(c,i){ idx[c.q+","+c.r]=i; });

  // 12 Dorf-Positionen im Meer-Streifen (q in {-1,0,1}), zickzack + symmetrisch
  var villageQR=[
    [0,-3],[0,-1],[0,1],[0,3],                     // 4 auf q=0
    [-1,-3],[-1,-1],[-1,1],[-1,3],                  // 4 auf q=-1
    [1,-3],[1,-1],[1,1],[1,2]                       // 4 auf q=1
  ];
  var villageSet={}; villageQR.forEach(function(qr){ var i=idx[qr[0]+","+qr[1]]; if(i!=null) villageSet[i]=true; });

  // Regionen zuweisen
  var region=coords.map(function(c,i){
    if(villageSet[i]) return "village";
    if(c.q<=-2 && c.dist<4) return "homeInner";     // Innere Home-Insel-Positionen
    if(c.q>=2  && c.dist<4) return "homeInner";
    if(c.q<=-2 || c.q>=2)   return "homeCoast";     // dist=4 Home-Randstreifen (teils Sea, teils Land)
    return "sea";                                   // Meer-Streifen ohne Dorf
  });

  // Home-Küste (dist=4 mit q≤-2 oder q≥2): 4 Land Positionen behalten, Rest = Sea (2 pro Seite)
  var coastLeft=[], coastRight=[];
  region.forEach(function(rg,hi){
    if(rg!=="homeCoast") return;
    if(coords[hi].q<=-2) coastLeft.push(hi); else coastRight.push(hi);
  });
  var coastLandLeft =shuffle(coastLeft.slice()).slice(0,3);   // 3 Küsten-Land links
  var coastLandRight=shuffle(coastRight.slice()).slice(0,3);  // 3 Küsten-Land rechts
  var coastLandSet={};
  coastLandLeft.concat(coastLandRight).forEach(function(hi){ coastLandSet[hi]=true; });

  // Home-Land Positionen: innere Home + ausgewählte Küsten-Land
  var homeLeftIds=[], homeRightIds=[];
  region.forEach(function(rg,hi){
    var isHomeSide=(rg==="homeInner")||(rg==="homeCoast" && coastLandSet[hi]);
    if(!isHomeSide) return;
    if(coords[hi].q<=-2) homeLeftIds.push(hi); else homeRightIds.push(hi);
  });

  // Pro Home-Insel: 2 Wüsten + 1 Gold + Rest Standard-Land (Ziel: je 13 Standard-Land)
  function placeHome(hids){
    var sh=shuffle(hids.slice());
    return {desert:sh.slice(0,2), gold:sh.slice(2,3), land:sh.slice(3)};
  }
  var lz=placeHome(homeLeftIds), rz=placeHome(homeRightIds);
  var allLand=lz.land.concat(rz.land);
  var allGold=lz.gold.concat(rz.gold);

  // Chip-Verteilung: proportional erweitertes PDF-Muster für 28 Chip-Positionen
  // (26 Standard + 2 Gold). PDF-Muster: 2:1, 3:3, 4:3, 5:3, 6:4, 8:4, 9:3, 10:3, 11:3, 12:1 = 28
  var chipCfg={2:1,3:3,4:3,5:3,6:4,8:4,9:3,10:3,11:3,12:1};
  var toks=chipBag(chipCfg);

  // Standard-Land-Ressourcen exakt nach PDF: Hügel 4, Wald 6, Weide 5, Acker 6, Gebirge 5 = 26
  var landBag=shuffle(resBag({brick:4,wood:6,sheep:5,wheat:6,ore:5}));

  var tiles=board.hexes.map(function(){return{resource:"sea",number:null};});
  allLand.forEach(function(hi){ tiles[hi]={resource:landBag.pop(),number:toks.pop()}; });
  allGold.forEach(function(hi){ tiles[hi]={resource:"gold",number:toks.pop()}; });
  lz.desert.concat(rz.desert).forEach(function(hi){ tiles[hi]={resource:"desert",number:null}; });
  var homeHexes={}; region.forEach(function(rg,hi){
    var isHomeSide=(rg==="homeInner")||(rg==="homeCoast" && coastLandSet[hi]);
    if(isHomeSide) homeHexes[hi]=true;
  });

  // 12 Dörfer: Nummern aus [3..11] ohne 7, doppelt verteilt (12 Nummern)
  var villages={}, vnums=shuffle([3,4,5,6,8,9,10,11, 3,5,9,11]);
  var vi=0;
  region.forEach(function(rg,hi){
    if(rg==="village"){
      var num=vnums[vi++%vnums.length];
      tiles[hi]={resource:"village",number:num};
      villages[hi]={number:num,cloth:5};
    }
  });

  var robberHex=lz.desert.length ? lz.desert[0] : allLand[0];
  var seaRobberHex=tiles.findIndex(function(t){return t.resource==="sea";});
  return {board:board,tiles:tiles,harbors:assignSeaHarbors(board,tiles),robberHex:robberHex,seaRobberHex:seaRobberHex,islandOf:null,homeHexes:homeHexes,villages:villages,clothReserve:10};
}

  var homeHexes={}; region.forEach(function(rg,hi){ if(rg==="home") homeHexes[hi]=true; });
  // far hexes: coastal ones (r==-1) carry harbor tokens, the rest carry tribe reward tokens
  var farIds=[]; region.forEach(function(rg,hi){ if(rg==="far") farIds.push(hi); });
  var coastFar=farIds.filter(function(hi){ return coords[hi].r===-1; });
  var harborHexes=shuffle(coastFar.slice()).slice(0,4);

  var tribeHarbors={}; harborHexes.forEach(function(hi,k){ var s=hspec[k%hspec.length]; tribeHarbors[hi]={ratio:s.ratio,kind:s.kind}; });
  var rewardIds=farIds.filter(function(hi){ return !harborSet[hi]; });
  var kinds=shuffle(rewardIds.map(function(_,i){ var m=i%10; return m<4?"res":(m<7?"dev":"vp"); }));
  var tribe={}; rewardIds.forEach(function(hi,k){ tribe[hi]={kind:kinds[k],res:tiles[hi].resource}; });
  var robberHex=region.indexOf("home"); var seaRobberHex=tiles.findIndex(function(t){return t.resource==="sea";});
  return {board:board,tiles:tiles,harbors:assignSeaHarbors(board,tiles),robberHex:robberHex,seaRobberHex:seaRobberHex,islandOf:null,homeHexes:homeHexes,tribe:tribe,tribeHarbors:tribeHarbors};
}
/* Szenario 5 "Der vergessene Stamm" für 5-6 Spieler.
   PDF-konformes Layout (2025er Ausgabe): exakt 63 Hex = 22 Meer + 4 Wüsten +
   3 Goldflüsse + 34 Standard-Land (7 pro Hügel/Wald/Weide/Acker + 6 Gebirge).
   Häfen: 5 Spezial + 3× 3:1 = 8 Häfen. Extra: 10 Siegpunkt-Chips + 6 Entw.-Karten.

   Board-Konstruktion: R=4-Basis (61 Hex) + 2 kleine Inseln bei (-4,-2) und
   (4,2) im dist=5-Ring → 63 Hex gesamt. Wasserstreifen r=0 (9 Hex) trennt
   Home (r≥1) und Far (r≤-1). Küstenring dist=4 non-r0 (22 Hex) verteilt in

   Wüsten/Gold-Verteilung: Home = 2 Wüsten + 1 Gold + 17 Standard,
   Far = 2 Wüsten + 2 Gold + 17 Standard (thematisch: das vergessene Land ist

   Chip-Anmerkung: Das PDF listet 29 Chips (physisch im Karton), aber 37 Chip-
   Positionen (34 Standard-Land + 3 Gold). Für Regelfluss verwenden wir 37 Chips

  var homeAllLand=innerHome.concat(homeCoastLand);

  var islands=[]; region.forEach(function(rg,hi){ if(rg==="island") islands.push(hi); });

  var homeDesert=homeShuf.slice(0,2);

  // Far-Verteilung: 2 Wüsten + 2 Gold + 17 Standard = 21
  var farShuf=shuffle(farAllLand.slice());
  var farDesert=farShuf.slice(0,2);
  var farGold  =farShuf.slice(2,4);
  var farStd   =farShuf.slice(4);         // 17 Standard-Land

  // Chip-Distribution: proportional erweitertes PDF-Muster für 37 Chips
  // (34 Standard + 3 Gold = 37 → 2:1, 3:5, 4:5, 5:5, 6:4, 8:4, 9:4, 10:4, 11:4, 12:1)
  var chipCfg={2:1,3:5,4:5,5:5,6:4,8:4,9:4,10:4,11:4,12:1};
  var toks=chipBag(chipCfg);

  // Ressourcen-Verteilung: 7+7+7+7+6 = 34 Standard (Hügel/Wald/Weide/Acker + Gebirge)
  var landBag=shuffle(resBag({brick:7,wood:7,sheep:7,wheat:7,ore:6}));

  farStd.forEach(function(hi){ tiles[hi]={resource:landBag.pop(), number:toks.pop()}; });
  homeGold.forEach(function(hi){ tiles[hi]={resource:"gold", number:toks.pop()}; });
  farGold.forEach(function(hi){ tiles[hi]={resource:"gold", number:toks.pop()}; });
  homeDesert.concat(farDesert).forEach(function(hi){ tiles[hi]={resource:"desert",number:null}; });

  // homeHexes: alle Home-Land-Positionen (für Startaufstellung "home"-Regel)
  var homeHexes={};

  // Tribe-Häfen auf Far-Küsten-Land + Islands (nur Standard-Land, keine Wüste/Gold)

  var hspec=shuffle([

  ]);
  var tribeHarbors={};

  var centers=coords.map(function(c){return{x:SIZE*SQRT3*(c.q+c.r/2),y:SIZE*1.5*c.r};});

  var robberHex=wheatHome.length?wheatHome[0]:homeProd[0];

/* Zielkreuzungen für das Vertreiben: fremder, schwächerer Ritter im eigenen Netz */

function barbarianAttack(commit){

    if(best.length===1){ state.players[best[0]].vpCards+=1; pushLog("log_barb_hero",{name:best[0]}); }
    else if(best.length>1){
      // Gleichstand: alle Beteiligten ziehen eine Fortschrittskarte, es gibt keinen Siegpunkt-Chip
      best.forEach(function(pi){
        var order=AREAS.filter(function(ar){return state.progDecks[ar]&&state.progDecks[ar].length;});
        if(!order.length)return;
        var ar=order[Math.floor(Math.random()*order.length)], card=state.progDecks[ar].shift(), pp=state.players[pi];
        if(PROG_VP[card]){ pp.vpCards+=PROG_VP[card]; pushLog("log_prog_vp",{name:pi,a:PROG_NAME[card]}); return; }
        pp.prog=pp.prog||[]; pp.prog.push(card);
        pushLog("log_barb_tie_card",{name:pi});
        if(pp.prog.length>4){
          if(pi===state.current) state.mustPlayProg=pi;
          else{ var di=Math.floor(Math.random()*pp.prog.length), back=pp.prog.splice(di,1)[0];
                state.progDecks[progAreaOf(back)].push(back); pushLog("log_prog_giveback",{name:pi,a:PROG_NAME[back]}); }

    }
    else pushLog("log_barb_win");

    // Das Barbarenheer gewinnt: wer am wenigsten beigetragen hat, verliert eine Stadt
    var owners=state.players.map(function(_,pi){return pi;}).filter(function(pi){
      return Object.keys(state.buildings).some(function(b){ var x=state.buildings[b]; return x.owner===pi&&x.type==="city"&&!x.captured&&!isMetroVertex(b); });
    });
    if(owners.length){
      var min=Math.min.apply(null,owners.map(function(pi){return def[pi];}));
      owners.filter(function(pi){return def[pi]===min;}).forEach(function(pi){
        var cityV=Object.keys(state.buildings).find(function(b){ var x=state.buildings[b]; return x.owner===pi&&x.type==="city"&&!x.captured&&!isMetroVertex(b); });
        if(cityV!=null){

          if(state.walls[cityV]){ delete state.walls[cityV]; state.players[pi].walls=Math.max(0,state.players[pi].walls-1); }
          pushLog("log_barb_sack",{name:pi});
        }
      });
    }
    pushLog("log_barb_lose");
  }
  // Eingesetzte Ritter deaktivieren, Barbarenschiff zurück auf Startfeld
  state.players.forEach(function(_,pi){
    var list=activeKnights(pi);
    if(commit&&commit[pi]!=null) list=list.slice(0,commit[pi]);   // nur die eingesetzten Ritter

function rollEventDie(){

/* Ein Wurf mit vorgegebenen Augen – so kann auch die Karte Alchemie den Zug auslösen. */

function beginRobber(source){
  // Barbarenüberfall: kein Räuber, direkt 1 Karte von beliebiger Person ziehen
  if(isBarb()){
    var thief=activePlayer();
    var victims=state.players.map(function(_,i){return i;}).filter(function(i){ return i!==thief && handPool(i).length>0; });
    if(victims.length){
      var vpick=victims[Math.floor(Math.random()*victims.length)];
      stealFrom(vpick);
    }
    state.pending=null; state.uiMode=null;
    return;
  }
  // Finale: kein Räuber, Barbar versetzen (falls auf Straße → Karte vom Eigentümer)
  if(isFinale()){
    var thiefF=activePlayer();
    // Wähle einen der 3 Barbaren (zufällig) und setze ihn auf eine andere Kante
    var barbEs=Object.keys(state.barbEdges||{});
    if(barbEs.length){
      var oldEid=Number(barbEs[Math.floor(Math.random()*barbEs.length)]);
      delete state.barbEdges[oldEid];
      var candidates=[];
      state.board.edges.forEach(function(ee){
        if(state.barbEdges[ee.id]) return;
        var isLand=ee.hexes.some(function(hi){ return hi<state.tiles.length && state.tiles[hi] && !isWaterRes(state.tiles[hi].resource); });
        if(!isLand) return;
        if(isTargetSeaEdge(ee.id)) return;
        candidates.push(ee.id);
      });
      if(candidates.length){
        var pickB=candidates[Math.floor(Math.random()*candidates.length)];
        state.barbEdges[pickB]=true;
        pushLog("log_barb_move",{name:thiefF});
        // Auf Straße? Dann 1 Karte vom Straßeneigner
        var roadO=state.roads[pickB];
        if(roadO && roadO.owner!==thiefF && handPool(roadO.owner).length>0){

}

function stealFrom(victimPi){

function checkWin(){

      var beatsAll=mine>0&&state.players.every(function(_,qi){return qi===pi||mine>(state.wonderStage[qi]||0);});
      if(beatsAll){ state.winner=pi; state.phase="gameover"; pushLog("log_wins",{name:pi}); }

    var best=-1,who=0; state.players.forEach(function(_,q){var v=fullVP(q);if(v>best){best=v;who=q;}});

}

// Ozeanien: reveal fog hexes bordering a newly built edge
function revealAt(hexId,discoverer,goldQ){
  if(!state.fog||state.tiles[hexId].resource!=="fog")return;
  var hidden=state.fog[hexId]; delete state.fog[hexId];
  if(!hidden||hidden.resource==="sea"){ state.tiles[hexId]={resource:"sea",number:null}; pushLog("log_fog_sea",{name:discoverer}); return; }
  var res=hidden.resource;
  // Landschaftsfeld: obersten Zahlenchip vom verdeckten Stapel darauflegen (nur die Wüste bleibt ohne)
  var num=(res==="desert")?null:(state.fogTokens.length?state.fogTokens.pop():null);
  state.tiles[hexId]={resource:res,number:num};
  // "Wer das Landschaftsfeld entdeckt hat, erhält sofort 1 Rohstoffkarte dieses Landschaftsfelds"
  if(res==="gold"){ if(goldQ) goldQ.push(1); }
  else if(res!=="desert"){ state.players[discoverer].res[res]+=1; }

function revealFogFor(edgeId,discoverer){

// Claim a harbor token by building a settlement next to it: attach a real harbor to that vertex
function claimTribeHarbor(v,tk){
  var vert=state.board.vertices[v], edge=null, seaHex=null;
  vert.edges.forEach(function(eid){
    var e=state.board.edges[eid];
    if(e.hexes.length===2){ var aW=isWaterHex(e.hexes[0]), bW=isWaterHex(e.hexes[1]); if(aW!==bW && !edge){ edge=e; seaHex=aW?e.hexes[0]:e.hexes[1]; } }

/* ---------- actions (mutating, then render) ---------- */

function apply(a){

    case "SET_SRSEA": state.ui.startSrSea=!state.ui.startSrSea; return;
    case "SET_TACTIC": state.ui.startTactic=!state.ui.startTactic; return;
    case "SET_FRIENDLY_ROBBER": state.ui.startFriendlyRobber=!state.ui.startFriendlyRobber; return;
    case "SET_HARBORS": state.ui.startHarbors=!state.ui.startHarbors; return;
    case "SET_EVENTS": state.ui.startEvents=!state.ui.startEvents; return;
    case "NEW_GAME": state=freshGame(a.n||state.ui.startN||3, a.mode||state.ui.startMode||"base", a.scn||state.ui.startScn||"frei", state.ui.startSkipRoll, (state.ui.seatBots||[]).slice(0,a.n||state.ui.startN||3), state.ui.startSrSea, state.ui.startTactic, a.hbScn||state.ui.startHbScn||"fischfang", state.ui.startFriendlyRobber, state.ui.startHarbors, state.ui.startEvents); return;
    case "ASK_NEWGAME": state.ui.confirmNew=true; return;

    case "FIRST_ROLL":{

      pushLog("log_first_roll",{name:pl,sum:d1+d2,d1:d1,d2:d2});
      fr.idx+=1;

        var best=-1,winners=[];
        fr.active.forEach(function(p){var sm=fr.rolls[p][0]+fr.rolls[p][1];if(sm>best){best=sm;winners=[p];}else if(sm===best)winners.push(p);});
        if(winners.length===1){ beginSetup(winners[0]); }

      }

      // Barbarenüberfall: 2. Runde ist ebenfalls eine Stadt (statt Siedlung)
      var barbCity=(state.hbScenario==="barbarenueberfall" && state.setup.idx>=state.players.length);
      var finaleCity=(state.hbScenario==="finale" && state.setup.idx>=state.players.length);
      state.buildings[v]={owner:pi,type:((srCity||barbCity||finaleCity)?"city":"settlement")};

    case "SET_BANK": state.ui[a.side]=a.res; return;    case "BANK_TRADE":{

    case "TRADE_ADJ":{

    case "TRADE_SEND":{

      }

      if(!state.special)return;

      sb.dev=sb.dev.concat(sb.newDev); sb.newDev=[]; // bought in A's turn → playable on their own turn

    case "OPEN_FISH":{
      if(state.hbScenario!=="fischfang")return;

      return;
    }
    case "CLOSE_FISH":{
      if(state.pending&&state.pending.type==="fish"){ state.pending=null; }
      if(state.pending&&state.pending.type==="fishRoad"){ state.pending=null; state.uiMode=null; }

    }
    case "FISH_ACTION":{
      if(!state.pending||state.pending.type!=="fish")return;
      var fpi=state.current, fp2=state.players[fpi];
      var act=a.act;
      var doPay=function(cost){
        if(fishSum(fp2)<cost) return false;
        var ok=payFishTiles(fpi, cost);
        if(ok) fp2.fish=fishSum(fp2);
        return ok;
      };
      if(act==="robber"){
        if(!doPay(2))return;
        state.robberHex=-1;
        state.pending=null;
        pushLog("log_fish_robber",{name:fpi});
        return;
      }
      if(act==="steal"){
        if(!doPay(3))return;
        var candidates=state.players.map(function(_,i){return i;}).filter(function(i){return i!==fpi&&totalCards(state.players[i].res)>0;});
        pushLog("log_fish_steal",{name:fpi});
        if(candidates.length===0){ state.pending=null; pushLog("log_nothing_steal"); return; }
        if(candidates.length===1){ stealFrom(candidates[0]); state.pending=null; return; }
        state.pending={type:"fishSteal",candidates:candidates};

      if(act==="res"){

        state.pending={type:"roadbuilding",left:1};
        state.uiMode="road";
        pushLog("log_fish_road",{name:fpi});
        return;
      }
      if(act==="dev"){
        if(!doPay(7))return;
        if(state.devDeck&&state.devDeck.length){
          var card=state.devDeck.shift();
          if(card==="vp"&&state.scenario!=="piraten")fp2.vpCards+=1; else fp2.newDev.push(card);
          pushLog("log_fish_dev",{name:fpi});
        }
        state.pending=null;
        return;
      }
      return;
    }
    case "FISH_STEAL_PI":{
      if(!state.pending||state.pending.type!=="fishSteal")return;
      stealFrom(a.pi);
      state.pending=null;
      return;
    }
    case "OPEN_SHOE":{
      if(state.hbScenario!=="fischfang"||state.alterSchuh!==state.current)return;
      state.pending={type:"shoe"};
      return;
    }
    case "CLOSE_SHOE":{
      if(state.pending&&state.pending.type==="shoe"){ state.pending=null; }

    }
    case "SHOE_PASS_PI":{
      if(!state.pending||state.pending.type!=="shoe")return;
      var meS=state.current;
      if(state.alterSchuh!==meS)return;
      if(a.pi===meS)return;
      if(fullVP(a.pi)<fullVP(meS))return;
      // Regel: Weitergabe frühestens im nächsten eigenen Zug – nicht im selben Zug, in dem der Schuh erhalten wurde
      if((state.alterSchuhTurn||0)>=(state.turnCount||0)) return;
      state.alterSchuh=a.pi;
      state.alterSchuhTurn=state.turnCount||0;
      pushLog("log_shoe_pass",{name:meS,to:a.pi});
      state.pending=null;
      return;
    }
  }
}
function advanceTurn(){
  state.current=(state.current+1)%state.players.length;
  state.turnCount=(state.turnCount||0)+1;
  state.turn={rolled:false,dice:null,fleetKind:null,crane:false}; state.uiMode=null; state.pending=null; state.special=null; state.part2=false;
  state.movedShip=false; state.attackedFortress=false;
  for(var kv2 in (state.knights||{})){                 // aktivierte Ritter werden im Folgezug einsatzbereit
    var kk=state.knights[kv2];
    if(kk.owner===state.current&&kk.active) kk.ready=true;
  }
  for(var k in state.ships) state.ships[k].fresh=false;
  // Flüsse: Reset Gold-Umtauschzähler pro Zug
  if(state.hbScenario==="fluesse"){
    state.players.forEach(function(pl){ pl.goldSpendsThisTurn=0; });
  }
  // Ereignisse: Seuche wirkt nur diese Runde
  state.seucheThisTurn=false;
  state.currentEvent=null;
  // Barbarenüberfall: prüfe Sieg über Barbaren nach jedem Zug
  if(isBarb()) checkBarbarianVictory();
  state.barbMoveTried=false;
  state.finaleMoveTried=false;
  // Finale: BP-Reset für nächsten Spieler, Wheat-Boost reset
  if(isFinale()){
    var nextPi=state.current;
    var stage=state.wagenStage[nextPi]||0;
    state.wagenBP[nextPi]=WAGEN_TABLEAU[Math.min(stage,4)].bp;
    state.wagenWheatUsed[nextPi]=false;
  }
  pushLog("log_next",{name:state.current});
}

/* ============================================================ BOT AI ============ */
var PIP_WEIGHT={2:1,3:2,4:3,5:4,6:5,8:5,9:4,10:3,11:2,12:1};
var SKILL={
  easy:  {noise:0.75, trade:false,  devTiming:"immediate", buyDevChance:0.30},
  medium:{noise:0.32, trade:"bank", devTiming:"smart",     buyDevChance:0.55},
  hard:  {noise:0.10, trade:"bank", devTiming:"smart",     buyDevChance:0.75}
};
function botSkill(pi){ return SKILL[state.players[pi]&&state.players[pi].bot]||SKILL.medium; }
function withUiMode(mode,fn){ var saved=state.uiMode; state.uiMode=mode; var r=fn(); state.uiMode=saved; return r; }
function legalSettlementVerts(){ return withUiMode("settlement",legalVertSet); }
function legalCityVerts(){ return withUiMode("city",legalVertSet); }
function legalRoadEdges(){ return withUiMode("road",legalEdgeSet); }
function legalShipEdges(){ return withUiMode("ship",legalEdgeSet); }
function vertexScore(v){
  var score=0, resSeen={};
  state.board.vertices[v].hexes.forEach(function(hi){
    var t=state.tiles[hi];
    if(!t||isWaterRes(t.resource)||t.resource==="desert"||t.resource==="fortress"||t.resource==="village")return;
    var w=PIP_WEIGHT[t.number]||0;
    if(t.resource==="gold")w*=1.3;
    score+=w; resSeen[t.resource]=(resSeen[t.resource]||0)+1;
  });
  score+=Object.keys(resSeen).length*0.6;
  state.harbors.forEach(function(hb){ if(hb.v1===Number(v)||hb.v2===Number(v))score+=(hb.kind==="any"?0.8:1.4); });
  return score;
}
function edgeScore(eid){
  var e=state.board.edges[eid];
  var sc=(vertexScore(e.v1)+vertexScore(e.v2))/2;
  if(state.pathSet&&state.pathSet[eid]&&state.pathSet[eid].owner===activePlayer())sc+=50;
  return sc;
}
function pickBest(map,scoreFn,sk){
  var keys=Object.keys(map); if(!keys.length)return null;
  var best=null,bestScore=-Infinity;
  keys.forEach(function(k){
    var raw=scoreFn(k); var jitter=1+(Math.random()*2-1)*(sk?sk.noise:0.3);
    var sc=raw*jitter;
    if(sc>bestScore){bestScore=sc;best=k;}
  });
  return best;
}
function leaderPi(excludePi){
  var best=-1,bi=null;
  state.players.forEach(function(pl,qi){ if(qi===excludePi)return; var v=fullVP(qi); if(v>best){best=v;bi=qi;} });
  return bi;
}
function missingFor(res,cost){ var m=[]; for(var k in cost){ if(res[k]<cost[k])m.push(k); } return m; }
function planBankTrade(pi){
  var p=state.players[pi], targets=[COSTS.settlement,COSTS.city,COSTS.dev];
  for(var i=0;i<targets.length;i++){
    var need=missingFor(p.res,targets[i]);
    if(need.length===1){
      var want=need[0];
      var give=RES.filter(function(r){return r!==want;}).sort(function(a,b){
        return (p.res[b]-bestRatio(pi,b))-(p.res[a]-bestRatio(pi,a));
      })[0];
      var ratio=bestRatio(pi,give);
      if(p.res[give]>=ratio)return{give:give,get:want};
    }
  }
  return null;
}
function pickNeededResource(pi){
  var p=state.players[pi];
  return ["ore","wheat","sheep","wood","brick"].sort(function(a,b){return p.res[a]-p.res[b];})[0];
}
function shouldPlayKnight(pi){
  if(state.robberHex==null)return false;
  var onMine=state.board.hexes[state.robberHex].vertices.some(function(v){var b=state.buildings[v];return b&&b.owner===pi;});
  return onMine||Math.random()<0.3;
}
function hasConvertibleShip(pi){
  var path=state.pathEdges&&state.pathEdges[pi]; if(!path)return false;
  return path.some(function(e){var sh=state.ships[e]; return sh&&sh.owner===pi&&!sh.war;});
}
function pickDevCardToPlay(pi,sk){
  var p=state.players[pi];
  if(sk.devTiming==="immediate")return p.dev[0]||null;
  if(state.scenario==="piraten"){
    if(p.dev.indexOf("knight")>=0&&hasConvertibleShip(pi))return "knight";
    if(p.dev.indexOf("vp")>=0&&hasConvertibleShip(pi))return "vp";
    if(p.dev.indexOf("road")>=0&&(countRoads(pi)<PIECE.road||countShips(pi)<PIECE.ship))return "road";
    if(p.dev.indexOf("monopoly")>=0&&Math.random()<0.5)return "monopoly";
    if(p.dev.indexOf("plenty")>=0&&Math.random()<0.6)return "plenty";
    return null;
  }
  if(p.dev.indexOf("knight")>=0&&shouldPlayKnight(pi))return "knight";
  if(p.dev.indexOf("road")>=0&&(countRoads(pi)<PIECE.road||countShips(pi)<PIECE.ship))return "road";
  if(p.dev.indexOf("monopoly")>=0&&Math.random()<0.5)return "monopoly";
  if(p.dev.indexOf("plenty")>=0&&Math.random()<0.6)return "plenty";
  return null;
}
function botMoveRobberHex(pi,seaMode){
  var target=leaderPi(pi);
  var cands=state.tiles.map(function(t,hi){return hi;}).filter(function(hi){
    var t=state.tiles[hi]; if(!t)return false;
    var isWater=isWaterRes(t.resource);
    if(seaMode&&(!isWater||hi===state.seaRobberHex))return false;
    if(!seaMode&&(isWater||hi===state.robberHex))return false;
    if(seaMode){
      return hexEdges(hi).some(function(e){var s=state.ships[e];return s&&s.owner!==pi;});
    }
    var hasSelf=state.board.hexes[hi].vertices.some(function(v){var b=state.buildings[v];return b&&b.owner===pi;});
    if(hasSelf) return false;
    // Freundlicher Räuber: Bot respektiert Regel
    if(!seaMode && !robberHexLegal(hi, pi)) return false;
    return true;
  });
  function scoreHex(hi){
    var s=PIP_WEIGHT[state.tiles[hi].number]||0;
    var hitsTarget=seaMode
      ? hexEdges(hi).some(function(e){var sh=state.ships[e];return sh&&sh.owner===target;})
      : state.board.hexes[hi].vertices.some(function(v){var b=state.buildings[v];return b&&b.owner===target;});
    if(hitsTarget)s+=5;
    return s;
  }
  cands.sort(function(a,b){return scoreHex(b)-scoreHex(a);});
  return cands.length?cands[0]:0;
}
function botDiscard(){
  var item=state.pending.queue[state.pending.qi], need=item.count;
  var kinds=isSR()?RES.concat(COMM):RES;
  var sel=freshDiscardSel(), guard=0;
  while(need>0&&guard<2000){
    guard++;
    var order=kinds.slice().sort(function(a,b){
      return (holdOf(item.pi,b)-(sel[b]||0))-(holdOf(item.pi,a)-(sel[a]||0));
    });
    var r=order[0];
    if((sel[r]||0)>=holdOf(item.pi,r))break;
    sel[r]=(sel[r]||0)+1; need--;
  }
  state.ui.discardSel=sel;
  apply({type:"DISCARD_CONFIRM"});
}
function botGold(){
  var gi=state.pending.queue[state.pending.qi], sel=emptyRes(), pick=pickNeededResource(gi.pi);
  sel[pick]=gi.count; state.ui.goldSel=sel;
  apply({type:"GOLD_CONFIRM"});
}
function botSteal(){
  var cands=state.pending.candidates.slice().sort(function(a,b){
    return (totalCards(state.players[b].res)+fullVP(b))-(totalCards(state.players[a].res)+fullVP(a));
  });
  apply({type:"STEAL",from:cands[0]});

function botFishAction(pi){

    apply({type:"OPEN_FISH"});

  }
  // 5🐟: gratis Straße bauen, wenn Straßenoption existiert und wir <5 Straßen frei haben
  if(sum>=5 && countRoads(pi)<PIECE.road){
    var roadCandidates=legalRoadEdges();
    if(roadCandidates.length>0){
      apply({type:"OPEN_FISH"});
      apply({type:"FISH_ACTION",act:"road"});
      // Die Straße wird direkt vom Bot-Loop platziert (uiMode="road") beim nächsten Tick
      return true;
    }
  }
  // 4🐟: Rohstoff nehmen, wenn wir einen brauchen für ein bald-mögliches Bauwerk
  if(sum>=4){
    var need=null;
    // Kandidaten: settlement>city>road
    ["settlement","city","road"].forEach(function(kind){
      if(need)return;
      var cost=COSTS[kind];
      RES.forEach(function(r){
        if(need)return;
        if((cost[r]||0)>p.res[r]) need=r;
      });
    });
    if(need){
      apply({type:"OPEN_FISH"});
      apply({type:"FISH_ACTION",act:"res"});
      // plenty modal: der Bot wird beim nächsten Tick den gewünschten Rohstoff wählen
      return true;
    }
  }
  // 3🐟: Karte stehlen, wenn ein Gegner ≥3 Karten hat
  if(sum>=3){
    var target=state.players.map(function(_,i){return i;}).filter(function(i){return i!==pi && totalCards(state.players[i].res)>=3;});
    if(target.length>0){
      apply({type:"OPEN_FISH"});
      apply({type:"FISH_ACTION",act:"steal"});
      return true;
    }
  }
  // 2🐟: Räuber vom Feld nehmen, wenn er auf einer eigenen produktiven Kachel steht
  if(sum>=2 && state.robberHex!=null && state.robberHex>=0){
    var rh=state.robberHex, mine=state.board.hexes[rh].vertices.some(function(v){var b=state.buildings[v]; return b && b.owner===pi;});

      apply({type:"OPEN_FISH"});
      apply({type:"FISH_ACTION",act:"robber"});
      return true;
    }

}

function botSRAction(pi){

      return progPlayable(pi,c)&&["alchemie","erfindung","diplomatie","intrige","haendler"].indexOf(c)<0;
    });
    if(forced.length){ apply({type:"PLAY_PROG",card:forced[0]}); return true; }
  }

  // 1. Verteidigung: kurz vor der Landung Ritter aktivieren
  var soon=state.barb>=state.barbMax-1;
  if(soon){
    var passive=myKnights(pi).filter(function(v){return !state.knights[v].active;});
    if(passive.length&&canAfford(p.res,COSTS.kact)){ apply({type:"ACTIVATE_KNIGHT",vertexId:passive[0]}); return true; }
  }
  // 2. Ritter aufstellen (höchstens 2 je Stufe, Regel greift in knightBuildable)
  if(canAfford(p.res,COSTS.knight)&&myKnights(pi).length<3){
    var spot=botKnightSpot(pi);
    if(spot!=null&&knightBuildable(spot,pi)){ apply({type:"BUILD_KNIGHT",vertexId:spot}); return true; }
  }
  // 3. Ritter aufwerten, wenn Vorrat da ist
  if(canAfford(p.res,COSTS.kup)&&Math.random()<0.6){
    var up=myKnights(pi).filter(function(v){return knightMayUpgrade(v,pi);});
    if(up.length){ apply({type:"UPGRADE_KNIGHT",vertexId:up[0]}); return true; }
  }
  // 4. Stadtausbau: Bereich mit den meisten passenden Handelswaren zuerst
  var areas=AREAS.slice().sort(function(a,b){
    return (p.comm[AREA_META[b].comm]||0)-(p.comm[AREA_META[a].comm]||0);
  });
  for(var i=0;i<areas.length;i++){
    if(canImprove(pi,areas[i])){ apply({type:"BUILD_IMPROVEMENT",area:areas[i]}); return true; }
  }
  // 5. Stadtmauer als Schutz vor dem Räuber
  if(canAfford(p.res,COSTS.wall)&&(p.walls||0)<3&&freeWallCity(pi)!=null&&Math.random()<0.5){
    apply({type:"BUILD_WALL"}); return true;
  }
  // 6. Fortschrittskarten spielen, die ohne weitere Auswahl auskommen
  var playable={bergbau:1,bewaesserung:1,motivation:1,strassenbau:1,ingenieurwesen:1,schmiedekunst:1,
                sabotage:1,hochzeit:1,abgaben:1,spionage:1,verrat:1,rohstoffmonopol:1,warenmonopol:1,medizin:1,
                baukran:1,handelsflotte:1,handelshafen:1,steuern:1,haendler:1,erfindung:1,diplomatie:1,intrige:1};
  var hand=(p.prog||[]).filter(function(c){return playable[c];});
  if(hand.length&&Math.random()<0.7){
    var pick=hand[Math.floor(Math.random()*hand.length)];
    if(pick&&!progPlayable(pi,pick))pick=null;
    if(pick==="steuern"&&!state.barbLanded)pick=null;
    if(pick==="baukran"&&!AREAS.some(function(ar){return canImprove(pi,ar);}))pick=null;
    if(pick==="haendler"&&state.merchant&&state.merchant.owner===pi)pick=null;
    if(pick){ apply({type:"PLAY_PROG",card:pick}); return true; }
  }
  // 6b. Ritteraktionen mit einsatzbereiten Rittern
  var ready=readyKnights(pi);
  if(ready.length){
    // Räuber vertreiben, wenn er auf einem eigenen Feld sitzt
    var chase=Object.keys(knightChaseVerts(pi)).map(Number);
    if(state.barbLanded&&chase.length&&state.robberHex!=null){
      var hurts=state.board.hexes[state.robberHex].vertices.some(function(v){
        var b=state.buildings[v]; return b&&b.owner===pi;

    // Schwächeren fremden Ritter vertreiben

      case "progmono":{
        var kindsM=(state.pending.kind==="comm")?COMM:RES;
        var bestM=kindsM[0],cntM=-1;
        kindsM.forEach(function(r){
          var tot=0; state.players.forEach(function(q,qi){ if(qi!==pi) tot+=holdOf(qi,r); });
          if(tot>cntM){cntM=tot;bestM=r;}
        });
        apply({type:"PROG_MONO",res:bestM}); return;
      }
      case "spyPick":{
        var tS=state.pending.targets;
        tS.sort(function(x,y){return state.players[y].prog.length-state.players[x].prog.length;});
        apply({type:"SPY_PICK",pi:tS[0]}); return;
      }
      case "spyCard":{
        var sp2=state.players[state.pending.target];
        apply({type:"SPY_TAKE",card:sp2.prog[Math.floor(Math.random()*sp2.prog.length)]}); return;
      }
      case "levyPick":{
        var tL=state.pending.targets.slice();
        tL.sort(function(x,y){return handPool(y).length-handPool(x).length;});
        apply({type:"LEVY_PICK",pi:tL[0]}); return;
      }
      case "levyCards":{
        var tgL=state.pending.target;
        var kindsL=tradeKinds().filter(function(r){return holdOf(tgL,r)>0;});
        if(!kindsL.length){ state.pending=null; return; }
        apply({type:"LEVY_TAKE",res:kindsL[Math.floor(Math.random()*kindsL.length)]}); return;
      }
      case "betrayPick":{
        var tB=state.pending.targets.slice();
        tB.sort(function(x,y){
          var mx=Math.max.apply(null,myKnights(x).map(function(v){return state.knights[v].level;}).concat([0]));
          var my=Math.max.apply(null,myKnights(y).map(function(v){return state.knights[v].level;}).concat([0]));
          return my-mx;
        });
        apply({type:"BETRAY_PICK",pi:tB[0]}); return;
      }
      case "betrayKnight":{
        var vicB2=state.pending.victim, ks=myKnights(vicB2);
        ks.sort(function(x,y){return state.knights[x].level-state.knights[y].level;});   // schwächsten Ritter opfern
        if(ks.length) apply({type:"BETRAY_REMOVE",vertexId:ks[0]});
        else { state.pending=null; state.uiMode=null; }
        return;
      }
      case "barbCommit":{
        var meB=state.pending.queue[state.pending.idx];
        apply({type:"BARB_COMMIT",count:activeKnights(meB).length});   // Bots setzen alle aktiven Ritter ein
        return;
      }
      case "alchemy":{
        apply({type:"ALCHEMY_PICK",value:1+Math.floor(Math.random()*6)});
        apply({type:"ALCHEMY_PICK",value:1+Math.floor(Math.random()*6)});
        return;
      }
      case "progfleet":{
        var kindsF=tradeKinds(), bestF=kindsF[0], cntF=-1;
        kindsF.forEach(function(r){ var v2=holdOf(pi,r); if(v2>cntF){cntF=v2;bestF=r;} });
        apply({type:"PROG_FLEET",res:bestF}); return;
      }
      case "robber": case "searobber": break; // fall through to the uiMode robber-move handling below
      default: return;
    }
  }
  if(state.uiMode==="swapchip"){                          // Erfindung: schlechten gegen guten Chip tauschen
    var sw=Object.keys(swappableHexes()).map(Number);
    function chipValue(hi){ var nn=state.tiles[hi].number; return nn==null?0:6-Math.abs(7-nn); }
    var mineSw=sw.filter(function(hi){
      return state.board.hexes[hi].vertices.some(function(v){var b=state.buildings[v];return b&&b.owner===pi;});
    });
    var otherSw=sw.filter(function(hi){return mineSw.indexOf(hi)<0;});
    mineSw.sort(function(x,y){return chipValue(x)-chipValue(y);});      // eigenes schwächstes Feld
    otherSw.sort(function(x,y){return chipValue(y)-chipValue(x);});     // fremdes stärkstes Feld
    if(mineSw.length&&otherSw.length){
      apply({type:"SWAP_CHIP",hexId:mineSw[0]}); apply({type:"SWAP_CHIP",hexId:otherSw[0]}); return;
    }
    state.ui.swapFirst=null; state.uiMode=null; return;
  }
  if(state.uiMode==="diplomacy"){                         // Diplomatie: fremde offene Straße entfernen
    var op=openRoadEdges(), foreign=Object.keys(op).filter(function(e){return op[e]!==pi;});
    if(foreign.length){ apply({type:"DIPLOMACY_REMOVE",edgeId:Number(foreign[0])}); return; }
    state.uiMode=null; return;
  }
  if(state.uiMode==="intrigue"){                          // Intrige: stärksten erreichbaren Ritter vertreiben
    var it=Object.keys(intrigueTargets(pi)).map(Number);
    it.sort(function(x,y){return state.knights[y].level-state.knights[x].level;});
    if(it.length){ apply({type:"INTRIGUE_DISPLACE",vertexId:it[0]}); return; }
    state.uiMode=null; return;
  }
  if(state.uiMode==="merchant"){                         // Händlerkarte: Feld neben eigener Siedlung
    var hx=null;
    state.tiles.forEach(function(t,hi){
      if(hx!=null||RES.indexOf(t.resource)<0)return;
      var mine=state.board.hexes[hi].vertices.some(function(v){var b=state.buildings[v];return b&&b.owner===pi&&!b.captured;});
      if(mine)hx=hi;
    });
    if(hx!=null){ apply({type:"PLACE_MERCHANT",hexId:hx}); return; }
    state.uiMode=null; return;
  }
  if(state.freeCity&&state.uiMode==="city"){             // Medizin: Siedlung zur Stadt machen
    var fv=Object.keys(state.buildings).find(function(v){
      var b=state.buildings[v]; return b&&b.owner===pi&&b.type==="settlement"&&!b.captured;
    });
    if(fv!=null){ apply({type:"BUILD_CITY",vertexId:Number(fv)}); return; }
    state.freeCity=false; state.uiMode=null; return;
  }
  if(state.uiMode==="moveRobber"){ apply({type:"MOVE_ROBBER",hexId:botMoveRobberHex(pi,false)}); return; }
  if(state.uiMode==="moveSeaRobber"){ apply({type:"MOVE_SEA_ROBBER",hexId:botMoveRobberHex(pi,true)}); return; }
  if(state.special){ botSpecialAction(pi); return; }
  botTurnAction(pi);
}

  if(botTimer)return;
  var pi=nextActorPi();
  if(pi==null||!isBot(pi))return;
  botTimer=setTimeout(function(){ botTimer=null; botStep(); render(); },BOT_DELAY);
}

/* ---- board ---- */
function touchesLand(v){
  return state.board.vertices[v].hexes.some(function(hi){ return !isWaterRes(state.tiles[hi].resource); });
}
function onMainIsland(v){
  return state.board.vertices[v].hexes.some(function(hi){ return state.tiles[hi].resource!=="sea" && state.tiles[hi].resource!=="fog" && (!state.islandOf||state.islandOf[hi]==null); });
}
function onHomeSide(v){ // found only on the home island
  if(state.homeHexes) return state.board.vertices[v].hexes.some(function(hi){ return state.homeHexes[hi]; });
  return state.board.vertices[v].hexes.some(function(hi){
    var r=state.tiles[hi].resource;
    return !isWaterRes(r)&&r!=="desert"&&!(state.farHexes&&state.farHexes[hi]);
  });
}
function legalVertSet(){
  var out={}, me=activePlayer(), mode=state.uiMode, setup=state.setup, board=state.board;
  if(state.phase==="setup"&&setup&&setup.placing==="settlement"){
    var setupPl=setup.order[setup.idx];
    // Ozeanien-Regel: Wenn der Spieler seine 1. Siedlung bereits auf einer der
    // beiden Startinseln gesetzt hat, MUSS die 2. Siedlung auf der anderen liegen.
    // homeIsland[hi] enthält 0 oder 1 pro Home-Hex; forbidIsland ist die Insel
    // der schon platzierten Siedlung.
    var forbidIsland=-1;
    if(state.scenario==="ozeanien"&&state.homeIsland){
      for(var _bid in state.buildings){
        if(state.buildings[_bid].owner!==setupPl)continue;
        board.vertices[_bid].hexes.forEach(function(hi){
          if(state.homeIsland[hi]!=null) forbidIsland=state.homeIsland[hi];
        });
        break;
      }
    }
    board.vertices.forEach(function(v){
      if(!settlementLegal(v.id,setupPl,state.buildings,state.roads,board,true))return;
      if(state.mode==="sea"){
        if(!touchesLand(v.id))return;                 // no founding in open water/fog
        if(state.scenario&&SCEN[state.scenario]&&SCEN[state.scenario].founding==="main"&&!onMainIsland(v.id))return;
        if(state.scenario&&SCEN[state.scenario]&&SCEN[state.scenario].founding==="home"&&!onHomeSide(v.id))return;
        if(forbidIsland!==-1){
          var vIsland=-1;
          board.vertices[v.id].hexes.forEach(function(hi){
            if(state.homeIsland[hi]!=null) vIsland=state.homeIsland[hi];
          });
          if(vIsland===forbidIsland)return;
        }
        if(state.wonderTaboo&&state.wonderTaboo[v.id])return;
      }
      out[v.id]=1;
    });
  }else if(mode==="kmove"||mode==="kdisp"){
    if(state.ui.ksel==null) readyKnights(me).forEach(function(v){ out[v]=1; });
    else if(mode==="kmove"){ var mt=knightMoveTargets(me); for(var tv in mt) out[tv]=1; }
    else { var dt=knightDisplaceTargets(me,state.ui.ksel); for(var dv in dt) out[dv]=1; }
  }else if(mode==="betrayremove"){
    var vicB=state.pending&&state.pending.victim;
    if(vicB!=null) myKnights(vicB).forEach(function(v){ out[v]=1; });
  }else if(mode==="intrigue"){
    var it=intrigueTargets(me); for(var iv in it) out[iv]=1;
  }else if(mode==="kchase"){
    var cv=knightChaseVerts(me); for(var c2 in cv) out[c2]=1;
  }else if(mode==="knight"){
    board.vertices.forEach(function(v){ if(knightBuildable(v.id,me)) out[v.id]=1; });
  }else if(mode==="kact"){
    board.vertices.forEach(function(v){ var k=knightAt(v.id); if(k&&k.owner===me&&!k.active) out[v.id]=1; });
  }else if(mode==="kup"){
    board.vertices.forEach(function(v){ if(knightMayUpgrade(v.id,me)) out[v.id]=1; });
  }else if(mode==="trosswagenMove"){
    if(isFinale() && state.trosswagen[me]){
      var tw=state.trosswagen[me];
      if(tw && tw.atVertex!=null){
        state.board.vertices[tw.atVertex].edges.forEach(function(oe){
          var e=state.board.edges[oe];
          var otherV=e.v1===tw.atVertex?e.v2:e.v1;
          var cost=trosswagenMoveCost(oe,me);
          if(cost==null) return;
          if(cost>(state.wagenBP[me]||0)) return;
          out[otherV]=1;
        });
      }
    }
  }else if(mode==="settlement"&&countType(me,"settlement")<PIECE.settlement){
    board.vertices.forEach(function(v){
      if(!settlementLegal(v.id,me,state.buildings,state.roads,board,false))return;
      if(state.mode==="sea"&&!touchesLand(v.id))return; // new settlements must reach land
      out[v.id]=1;
    });
  }else if(mode==="city"&&countType(me,"city")<PIECE.city){
    for(var k in state.buildings){var b=state.buildings[k];if(b.owner===me&&b.type==="settlement"&&!b.captured)out[k]=1;}
  }else if(mode==="city"){
    // Städtevorrat erschöpft: nur eine umgedrehte Stadt darf zurückgewandelt werden
    for(var k2 in state.buildings){var b2=state.buildings[k2];if(b2.owner===me&&b2.type==="settlement"&&b2.downgraded&&!b2.captured)out[k2]=1;}
  }
  return out;
}
function legalEdgeSet(){
  var out={}, me=activePlayer(), mode=state.uiMode, setup=state.setup, board=state.board;
  if(mode==="diplomacy"){ var op=openRoadEdges(); for(var oe in op) out[oe]="diplo"; return out; }
  if(state.phase==="setup"&&setup&&setup.placing==="road"){
    var who=setup.order[setup.idx], rv=setup.lastSettlement;
    board.edges.forEach(function(e){
      if(countRoads(who)<PIECE.road&&roadLegal(e.id,who,state.buildings,state.roads,board,rv))out[e.id]="road";
      else if(state.mode==="sea"&&countShips(who)<PIECE.ship&&shipLegal(e.id,who,rv))out[e.id]="ship";
    });
  }else if(mode==="road"){
    if(countRoads(me)<PIECE.road)board.edges.forEach(function(e){if(roadLegal(e.id,me,state.buildings,state.roads,board))out[e.id]="road";});
    if(state.pending&&state.pending.type==="roadbuilding"&&state.mode==="sea"&&countShips(me)<PIECE.ship)
      board.edges.forEach(function(e){if(shipLegal(e.id,me))out[e.id]="ship";});
  }else if(mode==="ship"){
    if(countShips(me)<PIECE.ship)board.edges.forEach(function(e){if(shipLegal(e.id,me))out[e.id]="ship";});
  }else if(mode==="bridge"){
    if((state.players[me].bridges||0)>0 && state.hbScenario==="fluesse"){
      board.edges.forEach(function(e){
        if(!isBridgeEdge(e.id))return;
        if(state.bridges&&state.bridges[e.id])return;
        // muss anschließen an eigene Straße/Siedlung/Brücke
        var connects=[e.v1,e.v2].some(function(w){
          var bo=state.buildings[w];
          if(bo&&bo.owner===me) return true;
          return board.vertices[w].edges.some(function(oe){
            return (state.roads[oe]&&state.roads[oe].owner===me) || (state.bridges&&state.bridges[oe]&&state.bridges[oe].owner===me);
          });
        });
        if(connects) out[e.id]="bridge";
      });
    }
  }else if(mode==="repairRoad"){
    if(state.events && canAfford(state.players[me].res,{wood:1,brick:1})){
      Object.keys(state.brokenRoads||{}).forEach(function(eid){
        if(state.roads[eid]&&state.roads[eid].owner===me) out[eid]="repair";
      });
    }
  }else if(mode==="placeBarbKnight"){
    if(isBarb() && (state.barbKnightsLeft[me]||0)>0){
      var which=(state.pending&&state.pending.which)||"stark";
      board.edges.forEach(function(e){
        if(state.barbKnights[e.id]) return;
        if(state.ships&&state.ships[e.id]) return;
        if(which==="ritterweihe"){
          if(!isBurgEdge(e.id)) return;
        } else {
          var isLandE=e.hexes.some(function(hi){ return hi<state.tiles.length && state.tiles[hi] && !isWaterRes(state.tiles[hi].resource) && !isCapturedHex(hi); });
          if(!isLandE) return;
          if(isBurgEdge(e.id)) return; // Starker Ritter darf nicht direkt aufs Burgfeld
        }
        out[e.id]="barbknightplace";
      });
    }
  }else if(mode==="barbMoveKnight"){
    if(!state.barbMove || state.barbMove.from==null){
      // Erste Phase: eigene Ritter zeigen
      Object.keys(state.barbKnights||{}).forEach(function(eid){
        if(state.barbKnights[eid].owner===me) out[eid]="barbknightpick";
      });
    } else {
      // Zweite Phase: erreichbare Zielkanten
      var fromE=state.barbMove.from, budget=state.barbMove.budget||3;
      board.edges.forEach(function(e){
        if(state.barbKnights[e.id]) return;
        if(state.ships&&state.ships[e.id]) return;
        if(isBurgEdge(e.id)) return;
        var isLandM=e.hexes.some(function(hi){ return hi<state.tiles.length && state.tiles[hi] && !isWaterRes(state.tiles[hi].resource) && !isCapturedHex(hi); });
        if(!isLandM) return;
        var d=barbKnightMoveDistance(fromE, e.id, me);
        if(d==null || d===0 || d>budget) return;
        out[e.id]="barbknightto";
      });
    }
  }else if(mode==="moveShipFrom"){
    for(var mk in state.ships){ if(shipMovable(Number(mk),me)) out[mk]="movefrom"; }
  }else if(mode==="moveShipTo"){
    var tg=shipMoveTargets(me,state.ui.moveShipFrom); for(var tk in tg) out[tk]=tg[tk];
  }
  return out;
}

  state.harbors.forEach(function(hb){
    var mx=hb.x+hb.dx*26, my=hb.y+hb.dy*26, va=board.vertices[hb.v1], vb3=board.vertices[hb.v2];

    s+='<line x1="'+vb3.x+'" y1="'+vb3.y+'" x2="'+mx+'" y2="'+my+'" stroke="#cdb98a" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.8"/>';

      s+='<text x="'+mx+'" y="'+(my+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#f3ecda">3:1</text>';

      s+='<text x="'+mx+'" y="'+(my-2)+'" text-anchor="middle" font-size="11">'+RES_META[hb.kind].icon+'</text>';

  // ships
