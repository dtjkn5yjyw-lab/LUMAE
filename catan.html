  if(state.robberHex!=null&&state.robberHex>=0){
    var rh=board.hexes[state.robberHex], ry=rh.y-SIZE*0.42+2;
    s+='<g pointer-events="none">'+
       '<circle cx="'+rh.x+'" cy="'+ry+'" r="17" fill="rgba(16,8,4,.82)" stroke="#f3ecda" stroke-width="1.8"/>'+
       '<text x="'+rh.x+'" y="'+(ry+8)+'" text-anchor="middle" font-size="22">🥷</text></g>';
  }
  if(state.seaRobberHex!=null&&state.seaRobberHex>=0){
    var srh=board.hexes[state.seaRobberHex];
    s+='<g transform="translate('+srh.x+','+srh.y+')" pointer-events="none">'+
       '<circle cx="0" cy="0" r="12" fill="#10314a" stroke="#cfe0ea" stroke-width="1.5"/>'+
       '<line x1="0" y1="-2" x2="0" y2="-12" stroke="#cfe0ea" stroke-width="1.5"/>'+
       '<path d="M0,-12 L8,-9 L0,-6 Z" fill="#111"/>'+
       '<text x="0" y="4" text-anchor="middle" font-size="10" fill="#cfe0ea">☠</text></g>';
  }
  if(state.scenario==="piraten"&&state.pirateRoute&&state.pirateRoute.length){
    var pfh=board.hexes[state.pirateRoute[state.pirateIdx]];
    s+='<g transform="translate('+pfh.x+','+pfh.y+')" pointer-events="none">'+
       '<circle cx="0" cy="0" r="15" fill="#1a1a1a" stroke="#e8c15a" stroke-width="1.5"/>'+
       '<text x="0" y="6" text-anchor="middle" font-size="17">🏴‍☠️</text></g>';
  }

  for(var rid in state.roads){
    var e=board.edges[rid], va=board.vertices[e.v1], vb2=board.vertices[e.v2];
    var isBroken = state.brokenRoads && state.brokenRoads[rid];
    if(isBroken){
      // Beschädigte Straße: quer (senkrecht zur Kante) mit rötlichem Ton
      var mx=(va.x+vb2.x)/2, my=(va.y+vb2.y)/2;
      var dx=vb2.x-va.x, dy=vb2.y-va.y, L=Math.hypot(dx,dy)||1;
      var nx=-dy/L*10, ny=dx/L*10; // Normalenvektor mal halbe Straßenlänge
      var col=PCOL[state.roads[rid].owner].main;
      s+='<line x1="'+(mx-nx)+'" y1="'+(my-ny)+'" x2="'+(mx+nx)+'" y2="'+(my+ny)+'" stroke="'+col+'" stroke-width="6" stroke-linecap="round" opacity="0.75"/>';
      // Kleines Reparatur-Symbol
      s+='<text x="'+mx+'" y="'+(my+3)+'" text-anchor="middle" font-size="10" fill="#a00">🛠</text>';
    } else {
      s+='<line x1="'+va.x+'" y1="'+va.y+'" x2="'+vb2.x+'" y2="'+vb2.y+'" stroke="'+PCOL[state.roads[rid].owner].main+'" stroke-width="9" stroke-linecap="round"/>';
    }
  }
  for(var eid in le){
    var e2=board.edges[eid], k2=le[eid];
    var ecol = k2==="movefrom" ? "#ffcf87" : (k2==="ship"||k2==="moveto") ? "#bfe3f5" : "#fff7d6";
    s+='<line data-edge="'+eid+'" x1="'+board.vertices[e2.v1].x+'" y1="'+board.vertices[e2.v1].y+'" x2="'+board.vertices[e2.v2].x+'" y2="'+board.vertices[e2.v2].y+'" stroke="'+ecol+'" stroke-width="9" stroke-linecap="round" opacity="0.6" style="cursor:pointer">'+
       '<animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.4s" repeatCount="indefinite"/></line>';
  }

  // Städte & Ritter: Stadtmauern unter den Städten
  var _walls=state.walls||{}, _knights=state.knights||{};
  for(var wv in _walls){
    var wvt=board.vertices[wv], wcol=PCOL[_walls[wv]];
    s+='<rect x="'+(wvt.x-13)+'" y="'+(wvt.y+6)+'" width="26" height="6" rx="2" fill="'+wcol.dark+'" stroke="#f3ecda" stroke-width="1"/>';
  }
  // Städte & Ritter: Ritterfiguren auf den Kreuzungen
  for(var kv in _knights){
    var k=_knights[kv], kvt=board.vertices[kv], kc=PCOL[k.owner];
    var ksel=(state.ui&&state.ui.ksel===Number(kv));
    var kr=ksel?12:10;
    s+='<circle cx="'+kvt.x+'" cy="'+kvt.y+'" r="'+kr+'" fill="'+kc.main+'" stroke="'+(ksel?"#fff":(k.active?"#ffd98a":"#2b1b12"))+'" stroke-width="'+(ksel?3:(k.active?2.4:1.4))+'"/>';
    var kimg=KNIGHT_IMG[KNIGHT_COLOR_KEYS[k.owner]];
    if(kimg){
      var kis=kr*1.8, kclipId="kc_"+kv;
      s+='<clipPath id="'+kclipId+'"><circle cx="'+kvt.x+'" cy="'+kvt.y+'" r="'+(kr-0.8)+'"/></clipPath>';
      s+='<image href="'+kimg+'" x="'+(kvt.x-kis/2)+'" y="'+(kvt.y-kis/2)+'" width="'+kis+'" height="'+kis+'" pointer-events="none" preserveAspectRatio="xMidYMid slice" clip-path="url(#'+kclipId+')"/>';
    }else{
      s+='<text x="'+kvt.x+'" y="'+(kvt.y+4)+'" text-anchor="middle" font-size="12" pointer-events="none">⚔️</text>';
    }
    s+='<circle cx="'+(kvt.x+kr-1)+'" cy="'+(kvt.y+kr-1)+'" r="6.5" fill="'+kc.dark+'" stroke="#f3ecda" stroke-width="1"/>';
    s+='<text x="'+(kvt.x+kr-1)+'" y="'+(kvt.y+kr+1.8)+'" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" pointer-events="none">'+k.level+'</text>';
    if(k.active&&!k.ready) s+='<circle cx="'+(kvt.x+kr-2)+'" cy="'+(kvt.y-kr+2)+'" r="3" fill="#f3ecda" opacity=".8"/>';
  }

  if(state.merchant&&state.merchant.hex!=null){
    var mh=board.hexes[state.merchant.hex];
    s+='<circle cx="'+(mh.x+SIZE*0.5)+'" cy="'+(mh.y-SIZE*0.5)+'" r="12" fill="rgba(20,10,8,.55)" stroke="'+PCOL[state.merchant.owner].main+'" stroke-width="2"/>';
    s+='<text x="'+(mh.x+SIZE*0.5)+'" y="'+(mh.y-SIZE*0.5+5)+'" text-anchor="middle" font-size="14">🧭</text>';
  }
  // Städte & Ritter: Metropolenaufsätze
  if(state.metroVertex){
    AREAS.forEach(function(ar){
      var mv=state.metroVertex[ar]; if(mv==null)return;
      var mvt=board.vertices[mv], mo=state.metro[ar];
      if(!mvt||mo==null)return;
      s+='<text x="'+mvt.x+'" y="'+(mvt.y-13)+'" text-anchor="middle" font-size="13">🏰</text>';
    });
  }
  for(var bid in state.buildings){
    var b=state.buildings[bid], v=board.vertices[bid], col=PCOL[b.owner];
    if(b.type==="settlement"&&b.downgraded){
      s+='<text x="'+vt.x+'" y="'+(vt.y-12)+'" text-anchor="middle" font-size="10" opacity=".85">↺</text>';
    }
    if(b.type==="city"){
      // Klassische Catan-Stadt: Haupthaus mit angebautem hohen Turm links.
      // Zwei separate Pfade in Spielerfarbe; überlappen sich, sodass eine markante
      // Silhouette entsteht (breite Basis, hoher Turm mit Spitzdach).
      var mainD="M "+(v.x-10)+" "+(v.y+8)+
                " L "+(v.x-10)+" "+(v.y-1)+
                " L "+v.x+" "+(v.y-7)+
                " L "+(v.x+10)+" "+(v.y-1)+
                " L "+(v.x+10)+" "+(v.y+8)+" Z";
      var towerD="M "+(v.x-11)+" "+(v.y+8)+
                 " L "+(v.x-11)+" "+(v.y-5)+
                 " L "+(v.x-7)+" "+(v.y-10)+
                 " L "+(v.x-3)+" "+(v.y-5)+
                 " L "+(v.x-3)+" "+(v.y+8)+" Z";
      s+='<g pointer-events="none">'+
         '<path d="'+mainD+'" fill="'+col.main+'" stroke="'+col.dark+'" stroke-width="1.8" stroke-linejoin="round"/>'+
         '<path d="'+towerD+'" fill="'+col.main+'" stroke="'+col.dark+'" stroke-width="1.8" stroke-linejoin="round"/>'+
         '</g>';
    }else{
      // Siedlung: einfaches Haus mit Spitzdach (Original beibehalten)
      var sz=9;
      var d="M "+(v.x-sz)+" "+(v.y+sz)+" L "+(v.x-sz)+" "+(v.y-sz*0.25)+" L "+v.x+" "+(v.y-sz)+" L "+(v.x+sz)+" "+(v.y-sz*0.25)+" L "+(v.x+sz)+" "+(v.y+sz)+" Z";
      s+='<g pointer-events="none"><path d="'+d+'" fill="'+col.main+'" stroke="'+col.dark+'" stroke-width="2" stroke-linejoin="round"/></g>';
    }
  }
  if(state.fortresses){
    for(var fpi in state.fortresses){
      var ff=state.fortresses[fpi], fv=board.vertices[ff.vertexId];
      s+='<g pointer-events="none"><circle cx="'+(fv.x+16)+'" cy="'+(fv.y-16)+'" r="11" fill="rgba(20,10,8,.8)" stroke="#f0e0c8" stroke-width="1.1"/>'+
         '<text x="'+(fv.x+16)+'" y="'+(fv.y-12)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">'+(ff.chips>0?ff.chips:"✓")+'</text></g>';
    }
  }
  if(state.wonders){
    var wMarks=[["wallChips","🧱"],["bridgeChips","🌉"],["lighthouseChips","💡"]];
    wMarks.forEach(function(pair){
      (state.wonders[pair[0]]||[]).forEach(function(v){
        var vv2=board.vertices[v]; if(!vv2)return;
        s+='<g pointer-events="none"><circle cx="'+vv2.x+'" cy="'+(vv2.y-14)+'" r="9" fill="rgba(20,10,8,.65)" stroke="#f0e0c8" stroke-width="1"/>'+
           '<text x="'+vv2.x+'" y="'+(vv2.y-10)+'" text-anchor="middle" font-size="10">'+pair[1]+'</text></g>';
      });
    });
  }
  for(var vid in lv){
    var vv=board.vertices[vid];
    s+='<circle data-vert="'+vid+'" cx="'+vv.x+'" cy="'+vv.y+'" r="9" fill="#fff7d6" stroke="#caa33a" stroke-width="2" opacity="0.85" style="cursor:pointer">'+
       '<animate attributeName="r" values="7;10;7" dur="1.3s" repeatCount="indefinite"/></circle>';
  }
  s+='</svg>';
  return s;
}

  var fr=state.firstRoll, roller=fr.active[fr.idx], c=PCOL[roller];

    var r=fr.rolls[pl], done=!!r, cc=PCOL[pl];

      '<span class="frname"><span class="dot" style="background:'+cc.main+'"></span>'+esc(colorName(pl))+'</span>'+
      '<span class="frval">'+(done?('🎲 '+(r[0]+r[1])+' <span class="frd">('+r[0]+'+'+r[1]+')</span>'):'—')+'</span></div>';
  }).join("");
  var body='<div class="panel"><div class="phead" style="background:'+c.main+';color:'+c.text+'">'+
      '<span class="who"><span class="miniwhite"></span>'+esc(tr("phase_firstroll"))+'</span></div>'+

      (fr.tie?'<div class="hint gold">'+esc(tr("first_tie"))+'</div>':'<div class="hint">'+esc(tr("first_hint"))+'</div>')+

    srSection=renderBarbTrack()+'<div style="margin-bottom:12px">'+

  function bb(label,cost,mode,enabled,act){

  }else if(state.uiMode==="moveShipFrom"){

  }else if(state.uiMode==="moveShipTo"){

  }else if(isBot(me)){
    actions='<div class="actions"><div class="hint gold">'+esc(tr("bot_thinking",{name:colorName(me)}))+'</div></div>';
  }else{
    var rb=(state.pending&&state.pending.type==="roadbuilding")?'<div class="hint gold">'+esc(tr("rb_hint"))+' ('+state.pending.left+')</div>':'';
    var rollRow= !rolled
      ? '<button class="btn-roll" data-act="roll" '+(canAct?"":"disabled")+'>'+esc(tr("roll"))+'</button>'
      : renderDice(state.turn.dice);
    var buildGrid='<div class="grid2">'+
      bb(tr("b_road"),COSTS.road,"road",canBuild&&canAfford(p.res,COSTS.road)&&roadsLeft>0)+
      (sea?bb(tr("b_ship"),COSTS.ship,"ship",canBuild&&canAfford(p.res,COSTS.ship)&&shipsLeft>0):"")+
      bb(tr("b_settlement"),COSTS.settlement,"settlement",canBuild&&canAfford(p.res,COSTS.settlement)&&settLeft>0)+

      bb(tr("b_dev"),COSTS.dev,"dev",canBuild&&canAfford(p.res,COSTS.dev)&&state.devDeck.length>0,"buydev")+

        bb(tr("b_wall"),COSTS.wall,"wall",canBuild&&canAfford(p.res,COSTS.wall)&&(p.walls||0)<3&&countType(me,"city")>(p.walls||0),"buildwall")+
        bb(tr("b_knight"),COSTS.knight,"knight",canBuild&&canAfford(p.res,COSTS.knight)&&knightCount(me,1)<2)+
        bb(tr("b_kact"),COSTS.kact,"kact",canBuild&&canAfford(p.res,COSTS.kact)&&myKnights(me).some(function(v){return !state.knights[v].active;}))+
        bb(tr("b_kup"),COSTS.kup,"kup",canBuild&&canAfford(p.res,COSTS.kup)&&myKnights(me).some(function(v){return knightMayUpgrade(v,me);}))+
        bb(tr("b_kmove"),{},"kmove",canBuild&&readyKnights(me).length>0)+

    var moveShipBtn=sea?('<button class="btn-trade" data-act="startmoveship" '+((canBuild&&!state.movedShip&&hasMovableShip(me))?"":"disabled")+'>'+esc(tr("moveship_btn"))+'</button>'):'';
    var atkBtn=(state.scenario==="piraten"&&canAttackFortress(me))?('<button class="btn-trade" data-act="attackfortress" style="background:#7c241d;color:#fff">'+esc(tr("attack_fortress"))+' ('+countWarShips(me)+'⚔)</button>'):'';
    var fishBtn="";
    if(state.hbScenario==="fischfang" && fishSum(p)>=2){
      fishBtn='<button class="btn-trade" data-act="openfish" '+(canAct?"":"disabled")+' style="background:#3f7a99;color:#fff">'+esc(tr("fish_btn"))+' ('+fishTileCount(p)+'× 🐟'+fishSum(p)+')</button>';
    }
    var shoeBtn="";
    if(state.hbScenario==="fischfang" && state.alterSchuh===me && canAct){
      // Weitergabe erlaubt: an jemand mit ≥ eigenen Siegpunkten und frühestens im nächsten eigenen Zug
      var myVP=fullVP(me);
      var eligible=state.players.some(function(_,qi){ return qi!==me && fullVP(qi)>=myVP; });
      var readyToPass=((state.alterSchuhTurn||0)<(state.turnCount||0));
      if(eligible && readyToPass) shoeBtn='<button class="btn-trade" data-act="openshoe" style="background:#7a5a2e;color:#fff">'+esc(tr("shoe_btn"))+'</button>';
    }
    var bridgeBtn="";
    if(state.hbScenario==="fluesse" && canBuild && (p.bridges||0)>0 && canAfford(p.res,bridgeCost())){
      var bridgeActive=(state.uiMode==="bridge");
      bridgeBtn='<button class="btn-trade" data-act="setmode" data-mode="bridge" style="background:'+(bridgeActive?"#4f8fa9":"#3f7a99")+';color:#fff">🌉 '+esc(tr("build_bridge"))+' ('+(p.bridges||0)+' × '+esc(tr("build_bridge_hint")).split(" ")[0]+') 2🧱+1🪵</button>';
    }
    var goldTradeBtn="";
    if(state.hbScenario==="fluesse" && canAct && (p.gold||0)>=2 && (p.goldSpendsThisTurn||0)<2){
      goldTradeBtn='<button class="btn-trade" data-act="opengoldtrade" style="background:#b8860b;color:#fff">'+esc(tr("gold_trade_btn"))+' ('+(p.gold||0)+' 💰)</button>';
    }
    var repairBtn="";
    if(state.events && canAct){
      var rr=repairableRoads(me);
      if(rr.length>0 && canAfford(p.res,{wood:1,brick:1})){
        var repairActive=(state.uiMode==="repairRoad");
        repairBtn='<button class="btn-trade" data-act="setmode" data-mode="repairRoad" style="background:'+(repairActive?"#a05050":"#803030")+';color:#fff">🛠 '+esc(tr("br_repair"))+' ('+rr.length+')</button>';
      }
    }
    var barbBtn="";
    if(isBarb() && canAct){
      var hasKnights=Object.keys(state.barbKnights||{}).some(function(eid){return state.barbKnights[eid].owner===me;});
      if(hasKnights){
        var barbActive=(state.uiMode==="barbMoveKnight");
        if(barbActive){
          var canPay=(p.res.wheat||0)>0;
          barbBtn='<button class="btn-trade" data-act="endbarbmove" style="background:#5a3d20;color:#fff">'+esc(tr("barb_end_move"))+'</button>'+
            (canPay?'<button class="btn-trade" data-act="barbpaywheat" style="background:#7a5a3a;color:#fff">🌾 '+esc(tr("barb_pay_wheat"))+'</button>':'');
        } else {
          barbBtn='<button class="btn-trade" data-act="startbarbmove" style="background:#5a3d20;color:#fff">'+esc(tr("barb_move_btn"))+'</button>';
        }
      }
    }
    var finaleBtn="";
    if(isFinale() && canAct && state.trosswagen[me]){
      var stage=state.wagenStage[me]||0;
      var bp=state.wagenBP[me]||0;
      var trActive=(state.uiMode==="trosswagenMove");
      if(trActive){
        finaleBtn+='<button class="btn-trade" data-act="trosswagenend" style="background:#5a3d20;color:#fff">'+esc(tr("trosswagen_end"))+' (BP: '+bp+')</button>';
        if(!state.wagenWheatUsed[me] && (p.res.wheat||0)>0){
          finaleBtn+='<button class="btn-trade" data-act="trosswagenwheat" style="background:#7a5a3a;color:#fff">'+esc(tr("trosswagen_wheat"))+'</button>';
        }
        // Vertreiben-Button: nur wenn Stufe≥2 und daneben ein Barbar steht
        if(stage>=2){
          var tw=state.trosswagen[me], nextToBarb=false;
          if(tw && tw.atVertex!=null){
            state.board.vertices[tw.atVertex].edges.forEach(function(oe){ if(isBarbEdge(oe)) nextToBarb=true; });
          }
          if(nextToBarb) finaleBtn+='<button class="btn-trade" data-act="trosswagendefeat" style="background:#8a3020;color:#fff">'+esc(tr("trosswagen_defeat_barb"))+'</button>';
        }
      } else {
        finaleBtn+='<button class="btn-trade" data-act="startrosswagen" style="background:#5a3d20;color:#fff">'+esc(tr("trosswagen_move_btn"))+' (BP: '+bp+')</button>';
      }
      if(finaleCanUpgrade(me)){
        finaleBtn+='<button class="btn-trade" data-act="wagenupgrade" style="background:#4a6a50;color:#fff">'+esc(tr("wagen_upgrade_btn"))+' (Stufe '+(stage+1)+')</button>';
      }
    }
    var wonderBox="";
    if(state.scenario==="wunder"){
      var myWonder=state.wonderClaims[me];
      if(myWonder){
        var wstage=state.wonderStage[me]||0, wcost=WONDERS[myWonder].cost;
        var wcostStr=Object.keys(wcost).map(function(k){return wcost[k]+RES_META[k].icon;}).join(" ");
        wonderBox='<div class="hint gold">'+esc(tr("wonder_"+myWonder))+' — '+esc(tr("wonder_stage",{stage:wstage}))+'</div>'+
          (wstage<4?'<button class="btn-trade" data-act="buildwonderstage" '+(canBuild&&canAfford(p.res,wcost)?"":"disabled")+'>'+esc(tr("wonder_build"))+' ('+wcostStr+')</button>':'');
      }else{
        var elig=eligibleWonders(me);
        if(elig.length){
          wonderBox='<div class="hint gold">'+esc(tr("wonder_choose"))+'</div><div class="grid2">'+
            elig.map(function(w){return '<button class="bbtn" data-act="claimwonder" data-wonder="'+w+'" '+(canBuild?"":"disabled")+'><div>'+esc(tr("wonder_"+w))+'</div></button>';}).join("")+'</div>';
        }
      }
    }
    var endBtn='<button class="btn-end" data-act="endturn" '+((rolled&&canAct)?"":"disabled")+'>'+esc(tr(state.part2?"end_turn":(bigTwo()?"end_ship1":"end_turn")))+'</button>';
    var ship12=bigTwo()?('<div class="hint'+(state.part2?" gold":"")+'">'+esc(state.part2?tr(isSR()?"burg2_hint":"ship2_hint"):tr(isSR()?"burg1_hint":"ship1_hint"))+'</div>'):'';
    actions='<div class="actions">'+ship12+rb+rollRow+buildGrid+bank+tradeBtn+moveShipBtn+atkBtn+fishBtn+shoeBtn+bridgeBtn+goldTradeBtn+repairBtn+barbBtn+finaleBtn+wonderBox+endBtn+'</div>';
  }

  var card='<div class="panel"><div class="phead" style="background:'+c.main+';color:'+c.text+'">'+
      '<span class="who"><span class="miniwhite"></span>'+esc(colorName(me))+(isBot(me)?' '+tr("bot_tag"):'')+'</span>'+
      '<span style="font-size:14px;font-weight:700">'+fullVP(me)+' / '+(state.vpTarget||10)+' ★</span></div>'+
    '<div class="pp">'+
      '<div class="res-grid">'+resCells+'</div>'+
      '<div class="supply"><span class="lbl">'+esc(tr("supply"))+'</span><span class="nums">'+
        '<span title="'+esc(tr("b_road"))+'">🛤️ '+roadsLeft+'</span>'+
        (sea?'<span title="'+esc(tr("b_ship"))+'">⛵ '+shipsLeft+'</span>':'')+
        '<span title="'+esc(tr("b_settlement"))+'">🏠 '+settLeft+'</span>'+
        '<span title="'+esc(tr("b_city"))+'">🏛️ '+cityLeft+'</span></span></div>'+
      devSection+srSection+actions+
    '</div></div>';

  return '<div class="sidebar">'+card+renderScoreboard()+renderLog()+'</div>';
}

/* Ereigniswürfel und Fahrstrecke des Barbarenschiffs (Städte & Ritter) */
function renderEventDie(){
  if(!isSR())return "";
  var ev=state.turn&&state.turn.event;
  var sym={ship:"🛶",science:"📜",trade:"🧵",politics:"🪙"}[ev]||"·";
  var lbl=ev?(ev==="ship"?tr("ev_ship"):tr("ev_"+ev)):tr("ev_none");
  return '<div class="die evdie" title="'+esc(tr("ev_title"))+' '+esc(lbl)+'">'+sym+'</div>';
}
function renderBarbTrack(){
  if(!isSR())return "";
  var steps="";
  for(var i=1;i<=state.barbMax;i++){
    var reached=state.barb>=i, last=(i===state.barbMax);
    steps+='<span class="barbstep'+(reached?" on":"")+(last?" last":"")+'">'+(last?"⚔":"")+'</span>';
  }
  return '<div class="barbtrack" title="'+esc(tr("barb_track_tip"))+'">'+
    '<span class="barbship" style="left:'+(state.barb/state.barbMax*100)+'%">🛶</span>'+
    '<span class="barblbl">'+esc(tr("sr_barb"))+'</span>'+steps+
    '<span class="barbnum">'+state.barb+'/'+state.barbMax+'</span></div>';
}
function renderDice(d){
  function die(n,red){var dots={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n];
    var cells="";for(var i=0;i<9;i++)cells+='<span>'+(dots.indexOf(i)>=0?'<span class="pip"></span>':'')+'</span>';
    return '<div class="die'+(red?" red":"")+'">'+cells+'</div>';}
  // In Städte & Ritter ist der zweite Augenwürfel der rote: seine Zahl entscheidet über die Fortschrittskarten
  return '<div class="dice">'+die(d[0])+die(d[1],isSR())+renderEventDie()+'<span class="dsum">= '+(d[0]+d[1])+'</span></div>';
}

function renderLog(){

/* ---- modals ---- */
function renderModals(){
  if(!state.pending&&state.phase!=="gameover")return "";
  if(state.phase==="gameover")return modalWin();
  if(isBot(pendingDeciderPi()))return "";
  switch(state.pending.type){
    case "discard": return modalDiscard();
    case "steal": return modalSteal();
    case "plenty": return modalPlenty();
    case "monopoly": return modalMonopoly();
    case "progmono": return modalProgMono();
    case "progfleet": return modalProgFleet();
    case "alchemy": return modalAlchemy();
    case "barbCommit": return modalBarbCommit();
    case "spyPick": return modalSpyPick();
    case "spyCard": return modalSpyCard();
    case "levyPick": return modalLevyPick();
    case "levyCards": return modalLevyCards();
    case "betrayPick": return modalBetrayPick();
    case "betrayKnight": return modalBetrayKnight();
    case "trade_compose": return modalTradeCompose();
    case "trade_offer": return modalTradeOffer();
    case "robberChoice": return modalRobberChoice();
    case "gold": return modalGold();
    case "pirateSteal": return modalSteal();
    case "fish": return modalFish();
    case "fishSteal": return modalFishSteal();
    case "shoe": return modalShoe();
    case "goldTrade": return modalGoldTrade();
    case "wagonVote": return modalWagonVote();
    case "eventCard": return modalEventCard();
  }
  // Fallback: automatisch anzeigen wenn currentEvent gesetzt und Human am Zug
  if(state.currentEvent && state.players && state.players[state.current] && !state.players[state.current].bot){
    return modalEventCard();
  }
  return "";
}

function modalFish(){
  var pi=state.current, p=state.players[pi], c=PCOL[pi], sum=fishSum(p), cnt=fishTileCount(p);
  var acts=[
    {cost:2,key:"fish_act_robber",act:"fishaction",arg:"robber"},
    {cost:3,key:"fish_act_steal",act:"fishaction",arg:"steal"},
    {cost:4,key:"fish_act_res",act:"fishaction",arg:"res"},
    {cost:5,key:"fish_act_road",act:"fishaction",arg:"road"},
    {cost:7,key:"fish_act_dev",act:"fishaction",arg:"dev"}

  var body=acts.map(function(A){
    var disabled=sum<A.cost;
    return '<button class="mbtn" style="background:'+(disabled?"#8899a0":c.main)+';margin-bottom:6px" '+(disabled?"disabled":"")+' data-act="'+A.act+'" data-arg="'+A.arg+'">'+esc(tr(A.key))+'</button>';
  }).join("");
  var close='<button class="mbtn" style="background:#666" data-act="closefish">'+esc(tr("close"))+'</button>';

  var tileRow=tiles.map(function(t){return '<span style="display:inline-block;background:#2b6785;color:#fff;border-radius:4px;padding:2px 6px;margin:2px;font-size:11px">🐟'+t.v+'</span>';}).join("");
  return shell(c.main,'<h3 style="color:'+c.main+'">'+esc(tr("fish_title"))+'</h3>'+
    '<p>'+esc(tr("fish_desc",{have:sum}))+' <span style="color:#7a6e52;font-size:11px">('+cnt+' Plättchen)</span></p>'+
    (tileRow?'<div style="margin-bottom:8px">'+tileRow+'</div>':'')+
    body+close);
}

/* ---- board click routing ---- */
function clickVertex(v){
  var setup=state.setup, mode=state.uiMode, lv=legalVertSet();
  if(!lv[v])return;
  if(state.phase==="setup"&&setup.placing==="settlement")dispatch({type:"SETUP_SETTLEMENT",vertexId:Number(v)});
  else if(mode==="settlement")dispatch({type:"BUILD_SETTLEMENT",vertexId:Number(v)});
  else if(mode==="city")dispatch({type:"BUILD_CITY",vertexId:Number(v)});
  else if(mode==="knight")dispatch({type:"BUILD_KNIGHT",vertexId:Number(v)});
  else if(mode==="kact")dispatch({type:"ACTIVATE_KNIGHT",vertexId:Number(v)});
  else if(mode==="kup")dispatch({type:"UPGRADE_KNIGHT",vertexId:Number(v)});
  else if(mode==="kmove"||mode==="kdisp"){
    if(state.ui.ksel==null)dispatch({type:"KNIGHT_SELECT",vertexId:Number(v)});
    else dispatch({type:(mode==="kmove"?"KNIGHT_MOVE":"KNIGHT_DISPLACE"),vertexId:Number(v)});
  }
  else if(mode==="kchase")dispatch({type:"KNIGHT_CHASE",vertexId:Number(v)});
  else if(mode==="intrigue")dispatch({type:"INTRIGUE_DISPLACE",vertexId:Number(v)});
  else if(mode==="betrayremove")dispatch({type:"BETRAY_REMOVE",vertexId:Number(v)});
  else if(mode==="trosswagenMove")dispatch({type:"TROSSWAGEN_MOVE",vertexId:Number(v)});
}
function clickEdge(e){
  var setup=state.setup, le=legalEdgeSet(), kind=le[e];
  if(!kind)return;
  if(kind==="diplo"){dispatch({type:"DIPLOMACY_REMOVE",edgeId:Number(e)});return;}
  if(kind==="movefrom"){dispatch({type:"PICK_MOVE_SHIP",edgeId:Number(e)});return;}
  if(kind==="moveto"){dispatch({type:"MOVE_SHIP",edgeId:Number(e)});return;}
  if(kind==="bridge"){dispatch({type:"BUILD_BRIDGE",edgeId:Number(e)});return;}
  if(kind==="repair"){dispatch({type:"REPAIR_ROAD",edgeId:Number(e)});return;}
  if(kind==="barbknightplace"){dispatch({type:"PLACE_BARB_KNIGHT",edgeId:Number(e)});return;}
  if(kind==="barbknightpick"){dispatch({type:"SELECT_BARB_KNIGHT",edgeId:Number(e)});return;}
  if(kind==="barbknightto"){dispatch({type:"MOVE_BARB_KNIGHT_TO",edgeId:Number(e)});return;}
  if(state.phase==="setup"&&setup.placing==="road")dispatch({type:(kind==="ship"?"SETUP_SHIP":"SETUP_ROAD"),edgeId:Number(e)});
  else dispatch({type:(kind==="ship"?"BUILD_SHIP":"BUILD_ROAD"),edgeId:Number(e)});
}

/* ---- event delegation ---- */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act],[data-vert],[data-edge],[data-hex]");
  if(!t)return;
  if(t.hasAttribute("data-vert")){clickVertex(t.getAttribute("data-vert"));return;}
  if(t.hasAttribute("data-edge")){clickEdge(t.getAttribute("data-edge"));return;}
  if(t.hasAttribute("data-hex")){dispatch({type:(state.uiMode==="swapchip"?"SWAP_CHIP":(state.uiMode==="merchant"?"PLACE_MERCHANT":(state.uiMode==="moveSeaRobber"?"MOVE_SEA_ROBBER":"MOVE_ROBBER"))),hexId:Number(t.getAttribute("data-hex"))});return;}
  var act=t.getAttribute("data-act");
  switch(act){
    case "costs": dispatch({type:"TOGGLE_COSTS"}); break;
    case "togglesave": dispatch({type:"TOGGLE_SAVE"}); break;
    case "savefile": if(downloadSave())dispatch({type:"SET_SAVE_MSG",msg:"save_file_ok"}); else dispatch({type:"SET_SAVE_MSG",msg:"save_err"}); break;
    case "loadfile": { var fi=document.getElementById("loadFileInput"); if(fi)fi.click(); break; }
    case "closesave": dispatch({type:"TOGGLE_SAVE"}); break;
    case "menuload": { var mf=document.getElementById("loadFileInput"); if(mf)mf.click(); break; }
    case "setn": dispatch({type:"SET_N",n:Number(t.getAttribute("data-n"))}); break;
    case "setseatbot": dispatch({type:"SET_SEAT_BOT",seat:Number(t.getAttribute("data-seat")),level:t.getAttribute("data-level")}); break;
    case "cycleseatbot": dispatch({type:"CYCLE_SEAT_BOT",seat:Number(t.getAttribute("data-seat"))}); break;
    case "setstartmode": dispatch({type:"SET_STARTMODE",mode:t.getAttribute("data-mode")}); break;
    case "setstartscn": dispatch({type:"SET_STARTSCN",scn:t.getAttribute("data-scn")}); break;
    case "setstarthbscn": dispatch({type:"SET_STARTHBSCN",scn:t.getAttribute("data-scn")}); break;
    case "skiproll": dispatch({type:"SET_SKIPROLL"}); break;
    case "srsea": dispatch({type:"SET_SRSEA"}); break;
    case "tactic": dispatch({type:"SET_TACTIC"}); break;
    case "fr": dispatch({type:"SET_FRIENDLY_ROBBER"}); break;
    case "hh": dispatch({type:"SET_HARBORS"}); break;
    case "ev": dispatch({type:"SET_EVENTS"}); break;
    case "begin": dispatch({type:"NEW_GAME",n:state.ui.startN}); break;
    case "firstroll": dispatch({type:"FIRST_ROLL"}); break;
    case "startmoveship": dispatch({type:"START_MOVE_SHIP"}); break;
    case "attackfortress": dispatch({type:"ATTACK_FORTRESS"}); break;
    case "claimwonder": dispatch({type:"CLAIM_WONDER",wonder:t.getAttribute("data-wonder")}); break;
    case "buildwonderstage": dispatch({type:"BUILD_WONDER_STAGE"}); break;
    case "cancelmoveship": dispatch({type:"CANCEL_MOVE_SHIP"}); break;
    case "robberchoice": dispatch({type:"ROBBER_CHOICE",which:t.getAttribute("data-which")}); break;
    case "goldadj": dispatch({type:"GOLD_ADJ",res:t.getAttribute("data-res"),d:Number(t.getAttribute("data-d"))}); break;
    case "goldconfirm": dispatch({type:"GOLD_CONFIRM"}); break;
    case "newgame": if(state.phase==="gameover"){dispatch({type:"TO_MENU"});}else{dispatch({type:"ASK_NEWGAME"});} break;
    case "toginfo": dispatch({type:"TOGGLE_INFO"}); break;
    case "closeinfo": dispatch({type:"CLOSE_INFO"}); break;
    case "closenew": dispatch({type:"CLOSE_NEWGAME"}); break;
    case "tomenu": dispatch({type:"TO_MENU"}); break;
    case "roll": dispatch({type:"ROLL"}); break;
    case "mode": dispatch({type:"SET_MODE",mode:t.getAttribute("data-mode")}); break;
    case "setmode": dispatch({type:"SET_MODE",mode:t.getAttribute("data-mode")}); break;
    case "buydev": dispatch({type:"BUY_DEV"}); break;
    case "buildwall": dispatch({type:"BUILD_WALL"}); break;
    case "improve": dispatch({type:"BUILD_IMPROVEMENT",area:t.getAttribute("data-area")}); break;
    case "playdev": dispatch({type:"PLAY_DEV",card:t.getAttribute("data-card")}); break;
    case "endturn": dispatch({type:"END_TURN"}); break;
    case "specialdone": dispatch({type:"SPECIAL_DONE"}); break;
    case "trade": dispatch({type:"BANK_TRADE"}); break;
    case "discadj": dispatch({type:"DISCARD_ADJ",res:t.getAttribute("data-res"),d:Number(t.getAttribute("data-d"))}); break;
    case "disconfirm": dispatch({type:"DISCARD_CONFIRM"}); break;
    case "steal": dispatch({type:"STEAL",from:Number(t.getAttribute("data-pi"))}); break;
    case "plentytoggle": dispatch({type:"PLENTY_TOGGLE",res:t.getAttribute("data-res")}); break;
    case "plentyreset": dispatch({type:"PLENTY_RESET"}); break;
    case "plentyconfirm": dispatch({type:"PLENTY_CONFIRM"}); break;
    case "monopoly": dispatch({type:"MONOPOLY",res:t.getAttribute("data-res")}); break;
    case "progmono": dispatch({type:"PROG_MONO",res:t.getAttribute("data-res")}); break;
    case "progfleet": dispatch({type:"PROG_FLEET",res:t.getAttribute("data-res")}); break;
    case "alchemy": dispatch({type:"ALCHEMY_PICK",value:Number(t.getAttribute("data-val"))}); break;
    case "barbcommit": dispatch({type:"BARB_COMMIT",count:Number(t.getAttribute("data-count"))}); break;
    case "spypick": dispatch({type:"SPY_PICK",pi:Number(t.getAttribute("data-pi"))}); break;
    case "spytake": dispatch({type:"SPY_TAKE",card:t.getAttribute("data-card")}); break;
    case "levypick": dispatch({type:"LEVY_PICK",pi:Number(t.getAttribute("data-pi"))}); break;
    case "levytake": dispatch({type:"LEVY_TAKE",res:t.getAttribute("data-res")}); break;
    case "betraypick": dispatch({type:"BETRAY_PICK",pi:Number(t.getAttribute("data-pi"))}); break;
    case "playprog": dispatch({type:"PLAY_PROG",card:t.getAttribute("data-card")}); break;
    case "opentrade": dispatch({type:"OPEN_TRADE"}); break;
    case "tradepartner": dispatch({type:"TRADE_PARTNER",pi:Number(t.getAttribute("data-pi"))}); break;
    case "tradeadj": dispatch({type:"TRADE_ADJ",slot:t.getAttribute("data-slot"),res:t.getAttribute("data-res"),d:Number(t.getAttribute("data-d"))}); break;
    case "tradesend": dispatch({type:"TRADE_SEND"}); break;
    case "tradecancel": dispatch({type:"TRADE_CANCEL"}); break;
    case "tradeaccept": dispatch({type:"TRADE_ACCEPT"}); break;
    case "tradedecline": dispatch({type:"TRADE_DECLINE"}); break;
    case "openfish": dispatch({type:"OPEN_FISH"}); break;
    case "closefish": dispatch({type:"CLOSE_FISH"}); break;
    case "fishaction": dispatch({type:"FISH_ACTION",act:t.getAttribute("data-arg")}); break;
    case "fishstealpi": dispatch({type:"FISH_STEAL_PI",pi:Number(t.getAttribute("data-pi"))}); break;
    case "openshoe": dispatch({type:"OPEN_SHOE"}); break;
    case "closeshoe": dispatch({type:"CLOSE_SHOE"}); break;
    case "shoepasspi": dispatch({type:"SHOE_PASS_PI",pi:Number(t.getAttribute("data-pi"))}); break;
    case "opengoldtrade": dispatch({type:"OPEN_GOLD_TRADE"}); break;
    case "closegoldtrade": dispatch({type:"CLOSE_GOLD_TRADE"}); break;
    case "goldtradepick": dispatch({type:"GOLD_TRADE_PICK",res:t.getAttribute("data-res")}); break;
    case "wvpick": dispatch({type:"WV_PICK",edgeId:t.getAttribute("data-eid")}); break;
    case "wvcast": dispatch({type:"WV_CAST",res:t.getAttribute("data-res")}); break;
    case "wvresolve": dispatch({type:"WV_RESOLVE"}); break;
    case "closeevent": dispatch({type:"CLOSE_EVENT"}); break;
    case "startbarbmove": dispatch({type:"START_BARB_MOVE"}); break;
    case "endbarbmove": dispatch({type:"END_BARB_MOVE"}); break;
    case "barbpaywheat": dispatch({type:"BARB_PAY_WHEAT"}); break;
    case "startrosswagen": dispatch({type:"START_TROSSWAGEN"}); break;
    case "trosswagenend": dispatch({type:"TROSSWAGEN_END"}); break;
    case "trosswagenwheat": dispatch({type:"TROSSWAGEN_WHEAT"}); break;
    case "trosswagendefeat": dispatch({type:"TROSSWAGEN_DEFEAT"}); break;
    case "wagenupgrade": dispatch({type:"WAGEN_UPGRADE"}); break;
  }
});
document.addEventListener("change",function(ev){
  var t=ev.target.closest('[data-act="setbank"]');
  if(!t)return;
  dispatch({type:"SET_BANK",side:t.getAttribute("data-side"),res:t.value});
});

/* ---- go ---- */
/* Spieluhr: aktualisiert #game-clock jede Sekunde, misst Wall-clock seit freshGame(). */
if(!window.__catanClock){
  window.__catanClock = setInterval(function(){
    var el = document.getElementById("game-clock");
    if(!el || !window.state || !state.startTime) return;
    el.textContent = fmtClock();
  }, 1000);
}
render();
</script>
</body>
</html>
