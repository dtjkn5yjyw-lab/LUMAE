<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CATAN — Pass &amp; Play</title>
<style>
  :root{
    --sea:#2a6f97; --panel:#f3ecda; --panel2:#e6dcc2; --ink:#2a2620;
    --slate:#1f3242; --slate2:#33526a; --slate3:#3e637e; --muted:#8a7d5e;
    --gold:#caa33a; --orange:#e2882a; --red:#cf3a36; --redd:#b8302c;
    --p0:#cf3a36; --p1:#2f6fd0; --p2:#e2882a; --p3:#f3efe2;
    --p0d:#8e221f; --p1d:#1d4a91; --p2d:#a85d12; --p3d:#9a9484;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    background:radial-gradient(circle at 50% 0%, #cfe3ee 0%, #a9cbdf 45%, #7fb0cd 100%);
    -webkit-text-size-adjust:100%;
  }
  .ui{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .display{font-family:Georgia,'Iowan Old Style',serif;letter-spacing:.04em}
  .wrap{max-width:1040px;margin:0 auto;padding:16px 12px}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  button:disabled{cursor:not-allowed}
  select{font-family:ui-sans-serif,system-ui,sans-serif}

  /* ---- menu ---- */
  .menu{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(circle at 50% 30%, #2b4a63, #16242f);color:#f3ecda;text-align:center}
  .menu .inner{max-width:460px}
  .menu .anchor{font-size:58px;margin-bottom:6px}
  .menu h1{font-family:Georgia,serif;font-weight:700;font-size:52px;letter-spacing:.25em;margin:0 0 2px}
  .menu .sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:#9fc0d4;margin-bottom:30px}
  .menu .q{font-family:ui-sans-serif,system-ui,sans-serif;color:#cdd9e0;font-size:14px;margin-bottom:12px}
  .menu .ns{display:flex;gap:12px;justify-content:center;margin-bottom:30px}
  .menu .ns button{width:54px;height:54px;border-radius:50%;font-size:20px;font-weight:700;border:2px solid #5d7e93;
    background:transparent;color:#9fc0d4;font-family:ui-sans-serif,system-ui,sans-serif;transition:.15s}
  .menu .ns button.on{background:var(--orange);border-color:#f3ecda;color:#fff;transform:scale(1.1)}
  .menu .begin{font-family:Georgia,serif;letter-spacing:.18em;font-size:18px;padding:12px 40px;border-radius:10px;
    background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .menu .begin:hover{background:var(--redd)}
  .menu .blurb{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;color:#7c98a9;margin-top:30px;line-height:1.6}

  /* ---- lang toggle ---- */
  .lang{display:inline-flex;gap:4px;padding:3px;border-radius:9px;background:rgba(0,0,0,.25)}
  .lang.light{background:rgba(31,50,66,.1)}
  .lang button{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;font-weight:600;
    padding:5px 10px;border-radius:7px;color:#9fc0d4;transition:.15s}
  .lang.light button{color:var(--slate2)}
  .lang button.on{background:var(--orange);color:#fff}

  /* ---- header ---- */
  .header{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:rgba(31,50,66,.88);color:#f3ecda;border-radius:12px;padding:8px 16px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .header .title{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.2em}
  .header .phase{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;text-transform:uppercase;
    letter-spacing:.16em;color:#9fc0d4}
  .header .right{display:flex;align-items:center;gap:10px}
  .header .turn{font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;display:flex;align-items:center;gap:8px}
  .header .turn .who{display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.4)}
  .btn-new{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;padding:6px 12px;border-radius:8px;
    background:var(--slate2);color:#f3ecda}
  .btn-new:hover{background:var(--slate3)}

  /* ---- layout ---- */
  .layout{display:flex;flex-direction:column;gap:16px;margin-top:12px}
  @media(min-width:900px){ .layout{flex-direction:row} .sidebar{width:320px;flex:0 0 320px} .board-wrap{flex:1;min-width:0} }
  .board-wrap{background:var(--sea);border-radius:18px;padding:8px;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
  .board-wrap svg{display:block;width:100%;height:auto;user-select:none}
  .sidebar{font-family:ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column;gap:12px}

  /* ---- panels ---- */
  .panel{background:var(--panel);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);overflow:hidden}
  .pp{padding:12px}
  .phead{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:700;letter-spacing:.02em}
  .phead .who{display:flex;align-items:center;gap:8px}
  .miniwhite{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.7)}

  .res-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
  .res-cell{text-align:center;border-radius:8px;padding:6px 0}
  .res-cell .ic{font-size:18px;line-height:1}
  .res-cell .n{font-weight:700;font-size:14px}

  .supply{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#7a6e52;margin:0 2px 12px}
  .supply .lbl{text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--muted)}
  .supply .nums{display:flex;gap:10px}

  .seclbl{text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--muted);margin-bottom:5px}
  .devrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .devbtn{font-size:11px;padding:4px 8px;border-radius:6px;background:var(--slate2);color:#f3ecda}
  .devbtn:hover:not(:disabled){background:var(--slate3)}
  .devbtn:disabled{opacity:.4}
  .newdev{font-size:11px;padding:4px 8px;border-radius:6px;background:rgba(154,148,132,.4);color:#5a523f}
  .vpbadge{font-size:11px;padding:4px 8px;border-radius:6px;background:rgba(202,163,58,.3);color:#7a5e12}

  .hint{font-size:13px;color:#5a523f;background:var(--panel2);border-radius:8px;padding:8px}
  .hint.gold{color:#7a5e12;background:rgba(202,163,58,.25);font-size:12px}

  .actions{display:flex;flex-direction:column;gap:8px}
  .btn-roll{width:100%;padding:11px;border-radius:10px;background:var(--red);color:#fff;font-weight:600;
    letter-spacing:.03em;box-shadow:0 4px 10px rgba(0,0,0,.15)}
  .btn-roll:hover:not(:disabled){background:var(--redd)}
  .btn-roll:disabled{opacity:.5}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bbtn{padding:6px 8px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--panel2);
    background:var(--panel2);color:#3a3024;transition:.12s;text-align:center}
  .bbtn:hover:not(:disabled){background:#dcceac}
  .bbtn.active{background:var(--orange);border-color:var(--gold);color:#fff}
  .bbtn:disabled{opacity:.45;background:rgba(230,220,194,.5);border-color:transparent;color:#9a9484}
  .bbtn .cost{font-size:10px;font-weight:400;opacity:.8}
  .btn-end{width:100%;padding:9px;border-radius:10px;background:var(--slate2);color:#f3ecda;font-weight:600}
  .btn-end:hover:not(:disabled){background:var(--slate3)}
  .btn-end:disabled{opacity:.4}

  .banktrade{border-radius:10px;background:var(--panel2);padding:8px}
  .banktrade .row{display:flex;align-items:center;gap:6px;font-size:14px}
  .banktrade select{background:#fff;border-radius:6px;padding:4px 6px;font-size:13px;border:1px solid #d8cfb6}
  .banktrade .arrow{color:var(--muted)}
  .banktrade .ratio{font-weight:700;color:var(--slate2);font-size:13px}
  .banktrade .tradebtn{margin-left:auto;padding:4px 10px;border-radius:6px;background:var(--slate2);
    color:#f3ecda;font-size:12px;font-weight:600}
  .banktrade .tradebtn:disabled{opacity:.4}

  .dice{display:flex;align-items:center;justify-content:center;gap:12px;padding:4px 0}
  .die{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;
    width:36px;height:36px;background:#fff;border-radius:6px;border:1px solid #d8cfb6;padding:4px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
  .die span{display:flex;align-items:center;justify-content:center}
  .pip{width:6px;height:6px;border-radius:50%;background:var(--slate2)}
  .dsum{font-size:22px;font-weight:700;color:var(--slate2)}

  .scoreboard .score-row{display:flex;align-items:center;gap:8px;font-size:14px;border-radius:8px;padding:4px 8px}
  .scoreboard .score-row.cur{background:var(--panel2)}
  .scoreboard .nm{font-weight:600;width:56px}
  .scoreboard .vp{color:#5a523f}
  .scoreboard .meta{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:#7a6e52}

  .log{background:rgba(31,50,66,.88);color:#dfe9ef;border-radius:12px;padding:12px;font-size:12px;line-height:1.6}
  .log .lh{text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:#7f9cae;margin-bottom:4px}
  .log .ln{opacity:.6}
  .log .ln.first{opacity:1;color:#f3ecda}

  .foot{margin-top:14px;text-align:center;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;color:rgba(31,50,66,.55)}

  /* ---- modals ---- */
  .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}
  .modal{width:100%;max-width:380px;border-radius:16px;overflow:hidden;background:var(--panel);box-shadow:0 20px 50px rgba(0,0,0,.4);
    font-family:ui-sans-serif,system-ui,sans-serif}
  .modal .bar{height:6px}
  .modal .body{padding:20px}
  .modal h3{font-family:Georgia,serif;font-size:21px;margin:0 0 4px}
  .modal p{font-size:14px;color:#5a523f;margin:0 0 14px}
  .drow{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
  .drow .rn{width:108px}
  .drow .have{font-size:12px;color:var(--muted);width:64px}
  .drow .pm{width:28px;height:28px;border-radius:6px;background:var(--panel2);font-size:16px}
  .drow .cnt{width:24px;text-align:center;font-weight:700}
  .mbtn{width:100%;padding:11px;border-radius:10px;color:#fff;font-weight:600}
  .mbtn:disabled{opacity:.4}
  .steal-opt{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;color:#fff;font-weight:600;margin-bottom:8px}
  .steal-opt .c{margin-left:auto;font-size:13px;opacity:.9}
  .resgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
  .resgrid button{border-radius:8px;padding:8px 0;text-align:center}
  .resgrid button .ic{font-size:18px}
  .resgrid button .nm{font-size:10px;margin-top:2px}
  .picked{font-size:14px;color:#5a523f;margin-bottom:12px}
  .picked .reset{margin-left:8px;font-size:12px;text-decoration:underline}
  .wincenter{text-align:center}
  .wincenter .trophy{font-size:46px;margin-bottom:6px}
  .wincenter h3{font-size:28px}
  .wincenter .again{font-family:Georgia,serif;letter-spacing:.16em;padding:10px 32px;border-radius:10px;color:#fff;margin-top:6px}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ============================================================

/* ============================================================ i18n ============ */

    c0:"Red", c1:"Blue", c2:"Orange", c3:"White",
    foot:"v0.3 · base game + harbors · offline · single file",
    log_setup_settle:"{name} placed a settlement.", log_setup_road:"{name} placed a road.",
    log_setup_prompt:"{name}, place a settlement.", log_setup_first:"Place your first settlements.",
    log_setup_done:"Setup complete. {name} to roll.",
    log_roll:"{name} rolled {sum} ({d1}+{d2}).",
    log_robber_discard:"Robber! Players with 8+ cards discard half.", log_move_robber:"Move the robber.",
    log_discarded:"{name} discarded {count} cards.", log_robber_nosteal:"Robber moved. No one to steal from.",

function fmt(s,p){ if(!p) return s; return s.replace(/\{(\w+)\}/g,function(_,k){return p[k]!==undefined?p[k]:"{"+k+"}";}); }
function tr(key,p){ var L=state.lang; var s=(I18N[L]&&I18N[L][key])||I18N.en[key]||key; return fmt(s,p); }
function resLabel(r){ return tr("res_"+r); }
function devLabel(c){ return tr("dev_"+c); }
function devDesc(c){ return tr("devd_"+c); }
function colorName(i){ return tr("c"+i); }
function logText(e){
  var p={}; var src=e.p||{}; for(var k in src) p[k]=src[k];
  if(typeof p.name==="number") p.name=colorName(p.name);
  if(typeof p.victim==="number") p.victim=colorName(p.victim);
  if(p.give&&RES.indexOf(p.give)>=0) p.give=resLabel(p.give);
  if(p.get&&RES.indexOf(p.get)>=0) p.get=resLabel(p.get);
  if(p.res&&RES.indexOf(p.res)>=0) p.res=resLabel(p.res);
  if(Array.isArray(p.resList)) p.resList=p.resList.map(resLabel).join(" & ");
  return tr(e.k,p);
}

/* ---------- utils ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function emptyRes(){return{wood:0,brick:0,sheep:0,wheat:0,ore:0};}
function totalCards(r){return RES.reduce(function(s,k){return s+r[k];},0);}
function canAfford(r,c){for(var k in c){if(r[k]<c[k])return false;}return true;}
function pay(r,c){var n={};for(var k in r)n[k]=r[k];for(var k2 in c)n[k2]-=c[k2];return n;}

/* ---------- board geometry ---------- */
function buildBoard(){
  var hSp=SQRT3*SIZE, vSp=1.5*SIZE, centers=[];
  ROWS.forEach(function(count,r){
    var y=r*vSp, rowW=(count-1)*hSp;
    for(var i=0;i<count;i++) centers.push({x:i*hSp-rowW/2,y:y});
  });
  function corner(cx,cy,i){var a=Math.PI/180*(60*i-30);return{x:cx+SIZE*Math.cos(a),y:cy+SIZE*Math.sin(a)};}
  var vmap={}, vertices=[];
  function vid(p){var key=Math.round(p.x)+","+Math.round(p.y);if(vmap[key]!==undefined)return vmap[key];
    var id=vertices.length;vertices.push({id:id,x:p.x,y:p.y,hexes:[],edges:[],adj:[]});vmap[key]=id;return id;}
  var hexes=centers.map(function(c,hi){var vs=[];for(var i=0;i<6;i++)vs.push(vid(corner(c.x,c.y,i)));return{id:hi,x:c.x,y:c.y,vertices:vs};});
  hexes.forEach(function(h){h.vertices.forEach(function(v){if(vertices[v].hexes.indexOf(h.id)<0)vertices[v].hexes.push(h.id);});});
  var emap={}, edges=[];
  function eid(a,b){var key=a<b?a+"-"+b:b+"-"+a;if(emap[key]!==undefined)return emap[key];
    var id=edges.length;var va=vertices[a],vb=vertices[b];edges.push({id:id,v1:a,v2:b,x:(va.x+vb.x)/2,y:(va.y+vb.y)/2,hexes:[]});emap[key]=id;return id;}
  hexes.forEach(function(h){for(var i=0;i<6;i++){var a=h.vertices[i],b=h.vertices[(i+1)%6];var e=eid(a,b);
    if(edges[e].hexes.indexOf(h.id)<0)edges[e].hexes.push(h.id);
    if(vertices[a].edges.indexOf(e)<0)vertices[a].edges.push(e);if(vertices[b].edges.indexOf(e)<0)vertices[b].edges.push(e);}});
  edges.forEach(function(e){if(vertices[e.v1].adj.indexOf(e.v2)<0)vertices[e.v1].adj.push(e.v2);if(vertices[e.v2].adj.indexOf(e.v1)<0)vertices[e.v2].adj.push(e.v1);});
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  vertices.forEach(function(v){minX=Math.min(minX,v.x);minY=Math.min(minY,v.y);maxX=Math.max(maxX,v.x);maxY=Math.max(maxY,v.y);});
  return{hexes:hexes,vertices:vertices,edges:edges,bounds:{minX:minX,minY:minY,maxX:maxX,maxY:maxY}};
}
function assignTiles(){
  var pool=shuffle([].concat(
    Array(4).fill("wood"),Array(3).fill("brick"),Array(4).fill("sheep"),
    Array(4).fill("wheat"),Array(3).fill("ore"),["desert"]));
  var tokens=shuffle([2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12]); var ti=0;
  return pool.map(function(res){return{resource:res,number:res==="desert"?null:tokens[ti++]};});
}
function buildDevDeck(){
  return shuffle([].concat(Array(14).fill("knight"),Array(5).fill("vp"),Array(2).fill("road"),Array(2).fill("plenty"),Array(2).fill("monopoly")));
}
function assignHarbors(board){
  var c={x:(board.bounds.minX+board.bounds.maxX)/2,y:(board.bounds.minY+board.bounds.maxY)/2};
  var outer=board.edges.filter(function(e){return e.hexes.length===1;});
  outer.sort(function(a,b){return Math.atan2(a.y-c.y,a.x-c.x)-Math.atan2(b.y-c.y,b.x-c.x);});
  var types=shuffle([
    {kind:"any",ratio:3},{kind:"any",ratio:3},{kind:"any",ratio:3},{kind:"any",ratio:3},
    {kind:"wood",ratio:2},{kind:"brick",ratio:2},{kind:"sheep",ratio:2},{kind:"wheat",ratio:2},{kind:"ore",ratio:2}
  ]);
  var harbors=[];
  for(var i=0;i<9&&outer.length>0;i++){
    var idx=Math.round(i*outer.length/9)%outer.length, e=outer[idx], t=types[i];
    var dx=e.x-c.x, dy=e.y-c.y, len=Math.hypot(dx,dy)||1;
    harbors.push({edgeId:e.id,kind:t.kind,ratio:t.ratio,v1:e.v1,v2:e.v2,x:e.x,y:e.y,dx:dx/len,dy:dy/len});
  }
  return harbors;
}
function bestRatio(pi,res){
  var r=4;
  for(var k=0;k<state.harbors.length;k++){
    var hb=state.harbors[k];
    var b1=state.buildings[hb.v1], b2=state.buildings[hb.v2];
    var owns=(b1&&b1.owner===pi)||(b2&&b2.owner===pi);
    if(!owns)continue;
    if(hb.kind==="any")r=Math.min(r,3); else if(hb.kind===res)r=Math.min(r,2);
  }
  return r;
}

/* ---------- rules helpers ---------- */
function distanceOK(v,b,board){if(b[v])return false;return board.vertices[v].adj.every(function(a){return !b[a];});}
function settlementLegal(v,pl,b,roads,board,setup){
  if(!distanceOK(v,b,board))return false; if(setup)return true;
  return board.vertices[v].edges.some(function(e){return roads[e]&&roads[e].owner===pl;});
}
function roadLegal(eid,pl,b,roads,board,restrict){
  if(roads[eid])return false; var e=board.edges[eid];
  if(restrict!=null)return e.v1===restrict||e.v2===restrict;
  return [e.v1,e.v2].some(function(w){
    var bo=b[w];
    if(bo&&bo.owner===pl)return true;
    if(bo&&bo.owner!==pl)return false;
    return board.vertices[w].edges.some(function(oe){return roads[oe]&&roads[oe].owner===pl;});
  });
}
function longestRoad(pl,roads,board,b){
  var owned=board.edges.filter(function(e){return roads[e.id]&&roads[e.id].owner===pl;});
  if(owned.length===0)return 0;
  var inc={};
  owned.forEach(function(e){(inc[e.v1]=inc[e.v1]||[]).push(e);(inc[e.v2]=inc[e.v2]||[]).push(e);});
  function blocked(v){return b[v]&&b[v].owner!==pl;}
  var best=0;
  function dfs(vertex,used){
    if(used.size>0&&blocked(vertex)){best=Math.max(best,used.size);return;}
    (inc[vertex]||[]).forEach(function(e){
      if(used.has(e.id))return;
      var next=e.v1===vertex?e.v2:e.v1;
      used.add(e.id);dfs(next,used);used.delete(e.id);
    });
    best=Math.max(best,used.size);
  }
  Object.keys(inc).forEach(function(v){dfs(Number(v),new Set());});
  return best;
}
function countRoads(pl){var n=0;for(var k in state.roads)if(state.roads[k].owner===pl)n++;return n;}
function countType(pl,type){var n=0;for(var k in state.buildings){var b=state.buildings[k];if(b.owner===pl&&b.type===type)n++;}return n;}

/* ---------- victory points ---------- */
function publicVP(pi){
  var vp=0;
  for(var k in state.buildings){var b=state.buildings[k];if(b.owner===pi)vp+=b.type==="city"?2:1;}
  if(state.longestRoadOwner===pi)vp+=2;
  if(state.largestArmyOwner===pi)vp+=2;
  return vp;
}
function fullVP(pi){return publicVP(pi)+state.players[pi].vpCards;}

/* ---------- awards (Almanach-faithful) ---------- */
function recomputeAwards(){
  var lengths=state.players.map(function(_,pi){return longestRoad(pi,state.roads,state.board,state.buildings);});
  var max=Math.max.apply(null,lengths.concat([0]));
  var owner=state.longestRoadOwner;
  if(max<5) owner=null;
  else if(owner!==null&&lengths[owner]===max){/* holder keeps */}
  else{
    var leaders=lengths.map(function(l,i){return l===max?i:-1;}).filter(function(i){return i>=0;});
    owner=leaders.length===1?leaders[0]:null; // tie among challengers => set aside
  }
  state.longestRoadOwner=owner;
  state.longestRoadLength=owner===null?0:lengths[owner];

  var knights=state.players.map(function(p){return p.knights;});
  var aMax=Math.max.apply(null,knights.concat([0]));
  var aOwner=state.largestArmyOwner;
  if(aMax<3) aOwner=null;
  else if(aOwner!==null&&knights[aOwner]===aMax){/* keep */}
  else{
    var aL=knights.map(function(k,i){return k===aMax?i:-1;}).filter(function(i){return i>=0;});
    aOwner=aL.length===1?aL[0]:null;
  }
  state.largestArmyOwner=aOwner;
  state.largestArmySize=aOwner===null?0:knights[aOwner];
}

/* ---------- state ---------- */
var state=menuState();
function menuState(){return{phase:"menu",lang:(state&&state.lang)||"de",ui:{startN:3}};}
function freshGame(n,lang){
  var board=buildBoard(), tiles=assignTiles();
  var robberHex=tiles.findIndex(function(t){return t.resource==="desert";});
  var harbors=assignHarbors(board);
  var players=[]; for(var i=0;i<n;i++) players.push({id:i,res:emptyRes(),dev:[],newDev:[],vpCards:0,knights:0,playedDevThisTurn:false});
  var order=[]; for(var a=0;a<n;a++)order.push(a); for(var b=n-1;b>=0;b--)order.push(b);
  return{
    phase:"setup", lang:lang, board:board, tiles:tiles, robberHex:robberHex, harbors:harbors, players:players,
    buildings:{}, roads:{}, current:order[0], devDeck:buildDevDeck(),
    setup:{order:order,idx:0,placing:"settlement",lastSettlement:null},
    turn:null, uiMode:null, pending:null,
    longestRoadOwner:null,longestRoadLength:0,largestArmyOwner:null,largestArmySize:0,
    winner:null, log:[{k:"log_setup_first"}],
    ui:{bankGive:"wood",bankGet:"ore",discardSel:emptyRes(),plentyPicks:[]}
  };
}
function pushLog(k,p){state.log.unshift({k:k,p:p});state.log=state.log.slice(0,7);}

function stealFrom(victimPi){
  var v=state.players[victimPi], pool=[];
  RES.forEach(function(r){for(var i=0;i<v.res[r];i++)pool.push(r);});
  if(pool.length===0){pushLog("log_nothing_steal");return;}
  var r=pool[Math.floor(Math.random()*pool.length)];
  v.res[r]-=1; state.players[state.current].res[r]+=1;
  pushLog("log_stole",{name:state.current,victim:victimPi});
}
function checkWin(){ if(fullVP(state.current)>=10){state.winner=state.current;state.phase="gameover";pushLog("log_wins",{name:state.current});} }

/* ---------- actions (mutating, then render) ---------- */
function dispatch(a){ apply(a); render(); }
function apply(a){
  switch(a.type){
    case "SET_LANG": state.lang=a.lang; return;
    case "SET_N": state.ui.startN=a.n; return;
    case "NEW_GAME": state=freshGame(a.n||state.ui.startN||3, state.lang); return;

    case "SETUP_SETTLEMENT":{
      var v=a.vertexId, pi=state.setup.order[state.setup.idx];
      state.buildings[v]={owner:pi,type:"settlement"};
      if(state.setup.idx>=state.players.length){
        state.board.vertices[v].hexes.forEach(function(hi){var t=state.tiles[hi];if(t.resource!=="desert")state.players[pi].res[t.resource]+=1;});
      }
      state.setup.placing="road"; state.setup.lastSettlement=v;
      pushLog("log_setup_settle",{name:pi}); return;
    }
    case "SETUP_ROAD":{
      var pir=state.setup.order[state.setup.idx];
      state.roads[a.edgeId]={owner:pir}; pushLog("log_setup_road",{name:pir});
      state.setup.idx+=1;
      if(state.setup.idx>=state.setup.order.length){
        state.phase="play"; state.current=state.setup.order[state.setup.order.length-1];
        state.setup=null; state.turn={rolled:false,dice:null}; recomputeAwards();
        pushLog("log_setup_done",{name:state.current});
      }else{
        state.setup.placing="settlement"; state.setup.lastSettlement=null;
        pushLog("log_setup_prompt",{name:state.setup.order[state.setup.idx]});
      }
      return;
    }

    case "ROLL":{
      var d1=1+Math.floor(Math.random()*6), d2=1+Math.floor(Math.random()*6), sum=d1+d2;
      state.turn.rolled=true; state.turn.dice=[d1,d2];
      pushLog("log_roll",{name:state.current,sum:sum,d1:d1,d2:d2});
      if(sum===7){
        var queue=[];
        state.players.forEach(function(p,pi){var nn=totalCards(p.res);if(nn>7)queue.push({pi:pi,count:Math.floor(nn/2)});});
        if(queue.length>0){state.pending={type:"discard",queue:queue,qi:0};state.ui.discardSel=emptyRes();pushLog("log_robber_discard");}
        else{state.uiMode="moveRobber";state.pending={type:"robber",source:"roll"};pushLog("log_move_robber");}
      }else{
        state.tiles.forEach(function(t,hi){
          if(t.number!==sum||hi===state.robberHex)return;
          state.board.hexes[hi].vertices.forEach(function(v){var b=state.buildings[v];if(b)state.players[b.owner].res[t.resource]+=b.type==="city"?2:1;});
        });
      }
      return;
    }

    case "DISCARD_ADJ":{
      var p=state.players[state.pending.queue[state.pending.qi].pi];
      var cur=state.ui.discardSel[a.res]+a.d;
      cur=Math.max(0,Math.min(p.res[a.res],cur)); state.ui.discardSel[a.res]=cur; return;
    }
    case "DISCARD_CONFIRM":{
      var item=state.pending.queue[state.pending.qi]; var pl=state.players[item.pi];
      RES.forEach(function(r){pl.res[r]-=state.ui.discardSel[r];});
      pushLog("log_discarded",{name:item.pi,count:item.count});
      state.pending.qi+=1; state.ui.discardSel=emptyRes();
      if(state.pending.qi>=state.pending.queue.length){state.pending={type:"robber",source:"roll"};state.uiMode="moveRobber";pushLog("log_move_robber");}
      return;
    }

    case "MOVE_ROBBER":{
      state.robberHex=a.hexId;
      var victims={};
      state.board.hexes[a.hexId].vertices.forEach(function(v){var b=state.buildings[v];if(b&&b.owner!==state.current&&totalCards(state.players[b.owner].res)>0)victims[b.owner]=true;});
      var list=Object.keys(victims).map(Number);
      state.uiMode=null;
      if(list.length===0){state.pending=null;pushLog("log_robber_nosteal");}
      else if(list.length===1){stealFrom(list[0]);state.pending=null;}
      else state.pending={type:"steal",candidates:list};
      return;
    }
    case "STEAL": stealFrom(a.from); state.pending=null; return;

    case "SET_MODE": state.uiMode=(state.uiMode===a.mode?null:a.mode); return;

    case "BUILD_ROAD":{
      var pr=state.players[state.current], free=state.pending&&state.pending.type==="roadbuilding";
      if(countRoads(state.current)>=PIECE.road)return;
      if(!free){ if(!canAfford(pr.res,COSTS.road))return; pr.res=pay(pr.res,COSTS.road); }
      state.roads[a.edgeId]={owner:state.current}; pushLog("log_built_road",{name:state.current}); recomputeAwards();
      if(free){
        state.pending.left-=1;
        var anyLegal=countRoads(state.current)<PIECE.road&&state.board.edges.some(function(e){return roadLegal(e.id,state.current,state.buildings,state.roads,state.board);});
        if(state.pending.left<=0||!anyLegal){state.pending=null;state.uiMode=null;}
      }
      checkWin(); return;
    }
    case "BUILD_SETTLEMENT":{
      var ps=state.players[state.current];
      if(countType(state.current,"settlement")>=PIECE.settlement)return;
      if(!canAfford(ps.res,COSTS.settlement))return; ps.res=pay(ps.res,COSTS.settlement);
      state.buildings[a.vertexId]={owner:state.current,type:"settlement"}; state.uiMode=null;
      pushLog("log_built_settle",{name:state.current}); recomputeAwards(); checkWin(); return;
    }
    case "BUILD_CITY":{
      var pc=state.players[state.current];
      if(countType(state.current,"city")>=PIECE.city)return;
      if(!canAfford(pc.res,COSTS.city))return; pc.res=pay(pc.res,COSTS.city);
      state.buildings[a.vertexId]={owner:state.current,type:"city"}; state.uiMode=null;
      pushLog("log_built_city",{name:state.current}); checkWin(); return;
    }
    case "BUY_DEV":{
      var pd=state.players[state.current];
      if(!canAfford(pd.res,COSTS.dev)||state.devDeck.length===0)return; pd.res=pay(pd.res,COSTS.dev);
      var card=state.devDeck.shift();
      if(card==="vp")pd.vpCards+=1; else pd.newDev.push(card);
      pushLog("log_bought_dev",{name:state.current}); checkWin(); return;
    }
    case "PLAY_DEV":{
      var pp=state.players[state.current];
      if(pp.playedDevThisTurn)return;
      var idx=pp.dev.indexOf(a.card); if(idx<0)return;
      pp.dev.splice(idx,1); pp.playedDevThisTurn=true; state.uiMode=null;
      pushLog("log_played_dev",{name:state.current,card:a.card});
      if(a.card==="knight"){pp.knights+=1;recomputeAwards();state.uiMode="moveRobber";state.pending={type:"robber",source:"knight"};checkWin();}
      else if(a.card==="road"){state.pending={type:"roadbuilding",left:2};state.uiMode="road";}
      else if(a.card==="plenty"){state.pending={type:"plenty"};state.ui.plentyPicks=[];}
      else if(a.card==="monopoly"){state.pending={type:"monopoly"};}
      return;
    }
    case "PLENTY_TOGGLE": if(state.ui.plentyPicks.length<2)state.ui.plentyPicks.push(a.res); return;
    case "PLENTY_RESET": state.ui.plentyPicks=[]; return;
    case "PLENTY_CONFIRM":{
      var pl2=state.players[state.current]; state.ui.plentyPicks.forEach(function(r){pl2.res[r]+=1;});
      pushLog("log_plenty",{name:state.current,resList:state.ui.plentyPicks.slice()}); state.pending=null; state.ui.plentyPicks=[]; return;
    }
    case "MONOPOLY":{
      var pm=state.players[state.current], taken=0;
      state.players.forEach(function(q,qi){if(qi===state.current)return;taken+=q.res[a.res];q.res[a.res]=0;});
      pm.res[a.res]+=taken; pushLog("log_monopoly",{name:state.current,res:a.res,count:taken}); state.pending=null; return;
    }

    case "SET_BANK": state.ui[a.side]=a.res; return;
    case "BANK_TRADE":{
      var pb=state.players[state.current], g=state.ui.bankGive, ge=state.ui.bankGet;
      var ratio=bestRatio(state.current,g);
      if(pb.res[g]<ratio||g===ge)return; pb.res[g]-=ratio; pb.res[ge]+=1;
      pushLog("log_bank",{name:state.current,ratio:ratio,give:g,get:ge}); return;
    }

    case "END_TURN":{
      var pe=state.players[state.current];
      pe.dev=pe.dev.concat(pe.newDev); pe.newDev=[]; pe.playedDevThisTurn=false;
      state.current=(state.current+1)%state.players.length;
      state.turn={rolled:false,dice:null}; state.uiMode=null; state.pending=null;
      pushLog("log_next",{name:state.current}); return;
    }
  }
}

function pips(n){var m={2:"•",12:"•",3:"••",11:"••",4:"•••",10:"•••",5:"••••",9:"••••",6:"•••••",8:"•••••"};return m[n]||"";}

/* ---- board ---- */
function legalVertSet(){
  var out={}, me=state.current, mode=state.uiMode, setup=state.setup, board=state.board;
  if(state.phase==="setup"&&setup&&setup.placing==="settlement"){
    board.vertices.forEach(function(v){if(settlementLegal(v.id,setup.order[setup.idx],state.buildings,state.roads,board,true))out[v.id]=1;});
  }else if(mode==="settlement"&&countType(me,"settlement")<PIECE.settlement){
    board.vertices.forEach(function(v){if(settlementLegal(v.id,me,state.buildings,state.roads,board,false))out[v.id]=1;});
  }else if(mode==="city"&&countType(me,"city")<PIECE.city){
    for(var k in state.buildings){var b=state.buildings[k];if(b.owner===me&&b.type==="settlement")out[k]=1;}
  }
  return out;
}
function legalEdgeSet(){
  var out={}, me=state.current, mode=state.uiMode, setup=state.setup, board=state.board;
  var who=state.phase==="setup"?(setup?setup.order[setup.idx]:me):me;
  if(countRoads(who)>=PIECE.road)return out;
  if(state.phase==="setup"&&setup&&setup.placing==="road"){
    board.edges.forEach(function(e){if(roadLegal(e.id,setup.order[setup.idx],state.buildings,state.roads,board,setup.lastSettlement))out[e.id]=1;});
  }else if(mode==="road"){
    board.edges.forEach(function(e){if(roadLegal(e.id,me,state.buildings,state.roads,board))out[e.id]=1;});
  }
  return out;
}
function renderBoard(){
  var board=state.board, tiles=state.tiles, pad=46;
  var vb=(board.bounds.minX-pad)+" "+(board.bounds.minY-pad)+" "+(board.bounds.maxX-board.bounds.minX+pad*2)+" "+(board.bounds.maxY-board.bounds.minY+pad*2);
  var moveRobber=state.uiMode==="moveRobber";
  var lv=legalVertSet(), le=legalEdgeSet();
  var s='<svg viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg">';

  board.hexes.forEach(function(h){
    var t=tiles[h.id];
    var pts=h.vertices.map(function(vi){return board.vertices[vi].x+","+board.vertices[vi].y;}).join(" ");
    var clickable=moveRobber&&h.id!==state.robberHex;
    s+='<g '+(clickable?'data-hex="'+h.id+'" style="cursor:pointer"':'')+'>';
    s+='<polygon points="'+pts+'" fill="'+RES_META[t.resource].tile+'" stroke="#244e36" stroke-width="3" stroke-linejoin="round"/>';
    if(clickable)s+='<polygon points="'+pts+'" fill="none" stroke="#ffe08a" stroke-width="4" stroke-linejoin="round"/>';
    s+='<text x="'+h.x+'" y="'+(h.y-SIZE*0.42)+'" text-anchor="middle" font-size="20" opacity="0.9">'+RES_META[t.resource].icon+'</text>';
    if(t.number!==null){
      var red=(t.number===6||t.number===8);
      s+='<circle cx="'+h.x+'" cy="'+(h.y+6)+'" r="16" fill="'+RES_META[t.resource].token+'" stroke="#7a6a45" stroke-width="1.2"/>';
      s+='<text x="'+h.x+'" y="'+(h.y+12)+'" text-anchor="middle" font-size="17" font-weight="700" fill="'+(red?"#c0392b":"#3a3024")+'" font-family="Georgia,serif">'+t.number+'</text>';
      s+='<text x="'+h.x+'" y="'+(h.y+24)+'" text-anchor="middle" font-size="7" fill="'+(red?"#c0392b":"#7a6a45")+'" letter-spacing="1">'+pips(t.number)+'</text>';
    }
    s+='</g>';
  });

  state.harbors.forEach(function(hb){
    var mx=hb.x+hb.dx*26, my=hb.y+hb.dy*26, va=board.vertices[hb.v1], vb3=board.vertices[hb.v2];
    s+='<g pointer-events="none">';
    s+='<line x1="'+va.x+'" y1="'+va.y+'" x2="'+mx+'" y2="'+my+'" stroke="#cdb98a" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.8"/>';
    s+='<line x1="'+vb3.x+'" y1="'+vb3.y+'" x2="'+mx+'" y2="'+my+'" stroke="#cdb98a" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.8"/>';
    s+='<circle cx="'+mx+'" cy="'+my+'" r="13" fill="#1f3242" stroke="#cdb98a" stroke-width="1.5"/>';
    if(hb.kind==="any"){
      s+='<text x="'+mx+'" y="'+(my+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#f3ecda">3:1</text>';
    }else{
      s+='<text x="'+mx+'" y="'+(my-2)+'" text-anchor="middle" font-size="11">'+RES_META[hb.kind].icon+'</text>';
      s+='<text x="'+mx+'" y="'+(my+9)+'" text-anchor="middle" font-size="8" font-weight="700" fill="#f3ecda">2:1</text>';
    }
    s+='</g>';
  });

  if(state.robberHex>=0){
    var rh=board.hexes[state.robberHex];
    s+='<g transform="translate('+(rh.x-20)+','+(rh.y-4)+')" pointer-events="none">'+
       '<ellipse cx="0" cy="14" rx="8" ry="3" fill="rgba(0,0,0,.3)"/>'+
       '<path d="M0,-12 C6,-12 7,-4 5,2 L7,14 L-7,14 L-5,2 C-7,-4 -6,-12 0,-12 Z" fill="#2c2c2c" stroke="#000" stroke-width="0.8"/>'+
       '<circle cx="0" cy="-12" r="5" fill="#2c2c2c" stroke="#000" stroke-width="0.8"/></g>';
  }

  for(var rid in state.roads){
    var e=board.edges[rid], va=board.vertices[e.v1], vb2=board.vertices[e.v2];
    s+='<line x1="'+va.x+'" y1="'+va.y+'" x2="'+vb2.x+'" y2="'+vb2.y+'" stroke="'+PCOL[state.roads[rid].owner].main+'" stroke-width="9" stroke-linecap="round"/>';
  }
  for(var eid in le){
    var e2=board.edges[eid];
    s+='<line data-edge="'+eid+'" x1="'+board.vertices[e2.v1].x+'" y1="'+board.vertices[e2.v1].y+'" x2="'+board.vertices[e2.v2].x+'" y2="'+board.vertices[e2.v2].y+'" stroke="#fff7d6" stroke-width="9" stroke-linecap="round" opacity="0.55" style="cursor:pointer">'+
       '<animate attributeName="opacity" values="0.3;0.75;0.3" dur="1.4s" repeatCount="indefinite"/></line>';
  }

  for(var bid in state.buildings){
    var b=state.buildings[bid], v=board.vertices[bid], col=PCOL[b.owner], sz=b.type==="city"?13:9;
    var d="M "+(v.x-sz)+" "+(v.y+sz)+" L "+(v.x-sz)+" "+(v.y-sz*0.25)+" L "+v.x+" "+(v.y-sz)+" L "+(v.x+sz)+" "+(v.y-sz*0.25)+" L "+(v.x+sz)+" "+(v.y+sz)+" Z";
    s+='<g pointer-events="none"><path d="'+d+'" fill="'+col.main+'" stroke="'+col.dark+'" stroke-width="2" stroke-linejoin="round"/>';
    if(sz>11)s+='<circle cx="'+v.x+'" cy="'+(v.y+sz*0.15)+'" r="'+(sz*0.28)+'" fill="'+col.dark+'" opacity="0.5"/>';
    s+='</g>';
  }
  for(var vid in lv){
    var vv=board.vertices[vid];
    s+='<circle data-vert="'+vid+'" cx="'+vv.x+'" cy="'+vv.y+'" r="9" fill="#fff7d6" stroke="#caa33a" stroke-width="2" opacity="0.85" style="cursor:pointer">'+
       '<animate attributeName="r" values="7;10;7" dur="1.3s" repeatCount="indefinite"/></circle>';
  }
  s+='</svg>';
  return s;
}

/* ---- sidebar ---- */
function renderSidebar(){
  var me=state.current, p=state.players[me], c=PCOL[me];
  var isSetup=state.phase==="setup";
  var blocking=!!state.pending&&state.pending.type!=="robber";
  var mustRobber=state.uiMode==="moveRobber";
  var canAct=state.phase==="play"&&!blocking&&!mustRobber;
  var rolled=state.turn&&state.turn.rolled;
  var canBuild=canAct&&rolled;
  var canPlayDev=canAct&&!p.playedDevThisTurn;
  var roadsLeft=PIECE.road-countRoads(me), settLeft=PIECE.settlement-countType(me,"settlement"), cityLeft=PIECE.city-countType(me,"city");

  var resCells=RES.map(function(r){
    return '<div class="res-cell" style="background:'+RES_META[r].token+'" title="'+esc(resLabel(r))+'"><div class="ic">'+RES_META[r].icon+'</div><div class="n">'+p.res[r]+'</div></div>';
  }).join("");

  var devSection="";
  if(p.dev.length||p.newDev.length||p.vpCards){
    var items=p.dev.map(function(d){return '<button class="devbtn" data-act="playdev" data-card="'+d+'" '+(canPlayDev?"":"disabled")+' title="'+esc(devDesc(d))+'">'+esc(devLabel(d))+'</button>';}).join("");
    items+=p.newDev.map(function(d){return '<span class="newdev" title="'+esc(tr("tip_newdev"))+'">'+esc(devLabel(d))+' '+esc(tr("new_suffix"))+'</span>';}).join("");
    if(p.vpCards)items+='<span class="vpbadge">'+esc(tr("vp_card"))+p.vpCards+'</span>';
    devSection='<div style="margin-bottom:12px"><div class="seclbl">'+esc(tr("dev_cards"))+'</div><div class="devrow">'+items+'</div></div>';
  }

  var actions;
  if(isSetup){
    actions='<div class="hint">'+esc(tr("place_a"))+' <b>'+esc(state.setup.placing==="settlement"?tr("s_settlement"):tr("s_road"))+'</b> '+esc(tr("on_board"))+'</div>';
  }else if(mustRobber){
    actions='<div class="hint">'+esc(tr("click_robber"))+'</div>';
  }else{
    var rb=(state.pending&&state.pending.type==="roadbuilding")?'<div class="hint gold">'+esc(tr("rb_hint"))+' ('+state.pending.left+')</div>':'';
    var rollRow= !rolled
      ? '<button class="btn-roll" data-act="roll" '+(canAct?"":"disabled")+'>'+esc(tr("roll"))+'</button>'
      : renderDice(state.turn.dice);
    function bb(label,cost,mode,enabled,act){
      var costStr=Object.keys(cost).map(function(k){return cost[k]+RES_META[k].icon;}).join(" ");
      var cls="bbtn"+(state.uiMode===mode?" active":"");
      var data=act?'data-act="'+act+'"':'data-act="mode" data-mode="'+mode+'"';
      return '<button class="'+cls+'" '+data+' '+(enabled?"":"disabled")+'><div>'+esc(label)+'</div><div class="cost">'+costStr+'</div></button>';
    }
    var buildGrid='<div class="grid2">'+
      bb(tr("b_road"),COSTS.road,"road",canBuild&&canAfford(p.res,COSTS.road)&&roadsLeft>0)+
      bb(tr("b_settlement"),COSTS.settlement,"settlement",canBuild&&canAfford(p.res,COSTS.settlement)&&settLeft>0)+
      bb(tr("b_city"),COSTS.city,"city",canBuild&&canAfford(p.res,COSTS.city)&&cityLeft>0&&countType(me,"settlement")>0)+
      bb(tr("b_dev"),COSTS.dev,"dev",canBuild&&canAfford(p.res,COSTS.dev)&&state.devDeck.length>0,"buydev")+
    '</div>';
    var giveRatio=bestRatio(me,state.ui.bankGive);
    var bankDisabled=(!canBuild)||p.res[state.ui.bankGive]<giveRatio||state.ui.bankGive===state.ui.bankGet;
    var sel=function(side){return '<select data-act="setbank" data-side="'+side+'">'+RES.map(function(r){return '<option value="'+r+'"'+(state.ui[side]===r?" selected":"")+'>'+RES_META[r].icon+' '+esc(resLabel(r))+'</option>';}).join("")+'</select>';};
    var bank='<div class="banktrade"><div class="seclbl" style="margin-bottom:4px">'+esc(tr("bank_trade"))+'</div>'+
      '<div class="row">'+sel("bankGive")+'<span class="ratio">'+giveRatio+':1</span><span class="arrow">→</span>'+sel("bankGet")+
      '<button class="tradebtn" data-act="trade" '+(bankDisabled?"disabled":"")+'>'+esc(tr("trade"))+'</button></div></div>';
    var endBtn='<button class="btn-end" data-act="endturn" '+((rolled&&canAct)?"":"disabled")+'>'+esc(tr("end_turn"))+'</button>';
    actions='<div class="actions">'+rb+rollRow+buildGrid+bank+endBtn+'</div>';
  }

  var card='<div class="panel"><div class="phead" style="background:'+c.main+';color:'+c.text+'">'+
      '<span class="who"><span class="miniwhite"></span>'+esc(colorName(me))+'</span>'+
      '<span style="font-size:14px;font-weight:700">'+fullVP(me)+' / 10 ★</span></div>'+
    '<div class="pp">'+
      '<div class="res-grid">'+resCells+'</div>'+
      '<div class="supply"><span class="lbl">'+esc(tr("supply"))+'</span><span class="nums">'+
        '<span title="'+esc(tr("b_road"))+'">🛤️ '+roadsLeft+'</span>'+
        '<span title="'+esc(tr("b_settlement"))+'">🏠 '+settLeft+'</span>'+
        '<span title="'+esc(tr("b_city"))+'">🏛️ '+cityLeft+'</span></span></div>'+
      devSection+actions+
    '</div></div>';

  return '<div class="sidebar">'+card+renderScoreboard()+renderLog()+'</div>';
}

function renderDice(d){
  function die(n){var dots={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n];
    var cells="";for(var i=0;i<9;i++)cells+='<span>'+(dots.indexOf(i)>=0?'<span class="pip"></span>':'')+'</span>';
    return '<div class="die">'+cells+'</div>';}
  return '<div class="dice">'+die(d[0])+die(d[1])+'<span class="dsum">= '+(d[0]+d[1])+'</span></div>';
}

function renderScoreboard(){
  var rows=state.players.map(function(p,pi){
    var c=PCOL[pi];
    return '<div class="score-row'+(pi===state.current?" cur":"")+'">'+
      '<span class="dot" style="background:'+c.main+'"></span>'+
      '<span class="nm">'+esc(colorName(pi))+'</span>'+
      '<span class="vp">'+publicVP(pi)+' ★</span>'+
      '<span class="meta"><span title="'+esc(tr("tip_hand"))+'">🂠 '+totalCards(p.res)+'</span>'+
        '<span title="'+esc(tr("tip_knights"))+'">⚔ '+p.knights+'</span>'+
        (state.longestRoadOwner===pi?'<span title="'+esc(tr("tip_lroad"))+'">🛤️</span>':'')+
        (state.largestArmyOwner===pi?'<span title="'+esc(tr("tip_larmy"))+'">🏰</span>':'')+
      '</span></div>';
  }).join("");
  return '<div class="panel pp scoreboard"><div class="seclbl">'+esc(tr("settlers"))+'</div>'+rows+'</div>';
}

function renderLog(){
  var lines=state.log.map(function(l,i){return '<div class="ln'+(i===0?" first":"")+'">'+esc(logText(l))+'</div>';}).join("");
  return '<div class="log"><div class="lh">'+esc(tr("game_log"))+'</div>'+lines+'</div>';
}

/* ---- modals ---- */
function renderModals(){
  if(!state.pending&&state.phase!=="gameover")return "";
  if(state.phase==="gameover")return modalWin();
  switch(state.pending.type){
    case "discard": return modalDiscard();
    case "steal": return modalSteal();
    case "plenty": return modalPlenty();
    case "monopoly": return modalMonopoly();
  }
  return "";
}
function shell(color,inner){return '<div class="overlay"><div class="modal"><div class="bar" style="background:'+color+'"></div><div class="body">'+inner+'</div></div></div>';}
function modalDiscard(){
  var item=state.pending.queue[state.pending.qi], p=state.players[item.pi], c=PCOL[item.pi];
  var sel=state.ui.discardSel, selected=totalCards(sel);
  var rows=RES.filter(function(r){return p.res[r]>0;}).map(function(r){
    return '<div class="drow"><span class="rn">'+RES_META[r].icon+' '+esc(resLabel(r))+'</span>'+
      '<span class="have">'+esc(tr("discard_have"))+' '+p.res[r]+'</span>'+
      '<button class="pm" data-act="discadj" data-res="'+r+'" data-d="-1">−</button>'+
      '<span class="cnt">'+sel[r]+'</span>'+
      '<button class="pm" data-act="discadj" data-res="'+r+'" data-d="1">+</button></div>';
  }).join("");
  var btn='<button class="mbtn" style="background:'+c.main+'" '+(selected===item.count?"":"disabled")+' data-act="disconfirm">'+
    esc(tr("discard_btn",{sel:selected,count:item.count}))+'</button>';
  return shell(c.main,'<h3 style="color:'+c.main+'">'+esc(tr("discard_title",{name:colorName(item.pi)}))+'</h3>'+
    '<p>'+esc(tr("discard_desc",{count:item.count}))+'</p>'+rows+btn);
}
function modalSteal(){
  var opts=state.pending.candidates.map(function(pi){var c=PCOL[pi];
    return '<button class="steal-opt" style="background:'+c.main+'" data-act="steal" data-pi="'+pi+'">'+
      '<span class="miniwhite"></span>'+esc(colorName(pi))+'<span class="c">'+totalCards(state.players[pi].res)+' '+esc(tr("cards"))+'</span></button>';}).join("");
  return shell("#1f3242",'<h3 style="color:#1f3242">'+esc(tr("steal_title"))+'</h3>'+opts);
}
function modalPlenty(){
  var picks=state.ui.plentyPicks;
  var grid=RES.map(function(r){return '<button data-act="plentytoggle" data-res="'+r+'" style="background:'+RES_META[r].token+'"><div class="ic">'+RES_META[r].icon+'</div></button>';}).join("");
  var picked='<div class="picked">'+esc(tr("plenty_picked"))+' '+(picks.map(function(r){return RES_META[r].icon;}).join(" ")||"—")+
    (picks.length?'<button class="reset" data-act="plentyreset">'+esc(tr("plenty_reset"))+'</button>':'')+'</div>';
  var btn='<button class="mbtn" style="background:#caa33a" '+(picks.length===2?"":"disabled")+' data-act="plentyconfirm">'+esc(tr("plenty_btn"))+'</button>';
  return shell("#caa33a",'<h3 style="color:#7a5e12">'+esc(tr("plenty_title"))+'</h3><p>'+esc(tr("plenty_desc"))+'</p>'+
    '<div class="resgrid">'+grid+'</div>'+picked+btn);
}
function modalMonopoly(){
  var grid=RES.map(function(r){return '<button data-act="monopoly" data-res="'+r+'" style="background:'+RES_META[r].token+'"><div class="ic">'+RES_META[r].icon+'</div><div class="nm">'+esc(resLabel(r))+'</div></button>';}).join("");
  return shell("#cf3a36",'<h3 style="color:#8e221f">'+esc(tr("mono_title"))+'</h3><p>'+esc(tr("mono_desc"))+'</p><div class="resgrid">'+grid+'</div>');
}
function modalWin(){
  var pi=state.winner, c=PCOL[pi];
  return shell(c.main,'<div class="wincenter"><div class="trophy">🏆</div>'+
    '<h3 style="color:'+c.main+'">'+esc(tr("win_title",{name:colorName(pi)}))+'</h3>'+
    '<p>'+esc(tr("win_sub"))+'</p>'+
    '<button class="again" data-act="newgame" style="background:'+c.main+'">'+esc(tr("win_again"))+'</button></div>');
}

/* ---- board click routing ---- */
function clickVertex(v){
  var setup=state.setup, mode=state.uiMode, lv=legalVertSet();
  if(!lv[v])return;
  if(state.phase==="setup"&&setup.placing==="settlement")dispatch({type:"SETUP_SETTLEMENT",vertexId:Number(v)});
  else if(mode==="settlement")dispatch({type:"BUILD_SETTLEMENT",vertexId:Number(v)});
  else if(mode==="city")dispatch({type:"BUILD_CITY",vertexId:Number(v)});
}
function clickEdge(e){
  var setup=state.setup, mode=state.uiMode, le=legalEdgeSet();
  if(!le[e])return;
  if(state.phase==="setup"&&setup.placing==="road")dispatch({type:"SETUP_ROAD",edgeId:Number(e)});
  else if(mode==="road")dispatch({type:"BUILD_ROAD",edgeId:Number(e)});
}

/* ---- event delegation ---- */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act],[data-vert],[data-edge],[data-hex]");
  if(!t)return;
  if(t.hasAttribute("data-vert")){clickVertex(t.getAttribute("data-vert"));return;}
  if(t.hasAttribute("data-edge")){clickEdge(t.getAttribute("data-edge"));return;}
  if(t.hasAttribute("data-hex")){dispatch({type:"MOVE_ROBBER",hexId:Number(t.getAttribute("data-hex"))});return;}
  var act=t.getAttribute("data-act");
  switch(act){
    case "lang": dispatch({type:"SET_LANG",lang:t.getAttribute("data-lang")}); break;
    case "setn": dispatch({type:"SET_N",n:Number(t.getAttribute("data-n"))}); break;
    case "begin": dispatch({type:"NEW_GAME",n:state.ui.startN}); break;
    case "newgame": dispatch({type:"NEW_GAME",n:(state.players?state.players.length:state.ui.startN)}); break;
    case "roll": dispatch({type:"ROLL"}); break;
    case "mode": dispatch({type:"SET_MODE",mode:t.getAttribute("data-mode")}); break;
    case "buydev": dispatch({type:"BUY_DEV"}); break;
    case "playdev": dispatch({type:"PLAY_DEV",card:t.getAttribute("data-card")}); break;
    case "endturn": dispatch({type:"END_TURN"}); break;
    case "trade": dispatch({type:"BANK_TRADE"}); break;
    case "discadj": dispatch({type:"DISCARD_ADJ",res:t.getAttribute("data-res"),d:Number(t.getAttribute("data-d"))}); break;
    case "disconfirm": dispatch({type:"DISCARD_CONFIRM"}); break;
    case "steal": dispatch({type:"STEAL",from:Number(t.getAttribute("data-pi"))}); break;
    case "plentytoggle": dispatch({type:"PLENTY_TOGGLE",res:t.getAttribute("data-res")}); break;
    case "plentyreset": dispatch({type:"PLENTY_RESET"}); break;
    case "plentyconfirm": dispatch({type:"PLENTY_CONFIRM"}); break;
    case "monopoly": dispatch({type:"MONOPOLY",res:t.getAttribute("data-res")}); break;
  }
});
document.addEventListener("change",function(ev){
  var t=ev.target.closest('[data-act="setbank"]');
  if(!t)return;
  dispatch({type:"SET_BANK",side:t.getAttribute("data-side"),res:t.value});
});

/* ---- go ---- */
render();
</script>
