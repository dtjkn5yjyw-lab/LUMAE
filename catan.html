<style>
  :root{
    --sea:#2a6f97; --panel:#f3ecda; --panel2:#e6dcc2; --ink:#2a2620;
    --slate:#7a231d; --slate2:#98332a; --slate3:#b4463a; --muted:#8a7d5e;
    --gold:#caa33a; --orange:#e2882a; --red:#cf3a36; --redd:#b8302c;
    --p0:#cf3a36; --p1:#2f6fd0; --p2:#e2882a; --p3:#f3efe2;
    --p0d:#8e221f; --p1d:#1d4a91; --p2d:#a85d12; --p3d:#9a9484;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    background:
      radial-gradient(circle at 50% 12%, rgba(250,214,120,.28) 0%, rgba(250,214,120,.09) 20%, rgba(250,214,120,0) 42%),
      linear-gradient(180deg, #b82617 0%, #cf4419 32%, #dd6a1f 60%, #e88b26 82%, #f0a52c 100%);
    background-attachment:fixed;
    -webkit-text-size-adjust:100%;
  }
  .ui{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .display{font-family:Georgia,'Iowan Old Style',serif;letter-spacing:.04em}
  .wrap{max-width:1040px;margin:0 auto;padding:16px 12px}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  button:disabled{cursor:not-allowed}
  select{font-family:ui-sans-serif,system-ui,sans-serif}

  /* ---- menu ---- */
  .menu{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(circle at 50% 30%, rgba(250,214,120,.55) 0%, rgba(250,214,120,.18) 22%, rgba(250,214,120,0) 42%),
      linear-gradient(180deg, #c4291a 0%, #d94d1c 34%, #ec7b23 60%, #f5a52a 82%, #f7c657 100%);
    color:#fff6e2;text-align:center}
  .menu .inner{max-width:460px}
  .menu .anchor{font-size:58px;margin-bottom:6px}

  .menu .q{font-family:ui-sans-serif,system-ui,sans-serif;color:#fff0d4;font-size:14px;margin-bottom:12px;text-shadow:0 1px 2px rgba(90,20,8,.35)}
  .menu .moderow{display:flex;gap:12px;justify-content:center;margin-bottom:26px}
  .menu .modebtn{font-family:Georgia,serif;letter-spacing:.05em;font-size:15px;padding:10px 22px;border-radius:10px;
    border:2px solid rgba(255,236,196,.42);background:rgba(120,30,14,.22);color:#fff1d6;transition:.15s}
  .menu .modebtn:hover{background:rgba(120,30,14,.34)}
  .menu .modebtn.on{background:linear-gradient(180deg,#8d2a12,#6d1d0d);border-color:#f7c657;color:#fff;

  .menu .ns{display:flex;gap:12px;justify-content:center;margin-bottom:30px}
  .menu .ns button{width:54px;height:54px;border-radius:50%;font-size:20px;font-weight:700;border:2px solid rgba(255,236,196,.42);

  .menu .ns button:hover{background:rgba(120,30,14,.34)}
  .menu .ns button.on{background:linear-gradient(180deg,#f7c657,#ef8f24);border-color:#fff6e2;color:#5b1c08;transform:scale(1.1);

<script>
"use strict";
/* ============================================================
   CATAN — Pass & Play  ·  standalone, offline, single file
   Aligned with the official Catan-Almanach (Kosmos, 2010, 3–4 P.)
   ============================================================ */

/* ---------- constants ---------- */
var VERSION="26.07.19.4";
function fmtClock(){
  if(!window.state||!state.startTime) return "00:00";
  var s=Math.floor((Date.now()-state.startTime)/1000);
  var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  var pad=function(n){return (n<10?"0":"")+n;};
  return (h?h+":"+pad(m):pad(m))+":"+pad(sec);
}
var SIZE=52, SQRT3=Math.sqrt(3), ROWS=[3,4,5,4,3];
var RES=["wood","brick","sheep","wheat","ore"];
/* ---- Städte & Ritter: Handelswaren ---- */
var COMM=["paper","cloth","coin"];
var COMM_META={
  paper:{icon:"📜",label:"Papier",from:"wood"},
  cloth:{icon:"🧵",label:"Tuch",from:"sheep"},
  coin:{icon:"🪙",label:"Münzen",from:"ore"}
};
var COMM_OF={wood:"paper",sheep:"cloth",ore:"coin"};
/* ---- Städte & Ritter: Stadtausbau-Tableaus ---- */
var AREAS=["science","trade","politics"];
var AREA_META={
  science:{comm:"paper", label:"Wissenschaft", icon:"📜",
           steps:["Stadt","Bibliothek","Schule","Aquädukt","Theater","Universität"]},
  trade:  {comm:"cloth", label:"Handel", icon:"🧵",
           steps:["Stadt","Markt","Zunft","Gilde","Bank","Handelszentrum"]},
  politics:{comm:"coin", label:"Politik", icon:"🪙",
           steps:["Stadt","Rathaus","Botschaft","Festung","Gericht","Rat Catans"]}
};
/* 54 Fortschrittskarten nach PDF-Aufteilung (18 je Bereich) */
var PROG_DECK={
  science:{alchemie:2,baukran:2,bergbau:2,bewaesserung:2,erfindung:2,ingenieurwesen:1,medizin:2,schmiedekunst:2,strassenbau:2,buchdruck:1},
  trade:{haendler:6,handelshafen:2,handelsflotte:2,abgaben:2,warenmonopol:2,rohstoffmonopol:4},
  politics:{steuern:2,diplomatie:2,motivation:2,hochzeit:2,intrige:2,sabotage:2,spionage:3,verrat:2,verfassung:1}
};
var PROG_NAME={
  alchemie:"Alchemie",baukran:"Baukran",bergbau:"Bergbau",bewaesserung:"Bewässerung",erfindung:"Erfindung",
  ingenieurwesen:"Ingenieurwesen",medizin:"Medizin",schmiedekunst:"Schmiedekunst",strassenbau:"Straßenbau",buchdruck:"Buchdruck",
  haendler:"Händler",handelshafen:"Handelshafen",handelsflotte:"Handelsflotte",abgaben:"Abgaben",
  warenmonopol:"Handelswaren-Monopol",rohstoffmonopol:"Rohstoff-Monopol",
  steuern:"Steuern",diplomatie:"Diplomatie",motivation:"Motivation",hochzeit:"Hochzeit",intrige:"Intrige",
  sabotage:"Sabotage",spionage:"Spionage",verrat:"Verrat",verfassung:"Verfassung"
};
var PROG_VP={buchdruck:1,verfassung:1};
function buildProgDecks(){
  var out={};
  AREAS.forEach(function(a){
    var arr=[]; for(var k in PROG_DECK[a]){ for(var i=0;i<PROG_DECK[a][k];i++) arr.push(k); }
    out[a]=shuffle(arr);
  });
  return out;
}
function impLevel(pi,area){ var p=state.players[pi]; return (p&&p.imp&&p.imp[area])||0; }
function impCost(level){ return level+1; }   // 1. Ausbau 1 Karte, 2. Ausbau 2 Karten usw.
function craneCost(pi,level){ return Math.max(0,impCost(level)-((state.turn&&state.turn.crane)?1:0)); }  // laut PDF darf auch der erste Ausbau gratis sein
function hasCity(pi){ return countType(pi,"city")>0; }
function freeWallCity(pi){
  return Object.keys(state.buildings).find(function(b){
    var x=state.buildings[b];
    return x.owner===pi&&x.type==="city"&&!x.captured&&!state.walls[b];
  });
}
function metroOf(area){ return (state.metro&&state.metro[area]!=null)?state.metro[area]:null; }
function metroCount(pi){ var n=0; AREAS.forEach(function(a){ if(metroOf(a)===pi)n++; }); return n; }
function isMetroVertex(v){ if(!state.metroVertex)return false; return AREAS.some(function(a){return state.metroVertex[a]===Number(v);}); }
function freeCityVertex(pi){
  return Object.keys(state.buildings).find(function(v){
    var b=state.buildings[v];
    return b.owner===pi&&b.type==="city"&&!b.captured&&!isMetroVertex(v);
  });
}
function canImprove(pi,area){
  if(!isSR())return false;
  var lvl=impLevel(pi,area);
  if(lvl>=5)return false;
  if(!hasCity(pi))return false;                             // ohne Stadt kein Stadtausbau
  if(lvl===3 && freeCityVertex(pi)==null)return false;      // 4. Stufe braucht eine freie Stadt für die Metropole
  var need=craneCost(pi,lvl), c=AREA_META[area].comm;
  return (state.players[pi].comm[c]||0)>=need;
}
function grantMetropolis(pi,area){
  var v=freeCityVertex(pi); if(v==null)return false;
  var prev=metroOf(area);
  if(prev!=null && prev!==pi){ state.metroVertex[area]=null; pushLog("log_metro_lost",{name:prev,a:tr("area_"+area)}); }
  state.metro[area]=pi; state.metroVertex[area]=Number(v);
  pushLog("log_metro",{name:pi,a:tr("area_"+area)});
  return true;
}
/* Hilfen für die Kartenwirkungen */
function progAreaOf(card){
  for(var a in PROG_DECK){ if(PROG_DECK[a][card]!=null) return a; }
  return "science";
}
function hexHarvest(pi,resKind){        // Bergbau / Bewässerung: 2 Karten je passendem Feld
  var got=0;
  state.tiles.forEach(function(t,hi){
    if(t.resource!==resKind)return;
    var touches=state.board.hexes[hi].vertices.some(function(v){
      var b=state.buildings[v]; return b&&b.owner===pi&&!b.captured;
    });
    if(touches){ state.players[pi].res[resKind]+=2; got+=2; }
  });
  return got;
}
function handPool(pi){                  // alle Handkarten als Liste (Rohstoffe + Handelswaren)
  var p=state.players[pi], pool=[];
  RES.forEach(function(r){ for(var i=0;i<p.res[r];i++) pool.push(r); });
  if(isSR()) COMM.forEach(function(c){ for(var j=0;j<(p.comm[c]||0);j++) pool.push(c); });
  return pool;
}
function takeRandomCards(fromPi,toPi,count){
  var moved=[];
  for(var i=0;i<count;i++){
    var pool=handPool(fromPi); if(!pool.length)break;
    var k=pool[Math.floor(Math.random()*pool.length)];
    addHold(fromPi,k,-1); if(toPi!=null) addHold(toPi,k,1);
    moved.push(k);
  }
  return moved;
}
function playersWithMoreVP(pi){
  return state.players.map(function(_,i){return i;}).filter(function(i){ return i!==pi && fullVP(i)>fullVP(pi); });
}
/* Offene Straße im Sinne der Karte Diplomatie: liegt am Ende einer Route und
   endet nicht an einer eigenen Siedlung, Stadt oder einem eigenen Ritter. */
function ownEdgeCount(v,pl){
  return state.board.vertices[v].edges.filter(function(e){
    var r=state.roads[e], s=state.ships&&state.ships[e];
    return (r&&r.owner===pl)||(s&&s.owner===pl);
  }).length;
}
function openRoadEdges(){
  var out={};
  state.board.edges.forEach(function(e){
    var r=state.roads[e.id]; if(!r)return;
    [e.v1,e.v2].forEach(function(v){
      if(out[e.id])return;
      if(ownEdgeCount(v,r.owner)>1)return;                       // wird fortgeführt
      var b=state.buildings[v]; if(b&&b.owner===r.owner)return;   // endet an eigenem Gebäude
      var k=knightAt(v); if(k&&k.owner===r.owner)return;          // endet an eigenem Ritter
      out[e.id]=r.owner;
    });
  });
  return out;
}
/* Zahlenchips, die die Karte Erfindung tauschen darf (2, 12, 6 und 8 sind tabu) */
function swappableHexes(){
  var out={};
  state.tiles.forEach(function(t,hi){
    if(t.number==null)return;
    if([2,12,6,8].indexOf(t.number)>=0)return;
    out[hi]=1;
  });
  return out;
}
/* Fremde Ritter, die die Karte Intrige vertreiben darf */
function intrigueTargets(pi){
  var out={};
  for(var v in (state.knights||{})){
    var k=state.knights[v];
    if(k.owner===pi)continue;
    if(!vertexOnMyNetwork(Number(v),pi))continue;
    out[v]=1;
  }
  return out;
}
function progPlayable(pi,card){
  var p=state.players[pi];
  if(card==="alchemie") return !state.turn.rolled;
  if(!state.turn.rolled) return false;
  if(card==="medizin") return countType(pi,"settlement")>0&&canAfford(p.res,{ore:2,wheat:1});
  if(card==="ingenieurwesen") return (p.walls||0)<3&&freeWallCity(pi)!=null;
  if(card==="diplomatie") return Object.keys(openRoadEdges()).length>0;
  if(card==="intrige") return Object.keys(intrigueTargets(pi)).length>0;
  if(card==="erfindung") return Object.keys(swappableHexes()).length>=2;
  return true;
}
function drawProgress(area,red){
  var n=state.players.length, order=[];
  for(var i=0;i<n;i++) order.push((state.current+i)%n);
  order.forEach(function(pi){
    var lvl=impLevel(pi,area);
    if(lvl<1)return;
    if(red>lvl+1)return;                                    // rote Würfelzahl muss die Bedingung erfüllen
    var deck=state.progDecks&&state.progDecks[area];
    if(!deck||!deck.length)return;
    var card=deck.shift(), p=state.players[pi];
    if(PROG_VP[card]){ p.vpCards+=PROG_VP[card]; pushLog("log_prog_vp",{name:pi,a:PROG_NAME[card]}); return; }
    p.prog=p.prog||[];
    p.prog.push(card);
    pushLog("log_prog_draw",{name:pi,a:tr("area_"+area)});
    if(p.prog.length>4){
      // 5. Karte: Wer an der Reihe ist, muss sofort eine Karte einsetzen,
      // alle anderen geben eine beliebige Karte unter den Stapel zurück (PDF S. 7).
      if(pi===state.current) state.mustPlayProg=pi;
      else{
        var di=Math.floor(Math.random()*p.prog.length), back=p.prog.splice(di,1)[0];
        state.progDecks[progAreaOf(back)].push(back);
        pushLog("log_prog_giveback",{name:pi,a:PROG_NAME[back]});
      }
    }
  });
}
function emptyComm(){return{paper:0,cloth:0,coin:0};}
function freshDiscardSel(){ var o=emptyRes(); COMM.forEach(function(c){o[c]=0;}); return o; }
function selTotal(sel){ return Object.keys(sel).reduce(function(s,k){return s+(sel[k]||0);},0); }
function commTotal(c){return c?COMM.reduce(function(s,k){return s+(c[k]||0);},0):0;}
function isSR(){return state.mode==="sr"||!!state.srSea;}   // Seefahrer-Szenarien lassen sich mit Städte & Ritter kombinieren
function handTotal(p){return totalCards(p.res)+(isSR()?commTotal(p.comm):0);}
function handLimit(p){return 7+(isSR()?2*(p.walls||0):0);}

/* ---- island generator: contiguous islands that never touch each other ---- */
function hexDist(a,b){ var dq=a.q-b.q, dr=a.r-b.r; return (Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2; }
function hexAdjacency(coords){
  var idx={}; coords.forEach(function(c,i){ idx[c.q+","+c.r]=i; });
  var DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  return coords.map(function(c){
    var out=[];
    DIRS.forEach(function(d){ var j=idx[(c.q+d[0])+","+(c.r+d[1])]; if(j!=null) out.push(j); });
    return out;
  });
}
// returns owner[] (island index per hex, -1 = sea) or null if it could not be laid out
function makeIslandRegions(coords,sizes,maxDist){
  var adj=hexAdjacency(coords), nIsl=sizes.length;
  var cand=[]; coords.forEach(function(c,i){ if(c.dist<=maxDist) cand.push(i); });
  for(var attempt=0;attempt<300;attempt++){
    var owner=coords.map(function(){return -1;});
    var seeds=[], pool=shuffle(cand.slice()), ok=true;
    for(var s=0;s<nIsl;s++){
      var found=-1;
      for(var p=0;p<pool.length;p++){
        var i=pool[p]; if(owner[i]!==-1) continue;
        var good=true;
        for(var t=0;t<seeds.length;t++){ if(hexDist(coords[i],coords[seeds[t]])<4){ good=false; break; } }
        if(good){ found=i; break; }
      }
      if(found<0){ ok=false; break; }
      seeds.push(found); owner[found]=s;
    }
    if(!ok) continue;
    var counts=seeds.map(function(){return 1;}), stuck=false;
    for(var g=0;g<2000;g++){
      var done=true;
      for(var s2=0;s2<nIsl;s2++){
        if(counts[s2]>=sizes[s2]) continue;
        done=false;
        var opts=[];
        for(var hi=0;hi<owner.length;hi++){
          if(owner[hi]!==s2) continue;
          adj[hi].forEach(function(j){
            if(owner[j]!==-1||coords[j].dist>maxDist) return;
            var bad=false;
            adj[j].forEach(function(k){ if(owner[k]!==-1&&owner[k]!==s2) bad=true; });
            if(!bad) opts.push(j);
          });
        }
        if(!opts.length){ stuck=true; break; }
        var pick=opts[Math.floor(Math.random()*opts.length)];
        owner[pick]=s2; counts[s2]++;
      }
      if(stuck||done) break;
    }
    if(stuck) continue;
    var complete=true;
    for(var c2=0;c2<nIsl;c2++) if(counts[c2]<sizes[c2]) complete=false;
    if(complete) return owner;
  }
  return null;
}
// Aufbauhinweis: Wald und Weideland sollen keine zu schlechten Zahlen (2/12) erhalten
function avoidWeakWoodSheep(tiles){
  var weak=[2,12];
  tiles.forEach(function(t,i){
    if((t.resource!=="wood"&&t.resource!=="sheep")||t.number===null) return;
    if(weak.indexOf(t.number)<0) return;
    for(var j=0;j<tiles.length;j++){
      var o=tiles[j];
      if(o.number===null||j===i) continue;
      if(o.resource==="wood"||o.resource==="sheep") continue;
      if(weak.indexOf(o.number)>=0) continue;
      var tmp=t.number; t.number=o.number; o.number=tmp; return;
    }
  });
}
/* Rings um jedes Spielfeld liegt ein Kranz aus "offener See": echte Hexfelder mit
   derselben Geometrie, aber weder befahrbar noch bebaubar. Sie entstehen hier, damit
   sie exakt bündig anschließen und später eigene Grafiken tragen können. */
function deepSeaRing(centers){
  var w=SIZE*SQRT3, hh=SIZE*1.5;
  var offs=[[w,0],[-w,0],[w/2,hh],[-w/2,hh],[w/2,-hh],[-w/2,-hh]];
  var key=function(x,y){ return Math.round(x)+","+Math.round(y); };
  var have={}; centers.forEach(function(c){ have[key(c.x,c.y)]=1; });
  var ring=[], seen={};
  centers.forEach(function(c){
    offs.forEach(function(o){
      var x=c.x+o[0], y=c.y+o[1], k=key(x,y);
      if(have[k]||seen[k])return;
      seen[k]=1; ring.push({x:x,y:y});
    });
  });

}
function assembleBoard(centers){
  var deepFrom=centers.length;

  function corner(cx,cy,i){var a=Math.PI/180*(60*i-30);return{x:cx+SIZE*Math.cos(a),y:cy+SIZE*Math.sin(a)};}
  var vmap={}, vertices=[];
  function vid(p){var key=Math.round(p.x)+","+Math.round(p.y);if(vmap[key]!==undefined)return vmap[key];
    var id=vertices.length;vertices.push({id:id,x:p.x,y:p.y,hexes:[],edges:[],adj:[]});vmap[key]=id;return id;}
  var hexes=centers.map(function(c,hi){var vs=[];for(var i=0;i<6;i++)vs.push(vid(corner(c.x,c.y,i)));return{id:hi,x:c.x,y:c.y,vertices:vs,edges:[]};});
  hexes.forEach(function(h){h.vertices.forEach(function(v){if(vertices[v].hexes.indexOf(h.id)<0)vertices[v].hexes.push(h.id);});});
  var emap={}, edges=[];
  function eid(a,b){var key=a<b?a+"-"+b:b+"-"+a;if(emap[key]!==undefined)return emap[key];
    var id=edges.length;var va=vertices[a],vb=vertices[b];edges.push({id:id,v1:a,v2:b,x:(va.x+vb.x)/2,y:(va.y+vb.y)/2,hexes:[]});emap[key]=id;return id;}
  hexes.forEach(function(h){for(var i=0;i<6;i++){var a=h.vertices[i],b=h.vertices[(i+1)%6];var e=eid(a,b);
    if(edges[e].hexes.indexOf(h.id)<0)edges[e].hexes.push(h.id);
    if(h.edges.indexOf(e)<0)h.edges.push(e);
    if(vertices[a].edges.indexOf(e)<0)vertices[a].edges.push(e);if(vertices[b].edges.indexOf(e)<0)vertices[b].edges.push(e);}});
  edges.forEach(function(e){if(vertices[e.v1].adj.indexOf(e.v2)<0)vertices[e.v1].adj.push(e.v2);if(vertices[e.v2].adj.indexOf(e.v1)<0)vertices[e.v2].adj.push(e.v1);});
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  vertices.forEach(function(v){minX=Math.min(minX,v.x);minY=Math.min(minY,v.y);maxX=Math.max(maxX,v.x);maxY=Math.max(maxY,v.y);});
  return{hexes:hexes,vertices:vertices,edges:edges,deepFrom:deepFrom,bounds:{minX:minX,minY:minY,maxX:maxX,maxY:maxY}};
}
function buildBoard(rows){
  rows=rows||ROWS;
  var hSp=SQRT3*SIZE, vSp=1.5*SIZE, centers=[];
  rows.forEach(function(count,r){
    var y=r*vSp, rowW=(count-1)*hSp;
    for(var i=0;i<count;i++) centers.push({x:i*hSp-rowW/2,y:y});
  });

}
// Seafarers: radius-R hexagonal field; distance R ring = sea, inner = land
function seaCoords(R){
  var out=[];
  for(var q=-R;q<=R;q++) for(var r=Math.max(-R,-q-R);r<=Math.min(R,-q+R);r++){
    out.push({q:q,r:r,dist:(Math.abs(q)+Math.abs(r)+Math.abs(q+r))/2});
  }

}

function assignHarbors(board,n,tiles){
  var c={x:(board.bounds.minX+board.bounds.maxX)/2,y:(board.bounds.minY+board.bounds.maxY)/2};
  // Häfen liegen an der Küste: eine Seite Land, die andere Wasser
  var isLandHex=function(hi){ var t=tiles&&tiles[hi]; return t?!isWaterRes(t.resource):false; };   // Kranzfelder gelten als Wasser

/* Städte & Ritter: Handelswaren zählen als eigene Sorten. Häfen und Vorrat gelten
   für sie ebenso; die Gilde (Handel 3) erlaubt zusätzlich den 2:1-Tausch. */
function isComm(k){ return COMM.indexOf(k)>=0; }
function holdOf(pi,k){ var p=state.players[pi]; return isComm(k)?((p.comm&&p.comm[k])||0):p.res[k]; }
function commSupply(k){ return (state.commSupply&&state.commSupply[k]!=null)?state.commSupply[k]:12; }
/* Karten wandern immer über den Vorrat: 12 Papier, 12 Tuch, 12 Münzen (PDF-Material). */
function addHold(pi,k,n){
  var p=state.players[pi];
  if(!isComm(k)){ p.res[k]+=n; return n; }
  if(n>0){
    var take=Math.min(n,commSupply(k));
    if(state.commSupply) state.commSupply[k]-=take;
    p.comm[k]=(p.comm[k]||0)+take;
    return take;
  }
  var give=Math.min(-n,p.comm[k]||0);
  p.comm[k]=(p.comm[k]||0)-give;
  if(state.commSupply) state.commSupply[k]+=give;
  return -give;
}

function kindLabel(k){ return isComm(k)?COMM_META[k].label:resLabel(k); }
function bestRatio(pi,res){
  if(isSR()&&state.turn&&state.turn.fleetKind===res) return 2;                     // Handelsflotte
  if(isSR()&&state.merchant&&state.merchant.owner===pi&&state.merchant.res===res) return 2;  // Händler
  if(isComm(res)){
    // Handelswaren: 3:1-Hafen gilt, Spezialhäfen nicht; mit der Gilde 2:1
    if(isSR()&&impLevel(pi,"trade")>=3) return 2;
    var rc=4;
    for(var i=0;i<state.harbors.length;i++){
      var hb2=state.harbors[i], a1=state.buildings[hb2.v1], a2=state.buildings[hb2.v2];
      if(((a1&&a1.owner===pi)||(a2&&a2.owner===pi))&&hb2.kind==="any") rc=Math.min(rc,3);
    }
    return rc;
  }
  var r=4;
  for(var k=0;k<state.harbors.length;k++){
    var hb=state.harbors[k];
    var b1=state.buildings[hb.v1], b2=state.buildings[hb.v2];
    var owns=(b1&&b1.owner===pi)||(b2&&b2.owner===pi);
    if(!owns)continue;
    if(hb.kind==="any")r=Math.min(r,3); else if(hb.kind===res)r=Math.min(r,2);
  }
  return r;
}

function distanceOK(v,b,board){if(b[v])return false;return board.vertices[v].adj.every(function(a){return !b[a];});}
function settlementLegal(v,pl,b,roads,board,setup){
  if(state.knights&&state.knights[v])return false;
  if(!touchesLand(v))return false;                   // keine Siedlung mitten im Wasser   // auf einer Ritter-Kreuzung wird nicht gebaut
  if(!distanceOK(v,b,board))return false;
  // Barbarenüberfall: keine Siedlung an eroberten Küstenfeldern
  if(isBarb()){
    var hasCapt=board.vertices[v].hexes.some(function(hi){ return isCapturedHex(hi); });
    if(hasCapt) return false;
    // Keine Siedlung am Burgfeld (nur Wege dienen für Ritter)
    var castles=(state.castleHexes&&state.castleHexes.length)?state.castleHexes:(state.castleHex!=null?[state.castleHex]:[]);
    if(castles.some(function(chi){ return board.vertices[v].hexes.indexOf(chi)>=0; })) return false;
  }
  // Finale: keine Siedlung an zentraler Kreuzung von Zielfeldern
  if(isFinale() && isTargetCenterVertex(v)) return false;
  if(setup)return true;
  var ships=state.ships||{};
  return board.vertices[v].edges.some(function(e){return ((roads[e]&&roads[e].owner===pl)||(ships[e]&&ships[e].owner===pl)) && !(state.brokenRoads&&state.brokenRoads[e]);});
}
function roadLegal(eid,pl,b,roads,board,restrict){
  if(roads[eid])return false;
  if(state.ships&&state.ships[eid])return false;
  // Barbarenüberfall: keine Straßen an eroberten Küstenfeldern und keine auf Burgfeld-Wegen
  if(isBarb()){
    var e0=board.edges[eid];
    if(e0.hexes.some(function(hi){ return isCapturedHex(hi); })) return false;
    var castles=(state.castleHexes&&state.castleHexes.length)?state.castleHexes:(state.castleHex!=null?[state.castleHex]:[]);
    if(castles.some(function(chi){ return e0.hexes.indexOf(chi)>=0; })) return false;
  }
  // Finale: keine Straßen an Zielfeld-Seewänden
  if(isFinale() && isTargetSeaEdge(eid)) return false;
  if(state.bridges&&state.bridges[eid])return false;      // Flüsse: existierende Brücke blockt Straße
  if(state.bridgeEdges&&state.bridgeEdges[eid])return false; // Flüsse: über den Fluss darf nur eine Brücke, keine Straße
  if(edgeKind(eid)==="deep")return false;                 // offene See ist tabu
  if(state.mode==="sea"&&edgeKind(eid)==="sea")return false;
  var e=board.edges[eid];
  if(restrict!=null)return e.v1===restrict||e.v2===restrict;
  return [e.v1,e.v2].some(function(w){
    var bo=b[w];
    if(bo&&bo.owner===pl)return true;
    if(bo&&bo.owner!==pl)return false;
    return board.vertices[w].edges.some(function(oe){return roads[oe]&&roads[oe].owner===pl && !(state.brokenRoads&&state.brokenRoads[oe]);});
  });
}
function shipLegal(eid,pl,restrict){
  var ships=state.ships||{}, b=state.buildings, board=state.board;
  if(state.pathSet&&state.pathSet[eid]){
    var pd=state.pathSet[eid];
    if(pd.owner!==pl||ships[eid])return false;
    for(var kk=0;kk<pd.idx;kk++){ if(!ships[state.pathEdges[pl][kk]])return false; }
    return true;
  }
  if(ships[eid]||state.roads[eid])return false;
  var k=edgeKind(eid); if(k!=="sea"&&k!=="coast")return false;
  if(seaRobberBlocks(eid))return false;
  var e=board.edges[eid];
  if(restrict!=null)return e.v1===restrict||e.v2===restrict;
  return [e.v1,e.v2].some(function(w){
    var bo=b[w];
    if(bo&&bo.owner===pl)return true;
    if(bo&&bo.owner!==pl)return false;
    return board.vertices[w].edges.some(function(oe){return ships[oe]&&ships[oe].owner===pl;});
  });
}
function shipMovable(eid,pl){
  if(state.pathSet&&state.pathSet[eid])return false;
  var sh=state.ships[eid]; if(!sh||sh.owner!==pl)return false;
  if(sh.fresh)return false;
  if(seaRobberBlocks(eid))return false;
  var e=state.board.edges[eid], b=state.buildings, ships=state.ships, board=state.board;
  return [e.v1,e.v2].some(function(v){
    if(b[v]&&b[v].owner===pl)return false;
    var other=board.vertices[v].edges.some(function(oe){return oe!==Number(eid)&&ships[oe]&&ships[oe].owner===pl;});
    return !other;
  });
}
function hasMovableShip(pl){ for(var k in state.ships){ if(shipMovable(Number(k),pl))return true; } return false; }
function shipMoveTargets(pl,fromEid){
  var out={}, saved=state.ships[fromEid]; delete state.ships[fromEid];
  state.board.edges.forEach(function(e){ if(e.id!==fromEid&&shipLegal(e.id,pl)) out[e.id]="moveto"; });
  state.ships[fromEid]=saved;
  return out;
}
function longestRoute(pl){
  var board=state.board, roads=state.roads, ships=state.ships||{}, bridges=state.bridges||{}, b=state.buildings, owned=[];
  board.edges.forEach(function(e){
    if(roads[e.id]&&roads[e.id].owner===pl){
      owned.push({id:e.id,v1:e.v1,v2:e.v2,kind:"road"});
      // Handelstross: parallele Straße zählt doppelt (2 Kanten statt 1)
      if(state.hbScenario==="handelstross" && isParallelToWagon(e.id)){
        owned.push({id:e.id+"_x",v1:e.v1,v2:e.v2,kind:"road"});
      }
    }
    else if(bridges[e.id]&&bridges[e.id].owner===pl) owned.push({id:e.id,v1:e.v1,v2:e.v2,kind:"road"}); // Brücke zählt wie eine Straße
    else if(ships[e.id]&&ships[e.id].owner===pl) owned.push({id:e.id,v1:e.v1,v2:e.v2,kind:"ship"});
  });
  if(owned.length===0)return 0;
  var inc={};
  owned.forEach(function(e){(inc[e.v1]=inc[e.v1]||[]).push(e);(inc[e.v2]=inc[e.v2]||[]).push(e);});
  function blocked(v){
    if(b[v]&&b[v].owner!==pl)return true;
    var kb=state.knights&&state.knights[v];          // fremder Ritter unterbricht die Route
    return !!(kb&&kb.owner!==pl);
  }
  function hasBuilding(v){return !!b[v];}
  var best=0;
  function dfs(vertex,arrived,used){
    if(arrived!==null&&blocked(vertex)){best=Math.max(best,used.size);return;}
    (inc[vertex]||[]).forEach(function(e){
      if(used.has(e.id))return;
      if(arrived!==null&&e.kind!==arrived&&!hasBuilding(vertex))return; // road<->ship only via a building
      var next=e.v1===vertex?e.v2:e.v1;
      used.add(e.id);dfs(next,e.kind,used);used.delete(e.id);
    });
    best=Math.max(best,used.size);
  }
  Object.keys(inc).forEach(function(v){dfs(Number(v),null,new Set());});
  return best;
}
function countRoads(pl){var n=0;for(var k in state.roads)if(state.roads[k].owner===pl)n++;return n;}
function countShips(pl){var n=0,s=state.ships||{};for(var k in s)if(s[k].owner===pl)n++;return n;}
function countType(pl,type){var n=0;for(var k in state.buildings){var b=state.buildings[k];if(b.owner===pl&&b.type===type)n++;}return n;}

/* ---------- victory points ---------- */
function publicVP(pi){
  var vp=0;
  for(var k in state.buildings){var b=state.buildings[k];if(b.owner===pi&&!b.captured)vp+=b.type==="city"?2:1;}
  if(state.longestRoadOwner===pi && !isFinale())vp+=2;
  if(state.largestArmyOwner===pi && !isBarb() && !isFinale())vp+=2;
  vp+=state.players[pi].islandVP||0;   // Seefahrer Sondersiegpunkte
  vp+=Math.floor((state.players[pi].cloth||0)/2); // Stoffe für Catan: 2 Stoff = 1 SP
  if(isSR()) vp+=2*metroCount(pi);                 // Städte & Ritter: je Metropole 2 SP
  if(isSR()&&state.merchant&&state.merchant.owner===pi) vp+=1;   // der Händler zählt 1 SP
  // Flüsse: Reichster (+1) / Armer (-2)
  if(state.hbScenario==="fluesse"){
    if(state.richest===pi) vp+=1;
    if(state.poorest&&state.poorest[pi]) vp-=2;
  }
  // Handelstross: Siedlungen/Städte zwischen 2 Trosswagen zählen +1 Punkt mehr
  if(state.hbScenario==="handelstross"){
    for(var kh in state.buildings){
      var bh=state.buildings[kh];
      if(bh.owner!==pi||bh.captured) continue;
      if(wagonAdjacentToVertex(Number(kh))>=2) vp+=1;
    }
  }
  // Häfen von Catan: Stärkste Häfen (+2 SP)
  if(state.harborsVariant && state.strongestHarbors===pi) vp+=2;
  // Barbarenüberfall: Gefangene zählen (je 2 = 1 SP), keine Größte Rittermacht
  if(isBarb()){
    vp += Math.floor((state.prisoners[pi]||0)/2);
  }
  // Finale: erfüllte Warenaufträge zählen als SP; Wagen-Tableau bei Max-Stufe 1 SP
  if(isFinale()){
    vp += (state.players[pi].wareVP||0);
    if((state.wagenStage[pi]||0)>=4) vp+=1;
  }
  return vp;
}
function fullVP(pi){return publicVP(pi)+state.players[pi].vpCards;}

/* ---------- awards (Almanach-faithful) ---------- */
function recomputeAwards(){
  var noLR=state.scenario&&SCEN[state.scenario]&&SCEN[state.scenario].noLongestRoad;
  var lengths=state.players.map(function(_,pi){return noLR?0:longestRoute(pi);});
  var max=Math.max.apply(null,lengths.concat([0]));
  var owner=state.longestRoadOwner;
  if(max<5) owner=null;
  else if(owner!==null&&lengths[owner]===max){/* holder keeps */}
  else{
    var leaders=lengths.map(function(l,i){return l===max?i:-1;}).filter(function(i){return i>=0;});
    owner=leaders.length===1?leaders[0]:null; // tie among challengers => set aside
  }
  state.longestRoadOwner=owner;
  state.longestRoadLength=owner===null?0:lengths[owner];

  var knights=state.players.map(function(p){return p.knights;});
  var noLA=state.scenario&&SCEN[state.scenario]&&SCEN[state.scenario].noLargestArmy;
  var aMax=noLA?0:Math.max.apply(null,knights.concat([0]));
  var aOwner=state.largestArmyOwner;
  if(aMax<3) aOwner=null;
  else if(aOwner!==null&&knights[aOwner]===aMax){/* keep */}
  else{
    var aL=knights.map(function(k,i){return k===aMax?i:-1;}).filter(function(i){return i>=0;});
    aOwner=aL.length===1?aL[0]:null;
  }
  state.largestArmyOwner=aOwner;
  state.largestArmySize=aOwner===null?0:knights[aOwner];
}

function spreadRes(k){var kinds=["brick","wood","sheep","wheat","ore"],out=[];for(var i=0;i<k;i++)out.push(kinds[i%5]);return out;}
function makeTokens(k){
  var base=[2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12], extra=[3,4,5,9,10,11,4,8,5,10], out=base.slice();

// Setup rule: no two red numbers (6 or 8) on adjacent land hexes. Post-process any board.
function fixRedAdjacency(board,tiles){
  var adj={};
  board.edges.forEach(function(e){ if(e.hexes.length===2){ var a=e.hexes[0],b=e.hexes[1]; (adj[a]=adj[a]||[]).push(b); (adj[b]=adj[b]||[]).push(a); } });
  var isRed=function(num){ return num===6||num===8; };
  var conflicts=function(){
    var list=[];
    for(var hs in adj){ var h=+hs; if(!isRed(tiles[h].number))continue;
      (adj[h]||[]).forEach(function(nb){ if(nb>h && isRed(tiles[nb].number)) list.push(h); });
    }
    return list;
  };
  var swapPass=function(){
    var tries=0;
    while(tries++<400){
      var c=conflicts(); if(!c.length)return 0;
      c=shuffle(c); var fixedOne=false;
      for(var ci=0; ci<c.length && !fixedOne; ci++){
        var h=c[ci];
        var cands=shuffle(tiles.map(function(t,i){return i;}).filter(function(i){return tiles[i].number!=null && tiles[i].resource!=="village" && !isRed(tiles[i].number);}));
        for(var k=0;k<cands.length;k++){
          var g=cands[k];
          var bad=(adj[g]||[]).some(function(nb){ return nb!==h && isRed(tiles[nb].number); });
          if(!bad){ var tmp=tiles[h].number; tiles[h].number=tiles[g].number; tiles[g].number=tmp; fixedOne=true; break; }
        }
      }
      if(!fixedOne)break;
    }
    return conflicts().length;
  };
  var idx=tiles.map(function(t,i){return i;}).filter(function(i){return tiles[i].number!=null && tiles[i].resource!=="village";});
  var best=null, bestConf=Infinity;
  for(var attempt=0; attempt<50; attempt++){
    if(attempt>0){ var nums=shuffle(idx.map(function(i){return tiles[i].number;})); idx.forEach(function(i,k){tiles[i].number=nums[k];}); }
    var cc=swapPass();
    if(cc<bestConf){ bestConf=cc; best=idx.map(function(i){return tiles[i].number;}); }
    if(cc===0)break;
  }
  if(best) idx.forEach(function(i,k){tiles[i].number=best[k];});
  return tiles;
}
// "Neue Welt" (freies Spiel): main home island + small foreign islands; +1 VP per first settlement on a foreign island
function buildNeueWelt(n){
  var R=4, coords=seaCoords(R);
  var centers=coords.map(function(c){return{x:SIZE*SQRT3*(c.q+c.r/2),y:SIZE*1.5*c.r};});
  var board=assembleBoard(centers); board.coords=coords;
  var ring4=coords.map(function(c,i){return{c:c,i:i};}).filter(function(o){return o.c.dist===4;});
  ring4.sort(function(a,b){return Math.atan2(centers[a.i].y,centers[a.i].x)-Math.atan2(centers[b.i].y,centers[b.i].x);});
  var nSmall=(n>=5)?9:5, smallSet={}, cnt=0;
  for(var k=0;k<ring4.length&&cnt<nSmall;k+=2){ smallSet[ring4[k].i]=true; cnt++; }
  var region=coords.map(function(c,i){ return c.dist<=2?"main":(smallSet[i]?"small":"sea"); });
  var M=region.filter(function(r){return r==="main";}).length, S=region.filter(function(r){return r==="small";}).length;
  var mainBag=shuffle(["desert"].concat(spreadRes(M-1))), smallBag=shuffle(spreadRes(S));
  var tiles=board.hexes.map(function(){return{resource:"sea",number:null};});
  region.forEach(function(rg,hi){ if(rg==="main")tiles[hi]={resource:mainBag.pop(),number:null}; else if(rg==="small")tiles[hi]={resource:smallBag.pop(),number:null}; });
  var producing=tiles.filter(function(t){return !isWaterRes(t.resource)&&t.resource!=="desert";}).length;
  var toks=makeTokens(producing);
  tiles.forEach(function(t){ if(!isWaterRes(t.resource)&&t.resource!=="desert") t.number=toks.pop(); });
  var islandOf=region.map(function(){return null;}), iid=0;
  region.forEach(function(rg,hi){ if(rg==="small") islandOf[hi]=iid++; });
  var robberHex=tiles.findIndex(function(t){return t.resource==="desert";}); if(robberHex<0)robberHex=0;
  var seaRobberHex=tiles.findIndex(function(t){return t.resource==="sea";});
  return {board:board,tiles:tiles,harbors:assignSeaHarbors(board,tiles),robberHex:robberHex,seaRobberHex:seaRobberHex,islandOf:islandOf};
}

/* Fischfang auf Catan: Wüste → See (Zahlen 2/3/11/12). Auf 6 Küstenkanten liegen Fischgründe
   mit Zahlen 4/5/6/8/9/10. Bei entsprechendem Wurf ziehen Anrainer 1 Fischplättchen (Städte 2).
   Fischplättchen: 11× 1-Fisch, 10× 2-Fisch, 8× 3-Fisch, 1× "Alter Schuh". Aktionen mit Fischen. */
function buildFischfang(n){
  var board=buildBoard(rowsFor(n));
  // normale Ressourcenverteilung, dann Wüste → See
  var pool=shuffle(tilePool(n)), tokens=shuffle(tokenSet(n)), ti=0;
  var tiles=pool.map(function(res){return{resource:res,number:res==="desert"?null:tokens[ti++]};});
  // Sammle alle Wüsten
  var desertIndices=[];
  tiles.forEach(function(t,ix){ if(t.resource==="desert") desertIndices.push(ix); });
  var isEdgeHex=function(hi){
    if(hi<0||hi>=tiles.length)return false;
    return board.hexes[hi].edges.some(function(eid){
      var e=board.edges[eid];
      if(e.hexes.length===1) return true;
      var other=e.hexes[0]===hi?e.hexes[1]:e.hexes[0];
      return other>=tiles.length;
    });
  };
  // Für jede Wüste: falls am Rand, ins Innere tauschen
  var lakeIndices=[];
  desertIndices.forEach(function(desertIdx){
    if(isEdgeHex(desertIdx)){
      var innerLand=[];
      for(var j=0;j<tiles.length;j++){
        if(tiles[j].resource==="desert"||tiles[j].resource==="lake")continue;
        if(!isEdgeHex(j)) innerLand.push(j);
      }
      if(innerLand.length){
        var swap=innerLand[Math.floor(Math.random()*innerLand.length)];
        var tmp=tiles[desertIdx]; tiles[desertIdx]=tiles[swap]; tiles[swap]=tmp;
        desertIdx=swap;
      }
    }
    lakeIndices.push(desertIdx);
  });
  // Erster See: 2/3/11/12. Zweiter (5-6): zusätzlich 10/4
  if(lakeIndices.length>=1){
    tiles[lakeIndices[0]]={resource:"lake",numbers:[2,3,11,12],number:null};
  }
  if(lakeIndices.length>=2){
    tiles[lakeIndices[1]]={resource:"lake",numbers:[10,4],number:null};
  }
  var harbors=assignHarbors(board,n,tiles);

  // Fischgründe an "Rahmenspitzen" platzieren (regelkonform mit 3 Küstenkreuzungen)
  var harborEdges={}; harbors.forEach(function(h){harborEdges[h.edgeId]=1;});
  var harborVerts={}; harbors.forEach(function(h){ harborVerts[h.v1]=1; harborVerts[h.v2]=1; });
  var isLandHex=function(hi){ if(hi<0||hi>=tiles.length)return false; var t=tiles[hi]; return t?!isWaterRes(t.resource):false; };
  var isCoastVertex=function(vi){
    var vt=board.vertices[vi]; if(!vt)return false;
    // Küstenkreuzung: liegt an mind. 1 Landhex UND an mind. 1 Wasserhex/Rand
    var hasLand=vt.hexes.some(function(hi){ return isLandHex(hi); });
    if(!hasLand)return false;
    var hasWater=vt.hexes.length<3 || vt.hexes.some(function(hi){ return !isLandHex(hi); });
    return hasWater;
  };
  // Nachbarn eines Vertex über Kanten
  var vertexNeighbors=function(vi){
    var out=[];
    board.edges.forEach(function(e){
      if(e.v1===vi) out.push({v:e.v2,edgeId:e.id});
      else if(e.v2===vi) out.push({v:e.v1,edgeId:e.id});
    });
    return out;
  };
  // Rahmenspitzen: Meer-Vertizes mit mind. 2 Küstenkreuzungen als Nachbarn
  var rahmenSpitzen=[];
  board.vertices.forEach(function(vt,vi){
    var isSeaVertex=vt.hexes.every(function(hi){ return !isLandHex(hi); });
    if(!isSeaVertex)return;
    var nbs=vertexNeighbors(vi);
    var coastNbs=nbs.filter(function(nb){ return isCoastVertex(nb.v); });
    if(coastNbs.length>=2){
      // Prüfe: mindestens eine der Verbindungskanten trägt keinen Hafen
      var hasFreeConn=coastNbs.some(function(nb){ return !harborEdges[nb.edgeId]; });
      if(hasFreeConn){
        rahmenSpitzen.push({vertexId:vi, coastVerts:coastNbs.map(function(nb){return nb.v;}), x:vt.x, y:vt.y});
      }
    }
  });
  // Sortiere zirkulär um Kartenzentrum
  var cx=(board.bounds.minX+board.bounds.maxX)/2, cy=(board.bounds.minY+board.bounds.maxY)/2;
  rahmenSpitzen.sort(function(a,b){return Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx);});
  // 6 (3-4) bzw. 8 (5-6) möglichst gleichmäßig verteilte Spitzen auswählen; zusätzliche Zahlen 5 und 9
  var fgNums = n>=5 ? shuffle([4,5,5,6,8,9,9,10]) : shuffle([4,5,6,8,9,10]);
  var fishingGrounds=[]; var used={};
  var target=Math.min(fgNums.length, rahmenSpitzen.length);
  for(var f=0;f<target;f++){
    var idx=Math.round(f*rahmenSpitzen.length/target)%rahmenSpitzen.length;
    var tries=0;
    while(used[idx]&&tries<rahmenSpitzen.length){ idx=(idx+1)%rahmenSpitzen.length; tries++; }
    used[idx]=1;
    var sp=rahmenSpitzen[idx];
    var dx=sp.x-cx, dy=sp.y-cy, len=Math.hypot(dx,dy)||1;
    fishingGrounds.push({
      vertexId:sp.vertexId, coastVerts:sp.coastVerts, number:fgNums[f],
      x:sp.x, y:sp.y, dx:dx/len, dy:dy/len
    });
  }
  var robberHex=-1; // Räuber startet außerhalb
  return {board:board,tiles:tiles,harbors:harbors,robberHex:robberHex,seaRobberHex:null,islandOf:null,fishingGrounds:fishingGrounds,fischfang:true};
}
var HB_SCEN={
  fischfang:{key:"menu_hb_fischfang",players:[3,4,5,6],vpTarget:10,build:function(n){return buildFischfang(n);}},
  fluesse:{key:"menu_hb_fluesse",players:[3,4,5,6],vpTarget:10,build:function(n){return buildFluesse(n);}},
  handelstross:{key:"menu_hb_handelstross",players:[3,4,5,6],vpTarget:12,build:function(n){return buildHandelstross(n);}},
  barbarenueberfall:{key:"menu_hb_barbarenueberfall",players:[3,4,5,6],vpTarget:12,build:function(n){return buildBarbarenueberfall(n);}},
  finale:{key:"menu_hb_finale",players:[3,4],vpTarget:13,build:function(n){return buildHaendlerBarbaren(n);}}
};

/* Der Barbarenüberfall
   – Wüste + Burgfeld im Zentrum
   – Äußerer Ring: Küstenfelder (Barbaren landen)
   – Innerer Ring: normale Landschaften
   – 6 Ritter pro Farbe, spezielle Entwicklungskarten
   – Kein Räuber, keine Größte Rittermacht
   – Ziel: 12 SP
*/
function buildBarbarenueberfall(n){
  var board=buildBoard(rowsFor(n));
  var pool=shuffle(tilePool(n));
  var tokens=shuffle(tokenSet(n)), ti=0;
  var tiles=pool.map(function(res){return{resource:res,number:res==="desert"?null:tokens[ti++]};});

  var cx=(board.bounds.minX+board.bounds.maxX)/2, cy=(board.bounds.minY+board.bounds.maxY)/2;
  var byDist=tiles.map(function(t,i){var h=board.hexes[i]; return {i:i, d:h?Math.hypot(h.x-cx,h.y-cy):Infinity, t:t};}).sort(function(a,b){return a.d-b.d;});

  var numCastles=(n>=5?2:1);
  var castleHexes=[];
  var used={};
  for(var c=0;c<numCastles;c++){
    // Nächstgelegenes noch nicht genutztes Feld
    var chosen=null;
    for(var k=0;k<byDist.length;k++){
      if(used[byDist[k].i]) continue;
      chosen=byDist[k].i; break;
    }
    if(chosen==null) break;
    tiles[chosen]={resource:"castle", number:null};
    castleHexes.push(chosen);
    used[chosen]=true;
  }
  // Nächstgelegenes Feld → Wüste (falls noch keine im Zentrum)
  var existDesert=tiles.findIndex(function(t){return t.resource==="desert";});
  var desertIdx=null;
  if(existDesert===-1){
    for(var k2=0;k2<byDist.length;k2++){
      if(used[byDist[k2].i]) continue;
      if(!isWaterRes(tiles[byDist[k2].i].resource) && tiles[byDist[k2].i].resource!=="castle"){
        desertIdx=byDist[k2].i;
        tiles[desertIdx]={resource:"desert", number:null};
        used[desertIdx]=true;
        break;
      }
    }
  } else {
    var target=null;
    for(var k3=0;k3<byDist.length;k3++){
      if(used[byDist[k3].i]) continue;
      if(tiles[byDist[k3].i].resource==="desert") continue;
      target=byDist[k3].i; break;
    }
    if(target!=null && target!==existDesert){
      var tmp=tiles[existDesert]; tiles[existDesert]=tiles[target]; tiles[target]=tmp;
    }
    desertIdx=target!=null?target:existDesert;
  }

  var harbors=assignHarbors(board,n,tiles);

  var coastHexes=[];
  tiles.forEach(function(t,hi){
    if(!t) return;
    if(isWaterRes(t.resource) || t.resource==="castle" || t.resource==="desert") return;
    var isCoast=board.hexes[hi].edges.some(function(eid){
      var e=board.edges[eid];
      if(e.hexes.length===1) return true;
      return e.hexes.some(function(hj){return hj>=tiles.length || isWaterRes(tiles[hj]?tiles[hj].resource:"deepsea");});
    });
    if(isCoast) coastHexes.push(hi);
  });

  // Startbarbaren auf Feldern mit "2" und "12"
  var barbarians={};
  coastHexes.forEach(function(hi){
    var t=tiles[hi];
    if(t && (t.number===2 || t.number===12)) barbarians[hi]=1;
  });
  var barbariansMax = (n>=5 ? 48 : 36);

  return {
    board:board, tiles:tiles, harbors:harbors,
    robberHex:-1, seaRobberHex:null, islandOf:null,
    castleHex:castleHexes[0]!=null?castleHexes[0]:null,
    castleHexes:castleHexes,
    coastHexes:coastHexes,
    barbarians:barbarians, capturedHexes:{}, capturedBuildings:{},
    barbariansLeft:barbariansMax-Object.keys(barbarians).length,
    barbariansMax:barbariansMax,
    barbarenueberfall:true
  };
}

/* Händler & Barbaren Finale
   – 3 Zielfelder: fortress (Burg), quarry (Marmorsteinbruch), glassworks (Glashütte)
   – Kein Räuber, keine Längste Handelsroute
   – Ziel: 13 SP
*/
function buildHaendlerBarbaren(n){
  var board=buildBoard(rowsFor(n));
  var pool=shuffle(tilePool(n));
  var tokens=shuffle(tokenSet(n).filter(function(x){return x!==2 && x!==12;})), ti=0;
  var tiles=pool.map(function(res){return{resource:res,number:res==="desert"?null:tokens[ti++]||null};});
  // 3 Zielfelder: die 3 zentrumsnächsten Land-Kacheln
  var cx=(board.bounds.minX+board.bounds.maxX)/2, cy=(board.bounds.minY+board.bounds.maxY)/2;
  var byDist=tiles.map(function(t,i){var h=board.hexes[i]; return {i:i, d:h?Math.hypot(h.x-cx,h.y-cy):Infinity};}).sort(function(a,b){return a.d-b.d;});
  var targets=["fortress","quarry","glassworks"];
  var targetHexes={};
  var used={};
  for(var c=0;c<3;c++){
    var chosen=null;
    for(var k=0;k<byDist.length;k++){
      if(used[byDist[k].i]) continue;
      // Bevorzugt Landfelder mit Meerkontakt
      var h=board.hexes[byDist[k].i], t=tiles[byDist[k].i];
      if(!t || isWaterRes(t.resource)) continue;
      chosen=byDist[k].i; break;
    }
    if(chosen==null) break;
    tiles[chosen]={resource:targets[c], number:null};
    targetHexes[targets[c]]=chosen;
    used[chosen]=true;
  }
  var harbors=assignHarbors(board,n,tiles);

  // Warenplättchen-Decks (36 total, 12 pro Sorte, unter den Zielfeldern verteilt)
  // Burg liefert Werkzeug + Sand
  // Marmorsteinbruch liefert Marmor + Sand
  // Glashütte liefert Glas + Werkzeug
  var wareDecks={};
  wareDecks.fortress=shuffle([].concat(Array(6).fill("werkzeug"),Array(6).fill("sand")));
  wareDecks.quarry=shuffle([].concat(Array(6).fill("marmor"),Array(6).fill("sand")));
  wareDecks.glassworks=shuffle([].concat(Array(6).fill("glas"),Array(6).fill("werkzeug")));

  // 3 Barbaren auf zufälligen Land-Kanten (die nicht am Zielfeld-Wasserrand liegen)
  var barbEdges={};
  var candidateEdges=[];
  board.edges.forEach(function(e){
    // Land-Kante?
    var landCount=0;
    e.hexes.forEach(function(hi){
      if(hi<tiles.length){
        var t=tiles[hi];
        if(t && !isWaterRes(t.resource)) landCount++;
      }
    });
    if(landCount<1) return;
    // Nicht an Zielfeld-Wasserseite (mind. eine Landkachel-Nachbarschaft)
    candidateEdges.push(e.id);
  });
  shuffle(candidateEdges);
  var placed=0;
  for(var ci=0; ci<candidateEdges.length && placed<3; ci++){
    var eid=candidateEdges[ci];
    // Kein anderer Barbar in unmittelbarer Nähe
    var eObj=board.edges[eid];
    var close=false;
    [eObj.v1, eObj.v2].forEach(function(v){
      board.vertices[v].edges.forEach(function(oe){ if(barbEdges[oe]) close=true; });
    });
    if(close) continue;
    barbEdges[eid]=true;
    placed++;
  }

  return {
    board:board, tiles:tiles, harbors:harbors,
    robberHex:-1, seaRobberHex:null, islandOf:null,
    targetHexes:targetHexes,
    wareDecks:wareDecks,
    barbEdges:barbEdges,
    finale:true
  };
}

/* Der Handelstross
   – Wasserstelle in der Mitte (statt Wüste), keine Ressourcenerträge
   – Trosswagen bilden bis zu 3 Handelsstrosse mit je bis zu 7 Wagen
   – Nach Bau einer Siedlung oder Stadt-Ausbau wird 1 Trosswagen platziert (Abstimmung)
   – Siedlungen/Städte zwischen 2 Trosswagen: +1 Punkt
   – Straße parallel zu Trosswagen: zählt doppelt in Längster Handelsroute
*/
function buildHandelstross(n){
  var board=buildBoard(rowsFor(n));
  var pool=shuffle(tilePool(n)), tokens=shuffle(tokenSet(n)), ti=0;
  var tiles=pool.map(function(res){return{resource:res,number:res==="desert"?null:tokens[ti++]};});
  var cx=(board.bounds.minX+board.bounds.maxX)/2, cy=(board.bounds.minY+board.bounds.maxY)/2;
  var deserts=[];
  tiles.forEach(function(t,ix){ if(t.resource==="desert") deserts.push(ix); });
  // 5-6: beide Wüsten werden zu Wasserstellen; jeweils in eine Hälfte des Bretts verschieben
  var waterholeHexes=[];
  var need = (n>=5 ? Math.min(2, deserts.length) : Math.min(1, deserts.length));
  for(var wi=0; wi<need; wi++){
    var desertIdx = deserts[wi];
    // Wähle passendes Zielfeld (bei 5-6 links/rechts der Mitte, sonst Zentrum)
    var width = board.bounds.maxX - board.bounds.minX;
    var targetX = (n>=5) ? (cx + (wi===0 ? -width*0.18 : width*0.18)) : cx;
    var candidates=[];
    for(var i=0;i<tiles.length;i++){
      if(tiles[i].resource==="desert"||tiles[i].resource==="waterhole")continue;
      var h=board.hexes[i]; if(!h)continue;
      // nur Kandidaten nehmen, die weiter von der anderen Wasserstelle entfernt sind
      var okDist = waterholeHexes.every(function(oi){ return Math.hypot(board.hexes[oi].x-h.x, board.hexes[oi].y-h.y) > 60; });
      if(!okDist) continue;
      candidates.push({i:i, d:Math.hypot(h.x-targetX, h.y-cy)});
    }
    candidates.sort(function(a,b){return a.d-b.d;});
    if(candidates.length){
      var currentD = Math.hypot(board.hexes[desertIdx].x-targetX, board.hexes[desertIdx].y-cy);
      if(candidates[0].d < currentD){
        var swap=candidates[0].i;
        var tmp=tiles[desertIdx]; tiles[desertIdx]=tiles[swap]; tiles[swap]=tmp;
        desertIdx=swap;
      }
    }
    tiles[desertIdx]={resource:"waterhole", number:null};
    waterholeHexes.push(desertIdx);
  }
  var harbors=assignHarbors(board,n,tiles);
  return {
    board:board, tiles:tiles, harbors:harbors,
    robberHex:-1, seaRobberHex:null, islandOf:null,
    waterholeHex: waterholeHexes[0]!=null ? waterholeHexes[0] : -1,
    waterholeHexes: waterholeHexes,
    handelstross:true
  };
}

/* Die Flüsse von Catan
   – Zwei Flüsse (3er und 4er) auf der Insel
   – Sumpffelder ohne Zahlenchips (Räuber startet dort)
   – Ein normales Landfeld erhält zusätzlich zur eigenen Zahl den Chip "2"
   – Straßen/Siedlungen/Brücken am Fluss → Gold
   – Brücken nur über Fluss (7 Brückenbauplätze), Kosten 2 Lehm + 1 Holz, +3 Gold
*/
function buildFluesse(n){
  var board=buildBoard(rowsFor(n));
  // Landschaftsverteilung laut Regel: 2× Sumpf + normale Verteilung ohne Wüste
  // Regel: 1× Hügel, 4× Wald, 2× Weide, 4× Ackerland, 1× Gebirge außerhalb der Flüsse
  // Innerhalb der Flüsse (7 Kacheln): 2× Sumpf + 5× Landschaften (nicht spezifiziert – wir würfeln)
  // Wir bauen die volle Verteilung: 2 Sumpf + normale Verteilung
  var pool=["swamp","swamp"]
    .concat(["hills"],["hills"],["hills"],["hills"])  // 4x Hügel? Nein, laut Anleitung im Rest der Insel: 1x Hügel
    .slice(0,0); // reset above
  // Umsetzung: nutze tilePool(n) und ersetze die Wüste durch Sumpf, füge einen weiteren Sumpf hinzu (statt 1 anderer)
  pool=shuffle(tilePool(n));
  var desertIdx=pool.indexOf("desert");
  if(desertIdx>=0) pool[desertIdx]="swamp";
  // Füge einen zweiten Sumpf hinzu, indem wir eine zufällige Landschaft ersetzen
  var landIdxs=[]; for(var pp=0;pp<pool.length;pp++){ if(pool[pp]!=="swamp") landIdxs.push(pp); }
  if(landIdxs.length){
    var swampSwap=landIdxs[Math.floor(Math.random()*landIdxs.length)];
    pool[swampSwap]="swamp";
  }
  // 5-6: dritter Sumpf für längeren Fluss
  if(n>=5){
    var landIdxs2=[]; for(var pp2=0;pp2<pool.length;pp2++){ if(pool[pp2]!=="swamp") landIdxs2.push(pp2); }
    if(landIdxs2.length){
      var swampSwap2=landIdxs2[Math.floor(Math.random()*landIdxs2.length)];
      pool[swampSwap2]="swamp";
    }
  }
  // Zahlenchips – wir brauchen einen zusätzlichen "2"-Chip, damit ein Feld sowohl seine Zahl als auch die 2 hat
  var tokens=shuffle(tokenSet(n));
  var ti=0;
  var tiles=pool.map(function(res){return{resource:res,number:res==="swamp"?null:tokens[ti++]};});
  // Ein normales Landfeld (kein Sumpf) bekommt zusätzlich den Chip "2" (via numbers Array)
  var candidatesFor2=[];
  for(var ci=0;ci<tiles.length;ci++){
    if(tiles[ci].resource!=="swamp" && tiles[ci].number!=null && tiles[ci].number!==2) candidatesFor2.push(ci);
  }
  if(candidatesFor2.length){
    // Wähle ein Feld mit einer 12 falls möglich (Regel: legt die 2 auf dasselbe Feld wie die 12)
    var twelveIdx=candidatesFor2.find(function(idx){return tiles[idx].number===12;});
    var pickTwo=(twelveIdx!=null?twelveIdx:candidatesFor2[Math.floor(Math.random()*candidatesFor2.length)]);
    tiles[pickTwo].numbers=[tiles[pickTwo].number,2];
    tiles[pickTwo].number=tiles[pickTwo].number; // primary number bleibt
  }
  var harbors=assignHarbors(board,n,tiles);

  // Flussverlauf definieren: 2 Ketten aus zusammenhängenden Hex-Indizes (auf dem Land)
  // Wir suchen zwei disjunkte Ketten – eine mit 3, eine mit 4 Hexes – die Sumpfhexes enthalten
  var swampHexIdxs=[]; for(var si=0;si<tiles.length;si++){ if(tiles[si].resource==="swamp") swampHexIdxs.push(si); }
  // Baue Adjazenz nur für Landkacheln
  var hexNb=function(hi){
    var nbs=[];
    board.hexes[hi].edges.forEach(function(eid){
      var e=board.edges[eid];
      if(e.hexes.length===2){
        var other=e.hexes[0]===hi?e.hexes[1]:e.hexes[0];
        if(other<tiles.length && tiles[other].resource!=="swamp"?true:true) nbs.push(other);
      }
    });
    return nbs.filter(function(o){return o<tiles.length;});
  };
  // BFS: finde eine Kette der gewünschten Länge, die vom Sumpf ausgeht
  function findChain(startHi, length, excluded){
    var best=null;
    (function dfs(path){
      if(path.length===length){ best=path.slice(); return; }
      if(best)return;
      var last=path[path.length-1];
      var nbs=hexNb(last).filter(function(x){return path.indexOf(x)<0 && !excluded[x];});
      // Priorisiere Züge, die eine gerade Linie einhalten (weniger scharfe Kurven)
      shuffle(nbs);
      for(var i=0;i<nbs.length && !best;i++){ dfs(path.concat(nbs[i])); }
    })([startHi]);
    return best;
  }
  var chainA=null, chainB=null;
  var lenA = n>=5 ? 4 : 3;
  var lenB = n>=5 ? 5 : 4;
  if(swampHexIdxs.length>=2){
    var attemptsA=0;
    while(!chainA && attemptsA<8){ chainA=findChain(swampHexIdxs[0],lenA,{}); attemptsA++; }
    if(chainA){
      var excl={}; chainA.forEach(function(x){excl[x]=1;});
      var attemptsB=0;
      while(!chainB && attemptsB<8){ chainB=findChain(swampHexIdxs[1],lenB,excl); attemptsB++; }
    }
  }
  var chains=[chainA,chainB].filter(function(c){return c;});
  // Ermittle Fluss-Kanten (die Kanten ENTLANG der Kette, an denen Land liegt und die als Fluss-Ufer gelten)
  // Vereinfacht: alle Kanten zwischen zwei aufeinanderfolgenden Hexes der Kette sind Fluss-Kanten (Brücken-Kanten).
  // Alle anderen Kanten der Kettenhexes sind Fluss-Uferkanten.
  var bridgeEdgeSet={}, riverEdgeSet={}, riverVertSet={}, swampSet={};
  swampHexIdxs.forEach(function(h){swampSet[h]=1;});
  chains.forEach(function(chain){
    for(var i=0;i<chain.length-1;i++){
      var a=chain[i], b=chain[i+1];
      board.hexes[a].edges.forEach(function(eid){
        var e=board.edges[eid];
        if(e.hexes.length===2 && ((e.hexes[0]===a && e.hexes[1]===b)||(e.hexes[1]===a && e.hexes[0]===b))){
          bridgeEdgeSet[eid]=1;
          riverVertSet[e.v1]=1; riverVertSet[e.v2]=1;
        }
      });
    }
    // Alle anderen Kanten der Kettenhexes zählen als "am Fluss" (Straßenbau dort → 1 Gold)
    chain.forEach(function(hi){
      board.hexes[hi].edges.forEach(function(eid){
        if(!bridgeEdgeSet[eid]) riverEdgeSet[eid]=1;
      });
      board.hexes[hi].vertices.forEach(function(vi){ riverVertSet[vi]=1; });
    });
  });
  var robberHex = swampHexIdxs[0]!=null ? swampHexIdxs[0] : 0;
  return {
    board:board, tiles:tiles, harbors:harbors, robberHex:robberHex, seaRobberHex:null, islandOf:null,
    bridgeEdges:bridgeEdgeSet, riverEdges:riverEdgeSet, riverVerts:riverVertSet, swampHexes:swampSet,
    fluesse:true
  };
}
/* Fischplättchen-Pool: 11× 1-Fisch, 10× 2-Fisch, 8× 3-Fisch, 1× "Alter Schuh" = 30 Plättchen (Regel 29 + Schuh). */
function buildFishPool(){
  var p=[];
  for(var i=0;i<11;i++) p.push({v:1});
  for(var i=0;i<10;i++) p.push({v:2});
  for(var i=0;i<8;i++) p.push({v:3});
  p.push({v:0,shoe:true}); // Alter Schuh
  return shuffle(p);
}
/* Fisch-Helpers: p.fishTiles ist Array von {v:1|2|3} */
function fishTilesOf(p){ if(!p.fishTiles)p.fishTiles=[]; return p.fishTiles; }
function fishSum(p){ return fishTilesOf(p).reduce(function(s,t){return s+(t.v||0);},0); }
function fishTileCount(p){ return fishTilesOf(p).length; }
/* Findet optimale Kombination von Plättchen, die die Kosten decken (minimaler Verfall) */
function findFishPayment(tiles, cost){
  var n=tiles.length; if(n===0||n>15)return null;
  var best=null;
  for(var mask=1; mask<(1<<n); mask++){
    var sum=0, cnt=0, idxs=[];
    for(var i=0;i<n;i++) if(mask&(1<<i)){ sum+=tiles[i].v; cnt++; idxs.push(i); }
    if(sum>=cost){
      var verlust=sum-cost;
      if(!best || verlust<best.verlust || (verlust===best.verlust && cnt<best.cnt)){
        best={mask:mask, verlust:verlust, cnt:cnt, sum:sum, idxs:idxs};
      }
    }
  }
  return best;
}
/* Zahlt Fischplättchen mit möglichst wenig Verfall; abgegebene Plättchen wandern in fishDiscard */
function payFishTiles(pi, cost){
  var p=state.players[pi], tiles=fishTilesOf(p);
  var pay=findFishPayment(tiles, cost);
  if(!pay) return false;
  // Von hinten entfernen, damit indices stimmen
  var sortedIdxs=pay.idxs.slice().sort(function(a,b){return b-a;});
  sortedIdxs.forEach(function(idx){
    var t=tiles.splice(idx,1)[0];
    if(!state.fishDiscard) state.fishDiscard=[];
    state.fishDiscard.push(t);
  });
  return true;
}
function drawFish(pi,count){
  if(!state.fishPool) return;
  var p=state.players[pi]; var got=0;
  for(var c=0;c<count;c++){
    if(!state.fishPool.length){
      // Regel: Recycling — verdeckte Plättchen leer → offene mischen und neu bereitlegen
      if(state.fishDiscard && state.fishDiscard.length){
        state.fishPool=shuffle(state.fishDiscard);
        state.fishDiscard=[];
        pushLog("log_fish_refill");
      }
      if(!state.fishPool.length) break;
    }
    var tile=state.fishPool.shift();
    if(tile.shoe){
      state.alterSchuh=pi;
      state.alterSchuhTurn=state.turnCount||0;
      continue;
    }
    var tiles=fishTilesOf(p);
    if(tiles.length>=7){
      // Regel: max 7 Plättchen. Bei Voll: tausche das kleinste eigene gegen das neue, wenn Vorteil.
      var minIdx=0;
      for(var mi=1;mi<tiles.length;mi++){ if(tiles[mi].v<tiles[minIdx].v) minIdx=mi; }
      if(tile.v > tiles[minIdx].v){
        var old=tiles.splice(minIdx,1)[0];
        if(!state.fishDiscard) state.fishDiscard=[];
        state.fishDiscard.push(old);
        tiles.push(tile);
        got += (tile.v - old.v);
      }else{
        // Neues Plättchen bringt keinen Vorteil → wandert in den Discard
        if(!state.fishDiscard) state.fishDiscard=[];
        state.fishDiscard.push(tile);
      }
    }else{
      tiles.push(tile);
      got += tile.v;
    }
  }
  // Halte den Zähler p.fish für UI-Kompatibilität synchron
  p.fish = fishSum(p);
  if(got>0) pushLog("log_fish_take",{name:pi,count:got});
}
function distributeFish(sum){
  // Sammle je Spieler die Anzahl Fischziehungen (nach Bauwerk-Art)
  var draws={};
  // Fischgründe an Rahmenspitzen – die 3 anliegenden Küstenkreuzungen sind Fischfanggebiet
  if(state.fishingGrounds){
    state.fishingGrounds.forEach(function(fg){
      if(fg.number!==sum) return;
      (fg.coastVerts||[fg.v1,fg.v2]).forEach(function(v){
        var b=state.buildings[v]; if(!b||b.captured)return;
        var amt=(b.type==="city"?(state.seucheThisTurn?1:2):1);
        draws[b.owner]=(draws[b.owner]||0)+amt;
      });
    });
  }
  // See als Fischfanggebiet - alle Anrainer-Kreuzungen
  state.tiles.forEach(function(t,hi){
    if(t.resource!=="lake") return;
    if(!t.numbers || t.numbers.indexOf(sum)<0) return;
    if(hi===state.robberHex) return; // Räuber blockiert auch den Fischertrag am See
    state.board.hexes[hi].vertices.forEach(function(v){
      var b=state.buildings[v]; if(!b||b.captured)return;
      var amt=(b.type==="city"?(state.seucheThisTurn?1:2):1);
      draws[b.owner]=(draws[b.owner]||0)+amt;
    });
  });
  Object.keys(draws).forEach(function(pk){ drawFish(Number(pk),draws[pk]); });
}

/* ---- Flüsse von Catan Helpers ---- */
function isRiverEdge(eid){ return state.riverEdges && state.riverEdges[eid]; }

// Wagen-Tableau: BP pro Stufe, Vertreib-Würfelzahlen, Gold-Belohnung
var WAGEN_TABLEAU=[
  {bp:4, defeat:[], reward:1, cost:{}},                       // Stufe 0 (Start)
  {bp:5, defeat:[6], reward:2, cost:{brick:1,wood:1}},        // Stufe 1
  {bp:6, defeat:[5,6], reward:3, cost:{sheep:1,wheat:1}},     // Stufe 2 (Barbaren vertreiben!)
  {bp:7, defeat:[4,5,6], reward:4, cost:{ore:2,wheat:1}},     // Stufe 3
  {bp:8, defeat:[3,4,5,6], reward:5, cost:{ore:2,wheat:2,sheep:1}}, // Stufe 4 (letzte)

function wagenTableau(pi){

}
function finaleCanUpgrade(pi){

}
// Ziel-Feld einer Ware
function targetHexForWare(ware){
  if(!state.targetHexes) return null;
  if(ware==="glas"||ware==="marmor") return state.targetHexes.fortress;
  if(ware==="werkzeug") return state.targetHexes.quarry;
  if(ware==="sand") return state.targetHexes.glassworks;
  return null;
}
// Zentrale Kreuzung eines Zielfelds finden (die von Land umgeben ist)
function targetCenterVertex(hi){
  if(hi==null) return null;
  var h=state.board.hexes[hi];
  var candidates=h.vertices.slice();
  // Wähle die Kreuzung, die die meisten Landfelder als Nachbarn hat
  var best=null, bestScore=-1;
  candidates.forEach(function(vi){
    var sc=state.board.vertices[vi].hexes.filter(function(hj){
      if(hj>=state.tiles.length) return false;
      var t=state.tiles[hj]; return t && !isWaterRes(t.resource);
    }).length;
    if(sc>bestScore){ bestScore=sc; best=vi; }
  });
  return best;
}
// Ist Vertex "zentrale Kreuzung" eines Zielfelds? Dort keine Siedlungen
function isTargetCenterVertex(vi){
  if(!isFinale() || !state.targetHexes) return false;
  return ["fortress","quarry","glassworks"].some(function(k){
    return targetCenterVertex(state.targetHexes[k])===vi;
  });
}
// Ist Kante eine "Seewand" eines Zielfelds (Straßenbau verboten)?
function isTargetSeaEdge(eid){
  if(!isFinale() || !state.targetHexes) return false;
  var e=state.board.edges[eid];
  return ["fortress","quarry","glassworks"].some(function(k){
    var thi=state.targetHexes[k]; if(thi==null) return false;
    if(e.hexes.indexOf(thi)<0) return false;
    // Wenn andere Seite Wasser ist → Seewand
    return e.hexes.some(function(hj){
      if(hj===thi) return false;
      return hj>=state.tiles.length || (state.tiles[hj] && isWaterRes(state.tiles[hj].resource));
    });
  });
}
function isBarbEdge(eid){ return state.barbEdges && state.barbEdges[eid]; }
// Bewegungskosten für Trosswagen
function trosswagenMoveCost(eid, pi){
  if(!state.board.edges[eid]) return null;
  // Seewand: verboten
  if(isTargetSeaEdge(eid)) return null;
  // Wasser: verboten
  var e=state.board.edges[eid];
  var landOK=e.hexes.some(function(hi){ return hi<state.tiles.length && state.tiles[hi] && !isWaterRes(state.tiles[hi].resource); });
  if(!landOK) return null;
  var road=state.roads[eid];
  var base;
  if(!road) base=2;                          // Weg ohne Straße
  else if(road.owner===pi) base=1;           // Eigene Straße
  else base=1;                               // Fremde Straße (Gold-Zahlung separat)
  if(isBarbEdge(eid)) base+=2;               // Barbar

}
// Ankunft an Zielfeld: Warenaufnahme/Ablieferung
function finaleCheckArrival(pi){
  var tw=state.trosswagen[pi]; if(!tw) return;

  // Prüfe alle 3 Zielfelder: wenn atV eine der zentralen Kreuzungen ist
  var arrivedAt=null;
  ["fortress","quarry","glassworks"].forEach(function(k){
    if(state.targetHexes[k]!=null && targetCenterVertex(state.targetHexes[k])===atV) arrivedAt=k;
  });

    var w=state.wareDecks[arrivedAt].shift();

function isRiverVertex(vi){ return state.riverVerts && state.riverVerts[vi]; }
function bridgeCost(){ return {brick:2,wood:1}; }
// Zählt eigene und fremde Ritter an Wegen um Küstenfeld
function barbKnightsAtHex(hi){

function totalBarbKnightsAtHex(hi){

function barbariansAtHex(hi){ return (state.barbarians && state.barbarians[hi]) || 0; }
function isCoastHex(hi){ return state.coastHexes && state.coastHexes.indexOf(hi)>=0; }
function isCapturedHex(hi){ return state.capturedHexes && state.capturedHexes[hi]; }
function isBurgEdge(eid){

// Barbarenüberfall auslösen (nach Bau)
function triggerBarbInvasion(){
  if(!isBarb()) return;
  if((state.barbariansLeft||0)<=0){ pushLog("log_barb_none"); return; }
  // Sammle Küstenfelder mit noch <3 Barbaren und Zahlenchip
  var eligibleNums={}; // Zahl → [hexIndices]
  state.coastHexes.forEach(function(hi){
    if(isCapturedHex(hi)) return;
    var t=state.tiles[hi]; if(t.number==null) return;
    if(barbariansAtHex(hi)>=3) return;
    if(!eligibleNums[t.number]) eligibleNums[t.number]=[];
    eligibleNums[t.number].push(hi);
  });
  pushLog("log_barb_start",{name:state.current});
  var rolledNums=[]; var attempts=0;
  while(rolledNums.length<3 && attempts<40){
    attempts++;
    var d1=1+Math.floor(Math.random()*6), d2=1+Math.floor(Math.random()*6), sum=d1+d2;
    if(sum===7) continue;
    if(rolledNums.indexOf(sum)>=0) continue;
    rolledNums.push(sum);
    // 5-6-Spieler: falls mehrere Felder mit dieser Zahl, ein Barbar pro Feld
    var candidates=(eligibleNums[sum]||[]).filter(function(hi){return barbariansAtHex(hi)<3;});
    if(candidates.length===0) continue;
    candidates.forEach(function(hi){
      if((state.barbariansLeft||0)<=0) return;
      state.barbarians[hi]=(state.barbarians[hi]||0)+1;
      state.barbariansLeft=Math.max(0,(state.barbariansLeft||36)-1);
      pushLog("log_barb_place",{n:sum, left:state.barbariansLeft});
      if(state.barbarians[hi]>=3){
        state.capturedHexes[hi]=true;

}
// Prüft, welche Siedlungen/Städte von Barbaren umschlossen sind
function updateCapturedBuildings(){
  if(!isBarb()) return;
  Object.keys(state.buildings).forEach(function(vk){
    var v=Number(vk), b=state.buildings[vk];
    // Prüfe alle angrenzenden Landfelder
    var hexes=state.board.vertices[v].hexes;
    var allCaptured=true, hasLand=false;
    hexes.forEach(function(hi){
      if(hi>=state.tiles.length) return;
      var t=state.tiles[hi]; if(!t) return;
      if(isWaterRes(t.resource)) return;
      hasLand=true;
      // Wüste und Burg gelten nie als erobert
      if(t.resource==="desert"||t.resource==="castle") { allCaptured=false; return; }
      if(!isCapturedHex(hi)) allCaptured=false;
    });
    var wasCaptured=!!(state.capturedBuildings && state.capturedBuildings[v]);
    if(hasLand && allCaptured && !wasCaptured){
      state.capturedBuildings[v]=true;
      pushLog("log_barb_building_captured",{name:b.owner});
    } else if(wasCaptured && !allCaptured){

      pushLog("log_barb_building_freed",{name:b.owner});
    }
  });
}
// Sieg über Barbaren prüfen (nach jedem Zug)
function removeBarbariansForVerrat(count){
  // Entferne bis zu count Barbaren von verschiedenen Feldern (nicht eroberte bevorzugt)
  var hexes=Object.keys(state.barbarians||{}).map(Number).filter(function(hi){return state.barbarians[hi]>0;});
  hexes.sort(function(a,b){ return state.barbarians[b]-state.barbarians[a]; });

    if(was===3 && isCapturedHex(hi)){

    }
